# Cloudflare Worker voor foutmeldingen. Zie worker/README.md.
name = "svensk-ovningar-b"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Eerste = standaard. De A1–A2-site stuurt repo: bvweerd/svenska_ovningar mee.
GITHUB_REPO = "bvweerd/svenska_ovningar_b,bvweerd/svenska_ovningar"
ALLOWED_ORIGINS = "https://bvweerd.github.io,http://localhost:5173"
ISSUE_LABELS = "melding"
# Optioneel: alleen Turnstile-tokens van deze hostnamen (zie README).
# TURNSTILE_HOSTNAMES = "bvweerd.github.io"

# Secrets (niet hier invullen, maar met wrangler):
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put TURNSTILE_SECRET
