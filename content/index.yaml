  - { chapter: 23, level: B1, theme: "Eten en consumeren · woordvorming, vergelijken", goal: "Producten vergelijken en kiezen", writing: "Een recensie" }
  - { chapter: 24, level: B1, theme: "Samenleving · mening geven, trots att, även om, medan", goal: "Discussiëren over een stelling", writing: "Een mening in 150 woorden" }
  - { chapter: 25, level: B2, theme: "Werk en economie · nominalisatie", goal: "Een grafiek of ontwikkeling beschrijven", writing: "Een kort verslag" }
  - { chapter: 26, level: B2, theme: "Wetenschap · deelwoordconstructies, lange naamwoordgroepen", goal: "Een onderzoek samenvatten", writing: "Een samenvatting van een artikel" }
  - { chapter: 27, level: B2, theme: "Politiek en debat · betoog opbouwen, det är … som", goal: "Argumenteren en weerleggen", writing: "Een betoog" }
  - { chapter: 28, level: B2, theme: "Taal en identiteit · register, uitdrukkingen", goal: "Je aanpassen aan de situatie", writing: "Dezelfde boodschap formeel en informeel" }
  - { chapter: 29, level: B2, theme: "Geschiedenis · lange bijzinnen, keuze van het eerste zinsdeel", goal: "Een historische gebeurtenis vertellen", writing: "Een verhalende tekst" }
