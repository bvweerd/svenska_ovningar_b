chapter: 23
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan met voor- en achtervoegsels nieuwe woorden maken en begrijpen", topics: [ordbildning] }
  - { text: "Ik kan producten en prijzen uitgebreid vergelijken", topics: [jamforelse] }

grammar:
  - id: ordbildning
    title: Woordvorming
    summary: "Met voor- en achtervoegsels maak je nieuwe woorden: *säker → säker**het***, *beställa → beställ**ning***, *sälja → sälj**are***, ***o**vanlig*, *socker**fri***, *miljö**vänlig***."
    body: |
      Als je deze vaste delen herkent, begrijp je veel woorden zonder woordenboek.

      | deel | maakt | voorbeelden |
      |---|---|---|
      | **-het** | eigenschap (en-woord) van een bijvoeglijk naamwoord | *säker → säkerhet, möjlig → möjlighet, ny → nyhet* |
      | **-ning / -ing** | handeling (en-woord) van een werkwoord | *beställa → beställning, betala → betalning, förklara → förklaring* |
      | **-are** | persoon (en-woord) van een werkwoord | *sälja → säljare, läsa → läsare, arbeta → arbetare* |
      | **o-** | het tegendeel | *vanlig → ovanlig, möjlig → omöjlig, hälsosam → ohälsosam* |
      | **-fri** | zonder | *sockerfri, laktosfri, rökfri* |
      | **-lös** | zonder (vaak negatief) | *arbetslös, smaklös, hjälplös* |
      | **-bar** | kan … worden | *ätbar, läsbar* |
      | **-vänlig** | goed voor | *miljövänlig, barnvänlig* |

      Let op de klemtoon bij **o-**: die ligt op *o*: ***o**vanlig*.

  - id: jamforelse
    title: Vergelijken, gevorderd
    summary: "*lika dyr **som***, *inte lika dyr som*, ***ju** mer man äter, **desto** tröttare blir man*, *allt dyrare* (steeds duurder), *så billigt **som** möjligt*, *mycket billigare*. Lange woorden: *mer praktisk, mest omtyckt*."
    body: |
      | constructie | betekenis | voorbeeld |
      |---|---|---|
      | **lika … som** | even … als | *Kasse B kostar **lika** mycket **som** vanlig mat.* |
      | **inte lika … som** | minder … dan | *A är **inte lika** dyr **som** C.* |
      | **ju … desto** | hoe … hoe | ***Ju** mer man lagar mat själv, **desto** billigare blir det.* |
      | **allt** + vergrotende trap | steeds … | *Maten blir **allt** dyrare.* |
      | **mycket** + vergrotende trap | veel … | *Den är **mycket** billigare.* |
      | **så … som möjligt** | zo … mogelijk | *Köp **så** billigt **som** möjligt.* |

      ### Woordvolgorde bij ju … desto
      Het *ju*-deel is een bijzin (onderwerp – werkwoord). Na *desto* + vergrotende trap volgt **inversie**:

      - *Ju mer **man tränar**, desto starkare **blir man**.*

      In informele taal hoor je ook *ju … ju*: *Ju förr, **ju** bättre.* Dat is correct, maar *ju … desto* is de standaard.

      ### Mer en mest
      Bij lange woorden, woorden op *-isk* en deelwoorden gebruik je meestal **mer / mest**:

      - *mer **praktisk**, mest **praktisk***
      - *mer **känd**, mest **omtyckt*** (maar *känd* heeft ook *kändare, kändast*)
      - Het tegendeel: **mindre / minst**: *mindre dyr, minst populär*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-matkassar
        title: "Lezen: maaltijdboxen getest"
        instruction: Lees de test en beantwoord de vragen.
        topic: jamforelse
        textTitle: Matkassar – värda pengarna?
        text: |
          Allt fler svenskar köper matkassar: en låda med recept och ingredienser som levereras hem till dörren. Vi testade tre olika matkassar under en vecka.

          **Kasse A** var billigast, men också minst varierad. Nästan alla rätter innehöll pasta, och efter tre dagar var vi trötta på den.

          **Kasse B** kostade ungefär lika mycket som en vanlig veckohandling. Recepten var både goda och hälsosamma, och tillagningen tog sällan mer än trettio minuter.

          **Kasse C** var dyrast. Råvarorna höll hög kvalitet, men tillagningen tog betydligt längre tid än utlovat. Dessutom var förpackningarna inte särskilt miljövänliga.

          Ju mer man tycker om att planera och laga mat själv, desto mindre behöver man en matkasse. Men för den som har ont om tid kan det vara en bra lösning. **Vårt betyg:** Kasse B är mest prisvärd.
        items:
          - { id: zxkk, type: mc, prompt: "Vad är en matkasse?", options: ["en låda med recept och ingredienser som levereras hem", "en restaurang", "en kokbok", "en butik"], answer: 0 }
          - { id: snmp, type: truefalse, statement: "Kasse A var den dyraste.", answer: false, correction: { answers: ["Kasse A var {billigast|den billigaste}."] } }
          - { id: gctc, type: mc, prompt: "Vad var problemet med kasse A?", options: ["Nästan alla rätter innehöll pasta.", "Den var för dyr.", "Maten kom aldrig.", "Recepten var på engelska."], answer: 0 }
          - { id: rfnz, type: truefalse, statement: "Kasse B kostade ungefär lika mycket som en vanlig veckohandling.", answer: true }
          - { id: bvzj, type: mc, prompt: "Vad var negativt med kasse C?", options: ["Tillagningen tog lång tid och förpackningarna var inte miljövänliga.", "Råvarorna var dåliga.", "Den var billigast.", "Den innehöll bara fisk."], answer: 0 }
          - { id: r2pd, type: mc, prompt: "Vilken kasse rekommenderar testarna?", options: ["kasse B", "kasse A", "kasse C", "ingen"], answer: 0 }
          - { id: kzr2, type: mc, prompt: "Wat betekent *för den som har ont om tid*?", options: ["voor wie weinig tijd heeft", "voor wie pijn heeft", "voor wie veel tijd heeft", "voor wie slecht kookt"], answer: 0 }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-winkelen
        title: Boodschappen en kopen
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: wmpn
            type: match
            pairs:
              - ["ett erbjudande", "een aanbieding"]
              - ["ett kvitto", "een kassabon"]
              - ["reklamera", "een klacht indienen over een product"]
              - ["byta", "ruilen"]
              - ["ekologisk", "biologisch"]
              - ["prisvärd", "zijn geld waard"]
          - id: vvcr
            type: match
            pairs:
              - ["en veckohandling", "de wekelijkse boodschappen"]
              - ["en råvara", "een grondstof, (vers) ingrediënt"]
              - ["en förpackning", "een verpakking"]
              - ["ha ont om", "weinig hebben van"]
              - ["gå på rea", "in de uitverkoop zijn"]
              - ["jämföra", "vergelijken"]

  - id: ordbildning
    title: "Grammatik: woordvorming"
    exercises:
      - id: ordbildning-maken
        title: Maak het woord
        instruction: Maak het gevraagde woord.
        topic: ordbildning
        shuffle: true
        items:
          - { id: khmv, type: gap, text: "säker → (zelfstandig naamwoord) ___", gaps: [{ answers: ["säkerhet", "en säkerhet"] }] }
          - { id: 6emb, type: gap, text: "möjlig → (zelfstandig naamwoord) ___", gaps: [{ answers: ["möjlighet", "en möjlighet"] }] }
          - { id: y7fz, type: gap, text: "beställa → (zelfstandig naamwoord) ___", gaps: [{ answers: ["beställning", "en beställning"], feedback: [{ match: "beställaning", tip: "Haal de -a weg: beställ + ning." }] }] }
          - { id: s2vn, type: gap, text: "betala → (zelfstandig naamwoord) ___", gaps: [{ answers: ["betalning", "en betalning"] }] }
          - { id: 8dkf, type: gap, text: "sälja → (persoon) ___", gaps: [{ answers: ["säljare", "en säljare"] }] }
          - { id: vbdv, type: gap, text: "läsa → (persoon) ___", gaps: [{ answers: ["läsare", "en läsare"] }] }
          - { id: ks27, type: gap, text: "vanlig → (tegendeel) ___", gaps: [{ answers: ["ovanlig"] }] }
          - { id: gpeh, type: gap, text: "hälsosam → (tegendeel) ___", gaps: [{ answers: ["ohälsosam"] }] }
          - { id: d75g, type: gap, text: "socker + zonder → ___", gaps: [{ answers: ["sockerfri"], feedback: [{ match: "sockerlös", tip: "Bij eten en drinken: -fri. sockerfri." }] }] }
          - { id: ssg5, type: gap, text: "miljö + goed voor → ___", gaps: [{ answers: ["miljövänlig"] }] }

      - id: ordbildning-sorteren
        title: Welk achtervoegsel?
        instruction: Welk achtervoegsel maakt het woord met deze betekenis?
        topic: ordbildning
        items:
          - id: dcjw
            type: sort
            categories: ["-het", "-ning", "-are"]
            items:
              - { text: "ny → nieuws", cat: 0 }
              - { text: "öppna → opening", cat: 1 }
              - { text: "sälja → verkoper", cat: 2 }
              - { text: "fri → vrijheid", cat: 0 }
              - { text: "beställa → bestelling", cat: 1 }
              - { text: "arbeta → arbeider", cat: 2 }

  - id: jamforelse
    title: "Grammatik: vergelijken"
    exercises:
      - id: jamfor-kiezen
        title: Het goede woord
        instruction: Kies wat past.
        topic: jamforelse
        shuffle: true
        items:
          - { id: kgnf, type: gap, text: "Kasse B kostar ___ mycket som vanlig mat.", gaps: [{ answers: ["lika"], options: ["lika", "så", "mer"], shuffle: false }] }
          - { id: 78s5, type: gap, text: "Kasse A är inte lika dyr ___ kasse C.", gaps: [{ answers: ["som"], options: ["som", "än", "så"], shuffle: false, feedback: [{ match: "än", tip: "Na lika: som. än hoort bij een vergrotende trap (dyrare än)." }] }] }
          - { id: uaw3, type: gap, text: "Ju mer man lagar mat själv, ___ billigare blir det.", gaps: [{ answers: ["desto"], options: ["desto", "än", "så"], shuffle: false, tip: "ju … desto (informeel ook ju … ju)." }] }
          - { id: sj5w, type: gap, text: "Maten blir ___ dyrare.", gaps: [{ answers: ["allt"], options: ["allt", "alla", "helt"], shuffle: false, tip: "Steeds duurder: allt dyrare." }] }
          - { id: 45u3, type: gap, text: "Vi försöker handla så billigt ___ möjligt.", gaps: [{ answers: ["som"], options: ["som", "än", "så"], shuffle: false }] }
          - { id: 6fcu, type: gap, text: "Den här tröjan är ___ billigare än den där.", gaps: [{ answers: ["mycket"], options: ["mycket", "mer", "mest"], shuffle: false, feedback: [{ match: "mer", tip: "billigare is al een vergrotende trap. Veel goedkoper: mycket billigare." }] }] }
          - { id: dnfb, type: gap, text: "Det är den ___ kända restaurangen i stan.", gaps: [{ answers: ["mest"], options: ["mest", "mer", "mycket"], shuffle: false }] }
          - { id: jgsc, type: gap, text: "Ju fler som köper, ___ lägre blir priset.", gaps: [{ answers: ["desto"], options: ["desto", "än", "så"], shuffle: false }] }

      - id: ju-desto
        title: Hoe … hoe
        instruction: Maak één zin met **ju … desto**.
        topic: jamforelse
        items:
          - { id: 8gg3, type: transform, prompt: "Man tränar mer. Man blir starkare.", answers: ["Ju mer man tränar, desto starkare blir man.", "Ju mer man tränar, ju starkare blir man."], feedback: [{ contains: "desto man blir", tip: "Na desto + vergrotende trap: inversie, desto starkare blir man." }, { contains: "ju mer tränar man", tip: "Het ju-deel is een bijzin: ju mer man tränar." }] }
          - { id: 7hte, type: transform, prompt: "Man sover mindre. Man blir tröttare.", answers: ["Ju mindre man sover, desto tröttare blir man.", "Ju mindre man sover, ju tröttare blir man."], feedback: [{ contains: "desto man blir", tip: "Na desto + vergrotende trap: inversie, desto tröttare blir man." }] }
          - { id: uhn9, type: transform, prompt: "Man handlar tidigare. Det blir billigare.", answers: ["Ju tidigare man handlar, desto billigare blir det.", "Ju tidigare man handlar, ju billigare blir det."], feedback: [{ contains: "desto det blir", tip: "Inversie na desto: desto billigare blir det." }] }
          - { id: xj93, type: transform, prompt: "Man läser mer. Man lär sig fler ord.", answers: ["Ju mer man läser, {desto|ju} fler ord lär man sig."], feedback: [{ contains: "ord man lär", tip: "Na desto + vergrotende trap komt eerst het werkwoord: desto fler ord lär man sig." }] }
          - { id: wsdc, type: transform, prompt: "Varan är äldre. Den blir billigare.", answers: ["Ju äldre varan är, {desto|ju} billigare blir den."], feedback: [{ contains: "billigare den blir", tip: "Inversie na desto: desto billigare blir den." }, { contains: "varan är äldre", tip: "Na ju komt eerst de vergrotende trap: ju äldre varan är." }] }
          - { id: 7bsz, type: transform, prompt: "Det är varmare. Glassen säljer bättre.", answers: ["Ju varmare det är, {desto|ju} bättre säljer glassen."], feedback: [{ contains: "bättre glassen säljer", tip: "Inversie na desto: desto bättre säljer glassen." }] }
          - { id: wsm3, type: transform, prompt: "Man väntar längre. Det blir dyrare.", answers: ["Ju längre man väntar, {desto|ju} dyrare blir det."], feedback: [{ contains: "dyrare det blir", tip: "Inversie na desto: desto dyrare blir det." }] }
          - { id: var4, type: transform, prompt: "Butiken är större. Utbudet blir bredare.", answers: ["Ju större butiken är, {desto|ju} {bredare|större} blir utbudet."] }

      - id: jamfor-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds.
        topic: jamforelse
        items:
          - { id: fuyj, type: translate, prompt: "Deze koffie is even duur als die.", answers: ["Det här kaffet är lika dyrt som det där.", "Det här kaffet kostar lika mycket som det där."], feedback: [{ contains: "lika dyr ", tip: "kaffe is een ett-woord: lika dyrt." }, { contains: "lika dyrt än", tip: "Na lika: som." }] }
          - { id: hm8q, type: translate, prompt: "Alles wordt steeds duurder.", answers: ["{Allt|Allting} blir allt dyrare.", "{Allt|Allting} blir dyrare och dyrare."] }
          - { id: gpzb, type: translate, prompt: "Het is veel goedkoper online.", answers: ["Det är mycket billigare på nätet.", "Det är mycket billigare online."], feedback: [{ contains: "mer billigare", tip: "billigare is al vergrotend: mycket billigare." }] }
          - { id: depz, type: translate, prompt: "Dit is de goedkoopste winkel van de stad.", answers: ["{Det här|Detta} är den billigaste {butiken|affären} i {staden|stan}."], feedback: [{ contains: "den billigast ", tip: "Bepaald: den billigaste butiken." }] }
          - { id: kctq, type: translate, prompt: "Mijn telefoon is niet zo nieuw als de jouwe.", answers: ["Min {mobil|telefon} är inte {lika|så} ny som din."], feedback: [{ contains: "ny än", tip: "Na lika (of så): som." }] }
          - { id: u43c, type: translate, prompt: "Hoe eerder, hoe beter.", answers: ["Ju {förr|tidigare}, {desto|ju} bättre."] }
          - { id: 29kg, type: translate, prompt: "Deze jas is iets duurder dan die.", answers: ["Den här {jackan|rocken|kappan} är {lite|något} dyrare än den där."], feedback: [{ contains: "mer dyr", tip: "dyr is een gewoon bijvoeglijk naamwoord: dyrare." }, { contains: "dyrare som", tip: "Na een vergrotende trap: än." }] }
          - { id: d3n3, type: translate, prompt: "Vlees wordt steeds duurder.", answers: ["{Kött|Köttet} blir {allt dyrare|dyrare och dyrare}."] }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-erbjudanden
        title: "Luisteren: aanbiedingen in de winkel"
        instruction: Luister naar het omroepbericht in de supermarkt. Is de bewering **rätt** of **fel**?
        topic: jamforelse
        listen: true
        textTitle: Veckans erbjudanden
        text: |
          Hej och välkommen till butiken! Den här veckan har vi flera bra erbjudanden. Köp två paket kaffe för åttionio kronor, det är mycket billigare än vanligt. Ekologiska bananer kostar bara nitton och nittio per kilo.

          I brödavdelningen hittar du gårdagens surdegsbröd till halva priset. Det är nästan lika gott som nybakat! Och glöm inte att lämna dina pantflaskor vid entrén. Tack för att du handlar hos oss!
        items:
          - { id: khqs, type: truefalse, statement: "Två paket kaffe kostar åttionio kronor.", answer: true }
          - { id: xxb5, type: truefalse, statement: "Bananerna kostar nittio kronor per kilo.", answer: false, correction: { answers: ["{Bananerna|De} kostar nitton och nittio[ kronor] per kilo.", "{Bananerna|De} kostar 19,90 per kilo."] } }
          - { id: 3ycy, type: truefalse, statement: "Gårdagens bröd kostar halva priset.", answer: true }
          - { id: v7g4, type: truefalse, statement: "Man lämnar pantflaskor i kassan.", answer: false, correction: { answers: ["Man lämnar {dem|pantflaskorna|pantflaskor} vid entrén."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: jamforelse
        shuffle: true
        items:
          - { id: f3b7, type: listen, say: "Kaffet är mycket billigare den här veckan." }
          - { id: mkrj, type: listen, say: "Ju mer man tränar, desto starkare blir man." }
          - { id: s6p3, type: listen, say: "Maten blir allt dyrare." }
          - { id: rvkc, type: listen, say: "Det här är inte lika gott som förra gången." }

  - id: praktiskt
    title: Praktiskt · vergelijken en kiezen
    exercises:
      - id: dialoog-byta
        title: Iets terugbrengen
        instruction: Zet het gesprek in de goede volgorde.
        topic: woordenschat
        items:
          - id: va8u
            type: dialogue
            lines:
              - "Kunden: Hej! Jag köpte den här vattenkokaren i förra veckan, men den har redan gått sönder."
              - "Expediten: Åh, vad tråkigt. Har du kvar kvittot?"
              - "Kunden: Ja, här är det."
              - "Expediten: Tack. Vill du byta den mot en ny eller få pengarna tillbaka?"
              - "Kunden: Finns det någon modell som är mer hållbar?"
              - "Expediten: Den här är lite dyrare, men den har fem års garanti."
              - "Kunden: Då tar jag den och betalar mellanskillnaden."

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat je zegt.
        topic: jamforelse
        shuffle: true
        items:
          - { id: 8dde, type: mc, prompt: "Je wilt weten wat het verschil is.", options: ["Vad är skillnaden mellan de här två?", "Vad är priset på skillnaden?", "Vilken skillnad är du?", "Är de lika skillnad?"], answer: 0 }
          - { id: nxmx, type: mc, prompt: "Je wilt iets goedkopers.", options: ["Har ni något som är lite billigare?", "Har ni något som är lite billigast?", "Har ni något som är lika billigare?", "Har ni mer billig?"], answer: 0 }
          - { id: 4zwg, type: mc, prompt: "Je wilt je geld terug.", options: ["Kan jag få pengarna tillbaka?", "Kan jag få kvittot tillbaka?", "Kan jag byta pengarna?", "Kan jag reklamera pengarna?"], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een recensie."
    exercises:
      - id: skriva-recension
        title: Schrijf een recensie
        instruction: Schrijf een korte recensie.
        topic: jamforelse
        items:
          - id: 9dyy
            type: free
            prompt: "Schrijf een recensie (80–120 woorden) van een restaurant, café of product dat je kent. Vergelijk het met een ander, noem voor- en nadelen en geef een cijfer. Gebruik **lika … som** of **inte lika … som**, een vergrotende trap met **än**, en een overtreffende trap."
            minWords: 75
            require:
              - { any: ["lika"], label: "Je gebruikt lika … som" }
              - { any: ["än"], label: "Je vergelijkt met än" }
              - { any: ["bäst", "billigast", "godast", "mest", "dyrast", "sämst", "minst"], label: "Je gebruikt een overtreffende trap" }
              - { any: ["men", "däremot", "dessutom"], label: "Je noemt voor- en nadelen (men, däremot, dessutom)" }
              - { any: ["betyg", "av fem", "av tio", "rekommenderar"], label: "Je geeft een oordeel of cijfer" }
            model: "Kafé Linden ligger mitt i stan och är ett av de populäraste kaféerna i Örebro. Jag har jämfört det med Kafé Ekan, som ligger bara två kvarter bort. Kanelbullarna på Linden är mycket godare än på Ekan, och kaffet är precis så starkt som jag vill ha det. Däremot är priserna högre: en kaffe och en bulle kostar sextio kronor. Dessutom är det svårt att hitta en ledig plats på helgerna. Ju tidigare man kommer, desto lugnare är det. Mitt betyg: fyra av fem. Bästa kanelbullen i stan!"

  - id: herhaling
    title: Herhaling
    exercises:
      - id: herhaling-13-23
        title: Hoofdstuk 13 tot en met 23 door elkaar
        instruction: Gemengde vragen.
        shuffle: true
        items:
          - { id: vf8q, type: gap, topic: passiv-s, text: "Matkassen ___ (leverera) hem till dörren.", gaps: [{ answers: ["levereras"] }] }
          - { id: cz4a, type: gap, topic: particip, text: "Vi köpte ___ (nybaka) bröd.", gaps: [{ answers: ["nybakat"] }] }
          - { id: fabu, type: gap, topic: villkor, text: "Om maten ___ (vara) billigare, skulle vi köpa mer.", gaps: [{ answers: ["var", "vore"] }] }
          - { id: 99fq, type: gap, topic: nagon-ingen, text: "Jag har inte köpt ___ kaffe.", gaps: [{ answers: ["något"], options: ["något", "inget", "någon"], shuffle: false, tip: "kaffe is een ett-woord, en na inte: något." }] }
          - { id: uhe3, type: gap, topic: sambandsord, text: "Kasse C var dyr. ___ var förpackningarna inte miljövänliga.", gaps: [{ answers: ["Dessutom"], options: ["Dessutom", "Därför", "Däremot"], shuffle: false }] }
          - { id: z4c9, type: gap, topic: ordbildning, text: "beställa → en ___", gaps: [{ answers: ["beställning"] }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: jamforelse
        shuffle: true
        items:
