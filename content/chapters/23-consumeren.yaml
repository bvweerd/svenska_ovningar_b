            feedback:
              - { contains: "lika dyr än", tip: "Na *lika*: *som*." }
              - { contains: "mer nyttigare", tip: "*nyttigare* is al een vergrotende trap: *mycket nyttigare*." }
          - id: 29g2
            type: translate
            prompt: "Omdat de prijzen steeds hoger worden, kopen veel gezinnen goedkoper eten."
            answers:
