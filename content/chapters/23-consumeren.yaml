          - { id: 52kv, type: translate, prompt: "Tegenwoordig kopen steeds meer mensen hun kerstcadeaus online.", answers: ["{Nuförtiden|Numera|I dag} köper {allt fler|fler och fler} {människor|personer} sina julklappar {på nätet|online}.", "{Allt fler|Fler och fler} {människor|personer} köper sina julklappar {på nätet|online} {nuförtiden|numera|i dag}."], feedback: [{ contains: ["nuförtiden allt", "nuförtiden fler", "numera allt", "numera fler", "i dag allt", "i dag fler"], tip: "Na nuförtiden vooraan: inversie, nuförtiden köper allt fler människor." }, { contains: "deras julklappar", tip: "Hun eigen cadeaus (van het onderwerp): sina julklappar." }] }

      - id: jamfor-zinnen
        title: Vertaal de langere zinnen
        instruction: Vertaal naar het Zweeds.
        topic: jamforelse
        shuffle: true
        items:
          - id: 3sx7
            type: translate
            prompt: "Hoe meer je zelf kookt, hoe minder geld je aan eten uitgeeft."
            answers:
              - "Ju mer man {lagar mat själv|själv lagar mat}, {desto|ju} mindre pengar {lägger|spenderar|använder} man på mat."
              - "Ju mer du {lagar mat själv|själv lagar mat}, {desto|ju} mindre pengar {lägger|spenderar|använder} du på mat."
            feedback:
              - { contains: "pengar man lägger", tip: "Na *desto* + vergrotende trap: inversie, *desto mindre pengar lägger man*." }
              - { contains: "pengar du lägger", tip: "Na *desto* + vergrotende trap: inversie, *desto mindre pengar lägger du*." }
              - { contains: "ju mer lagar", tip: "Het *ju*-deel is een bijzin: *ju mer man lagar*." }
