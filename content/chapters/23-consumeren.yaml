chapter: 23
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan met voor- en achtervoegsels nieuwe woorden maken en begrijpen", topics: [ordbildning] }
  - { text: "Ik kan producten en prijzen uitgebreid vergelijken", topics: [jamforelse] }

grammar:
  - id: ordbildning
    title: Woordvorming
    summary: "Met voor- en achtervoegsels maak je nieuwe woorden: *säker → säker**het***, *beställa → beställ**ning***, *sälja → sälj**are***, ***o**vanlig*, *socker**fri***, *miljö**vänlig***."
    body: |
      Als je deze vaste delen herkent, begrijp je veel woorden zonder woordenboek.

      | deel | maakt | voorbeelden |
      |---|---|---|
      | **-het** | eigenschap (en-woord) van een bijvoeglijk naamwoord | *säker → säkerhet, möjlig → möjlighet, ny → nyhet* |
      | **-ning / -ing** | handeling (en-woord) van een werkwoord | *beställa → beställning, betala → betalning, förklara → förklaring* |
      | **-are** | persoon (en-woord) van een werkwoord | *sälja → säljare, läsa → läsare, arbeta → arbetare* |
      | **o-** | het tegendeel | *vanlig → ovanlig, möjlig → omöjlig, hälsosam → ohälsosam* |
      | **-fri** | zonder | *sockerfri, laktosfri, rökfri* |
      | **-lös** | zonder (vaak negatief) | *arbetslös, smaklös, hjälplös* |
      | **-bar** | kan … worden | *ätbar, läsbar* |
      | **-vänlig** | goed voor | *miljövänlig, barnvänlig* |

      Let op de klemtoon bij **o-**: die ligt op *o*: ***o**vanlig*.

  - id: jamforelse
    title: Vergelijken, gevorderd
    summary: "*lika dyr **som***, *inte lika dyr som*, ***ju** mer man äter, **desto** tröttare blir man*, *allt dyrare* (steeds duurder), *så billigt **som** möjligt*, *mycket billigare*. Lange woorden: *mer praktisk, mest omtyckt*."
    body: |
      | constructie | betekenis | voorbeeld |
      |---|---|---|
      | **lika … som** | even … als | *Kasse B kostar **lika** mycket **som** vanlig mat.* |
      | **inte lika … som** | minder … dan | *A är **inte lika** dyr **som** C.* |
      | **ju … desto** | hoe … hoe | ***Ju** mer man lagar mat själv, **desto** billigare blir det.* |
      | **allt** + vergrotende trap | steeds … | *Maten blir **allt** dyrare.* |
      | **mycket** + vergrotende trap | veel … | *Den är **mycket** billigare.* |
      | **så … som möjligt** | zo … mogelijk | *Köp **så** billigt **som** möjligt.* |

      ### Woordvolgorde bij ju … desto
      Het *ju*-deel is een bijzin (onderwerp – werkwoord). Na *desto* + vergrotende trap volgt **inversie**:

      - *Ju mer **man tränar**, desto starkare **blir man**.*

      In informele taal hoor je ook *ju … ju*: *Ju förr, **ju** bättre.* Dat is correct, maar *ju … desto* is de standaard.

      ### Mer en mest
      Bij lange woorden, woorden op *-isk* en deelwoorden gebruik je meestal **mer / mest**:

      - *mer **praktisk**, mest **praktisk***
      - *mer **känd**, mest **omtyckt*** (maar *känd* heeft ook *kändare, kändast*)
      - Het tegendeel: **mindre / minst**: *mindre dyr, minst populär*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-matkassar
        title: "Lezen: maaltijdboxen getest"
        instruction: Lees de test en beantwoord de vragen.
        topic: jamforelse
        textTitle: Matkassar – värda pengarna?
        text: |
          Allt fler svenskar köper matkassar: en låda med recept och ingredienser som levereras hem till dörren. Vi testade tre olika matkassar under en vecka. Vi är en familj på fyra personer i Västerås, och vi lagade alla rätter själva. Efter varje middag fick alla ge betyg från ett till fem, även barnen.

          **Kasse A** var billigast, men också minst varierad. Nästan alla rätter innehöll pasta, och efter tre dagar var vi trötta på den.

          **Kasse B** kostade ungefär lika mycket som en vanlig veckohandling. Recepten var både goda och hälsosamma, och tillagningen tog sällan mer än trettio minuter.

          **Kasse C** var dyrast. Råvarorna höll hög kvalitet, men tillagningen tog betydligt längre tid än utlovat. Dessutom var förpackningarna inte särskilt miljövänliga.

          Barnen gav kasse A högst betyg, eftersom de älskar pasta. De vuxna gav den däremot lägst betyg. Kasse B var den enda som alla i familjen tyckte om.

          Vi jämförde också priserna med vår vanliga veckohandling. Kasse A var ungefär femton procent billigare, och kasse C kostade nästan dubbelt så mycket. Men med en matkasse slänger man mindre mat, eftersom man bara får det man behöver. Det är både bra för plånboken och mer miljövänligt än att köpa för mycket och slänga resten.

          Ju mer man tycker om att planera och laga mat själv, desto mindre behöver man en matkasse. Men för den som har ont om tid kan det vara en bra lösning. **Vårt betyg:** Kasse B är mest prisvärd.
        items:
          - { id: zxkk, type: mc, prompt: "Vad är en matkasse?", options: ["en låda med recept och ingredienser som levereras hem", "en restaurang", "en kokbok", "en butik"], answer: 0 }
          - { id: snmp, type: truefalse, statement: "Kasse A var den dyraste.", answer: false, correction: { answers: ["Kasse A var {billigast|den billigaste}."] } }
          - { id: gctc, type: mc, prompt: "Vad var problemet med kasse A?", options: ["Nästan alla rätter innehöll pasta.", "Den var för dyr.", "Maten kom aldrig.", "Recepten var på engelska."], answer: 0 }
          - { id: rfnz, type: truefalse, statement: "Kasse B kostade ungefär lika mycket som en vanlig veckohandling.", answer: true }
          - { id: bvzj, type: mc, prompt: "Vad var negativt med kasse C?", options: ["Tillagningen tog lång tid och förpackningarna var inte miljövänliga.", "Råvarorna var dåliga.", "Den var billigast.", "Den innehöll bara fisk."], answer: 0 }
          - { id: r2pd, type: mc, prompt: "Vilken kasse rekommenderar testarna?", options: ["kasse B", "kasse A", "kasse C", "ingen"], answer: 0 }
          - { id: kzr2, type: mc, prompt: "Wat betekent *för den som har ont om tid*?", options: ["voor wie weinig tijd heeft", "voor wie pijn heeft", "voor wie veel tijd heeft", "voor wie slecht kookt"], answer: 0 }
          - { id: hk9q, type: mc, prompt: "Hur gav familjen betyg på rätterna?", options: ["Alla gav betyg från ett till fem efter varje middag.", "Bara de vuxna gav betyg.", "En kock gav betyg.", "De gav betyg en gång i slutet av veckan."], answer: 0 }
          - { id: j49w, type: truefalse, statement: "Barnen tyckte minst om kasse A.", answer: false, correction: { answers: ["{Barnen|De} gav kasse A högst betyg.", "{Barnen|De} tyckte bäst om kasse A."] } }
          - { id: ax3x, type: mc, prompt: "Varför slänger man mindre mat med en matkasse?", options: ["för att man bara får det man behöver", "för att maten är godare", "för att barnen äter mer", "för att förpackningarna är mindre"], answer: 0 }

      - id: makkelijk-1
        title: "Makkelijk lezen: Rean"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Rean"
        text: |
          I januari är det rea i många affärer. Fredrik ville köpa en ny jacka. I den första affären kostade jackan 1 200 kronor, men i den andra var den 30 procent billigare. Han valde den billigare. Hemma märkte han att en knapp saknades. Han gick tillbaka, och säljaren bytte jackan utan problem. Nu har Fredrik både en ny jacka och pengar kvar till en mössa.
        items:
          - { id: ahzq, type: truefalse, statement: "Jackan var billigare i den andra affären.", answer: true }
          - { id: aqrc, type: truefalse, statement: "Säljaren ville inte byta jackan.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Ekologisk mat"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Ekologisk mat"
        text: |
          Maria köper allt oftare ekologisk mat. Den är dyrare, men hon tycker att den är godare och bättre för miljön. Ju mer hon läser om mat och miljö, desto mer intresserad blir hon. Nu odlar hon jordgubbar på balkongen. Hennes man trodde först inte på idén. Men nu hjälper han till varje kväll. Förra sommaren fick de nästan fem kilo jordgubbar, och de gjorde egen sylt.
        items:
          - { id: 8abs, type: truefalse, statement: "Maria tycker att ekologisk mat är billigare.", answer: false }
          - { id: wv77, type: truefalse, statement: "Maria odlar jordgubbar på balkongen.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: En ny mobil"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "En ny mobil"
        text: |
          Johans gamla mobil har gått sönder. Han jämför två nya modeller i en butik. Den ena är billigare, men den har en sämre kamera. Den andra är dyrare och har ett större batteri. Säljaren säger att den dyrare håller längre. Johan tänker länge. Till slut köper han den billigare, eftersom han inte tar så många bilder. Han köper också ett skal, så att mobilen inte går sönder lika lätt.
        items:
          - { id: rpgb, type: truefalse, statement: "Johan köper den dyrare mobilen.", answer: false }
          - { id: fvnz, type: mc, prompt: "Vad har den dyrare mobilen?", options: ["En sämre kamera.", "Ett större batteri.", "Ett skal."], answer: 1 }
          - { id: jvme, type: truefalse, statement: "Johan tar inte så många bilder.", answer: true }

      - id: makkelijk-4
        title: "Makkelijk lezen: Second hand"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Second hand"
        text: |
          Maja köper nästan alla sina kläder second hand. Det är billigare än i vanliga butiker, och det är bättre för miljön. I lördags hittade hon en vinterjacka för hundra kronor. Den var nästan lika fin som en ny. Hennes vän Lisa köper hellre nya kläder, men hon tycker att Majas jacka är snyggare än hennes egen. Nästa gång vill Lisa följa med till butiken.
        items:
          - { id: wj98, type: mc, prompt: "Hur mycket kostade jackan?", options: ["Hundra kronor.", "Femhundra kronor.", "Tusen kronor."], answer: 0 }
          - { id: fz8e, type: truefalse, statement: "Lisa köper också alla sina kläder second hand.", answer: false }
          - { id: 2t9q, type: truefalse, statement: "Lisa vill följa med nästa gång.", answer: true }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-winkelen
        title: Boodschappen en kopen
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: wmpn
            type: match
            pairs:
              - ["ett erbjudande", "een aanbieding"]
              - ["ett kvitto", "een kassabon"]
              - ["reklamera", "een klacht indienen over een product"]
              - ["byta", "ruilen"]
              - ["ekologisk", "biologisch"]
              - ["prisvärd", "zijn geld waard"]
          - id: vvcr
            type: match
            pairs:
              - ["en veckohandling", "de wekelijkse boodschappen"]
              - ["en råvara", "een grondstof, (vers) ingrediënt"]
              - ["en förpackning", "een verpakking"]
              - ["ha ont om", "weinig hebben van"]
              - ["gå på rea", "in de uitverkoop zijn"]
              - ["jämföra", "vergelijken"]

      - id: ord-alle-woorden
        title: "Woorden in een zin: de rest van de lijst"
        instruction: Kies het woord dat past. Zo zie je ook de woorden uit de lijst die nog nergens in een zin stonden.
        topic: woordenschat
        shuffle: true
        items:
          - { id: at8d, type: gap, text: "Den här mobilen har två års ___, så du kan reklamera den om den går sönder.", gaps: [{ answers: ["garanti"], options: ["garanti", "rabatt", "recension", "leverans"], feedback: [{ match: "rabatt", tip: "*rabatt* betekent „een korting”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: f7tv, type: gap, text: "Det var stor ___ i pris mellan skorna, så när jag bytte betalade jag mellanskillnaden.", gaps: [{ answers: ["skillnad"], options: ["skillnad", "garanti", "storlek", "reklam"], feedback: [{ match: "storlek", tip: "*storlek* betekent „een maat (van kleding of schoenen), een grootte”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: ayet, type: gap, text: "Innan jag köper något läser jag alltid ___ på nätet.", gaps: [{ answers: ["recensioner"], options: ["recensioner", "rabatter", "leveranser", "garantier"], feedback: [{ match: "rabatter", tip: "*rabatter* betekent „een korting”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: vdhb, type: gap, text: "Med kortet får du 20 procents ___ på alla skor.", gaps: [{ answers: ["rabatt"], options: ["rabatt", "reklam", "garanti", "ångerrätt"], feedback: [{ match: "reklam", tip: "*reklam* betekent „reclame”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: wa9k, type: gap, text: "Som ___ har du ångerrätt i 14 dagar när du handlar i en nätbutik.", gaps: [{ answers: ["konsument"], options: ["konsument", "leverans", "recension", "provhytt"], feedback: [{ match: "leverans", tip: "*leverans* betekent „een levering”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: wq9s, type: gap, text: "Det finns för mycket ___ på tv, och den får oss att ___ mer än vi behöver.", gaps: [{ answers: ["reklam"], options: ["reklam", "rabatt", "garanti", "leverans"], feedback: [{ match: "rabatt", tip: "*rabatt* betekent „een korting”. Lees de zin nog eens: wat past hier?" }] }, { answers: ["konsumera"], options: ["konsumera", "pruta", "returnera", "reklamera"] }] }
          - { id: cnu8, type: gap, text: "___ tog en vecka, men allt i paketet var rätt.", gaps: [{ answers: ["Leveransen"], options: ["Leveransen", "Recensionen", "Rabatten", "Reklamen"], feedback: [{ match: "Rabatten", tip: "*Rabatten* betekent „een korting”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: t6dq, type: gap, text: "Läs ___ på förpackningen om du är allergisk mot nötter.", gaps: [{ answers: ["innehållsförteckningen"], options: ["innehållsförteckningen", "prislappen", "recensionen", "garantin"], feedback: [{ match: "prislappen", tip: "*prislappen* betekent „een prijskaartje”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 87xt, type: gap, text: "Byxorna var för små, så jag gick tillbaka till ___ med en större ___.", gaps: [{ answers: ["provhytten"], options: ["provhytten", "nätbutiken", "leveransen", "rabatten"], feedback: [{ match: "nätbutiken", tip: "*nätbutiken* betekent „een webwinkel”. Lees de zin nog eens: wat past hier?" }] }, { answers: ["storlek"], options: ["storlek", "skillnad", "garanti", "rabatt"] }] }
          - { id: kr5j, type: gap, text: "Jag fick ett ___ på 500 kronor i födelsedagspresent.", gaps: [{ answers: ["presentkort"], options: ["presentkort", "kontokort", "impulsköp", "kvitto"], feedback: [{ match: "kontokort", tip: "*kontokort* betekent „een creditcard, betaalkaart”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: nuky, type: gap, text: "Godiset vid kassan är ett typiskt ___.", gaps: [{ answers: ["impulsköp"], options: ["impulsköp", "presentkort", "kontokort", "kvitto"], feedback: [{ match: "presentkort", tip: "*presentkort* betekent „een cadeaubon”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: fpmx, type: gap, text: "Jag köpte en jacka, men sedan ___ och lämnade tillbaka den.", gaps: [{ answers: ["ångrade jag mig"], options: ["ångrade jag mig", "unnade jag mig", "slog jag till", "prutade jag"], feedback: [{ match: "unnade jag mig", tip: "*unnade jag mig* betekent „zich gunnen, zich trakteren op”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: qftf, type: gap, text: "Det var 50 procent på allt, så jag ___ och köpte två par skor.", gaps: [{ answers: ["slog till"], options: ["slog till", "prutade", "returnerade", "lurade"], feedback: [{ match: "prutade", tip: "*prutade* betekent „afdingen”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: drfj, type: gap, text: "Efter en lång vecka ___ jag mig en god middag på restaurang.", gaps: [{ answers: ["unnade"], options: ["unnade", "ångrade", "returnerade", "lurade"], feedback: [{ match: "ångrade", tip: "*ångrade* betekent „spijt krijgen, van gedachten veranderen”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 9bz2, type: gap, text: "Om varan är trasig kan du ___ den inom 30 dagar.", gaps: [{ answers: ["returnera"], options: ["returnera", "pruta", "lura", "konsumera"], feedback: [{ match: "pruta", tip: "*pruta* betekent „afdingen”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: ft4d, type: gap, text: "På marknaden i Turkiet kan man ofta ___ på priset.", gaps: [{ answers: ["pruta"], options: ["pruta", "returnera", "reklamera", "unna"], feedback: [{ match: "reklamera", tip: "*reklamera* betekent „een klacht indienen over een product”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: sp3g, type: gap, text: "Det ___ sig att jämföra priser innan man köper en ny tv.", gaps: [{ answers: ["lönar"], options: ["lönar", "unnar", "ångrar", "tar"], feedback: [{ match: "ångrar", tip: "*ångrar* betekent „spijt krijgen, van gedachten veranderen”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: wczh, type: gap, text: "Mjölken har ___, kan du köpa mer?", gaps: [{ answers: ["tagit slut"], options: ["tagit slut", "slagit till", "lönat sig", "lurat"], feedback: [{ match: "slagit till", tip: "*slagit till* betekent „toeslaan (bij een koopje)”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 4mha, type: gap, text: "Var försiktig – det finns många som försöker ___ folk på nätet.", gaps: [{ answers: ["lura"], options: ["lura", "pruta", "returnera", "unna"], feedback: [{ match: "pruta", tip: "*pruta* betekent „afdingen”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 22yz, type: gap, text: "Är väskan i ___ läder? – Ja, men tyvärr är den redan ___.", gaps: [{ answers: ["äkta"], options: ["äkta", "onödig", "nöjd", "kontant"], feedback: [{ match: "onödig", tip: "*onödig* betekent „onnodig”. Lees de zin nog eens: wat past hier?" }] }, { answers: ["slutsåld"], options: ["slutsåld", "äkta", "nöjd", "onödig"] }] }
          - { id: kd4w, type: gap, text: "Det var ett ___ köp – jag behövde inte en tredje jacka.", gaps: [{ answers: ["onödigt"], options: ["onödigt", "nöjt", "äkta", "kontant"], feedback: [{ match: "äkta", tip: "*äkta* betekent „echt, authentiek”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: m3bd, type: gap, text: "Jag är mycket ___ med mina nya skor.", gaps: [{ answers: ["nöjd"], options: ["nöjd", "slutsåld", "onödig", "äkta"], feedback: [{ match: "slutsåld", tip: "*slutsåld* betekent „uitverkocht”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: mrx9, type: gap, text: "Titta på ___ – tröjan kostar 299 kronor.", gaps: [{ answers: ["prislappen"], options: ["prislappen", "innehållsförteckningen", "recensionen", "garantin"], feedback: [{ match: "recensionen", tip: "*recensionen* betekent „een recensie”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: b5wr, type: gap, text: "Vill du betala med ___ eller kontant?", gaps: [{ answers: ["kontokort"], options: ["kontokort", "presentkort", "impulsköp", "kvitto"], feedback: [{ match: "presentkort", tip: "*presentkort* betekent „een cadeaubon”. Lees de zin nog eens: wat past hier?" }] }] }

  - id: ordbildning
    title: "Grammatik: woordvorming"
    exercises:
      - id: ontdek-ordbildning
        title: Ontdek de regel – woordvorming
        instruction: Bekijk de voorbeelden en ontdek zelf de regel. Pas hem daarna toe. De uitleg staat ook op de kaart.
        topic: ordbildning
        items:
          - id: cdtj
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *sälja → en säljare*, *läsa → en läsare*, *arbeta → en arbetare*. Wat maakt -are?", options: ["Iemand die het doet: een persoon.", "Een handeling.", "Het tegendeel."], answer: 0, tip: "Een säljare verkoopt, een läsare leest: -are maakt een persoon." }
              - { type: gap, text: "spela → en ___", gaps: [{ answers: ["spelare"], feedback: [{ match: ["spelning", "spelaren"], tip: "Gevraagd is een persoon die speelt, onbepaald: en spelare." }] }] }
          - id: 2bbp
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *beställa → en beställning*, *betala → en betalning*, *förklara → en förklaring*. Wat maakt -ning of -ing?", options: ["Een handeling (een en-woord).", "Een persoon.", "Een eigenschap."], answer: 0, tip: "Een betalning is het betalen zelf: -ning maakt een handeling." }
              - { type: gap, text: "boka → en ___", gaps: [{ answers: ["bokning"], feedback: [{ match: "bokare", tip: "Gevraagd is de handeling, niet de persoon: en bokning." }, { match: "boking", tip: "Meestal is het stam + -ning: beställ-ning, betal-ning, dus bok-ning." }] }] }
          - id: a27j
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *säker → en säkerhet*, *möjlig → en möjlighet*, *fri → en frihet*. Wat maakt -het?", options: ["Een zelfstandig naamwoord voor een eigenschap.", "Een persoon.", "Een werkwoord."], answer: 0, tip: "säker (veilig) → säkerhet (veiligheid): -het maakt van een bijvoeglijk naamwoord een zelfstandig naamwoord." }
              - { type: gap, text: "svag → en ___", gaps: [{ answers: ["svaghet"], feedback: [{ match: ["svagning", "svagare"], tip: "Van een bijvoeglijk naamwoord maak je een eigenschap met -het: svaghet." }] }] }

      - id: ordbildning-maken
        title: Maak het woord
        instruction: Maak het gevraagde woord.
        topic: ordbildning
        shuffle: true
        items:
          - { id: khmv, type: gap, text: "säker → (zelfstandig naamwoord) ___", gaps: [{ answers: ["säkerhet", "en säkerhet"] }] }
