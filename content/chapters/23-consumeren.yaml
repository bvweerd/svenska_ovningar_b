            prompt: "Biologische bananen zijn iets duurder dan gewone, maar ze smaken veel beter."
            answers: ["Ekologiska bananer är {lite|något} dyrare än vanliga[ bananer], men de smakar {mycket|betydligt} bättre."]
            feedback:
