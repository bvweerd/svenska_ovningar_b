              - "Många familjer köper billigare mat[,] eftersom priserna blir {allt högre|högre och högre}."
            feedback:
              - { contains: "blir alla högre", tip: "Steeds hoger: *allt högre*." }
              - { contains: "högre många familjer köper", tip: "Na de bijzin vooraan komt eerst het werkwoord: *köper många familjer*." }
          - id: 3umt
            type: translate
            prompt: "Deze stofzuiger is niet zo duur als die, maar hij is net zo goed."
            answers: ["Den här dammsugaren är inte {lika|så} dyr som den där, men den är [precis ]lika bra."]
            feedback:
              - { contains: "dyr än", tip: "Na *lika* (of *så*): *som*." }
              - { contains: "är lika god", tip: "Over een apparaat zeg je *bra*: *lika bra*." }
          - id: 8gch
            type: translate
            prompt: "We proberen zo weinig mogelijk eten weg te gooien."
            answers: ["Vi försöker [att ]{slänga|kasta} så lite mat som möjligt."]
            feedback:
              - { contains: "lite mat än", tip: "zo … mogelijk = *så … som möjligt*." }
          - id: ugvv
