              - { contains: "mer bättre", tip: "*bättre* is al een vergrotende trap: *mycket bättre*." }
          - id: gzm7
            type: translate
            prompt: "Hoe langer je wacht, hoe moeilijker het wordt om een goedkope vlucht te vinden."
            answers:
              - "Ju längre man väntar, {desto|ju} svårare blir det att hitta {ett billigt flyg|en billig flygresa|en billig flygbiljett}."
              - "Ju längre du väntar, {desto|ju} svårare blir det att hitta {ett billigt flyg|en billig flygresa|en billig flygbiljett}."
            feedback:
              - { contains: "svårare det blir", tip: "Na *desto* + vergrotende trap: inversie, *desto svårare blir det*." }
              - { contains: "billig flyg", tip: "*flyg* is een ett-woord: *ett billigt flyg*." }

