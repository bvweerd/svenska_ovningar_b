chapter: 18

grammar:
  - id: villkor
    title: "Als … dan: skulle"
    summary: "Werkelijke voorwaarde: *Om jag **har** tid **hjälper** jag dig.* Denkbeeldig: *Om jag **hade** tid **skulle** jag **hjälpa** dig.* Verleden: *Om jag **hade vetat** det **skulle** jag **ha kommit**.*"
    body: |
      ### Werkelijke voorwaarde
      Het kan echt gebeuren: gewone **presens** in beide delen.

      - *Om det **regnar**, **stannar** vi hemma.*

      ### Denkbeeldige voorwaarde (nu of later)
      Het is niet zo, of onwaarschijnlijk: **preteritum** in de om-zin, **skulle + infinitief** in de hoofdzin.

      - *Om jag **hade** mer tid, **skulle** jag **träna** mer.* – Als ik meer tijd had, zou ik meer sporten.
      - *Vad **skulle** du **göra** om du **vann** en miljon?*

      ### Denkbeeldig in het verleden
      Het is niet gebeurd: **hade + supinum** in de om-zin, **skulle ha + supinum** (of *hade + supinum*) in de hoofdzin.

      - *Om jag **hade vetat** det, **skulle** jag **ha kommit**.* – Als ik het had geweten, was ik gekomen.
      - Korter en ook gewoon: *Om jag hade vetat det, **hade** jag **kommit**.*

      ### Woordvolgorde
      Begint de zin met de om-zin, dan komt in de hoofdzin eerst het werkwoord (V2): *Om jag hade tid, **skulle jag** hjälpa dig.*

      *Om jag var du* is gewoon Zweeds; *om jag **vore** du* is wat formeler.

  - id: rad-onskan
    title: Advies en wensen
    summary: "Advies: *Du **borde** …, Om jag var du **skulle** jag …, Du **kanske skulle** …* Beleefd vragen: ***Skulle** du kunna …?* Wens: *Jag **önskar** att jag **hade** mer tid.*"
    body: |
      ### Advies geven
      | zin | betekenis |
      |---|---|
      | *Du **borde** prata med honom.* | Je zou met hem moeten praten. |
      | *Om jag var du **skulle** jag prata med honom.* | Als ik jou was, zou ik met hem praten. |
      | *Du **kanske skulle** prata med honom?* | Misschien moet je met hem praten? (voorzichtig) |
      | *Har du **tänkt på** att …?* | Heb je erover nagedacht dat …? |
      | *Det **vore** bra om du …* | Het zou goed zijn als je … |

      *borde* is de verleden tijd van *böra* (moeten, horen te) en wordt bijna alleen in deze vorm gebruikt.

      ### Beleefd vragen
      - ***Skulle** du kunna hjälpa mig?* – Zou je me kunnen helpen?
      - *Jag **skulle vilja** ha en kopp kaffe.* – Ik zou graag …

      ### Wensen
      Na *önska att* en *tänk om* komt de **verleden tijd**, net als bij een denkbeeldige voorwaarde:

      - *Jag **önskar** att jag **hade** mer tid.* – Ik wou dat ik meer tijd had.
      - ***Tänk om** vi **kunde** åka till Island!* – Stel je voor dat we naar IJsland konden!
      - *Om jag **ändå** **hade** lyssnat!* – Had ik maar geluisterd!

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-fraga-frida
        title: "Lezen: vraag het Frida"
        instruction: Lees de brief en het antwoord. Beantwoord de vragen.
        topic: rad-onskan
        textTitle: Fråga Frida
        text: |
          **Hej Frida!** Jag och min sambo Erik har bott tillsammans i Stockholm i fem år. Nu har Erik fått ett jobberbjudande i Luleå, där han växte upp, och han vill gärna flytta tillbaka. Men jag trivs i Stockholm. Här har jag mitt jobb, mina vänner och min kör. Om vi flyttade skulle jag inte känna någon. Samtidigt vet jag att Erik har längtat hem länge. Vad ska jag göra? *Kluven i Stockholm*

          **Hej Kluven!** Det låter som ett svårt beslut, och det är bra att du tar det på allvar. Om jag var du skulle jag först prata öppet med Erik om vad ni båda vill de närmaste åren. Ni kanske kan hitta en kompromiss? Erik skulle kunna ta jobbet på prov i ett år, och ni skulle kunna hälsa på varandra varannan helg. Du borde också åka upp till Luleå en vecka och se hur det känns. Kanske finns det en kör där också! Om ni bestämmer er tillsammans blir det lättare, vad ni än väljer. Lycka till! *Frida*
        items:
          - { type: mc, prompt: "Varför vill Erik flytta till Luleå?", options: ["Han har fått ett jobberbjudande där.", "Han tycker inte om Stockholm.", "Hans föräldrar är sjuka.", "Han vill sjunga i en kör."], answer: 0 }
          - { type: truefalse, statement: "Kluven trivs inte i Stockholm.", answer: false, correction: { answers: ["{Kluven|Hon|Han} trivs [bra ]i Stockholm."] } }
          - { type: mc, prompt: "Vad skulle hända om de flyttade, enligt Kluven?", options: ["Hon skulle inte känna någon.", "Hon skulle få ett nytt jobb.", "Erik skulle bli arg.", "De skulle köpa ett hus."], answer: 0 }
          - { type: mc, prompt: "Vad är Fridas första råd?", options: ["att prata öppet med Erik", "att flytta direkt", "att göra slut", "att stanna i Stockholm"], answer: 0 }
          - { type: truefalse, statement: "Frida föreslår att Erik tar jobbet på prov i ett år.", answer: true }
          - { type: mc, prompt: "Wat betekent *kluven*?", options: ["verscheurd, in tweestrijd", "boos", "verliefd", "eenzaam"], answer: 0 }
          - type: multi
            prompt: "Welke zinnen in de tekst geven advies?"
            options: ["Om jag var du skulle jag först prata öppet med Erik.", "Du borde också åka upp till Luleå.", "Erik skulle kunna ta jobbet på prov.", "Om vi flyttade skulle jag inte känna någon.", "Han vill gärna flytta tillbaka."]
            answers: [0, 1, 2]
            tip: "Om vi flyttade … is een denkbeeldige situatie, geen advies."

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-relaties
        title: Relaties
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - type: match
            pairs:
              - ["en sambo", "samenwonende partner"]
              - ["en särbo", "partner met wie je niet samenwoont"]
              - ["bli ihop", "verkering krijgen"]
              - ["göra slut", "het uitmaken"]
              - ["vara kär i", "verliefd zijn op"]
              - ["gräla", "ruziemaken"]
          - type: match
            pairs:
              - ["förlovad", "verloofd"]
              - ["gifta sig", "trouwen"]
              - ["skilja sig", "scheiden"]
              - ["svärmor", "schoonmoeder"]
              - ["ett förhållande", "een relatie"]
              - ["längta efter", "verlangen naar"]

  - id: villkor
    title: "Grammatik: als … dan"
    exercises:
      - id: villkor-invullen
        title: Skulle en hade
        instruction: Vul het werkwoord in de goede vorm in.
        topic: villkor
        shuffle: true
        items:
          - { type: gap, text: "Om jag ___ (ha) mer tid, skulle jag träna mer.", gaps: [{ answers: ["hade"], feedback: [{ match: "har", tip: "Het is denkbeeldig (ik heb geen tijd): verleden tijd, hade." }, { match: "skulle ha", tip: "In de om-zin komt geen skulle: hade." }] }] }
          - { type: gap, text: "Om vi bodde närmare, ___ vi ses oftare.", gaps: [{ answers: ["skulle"], options: ["skulle", "ska", "kommer att"], shuffle: false, feedback: [{ match: "ska", tip: "Denkbeeldig: skulle." }] }] }
          - { type: gap, text: "Vad ___ du göra om du vann en miljon?", gaps: [{ answers: ["skulle"], options: ["skulle", "ska", "kommer"], shuffle: false }] }
          - { type: gap, text: "Om jag hade vetat det, skulle jag ___ ringt dig.", gaps: [{ answers: ["ha"], options: ["ha", "har", "hade"], shuffle: false, tip: "skulle ha + supinum: skulle ha ringt." }] }
          - { type: gap, text: "Om hon ___ (vara) här nu, skulle hon skratta.", gaps: [{ answers: ["var", "vore"], feedback: [{ match: "är", tip: "Ze is er niet: denkbeeldig, dus var (of formeel vore)." }] }] }
          - { type: gap, text: "Om du ___ (fråga) honom i går, hade han hjälpt dig.", gaps: [{ answers: ["hade frågat"], feedback: [{ match: "frågade", tip: "Het gaat om het verleden en het is niet gebeurd: hade frågat." }] }] }

      - id: villkor-omvormen
        title: Van echt naar denkbeeldig
        instruction: Maak de voorwaarde denkbeeldig (met **hade/-de** en **skulle**).
        topic: villkor
        items:
          - { type: transform, prompt: "Om jag har tid, hjälper jag dig.", answers: ["Om jag hade tid, skulle jag hjälpa dig.", "Om jag hade tid, hjälpte jag dig."], feedback: [{ contains: "skulle jag hjälpte", tip: "Na skulle komt de infinitief: skulle jag hjälpa." }, { contains: "jag skulle hjälpa", tip: "Na de om-zin komt eerst het werkwoord: skulle jag hjälpa." }] }
          - { type: transform, prompt: "Om det regnar, stannar vi hemma.", answers: ["Om det regnade, skulle vi stanna hemma.", "Om det regnade, stannade vi hemma."], feedback: [{ contains: "vi skulle", tip: "Na de om-zin komt eerst het werkwoord: skulle vi." }] }
          - { type: transform, prompt: "Om du frågar, svarar hon.", answers: ["Om du frågade, skulle hon svara.", "Om du frågade, svarade hon."] }
          - { type: transform, prompt: "Jag visste det inte, så jag kom inte. (Begin met: Om jag hade …)", answers: ["Om jag hade vetat det, skulle jag ha kommit.", "Om jag hade vetat det, hade jag kommit."], feedback: [{ contains: "skulle jag kommit", tip: "Vergeet ha niet: skulle jag ha kommit." }] }

      - id: villkor-sorteren
        title: Echt of denkbeeldig?
        instruction: Kan het echt gebeuren, of is het denkbeeldig?
        topic: villkor
        items:
          - type: sort
            categories: ["echte voorwaarde", "denkbeeldig"]
            items:
              - { text: "Om du kommer i tid, hinner vi med tåget.", cat: 0 }
              - { text: "Om jag var rik, skulle jag köpa ett hus vid havet.", cat: 1 }
              - { text: "Om det är fint väder, grillar vi.", cat: 0 }
              - { text: "Om vi hade träffats tidigare, hade allt varit annorlunda.", cat: 1 }
              - { text: "Om du vill, kan jag följa med.", cat: 0 }
              - { text: "Om jag kunde flyga, skulle jag besöka dig varje dag.", cat: 1 }

  - id: rad
    title: "Grammatik: advies en wensen"
    exercises:
      - id: rad-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds.
        topic: rad-onskan
        items:
          - { type: translate, prompt: "Als ik jou was, zou ik met hem praten.", answers: ["Om jag {var|vore} du, skulle jag prata med honom.", "Om jag {var|vore} du, hade jag pratat med honom."], feedback: [{ contains: "jag skulle prata", tip: "Na de om-zin komt eerst het werkwoord: skulle jag prata." }, { contains: "om jag är du", tip: "Denkbeeldig: om jag var du." }] }
          - { type: translate, prompt: "Je zou meer moeten slapen.", answers: ["Du borde sova mer."], feedback: [{ contains: "skulle måste", tip: "Moeten (advies) = borde: Du borde sova mer." }] }
          - { type: translate, prompt: "Ik wou dat ik meer tijd had.", answers: ["Jag önskar att jag hade mer tid."], feedback: [{ contains: "att jag har", tip: "Na önskar att: verleden tijd, hade." }] }
          - { type: translate, prompt: "Zou je me kunnen helpen?", answers: ["Skulle du kunna hjälpa mig?"] }
          - { type: translate, prompt: "Stel je voor dat we naar IJsland konden gaan!", answers: ["Tänk om vi kunde {åka|resa} till Island!"] }

      - id: rad-kiezen
        title: Een goed advies
        instruction: Je vriendin zegt iets. Kies het beste advies.
        topic: rad-onskan
        shuffle: true
        items:
          - { type: mc, prompt: "*Jag är så trött hela tiden.*", options: ["Du borde kanske gå och lägga dig tidigare.", "Du borde vara trött.", "Om jag var du skulle jag vara trött.", "Jag önskar att du var trött."], answer: 0 }
          - { type: mc, prompt: "*Min chef ger mig för mycket jobb.*", options: ["Om jag var du skulle jag prata med henne om det.", "Om jag var din chef skulle jag ge dig mer.", "Du borde jobba mindre hemma.", "Tänk om du hade ett jobb!"], answer: 0 }
          - { type: mc, prompt: "*Jag har grälat med min syster.*", options: ["Du kanske skulle ringa henne och be om ursäkt?", "Du borde gräla mer.", "Om jag var din syster skulle jag gräla.", "Jag önskar att jag hade en syster."], answer: 0 }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-sara
        title: "Luisteren: Sara vraagt om advies"
        instruction: Luister naar het bericht van Sara. Is de bewering **rätt** of **fel**?
        topic: villkor
        listen: true
        textTitle: Ett röstmeddelande från Sara
        text: |
          Hej, det är Sara! Jag behöver ditt råd. Min bästa vän Linnea har glömt min födelsedag för andra året i rad. Hon skickade inte ens ett sms. Jag är faktiskt ganska ledsen.

          Om det bara hade hänt en gång, skulle jag inte bry mig. Men nu känns det som att hon inte tycker att vår vänskap är viktig. Skulle jag säga något till henne, eller borde jag bara glömma det? Ring mig när du hör det här!
        items:
          - { type: truefalse, statement: "Linnea har glömt Saras födelsedag två år i rad.", answer: true }
          - { type: truefalse, statement: "Linnea skickade ett sms.", answer: false, correction: { answers: ["{Linnea|Hon} skickade inte [ens ]ett sms."] } }
          - { type: truefalse, statement: "Sara är glad.", answer: false, correction: { answers: ["{Sara|Hon} är [ganska ]ledsen."] } }
          - { type: truefalse, statement: "Om det bara hade hänt en gång, skulle Sara inte bry sig.", answer: true }
          - { type: truefalse, statement: "Sara vill att du skickar ett sms.", answer: false, correction: { answers: ["{Sara|Hon} vill att du ringer {henne|[till ]Sara}."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: villkor
        shuffle: true
        items:
          - { type: listen, say: "Om jag hade tid, skulle jag hjälpa dig." }
          - { type: listen, say: "Du borde prata med henne." }
          - { type: listen, say: "Jag önskar att du var här." }
          - { type: listen, say: "Skulle du kunna ringa mig i kväll?" }

  - id: praktiskt
    title: Praktiskt · advies vragen en geven
    exercises:
      - id: dialoog-rad
        title: Een vriend om raad vragen
        instruction: Zet het gesprek in de goede volgorde.
        topic: rad-onskan
        items:
          - type: dialogue
            lines:
              - "Lotte: Har du tid en stund? Jag behöver ett råd."
              - "Johan: Visst. Vad har hänt?"
              - "Lotte: Jag har fått ett nytt jobb i Göteborg, men min sambo vill inte flytta."
              - "Johan: Oj, det låter svårt. Har ni pratat ordentligt om det?"
              - "Lotte: Inte riktigt. Vi blir arga på varandra direkt."
              - "Johan: Om jag var du skulle jag föreslå att ni tar en promenad och pratar i lugn och ro."
              - "Lotte: Du har nog rätt. Tack, det ska jag göra!"

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een persoonlijke brief met advies."
    exercises:
      - id: skriva-rad
        title: Geef advies
        instruction: Schrijf een antwoord op het bericht van Sara.
        topic: rad-onskan
        items:
          - type: free
            prompt: "Je vriendin Sara is verdrietig omdat haar beste vriendin haar verjaardag twee keer is vergeten (zie de luisteroefening). Schrijf haar een bericht (70–120 woorden). Toon begrip en geef minstens twee adviezen. Gebruik *borde*, *om jag var du skulle jag …* en een *om*-zin."
            minWords: 65
            require:
              - { any: ["hej"], label: "Je begint met een aanhef" }
              - { any: ["borde"], label: "Je gebruikt borde" }
              - { any: ["skulle"], label: "Je gebruikt skulle" }
              - { any: ["om"], label: "Je gebruikt een om-zin" }
              - { any: ["kram", "hälsningar", "hörs"], label: "Je sluit persoonlijk af" }
            model: "Hej Sara! Vad tråkigt att höra. Jag förstår verkligen att du är ledsen, det skulle jag också vara. Om jag var du skulle jag prata med Linnea, men inte via sms. Ni borde träffas och ta en fika. Säg lugnt hur du känner dig, utan att anklaga henne. Kanske har hon haft det jobbigt och glömt allt annat också? Om hon blir ledsen och ber om ursäkt, vet du att vänskapen är viktig för henne. Om hon inte bryr sig, kanske du borde lägga mer tid på andra vänner. Ring mig när du vill! Kram, Emma"

  - id: herhaling
    title: Herhaling
    exercises:
      - id: herhaling-13-18
        title: Hoofdstuk 13 tot en met 18 door elkaar
        instruction: Gemengde vragen.
        shuffle: true
        items:
          - { type: gap, topic: passiv-bli, text: "Han blev ___ (bjuda) på bröllopet.", gaps: [{ answers: ["bjuden"] }] }
          - { type: gap, topic: deponens, text: "De ___ (träffas) på en fest för tio år sedan.", gaps: [{ answers: ["träffades"] }] }
          - { type: gap, topic: prep-verb, text: "Hon är kär ___ sin granne.", gaps: [{ answers: ["i"], feedback: [{ match: "på", tip: "Verliefd op = kär i." }] }] }
          - { type: gap, topic: framtid, text: "Ni ___ att bli så lyckliga tillsammans!", gaps: [{ answers: ["kommer"], options: ["kommer", "ska", "tänker"], shuffle: false }] }
          - { type: transform, topic: relativ-som, prompt: "Jag har en kompis. Hon har just gift sig.", answers: ["Jag har en kompis som just har gift sig.", "Jag har en kompis som har gift sig just."] }
          - { type: gap, topic: villkor, text: "Om jag ___ (vara) du, skulle jag ringa henne.", gaps: [{ answers: ["var", "vore"] }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: villkor
        shuffle: true
        items:
          - { type: findError, sentence: "Om jag har pengar skulle jag resa jorden runt.", wrong: [2], answers: ["Om jag hade pengar skulle jag resa jorden runt."], tip: "Het is denkbeeldig." }
          - { type: findError, sentence: "Om jag hade tid jag skulle hjälpa dig.", wrong: [4, 5], answers: ["Om jag hade tid skulle jag hjälpa dig."], tip: "V2: na de om-zin komt eerst het werkwoord." }
          - { type: findError, topic: rad-onskan, sentence: "Jag önskar att jag har mer tid.", wrong: [4], answers: ["Jag önskar att jag hade mer tid."], tip: "Na önskar att: verleden tijd." }
          - { type: findError, sentence: "Om jag hade vetat det skulle jag kommit.", wrong: [6, 7], answers: ["Om jag hade vetat det skulle jag ha kommit."], tip: "Er ontbreekt een woordje: skulle … kommit." }
          - { type: findError, topic: rad-onskan, sentence: "Du borde att sova mer.", wrong: [2], answers: ["Du borde sova mer."], tip: "Na borde komt geen att." }

