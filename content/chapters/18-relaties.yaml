chapter: 18
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan zeggen wat er zou gebeuren als … (skulle)", topics: [villkor] }
  - { text: "Ik kan advies geven en beleefd iets vragen of wensen", topics: [rad-onskan] }

grammar:
  - id: villkor
    title: "Als … dan: skulle"
    summary: "Werkelijke voorwaarde: *Om jag **har** tid **hjälper** jag dig.* Denkbeeldig: *Om jag **hade** tid **skulle** jag **hjälpa** dig.* Verleden: *Om jag **hade vetat** det **skulle** jag **ha kommit**.*"
    body: |
      ### Werkelijke voorwaarde
      Het kan echt gebeuren: gewone **presens** in beide delen.

      - *Om det **regnar**, **stannar** vi hemma.*

      ### Denkbeeldige voorwaarde (nu of later)
      Het is niet zo, of onwaarschijnlijk: **preteritum** in de om-zin, **skulle + infinitief** in de hoofdzin.

      - *Om jag **hade** mer tid, **skulle** jag **träna** mer.* – Als ik meer tijd had, zou ik meer sporten.
      - *Vad **skulle** du **göra** om du **vann** en miljon?*

      In spreektaal hoor je ook de verleden tijd in beide delen: *Om jag hade tid, **hjälpte** jag dig.* Na de om-zin mag ook *så* staan: *Om jag hade tid, **så** skulle jag hjälpa dig.*

      ### Denkbeeldig in het verleden
      Het is niet gebeurd: **hade + supinum** in de om-zin, **skulle ha + supinum** (of *hade + supinum*) in de hoofdzin.

      - *Om jag **hade vetat** det, **skulle** jag **ha kommit**.* – Als ik het had geweten, was ik gekomen.
      - Korter en ook gewoon: *Om jag hade vetat det, **hade** jag **kommit**.*

      ### Woordvolgorde
      Begint de zin met de om-zin, dan komt in de hoofdzin eerst het werkwoord (V2): *Om jag hade tid, **skulle jag** hjälpa dig.*

      *Om jag var du* is gewoon Zweeds; *om jag **vore** du* is wat formeler.

  - id: rad-onskan
    title: Advies en wensen
    summary: "Advies: *Du **borde** …, Om jag var du **skulle** jag …, Du **kanske skulle** …* Beleefd vragen: ***Skulle** du kunna …?* Wens: *Jag **önskar** att jag **hade** mer tid.*"
    body: |
      ### Advies geven
      | zin | betekenis |
      |---|---|
      | *Du **borde** prata med honom.* | Je zou met hem moeten praten. |
      | *Om jag var du **skulle** jag prata med honom.* | Als ik jou was, zou ik met hem praten. |
      | *Du **kanske skulle** prata med honom?* | Misschien moet je met hem praten? (voorzichtig) |
      | *Har du **tänkt på** att …?* | Heb je eraan gedacht dat …? |
      | *Det **vore** bra om du …* | Het zou goed zijn als je … |

      *borde* is de verleden tijd van *böra* (moeten, horen te). In persoonlijk advies gebruik je meestal *borde*. De presens *bör* is ook heel gewoon, vooral in formele tekst en regels: *Man **bör** boka tid i förväg.*

      ### Beleefd vragen
      - ***Skulle** du kunna hjälpa mig?* – Zou je me kunnen helpen?
      - *Jag **skulle vilja** ha en kopp kaffe.* – Ik zou graag …

      ### Wensen
      Gaat het om een **onwerkelijke** wens, dan komt na *önska att* en *tänk om* de **verleden tijd**, net als bij een denkbeeldige voorwaarde:

      - *Jag **önskar** att jag **hade** mer tid.* – Ik wou dat ik meer tijd had.
      - ***Tänk om** vi **kunde** åka till Island!* – Stel je voor dat we naar IJsland konden!
      - *Om jag **ändå** **hade** lyssnat!* – Had ik maar geluisterd!

      Kan de wens echt uitkomen, dan blijft de presens: *Jag **önskar** att du **får** en fin dag.* *Tänk om det **regnar** i morgon?* (en als het morgen regent?)

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-fraga-frida
        title: "Lezen: vraag het Frida"
        instruction: Lees de brief en het antwoord. Beantwoord de vragen.
        topic: rad-onskan
        textTitle: Fråga Frida
        text: |
          **Hej Frida!** Jag och min sambo Erik har bott tillsammans i Stockholm i fem år. Nu har Erik fått ett jobberbjudande i Luleå, där han växte upp, och han vill gärna flytta tillbaka. Men jag trivs i Stockholm. Här har jag mitt jobb, mina vänner och min kör. Om vi flyttade skulle jag inte känna någon. Samtidigt vet jag att Erik har längtat hem länge. Vad ska jag göra? *Kluven i Stockholm*

          **Hej Kluven!** Det låter som ett svårt beslut, och det är bra att du tar det på allvar. Om jag var du skulle jag först prata öppet med Erik om vad ni båda vill de närmaste åren. Ni kanske kan hitta en kompromiss? Erik skulle kunna ta jobbet på prov i ett år, och ni skulle kunna hälsa på varandra varannan helg. Du borde också åka upp till Luleå en vecka och se hur det känns. Kanske finns det en kör där också! Om ni bestämmer er tillsammans blir det lättare, vad ni än väljer. Lycka till! *Frida*
        items:
          - { id: zagv, type: mc, prompt: "Varför vill Erik flytta till Luleå?", options: ["Han har fått ett jobberbjudande där.", "Han tycker inte om Stockholm.", "Hans föräldrar är sjuka.", "Han vill sjunga i en kör."], answer: 0 }
          - { id: vugf, type: truefalse, statement: "Kluven trivs inte i Stockholm.", answer: false, correction: { answers: ["{Kluven|Hon|Han} trivs [bra ]i Stockholm."] } }
          - { id: muyt, type: mc, prompt: "Vad skulle hända om de flyttade, enligt Kluven?", options: ["Hon skulle inte känna någon.", "Hon skulle få ett nytt jobb.", "Erik skulle bli arg.", "De skulle köpa ett hus."], answer: 0 }
          - { id: p555, type: mc, prompt: "Vad är Fridas första råd?", options: ["att prata öppet med Erik", "att flytta direkt", "att göra slut", "att stanna i Stockholm"], answer: 0 }
          - { id: rpub, type: truefalse, statement: "Frida föreslår att Erik tar jobbet på prov i ett år.", answer: true }
          - { id: f7fm, type: mc, prompt: "Wat betekent *kluven*?", options: ["verscheurd, in tweestrijd", "boos", "verliefd", "eenzaam"], answer: 0 }
          - id: cnmd
            type: multi
            prompt: "Welke zinnen in de tekst geven advies?"
            options: ["Om jag var du skulle jag först prata öppet med Erik.", "Du borde också åka upp till Luleå.", "Erik skulle kunna ta jobbet på prov.", "Om vi flyttade skulle jag inte känna någon.", "Han vill gärna flytta tillbaka."]
            answers: [0, 1, 2]
            tip: "Om vi flyttade … is een denkbeeldige situatie, geen advies."

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-relaties
        title: Relaties
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: h6jc
            type: match
            pairs:
              - ["en sambo", "een samenwonende partner"]
              - ["en särbo", "een partner met wie je niet samenwoont"]
              - ["bli ihop", "verkering krijgen"]
              - ["göra slut", "het uitmaken"]
              - ["vara kär i", "verliefd zijn op"]
              - ["gräla", "ruziemaken"]
          - id: jfzq
            type: match
            pairs:
              - ["förlovad", "verloofd"]
              - ["gifta sig", "trouwen"]
              - ["skilja sig", "scheiden"]
              - ["svärmor", "schoonmoeder"]
              - ["ett förhållande", "een relatie"]
              - ["längta efter", "verlangen naar"]

  - id: villkor
    title: "Grammatik: als … dan"
    exercises:
      - id: villkor-sorteren
        title: Echt of denkbeeldig?
        instruction: Kan het echt gebeuren, of is het denkbeeldig?
        topic: villkor
        items:
          - id: r8et
            type: sort
            categories: ["echte voorwaarde", "denkbeeldig"]
            items:
              - { text: "Om du kommer i tid, hinner vi med tåget.", cat: 0 }
              - { text: "Om jag var rik, skulle jag köpa ett hus vid havet.", cat: 1 }
              - { text: "Om det är fint väder, grillar vi.", cat: 0 }
              - { text: "Om vi hade träffats tidigare, hade allt varit annorlunda.", cat: 1 }
              - { text: "Om du vill, kan jag följa med.", cat: 0 }
              - { text: "Om jag kunde flyga, skulle jag besöka dig varje dag.", cat: 1 }

      - id: villkor-invullen
        title: Skulle en hade
        instruction: Vul het werkwoord in de goede vorm in.
        topic: villkor
        shuffle: true
        items:
          - { id: nh5y, type: gap, text: "Om jag ___ (ha) mer tid, skulle jag träna mer.", gaps: [{ answers: ["hade"], feedback: [{ match: "har", tip: "Het is denkbeeldig (ik heb geen tijd): verleden tijd, hade." }, { match: "skulle ha", tip: "In de om-zin komt geen skulle: hade." }] }] }
          - { id: 24f5, type: gap, text: "Om vi bodde närmare, ___ vi ses oftare.", gaps: [{ answers: ["skulle"], options: ["skulle", "ska", "kommer att"], shuffle: false, feedback: [{ match: "ska", tip: "Denkbeeldig: skulle." }] }] }
          - { id: wkv9, type: gap, text: "Vad ___ du göra om du vann en miljon?", gaps: [{ answers: ["skulle"], options: ["skulle", "ska", "kommer"], shuffle: false }] }
          - { id: tqz4, type: gap, text: "Om jag hade vetat det, skulle jag ___ ringt dig.", gaps: [{ answers: ["ha"], options: ["ha", "har", "hade"], shuffle: false, tip: "skulle ha + supinum: skulle ha ringt." }] }
          - { id: kmxu, type: gap, text: "Om hon ___ (vara) här nu, skulle hon skratta.", gaps: [{ answers: ["var", "vore"], feedback: [{ match: "är", tip: "Ze is er niet: denkbeeldig, dus var (of formeel vore)." }] }] }
          - { id: 447z, type: gap, text: "Om du ___ (fråga) honom i går, hade han hjälpt dig.", gaps: [{ answers: ["hade frågat"], feedback: [{ match: "frågade", tip: "Het gaat om het verleden en het is niet gebeurd: hade frågat." }] }] }
          - { id: rwgr, type: gap, text: "Om jag ___ (vinna) en miljon, skulle jag resa jorden runt.", gaps: [{ answers: ["vann"], feedback: [{ match: "vinner", tip: "Het is denkbeeldig: verleden tijd, vann." }, { match: "vinnade", tip: "vinna is sterk: vann." }] }] }
          - { id: ugmb, type: gap, text: "Vad ___ du ha gjort om bussen inte hade kommit?", gaps: [{ answers: ["skulle"], options: ["skulle", "ska", "hade"], shuffle: false }] }

      - id: villkor-omvormen
        title: Van echt naar denkbeeldig
        instruction: Maak de voorwaarde denkbeeldig (met **hade/-de** en **skulle**).
        topic: villkor
        items:
          - { id: rwtu, type: transform, prompt: "Om jag har tid, hjälper jag dig.", answers: ["Om jag hade tid, skulle jag hjälpa dig.", "Om jag hade tid, hjälpte jag dig.", "Om jag hade tid, så {skulle jag hjälpa|hjälpte jag} dig."], feedback: [{ contains: "skulle jag hjälpte", tip: "Na skulle komt de infinitief: skulle jag hjälpa." }, { contains: "jag skulle hjälpa", tip: "Na de om-zin komt eerst het werkwoord: skulle jag hjälpa." }] }
          - { id: pmg9, type: transform, prompt: "Om det regnar, stannar vi hemma.", answers: ["Om det regnade, skulle vi stanna hemma.", "Om det regnade, stannade vi hemma.", "Om det regnade, så {skulle vi stanna|stannade vi} hemma."], feedback: [{ contains: "vi skulle", tip: "Na de om-zin komt eerst het werkwoord: skulle vi." }] }
          - { id: 7js3, type: transform, prompt: "Om du frågar, svarar hon.", answers: ["Om du frågade, skulle hon svara.", "Om du frågade, svarade hon.", "Om du frågade, så {skulle hon svara|svarade hon}."] }
          - { id: qa5m, type: transform, prompt: "Jag visste det inte, så jag kom inte. (Begin met: Om jag hade …)", answers: ["Om jag hade vetat det, skulle jag ha kommit.", "Om jag hade vetat det, hade jag kommit.", "Om jag hade vetat det, så {skulle jag ha kommit|hade jag kommit}."], feedback: [{ contains: "skulle jag kommit", tip: "In spreektaal valt ha vaak weg, maar schrijf: skulle jag ha kommit." }] }
          - { id: qzfa, type: transform, prompt: "Om vi har råd, köper vi ett hus.", answers: ["Om vi hade råd, [så ]skulle vi köpa ett hus.", "Om vi hade råd, [så ]köpte vi ett hus."], feedback: [{ contains: "skulle vi köpte", tip: "Na skulle komt de infinitief: skulle vi köpa." }] }
          - { id: qcct, type: transform, prompt: "Om hon kommer, blir jag glad.", answers: ["Om hon kom, [så ]skulle jag bli glad.", "Om hon kom, [så ]blev jag glad."] }
          - { id: bk3u, type: transform, prompt: "Om det är soligt, går vi till stranden.", answers: ["Om det {var|vore} soligt, [så ]skulle vi gå till stranden.", "Om det {var|vore} soligt, [så ]gick vi till stranden."], feedback: [{ contains: ["soligt vi skulle", "soligt, vi skulle"], tip: "Na de om-zin komt eerst het werkwoord: skulle vi." }] }
          - { id: n5fb, type: transform, prompt: "Han ringde inte, så hon blev arg. (Begin met: Om han hade …)", answers: ["Om han hade ringt, [så ]skulle hon inte ha blivit arg.", "Om han hade ringt, [så ]hade hon inte blivit arg."], feedback: [{ contains: "hade ringat", tip: "ringa – ringde – ringt." }] }

  - id: rad
    title: "Grammatik: advies en wensen"
    exercises:
      - id: rad-kiezen
        title: Een goed advies
        instruction: Je vriendin zegt iets. Kies het beste advies.
        topic: rad-onskan
        shuffle: true
        items:
          - { id: zm84, type: mc, prompt: "*Jag är så trött hela tiden.*", options: ["Du borde kanske gå och lägga dig tidigare.", "Du borde vara trött.", "Om jag var du skulle jag vara trött.", "Jag önskar att du var trött."], answer: 0 }
          - { id: gbcy, type: mc, prompt: "*Min chef ger mig för mycket jobb.*", options: ["Om jag var du skulle jag prata med henne om det.", "Om jag var din chef skulle jag ge dig mer.", "Du borde jobba mindre hemma.", "Tänk om du hade ett jobb!"], answer: 0 }
          - { id: yxsn, type: mc, prompt: "*Jag har grälat med min syster.*", options: ["Du kanske skulle ringa henne och be om ursäkt?", "Du borde gräla mer.", "Om jag var din syster skulle jag gräla.", "Jag önskar att jag hade en syster."], answer: 0 }
          - { id: mag4, type: mc, prompt: "*Jag har ont i ryggen efter jobbet.*", options: ["Du borde kanske ta en paus då och då.", "Du borde ha ont i ryggen.", "Om jag var din rygg skulle jag vila.", "Tänk om du hade en rygg!"], answer: 0 }
          - { id: safw, type: mc, prompt: "*Jag vet inte vad jag ska ge Olle i present.*", options: ["Du skulle kunna fråga hans fru.", "Du borde inte ge Olle.", "Om jag var Olle skulle jag ge dig en present.", "Jag önskar att jag var en present."], answer: 0 }
          - { id: rg6d, type: mc, prompt: "*Jag är så nervös inför intervjun.*", options: ["Om jag var du skulle jag förbereda några frågor.", "Du borde vara mer nervös.", "Tänk om du var nervös!", "Jag önskar att jag hade en intervju."], answer: 0 }
          - { id: d65d, type: mc, prompt: "*Vi bråkar alltid om disken.*", options: ["Ni kanske skulle göra ett schema?", "Ni borde bråka mer om disken.", "Om jag var disken skulle jag gå.", "Jag önskar att jag hade disk."], answer: 0 }
          - { id: b4mm, type: mc, prompt: "*Jag har ingen lust att träna.*", options: ["Du skulle kunna börja med korta promenader.", "Du borde ha ingen lust.", "Om jag var du skulle jag ha lust.", "Tänk om du hade lust!"], answer: 0 }

      - id: rad-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds.
        topic: rad-onskan
        items:
          - { id: 8naq, type: translate, prompt: "Als ik jou was, zou ik met hem praten.", answers: ["Om jag {var|vore} du, [så ]skulle jag prata med honom.", "Om jag {var|vore} du, [så ]hade jag pratat med honom."], feedback: [{ contains: "jag skulle prata", tip: "Na de om-zin komt eerst het werkwoord: skulle jag prata." }, { contains: "om jag är du", tip: "Denkbeeldig: om jag var du." }] }
          - { id: q4h2, type: translate, prompt: "Je zou meer moeten slapen.", answers: ["Du borde sova mer.", "Du bör sova mer.", "Du skulle behöva sova mer."], feedback: [{ contains: "skulle måste", tip: "Moeten (advies) = borde: Du borde sova mer." }] }
          - { id: dz4s, type: translate, prompt: "Ik wou dat ik meer tijd had.", answers: ["Jag önskar [att ]jag hade mer tid."], feedback: [{ contains: "att jag har", tip: "Na önskar att: verleden tijd, hade." }] }
          - { id: 9p28, type: translate, prompt: "Zou je me kunnen helpen?", answers: ["Skulle du kunna hjälpa mig?"] }
          - { id: ew3k, type: translate, prompt: "Stel je voor dat we naar IJsland konden gaan!", answers: ["Tänk om vi kunde {åka|resa} till Island!"] }
          - { id: gwvu, type: translate, prompt: "Je zou eens met een dokter moeten praten.", answers: ["Du borde [kanske ]prata med en {läkare|doktor}.", "Du borde [kanske ]prata med {läkaren|doktorn|din läkare}.", "Du skulle [kanske ]behöva prata med en {läkare|doktor}."], feedback: [{ contains: "skulle måste", tip: "Moeten (advies) = borde." }] }
          - { id: 3zre, type: translate, prompt: "Als ik jou was, zou ik dat niet doen.", answers: ["Om jag {var|vore} du, [så ]skulle jag inte göra det.", "Om jag {var|vore} du, [så ]hade jag inte gjort det."], feedback: [{ contains: "jag skulle inte", tip: "Na de om-zin komt eerst het werkwoord: skulle jag." }] }
          - { id: m5nb, type: translate, prompt: "Ik wou dat het zomer was.", answers: ["Jag önskar [att ]det {var|vore} sommar."], feedback: [{ contains: "det är sommar", tip: "Na önskar att: verleden tijd, det var." }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: villkor
        shuffle: true
        items:
          - { id: ccp9, type: findError, sentence: "Om jag har pengar skulle jag resa jorden runt.", wrong: [2], answers: ["Om jag hade pengar skulle jag resa jorden runt."], tip: "Het is denkbeeldig." }
          - { id: nfps, type: findError, sentence: "Om jag hade tid jag skulle hjälpa dig.", wrong: [4, 5], answers: ["Om jag hade tid skulle jag hjälpa dig."], tip: "V2: na de om-zin komt eerst het werkwoord." }
          - { id: 5bea, type: findError, topic: rad-onskan, sentence: "Jag önskar att jag har mer tid.", wrong: [4], answers: ["Jag önskar att jag hade mer tid."], tip: "Na önskar att: verleden tijd." }
          - { id: p9ek, type: findError, sentence: "Om jag hade vetat det skulle jag kommit.", wrong: [6, 7], answers: ["Om jag hade vetat det skulle jag ha kommit."], tip: "In spreektaal valt ha vaak weg, maar schrijf het wel: skulle … kommit." }
          - { id: fkg9, type: findError, topic: rad-onskan, sentence: "Du borde att sova mer.", wrong: [2], answers: ["Du borde sova mer."], tip: "Na borde komt geen att." }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-sara
        title: "Luisteren: Sara vraagt om advies"
        instruction: Luister naar het bericht van Sara. Is de bewering **rätt** of **fel**?
        topic: villkor
        listen: true
        textTitle: Ett röstmeddelande från Sara
        text: |
          Hej, det är Sara! Jag behöver ditt råd. Min bästa vän Linnea har glömt min födelsedag för andra året i rad. Hon skickade inte ens ett sms. Jag är faktiskt ganska ledsen.

          Om det bara hade hänt en gång, skulle jag inte bry mig. Men nu känns det som att hon inte tycker att vår vänskap är viktig. Ska jag säga något till henne, eller borde jag bara glömma det? Ring mig när du hör det här!
        items:
          - { id: krdu, type: truefalse, statement: "Linnea har glömt Saras födelsedag två år i rad.", answer: true }
          - { id: f3cw, type: truefalse, statement: "Linnea skickade ett sms.", answer: false, correction: { answers: ["{Linnea|Hon} skickade inte [ens ]ett sms."] } }
          - { id: y8zd, type: truefalse, statement: "Sara är glad.", answer: false, correction: { answers: ["{Sara|Hon} är [ganska ]ledsen."] } }
          - { id: ugwj, type: truefalse, statement: "Om det bara hade hänt en gång, skulle Sara inte bry sig.", answer: true }
          - { id: ern5, type: truefalse, statement: "Sara vill att du skickar ett sms.", answer: false, correction: { answers: ["{Sara|Hon} vill att du ringer {henne|[till ]Sara}."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: villkor
        shuffle: true
        items:
          - { id: 4wt4, type: listen, say: "Om jag hade tid, skulle jag hjälpa dig." }
          - { id: yx9y, type: listen, say: "Du borde prata med henne." }
          - { id: gf68, type: listen, say: "Jag önskar att du var här." }
          - { id: 6ncj, type: listen, say: "Skulle du kunna ringa mig i kväll?" }

  - id: praktiskt
    title: Praktiskt · advies vragen en geven
    exercises:
      - id: dialoog-rad
        title: Een vriend om raad vragen
        instruction: Zet het gesprek in de goede volgorde.
        topic: rad-onskan
        items:
          - id: 8qfg
            type: dialogue
            lines:
              - "Lotte: Har du tid en stund? Jag behöver ett råd."
              - "Johan: Visst. Vad har hänt?"
              - "Lotte: Jag har fått ett nytt jobb i Göteborg, men min sambo vill inte flytta."
              - "Johan: Oj, det låter svårt. Har ni pratat ordentligt om det?"
              - "Lotte: Inte riktigt. Vi blir arga på varandra direkt."
              - "Johan: Om jag var du skulle jag föreslå att ni tar en promenad och pratar i lugn och ro."
              - "Lotte: Du har nog rätt. Tack, det ska jag göra!"

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een persoonlijke brief met advies."
    exercises:
      - id: skriva-rad
        title: Geef advies
        instruction: Schrijf een antwoord op het bericht van Sara.
        topic: rad-onskan
        items:
          - id: 8fr2
            type: free
            prompt: "Je vriendin Sara is verdrietig omdat haar beste vriendin haar verjaardag twee keer is vergeten (zie de luisteroefening). Schrijf haar een bericht (70–120 woorden). Toon begrip en geef minstens twee adviezen. Gebruik *borde*, *om jag var du skulle jag …* en een *om*-zin."
            minWords: 65
            require:
              - { any: ["hej"], label: "Je begint met een aanhef" }
              - { any: ["borde"], label: "Je gebruikt borde" }
              - { any: ["skulle"], label: "Je gebruikt skulle" }
              - { any: ["om"], label: "Je gebruikt een om-zin" }
              - { any: ["kram", "hälsningar", "hörs"], label: "Je sluit persoonlijk af" }
            model: "Hej Sara! Vad tråkigt att höra. Jag förstår verkligen att du är ledsen, det skulle jag också vara. Om jag var du skulle jag prata med Linnea, men inte via sms. Ni borde träffas och ta en fika. Säg lugnt hur du känner dig, utan att anklaga henne. Kanske har hon haft det jobbigt och glömt allt annat också? Om hon blir ledsen och ber om ursäkt, vet du att vänskapen är viktig för henne. Om hon inte bryr sig, borde du kanske lägga mer tid på andra vänner. Ring mig när du vill! Kram, Emma"

