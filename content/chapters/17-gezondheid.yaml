  - id: prep
    title: "Grammatik: vaste voorzetsels"
    exercises:
      - id: prep-invullen
        title: Het goede voorzetsel
        instruction: Vul het voorzetsel in.
        topic: prep-verb
        shuffle: true
        items:
          - { id: bmrw, type: gap, text: "Jag tänker ofta ___ dig.", gaps: [{ answers: ["på"], feedback: [{ match: "om", tip: "tänka om = opnieuw nadenken (of: vinden van). Denken aan = tänka på." }, { match: "åt", tip: "Denken aan = tänka på." }] }] }
          - { id: d2dp, type: gap, text: "Vi väntar ___ läkaren.", gaps: [{ answers: ["på"], feedback: [{ match: ["för", "efter"], tip: "Wachten op = vänta på." }] }] }
          - { id: 54bj, type: gap, text: "Hon är rädd ___ sprutor.", gaps: [{ answers: ["för"], feedback: [{ match: ["av", "från"], tip: "Bang voor = rädd för." }] }] }
          - { id: 54sx, type: gap, text: "Jag litar inte ___ honom.", gaps: [{ answers: ["på"] }] }
          - { id: ftdf, type: gap, text: "Han är intresserad ___ medicin.", gaps: [{ answers: ["av"], feedback: [{ match: "i", tip: "Geïnteresseerd in = intresserad av." }] }] }
          - { id: wk6u, type: gap, text: "Jag är nöjd ___ behandlingen.", gaps: [{ answers: ["med"] }] }
          - { id: aky7, type: gap, text: "Hon bryr sig inte ___ vad andra tycker.", gaps: [{ answers: ["om"] }] }
          - { id: b5x6, type: gap, text: "Jag är orolig ___ min mamma.", gaps: [{ answers: ["för"], feedback: [{ match: "över", tip: "Ongerust over iemand = orolig för. orolig över gebruik je eerder voor een situatie: orolig över läget." }] }] }
          - { id: k52z, type: gap, text: "Barnet drömmer ___ en hund.", gaps: [{ answers: ["om"], feedback: [{ match: "av", tip: "Dromen van = drömma om." }] }] }
          - { id: 9jt7, type: gap, text: "Vad pratade ni ___?", gaps: [{ answers: ["om"], feedback: [{ match: "över", tip: "Praten over = prata om." }] }] }

      - id: prep-vertalen
        title: Vertaal met het vaste voorzetsel
        instruction: Vertaal naar het Zweeds. Let op het vaste voorzetsel.
        topic: prep-verb
        shuffle: true
        items:
          - { id: qtx9, type: translate, prompt: "Ik denk vaak aan mijn oma, die alleen in Groningen woont.", answers: ["Jag tänker ofta på {min mormor|min farmor|mormor|farmor}[,] som bor {ensam|själv} i Groningen."], feedback: [{ contains: ["tänker ofta om", "tänker ofta åt"], tip: "Denken aan = tänka på." }, { contains: "tänker på min mormor ofta", tip: "ofta staat direct na het werkwoord: Jag tänker ofta på …" }] }
          - { id: k2av, type: translate, prompt: "We wachten al een uur in de wachtkamer op de dokter.", answers: ["Vi har [redan ]väntat på {läkaren|doktorn} i väntrummet [i ]{en timme|över en timme}.", "Vi har [redan ]väntat på {läkaren|doktorn} [i ]{en timme|över en timme} i väntrummet.", "Vi har [redan ]väntat [i ]{en timme|över en timme} på {läkaren|doktorn} i väntrummet.", "Vi har [redan ]väntat i väntrummet på {läkaren|doktorn} [i ]{en timme|över en timme}."], feedback: [{ contains: ["väntat för", "väntar för"], tip: "Wachten op = vänta på." }, { contains: "vi väntar", tip: "Het wachten duurt tot nu toe: perfectum, vi har väntat … i en timme." }, { contains: "sedan en timme", tip: "Hoe lang iets al duurt: i en timme." }] }
          - { id: q5bu, type: translate, prompt: "Mijn zoon is bang voor honden, maar hij is niet bang voor katten.", answers: ["Min son är rädd för hundar, men {han är inte rädd för katter|inte för katter}."], feedback: [{ contains: ["rädd av", "rädd från"], tip: "Bang voor = rädd för." }] }
          - { id: duxs, type: translate, prompt: "Ze is erg tevreden met de behandeling die ze in het ziekenhuis kreeg.", answers: ["Hon är {mycket|väldigt} nöjd med behandlingen [som ]hon fick på sjukhuset."], feedback: [{ contains: ["nöjd av", "nöjd på", "nöjd för"], tip: "Tevreden met = nöjd med." }, { contains: "i sjukhuset", tip: "In het ziekenhuis = på sjukhuset." }] }
          - { id: pn4e, type: translate, prompt: "Ik vertrouw op mijn dokter, want ze luistert altijd naar haar patiënten.", answers: ["Jag litar på min {läkare|doktor}[,] {för hon lyssnar alltid|eftersom hon alltid lyssnar} på sina patienter."], feedback: [{ contains: ["litar i", "litar av", "litar till"], tip: "Vertrouwen op = lita på." }, { contains: ["hennes patienter"], tip: "De patiënten horen bij hon, het onderwerp van dezelfde zin: sina patienter." }, { contains: "eftersom hon lyssnar alltid", tip: "In een bijzin (na eftersom) staat alltid vóór het werkwoord: eftersom hon alltid lyssnar." }] }
          - { id: zd49, type: translate, prompt: "Waar wacht je op? De bus naar het ziekenhuis vertrekt over vijf minuten.", answers: ["Vad väntar du på? Bussen till sjukhuset {går|avgår} om fem minuter.", "Vad väntar du på? Om fem minuter {går|avgår} bussen till sjukhuset."], feedback: [{ contains: "på vad väntar", tip: "In een Zweedse vraag blijft het voorzetsel achteraan: Vad väntar du på?" }, { contains: "i fem minuter", tip: "Over vijf minuten (in de toekomst) = om fem minuter." }] }

      - id: langere-zinnen
        title: "Vertaal: langere zinnen"
        instruction: Vertaal de hele zin. Let op de woordvolgorde in de bijzin en na een woord vooraan.
        items:
          - { id: 343s, type: translate, topic: framtid, prompt: "De dokter denkt dat het minstens twee weken zal duren voordat de knie weer goed wordt.", answers: ["Läkaren tror att det kommer att ta minst två veckor innan knät blir bra igen.", "{Läkaren|Doktorn} tror [att ]det kommer [att ]ta minst två veckor innan {knät|knäet|mitt knä} blir bra igen."], feedback: [{ contains: "ska ta minst två veckor innan", tip: "Een voorspelling van de dokter: kommer att ta." }] }
          - { id: aagb, type: translate, topic: framtid, prompt: "Ik ga morgenvroeg de huisartsenpraktijk bellen en een afspraak maken bij een arts.", answers: ["Jag ska ringa vårdcentralen i morgon bitti och boka en tid hos en läkare.", "Jag ska ringa [till ]vårdcentralen {i morgon|imorgon} bitti och boka [en ]tid hos {en läkare|läkaren}.", "{I morgon|Imorgon} bitti ska jag ringa [till ]vårdcentralen och boka [en ]tid hos {en läkare|läkaren}."], feedback: [{ contains: "en tid till en läkare", tip: "Bij een arts: hos." }] }
          - { id: 7b57, type: translate, topic: prep-verb, prompt: "Ze maakt zich zorgen om haar vader, die zich niets aantrekt van wat de dokter zegt.", answers: ["Hon är orolig för sin pappa, som inte bryr sig om vad läkaren säger.", "Hon {är orolig|oroar sig} för sin {pappa|far}, som inte bryr sig om vad {läkaren|doktorn} säger."], feedback: [{ contains: "orolig om", tip: "Bezorgd om: orolig för." }] }

