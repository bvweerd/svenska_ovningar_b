chapter: 17
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan over de toekomst praten met ska, kommer att en tänker", topics: [framtid] }
  - { text: "Ik ken het vaste voorzetsel bij veelgebruikte werkwoorden", topics: [prep-verb] }

grammar:
  - id: framtid
    title: "Toekomst: ska, kommer att, tänker"
    summary: "**ska** = plan of afspraak, **kommer att** = voorspelling (niet in je macht), **tänker** = eigen besluit. Met een tijdsbepaling kan ook de presens: *Jag börjar på måndag.*"
    body: |
      Het Zweeds heeft geen vaste toekomende tijd zoals het Nederlandse *zullen*. Je kiest:

      | vorm | gebruik | voorbeeld |
      |---|---|---|
      | **ska** + infinitief | plan, afspraak, wat iemand wil | *Jag **ska** ringa vårdcentralen i morgon.* |
      | **kommer att** + infinitief | voorspelling, iets waar niemand over beslist | *Det **kommer att** regna. Du **kommer att** må bättre.* |
      | **tänker** + infinitief | eigen, vast besluit | *Jag **tänker** sluta röka.* |
      | **presens** + tijd | vaststaande toekomst | *Jag **börjar** nytt jobb på måndag.* |

      Een handige test: kan iemand het **beslissen**? Dan *ska* (of *tänker*). Gaat het **vanzelf**, zoals het weer, de toekomst of gevoelens? Dan *kommer att*.

      - *Det **kommer att** regna i morgon.* (voorspelling)
      - *Vi **ska** träffas klockan tre.* (afspraak)

      In spreektaal valt *att* vaak weg: *Det kommer regna.* In geschreven tekst schrijf je meestal *kommer att*.

      **ska** kan ook betekenen *moeten volgens iemand anders*: *Du **ska** ta tabletterna tre gånger om dagen.*

      En **ska** kan betekenen *naar verluidt, volgens de verwachting*: je geeft door wat een ander zegt. *Det **ska** regna i morgon, enligt SMHI.* – Volgens de weerdienst gaat het morgen regenen. Dat is gewoon goed Zweeds.

  - id: prep-verb
    title: Vaste voorzetsels
    summary: "Veel werkwoorden en bijvoeglijke naamwoorden hebben een vast voorzetsel: *tänka **på**, vänta **på**, tro **på**, lita **på**, bry sig **om**, rädd **för**, intresserad **av**, nöjd **med***."
    body: |
      Het voorzetsel moet je per woord leren. Vaak is het anders dan in het Nederlands:

      | Zweeds | Nederlands |
      |---|---|
      | tänka **på** | denken **aan** |
      | vänta **på** | wachten **op** |
      | tro **på** | geloven **in** |
      | lita **på** | vertrouwen **op** |
      | drömma **om** | dromen **van** |
      | prata **om** | praten **over** |
      | bry sig **om** | geven **om** |
      | vara rädd **för** | bang zijn **voor** |
      | vara orolig **för** | ongerust zijn **over** (iemand, iets wat kan gebeuren) |
      | vara orolig **över** | ongerust zijn **over** (een situatie) |
      | vara intresserad **av** | geïnteresseerd zijn **in** |
      | vara beroende **av** | afhankelijk zijn **van** |
      | vara nöjd **med** | tevreden zijn **met** |
      | vara arg **på** | boos zijn **op** |

      Pas op: *tänka **om*** (klemtoon op *om*) betekent *opnieuw nadenken, van mening veranderen*. Met onbeklemtoond *om* betekent het *vinden van*: *Vad tänker du om det?* Geen van beide is *denken aan*.

      In een vraag of bijzin blijft het voorzetsel achteraan: *Vad tänker du **på**? Det är något jag är rädd **för**.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-knat
        title: "Lezen: een pijnlijke knie"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: framtid
        textTitle: Ont i knät
        text: |
          Ruud har sprungit varje morgon i två år. Men en dag i oktober fick han plötsligt ont i knät. Först trodde han att det inte var något farligt, men efter några dagar var det fortfarande svullet.

          Han ringde 1177 och fick prata med en sjuksköterska. Hon frågade hur det hade hänt och om han kunde gå normalt. ”Vila knät och lägg is på det”, sa hon. ”Om det inte blir bättre inom en vecka ska du boka en tid på vårdcentralen.”

          Knät blev inte bättre, så Ruud bokade en tid i vårdcentralens app. Läkaren undersökte honom och trodde inte att det var något allvarligt. ”Du kommer att bli bra, men det kommer att ta tid”, sa hon. Nu ska Ruud träffa en fysioterapeut två gånger i veckan.

          Fysioterapeuten heter Amira. Hon undersökte knät noga och gav Ruud ett träningsprogram med fem enkla övningar. ”Du ska göra övningarna varje dag, även när det gör lite ont”, sa hon. ”Om tre veckor kommer du att märka skillnad.” Ruud var först orolig för knät, men han litade på henne och gjorde som hon sa.

          Efter en månad kunde han gå i trappor utan smärta, och nu cyklar han till jobbet i stället för att ta bussen. Han är nöjd med behandlingen, men han saknar sina löprundor på morgonen.

          ”Jag tänker inte springa något maraton i år”, säger han. ”Men nästa år ska jag försöka igen.”
        items:
          - { id: 8e39, type: mc, prompt: "Hur länge har Ruud sprungit varje morgon?", options: ["i två år", "i två månader", "sedan oktober", "i tio år"], answer: 0 }
          - { id: 4qxq, type: truefalse, statement: "Ruud ringde först till vårdcentralen.", answer: false, correction: { answers: ["{Ruud|Han} ringde först [till ]1177."] } }
          - { id: mnvj, type: mc, prompt: "Vilket råd gav sjuksköterskan?", options: ["vila knät och lägga is på det", "springa försiktigt", "åka till akuten direkt", "ta antibiotika"], answer: 0 }
          - { id: an85, type: truefalse, statement: "Läkaren tyckte att det var allvarligt.", answer: false, correction: { answers: ["{Läkaren|Hon} {tyckte|trodde} inte att det var [något ]allvarligt."] } }
          - { id: 9uau, type: truefalse, statement: "Ruud ska träffa en fysioterapeut.", answer: true }
          - { id: be3u, type: mc, prompt: "Wat betekent *Du kommer att bli bra* hier?", options: ["Een voorspelling: je wordt (vanzelf) weer beter.", "Een plan: je gaat zorgen dat je beter wordt.", "Een bevel: word beter!", "Een vraag: word je beter?"], answer: 0 }
          - { id: uw95, type: mc, prompt: "Wat betekent *Jag tänker inte springa något maraton i år*?", options: ["Hij heeft besloten dit jaar geen marathon te lopen.", "Hij denkt niet aan de marathon.", "Hij weet niet of hij kan lopen.", "Hij mag geen marathon lopen van de dokter."], answer: 0 }
          - { id: rbcu, type: mc, prompt: "Vad fick Ruud av fysioterapeuten?", options: ["ett träningsprogram med fem övningar", "en remiss till sjukhuset", "ett recept på tabletter", "en ny tid hos läkaren"], answer: 0 }
          - { id: by6v, type: truefalse, statement: "Nu tar Ruud bussen till jobbet.", answer: false, correction: { answers: ["{Ruud|Han} cyklar [nu ]till jobbet[ i stället för att ta bussen].", "Nu cyklar {Ruud|han} till jobbet[ i stället för att ta bussen]."] } }
          - id: mk24
            type: multi
            prompt: "Welke zinnen uit de tekst zijn een voorspelling?"
            options: ["Du kommer att bli bra.", "Om tre veckor kommer du att märka skillnad.", "Nu ska Ruud träffa en fysioterapeut.", "Jag tänker inte springa något maraton i år.", "Du ska göra övningarna varje dag."]
            answers: [0, 1]
            tip: "Een voorspelling is kommer att. ska is een plan of iets wat moet volgens een ander, tänker een eigen besluit."

      - id: makkelijk-1
        title: "Makkelijk lezen: Hos tandläkaren"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Hos tandläkaren"
        text: |
          Ruud har haft ont i en tand i några dagar. Han ringer tandläkaren och får en tid på torsdag. Tandläkaren undersöker tanden och säger att den måste lagas. – Det kommer inte att göra ont, säger hon. Ruud är lite orolig för det, men det går bra. Efteråt får han inte äta på två timmar. Han tänker gå till jobbet efter lunch.
        items:
          - { id: anru, type: truefalse, statement: "Ruud får en tid på torsdag.", answer: true }
          - { id: w296, type: truefalse, statement: "Ruuds tand måste dras ut.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Förkyld"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Förkyld"
        text: |
          Mira vaknade med feber i morse. Hon ringde till jobbet och sa att hon var sjuk. Hennes sambo köpte medicin på apoteket och lagade soppa. Mira kommer att stanna hemma resten av veckan. Hon bryr sig inte om att hon missar ett möte, för hon vill bli frisk. Hennes chef var snäll och önskade henne god bättring. På kvällen mådde hon lite bättre och kunde läsa en bok i sängen.
        items:
          - { id: h8c2, type: truefalse, statement: "Mira har feber.", answer: true }
          - { id: g46s, type: truefalse, statement: "Mira ska jobba i morgon.", answer: false }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-klachten
        title: Klachten
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: kubw
            type: match
            pairs:
              - ["feber", "koorts"]
              - ["hosta", "hoesten, hoest"]
              - ["yr", "duizelig"]
              - ["illamående", "misselijk(heid)"]
              - ["svullen", "gezwollen"]
              - ["utslag", "uitslag"]
          - id: g4rf
            type: match
            pairs:
              - ["en vårdcentral", "een huisartsenpraktijk, gezondheidscentrum"]
              - ["akuten", "de spoedeisende hulp"]
              - ["ett recept", "een recept (van de arts)"]
              - ["en remiss", "een verwijzing"]
              - ["en fysioterapeut", "een fysiotherapeut"]
              - ["sjukskriven", "met ziekteverlof (op advies van de arts)"]

      - id: ord-dokter
        title: Bij de dokter
        instruction: Hoe zeg je het?
        topic: woordenschat
        shuffle: true
        items:
          - { id: 4cys, type: translate, prompt: "Ik ben duizelig.", answers: ["Jag är yr.", "Jag känner mig yr."] }
          - { id: 6eb7, type: translate, prompt: "Ik heb sinds gisteren koorts.", answers: ["Jag har haft feber {sedan|sen} {i går|igår}."], feedback: [{ contains: "jag har feber", tip: "Het duurt tot nu toe: perfectum, jag har haft feber sedan i går." }, { contains: "gisteren", tip: "Gisteren = i går." }] }
          - { id: kq8k, type: translate, prompt: "Mijn knie doet pijn.", answers: ["Jag har ont i knät.", "Knät gör ont.", "Mitt knä gör ont.", "Det gör ont i {knät|mitt knä}."] }
          - { id: unqg, type: translate, prompt: "Ik ben misselijk.", answers: ["Jag mår illa.", "Jag känner mig illamående.", "Jag är illamående."] }

  - id: framtid
    title: "Grammatik: ska, kommer att, tänker"
    exercises:
      - id: framtid-kiezen
        title: Welke vorm?
        instruction: Kies **ska**, **kommer att** of **tänker**.
        topic: framtid
        shuffle: true
        items:
          - { id: x7eu, type: gap, text: "Titta på molnen! Det ___ regna snart.", gaps: [{ answers: ["kommer att"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "ska", tip: "Je voorspelt het zelf (je ziet de wolken): kommer att." }] }] }
          - { id: nh5r, type: gap, text: "Vi har bestämt det: jag ___ ringa vårdcentralen i morgon bitti.", gaps: [{ answers: ["ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "kommer att", tip: "Het is een plan: ska." }] }] }
          - { id: 8px4, type: gap, text: "Oroa dig inte. Du ___ må bättre om några dagar.", gaps: [{ answers: ["kommer att"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "ska", tip: "Beter worden kun je niet beslissen: kommer att." }] }] }
          - { id: f9vj, type: gap, text: "Jag ___ inte ta den medicinen, vad läkaren än säger!", gaps: [{ answers: ["tänker", "ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, tip: "Een eigen, vast besluit: tänker (ska kan hier ook)." }] }
          - { id: arrp, type: gap, text: "Vi ___ träffas klockan tre, eller hur?", gaps: [{ answers: ["ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "kommer att", tip: "Een afspraak: ska." }] }] }
          - { id: fj6e, type: gap, text: "Forskarna tror att fler människor ___ jobba hemifrån om tio år.", gaps: [{ answers: ["kommer att"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "ska", tip: "Een voorspelling (tror att): kommer att." }] }] }
          - { id: sfjs, type: gap, text: "Läkaren säger att du ___ ta tabletterna tre gånger om dagen.", gaps: [{ answers: ["ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, tip: "ska = moeten volgens iemand anders (hier de arts)." }] }
          - { id: bkg7, type: gap, text: "Enligt prognosen ___ det bli kallare i helgen.", gaps: [{ answers: ["kommer att", "ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "tänker", tip: "Het weer heeft geen plannen: een voorspelling is kommer att (of ska: zo wordt het verwacht)." }] }] }
          - { id: f2bz, type: gap, text: "Om du inte vilar ordentligt, ___ det ta ännu längre tid innan du blir frisk.", gaps: [{ answers: ["kommer att"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "ska", tip: "Hoe lang genezen duurt, beslist niemand: een voorspelling, kommer att." }] }] }
          - { id: jqsy, type: gap, text: "Jag har bestämt mig: jag ___ inte äta socker längre, vad mina vänner än säger.", gaps: [{ answers: ["tänker", "ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "kommer att", tip: "Een eigen, vast besluit is geen voorspelling: tänker (of ska)." }] }] }
          - { id: q37h, type: gap, text: "Vi ___ träffa en sjuksköterska på vårdcentralen på torsdag, det är redan bokat.", gaps: [{ answers: ["ska"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "kommer att", tip: "Een afspraak die al geboekt is: ska." }] }] }
          - { id: ynjk, type: gap, text: "Många experter tror att ännu fler människor ___ få problem med ryggen i framtiden.", gaps: [{ answers: ["kommer att"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "ska", tip: "Een voorspelling (tror att): kommer att." }] }] }
          - { id: x9x8, type: gap, text: "Titta så blek han är! Jag tror att han ___ svimma när han ser sprutan.", gaps: [{ answers: ["kommer att"], options: ["ska", "kommer att", "tänker"], shuffle: false, feedback: [{ match: "ska", tip: "Flauwvallen beslist niemand: een voorspelling, kommer att." }] }] }

      - id: framtid-sorteren
        title: Plan of voorspelling?
        instruction: Gaat het om een plan of afspraak, of om een voorspelling?
        topic: framtid
        items:
          - id: be9w
            type: sort
            categories: ["plan of afspraak", "voorspelling"]
            items:
              - { text: "Jag **ska** boka en tid i morgon.", cat: 0 }
              - { text: "Det **kommer att** bli kallt i natt.", cat: 1 }
              - { text: "Vi **ska** åka till Göteborg i helgen.", cat: 0 }
              - { text: "Operationen **kommer att** ta två timmar.", cat: 1 }
              - { text: "Jag **tänker** börja träna igen.", cat: 0 }
              - { text: "Du **kommer att** älska den här staden.", cat: 1 }

      - id: framtid-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds.
        topic: framtid
        items:
          - { id: bha8, type: translate, prompt: "Het gaat morgen regenen.", answers: ["Det kommer[ att] regna {i morgon|imorgon}.", "{I morgon|Imorgon} kommer det[ att] regna.", "Det ska regna {i morgon|imorgon}.", "{I morgon|Imorgon} ska det regna."], feedback: [{ contains: "går att regna", tip: "gå betekent hier niet gaan: gebruik kommer att." }] }
          - { id: 2xwx, type: translate, prompt: "Ik ga morgen naar de dokter. (Ik heb een afspraak.)", answers: ["Jag ska [gå ]till {läkaren|doktorn|vårdcentralen} {i morgon|imorgon}.", "{I morgon|Imorgon} ska jag [gå ]till {läkaren|doktorn|vårdcentralen}.", "Jag går till {läkaren|doktorn|vårdcentralen} {i morgon|imorgon}."], feedback: [{ contains: "går att", tip: "Nederlands gaan + infinitief is geen gå in het Zweeds: gebruik ska." }] }
          - { id: pnv9, type: translate, prompt: "Je zult je snel beter voelen.", answers: ["Du kommer[ att] må bättre snart.", "Du kommer snart[ att] må bättre.", "Du kommer[ att] känna dig bättre snart.", "Du kommer snart[ att] känna dig bättre."], feedback: [{ contains: "du ska", tip: "Een voorspelling: kommer att." }] }
          - { id: zynp, type: translate, prompt: "Ik ben van plan te stoppen met roken.", answers: ["Jag tänker sluta röka.", "Jag ska sluta röka.", "Jag har tänkt sluta röka.", "Jag planerar att sluta röka.", "Jag har planer på att sluta röka."] }
          - { id: yhtg, type: translate, prompt: "De apotheek gaat om negen uur open.", answers: ["Apoteket öppnar [klockan ]nio.", "Apoteket ska öppna [klockan ]nio.", "[Klockan ]nio öppnar apoteket."], feedback: [{ contains: "går att öppna", tip: "Gaan + infinitief bestaat niet in het Zweeds. Voor een vaste tijd gebruik je de presens: Apoteket öppnar klockan nio." }] }
          - { id: 2yu9, type: translate, prompt: "Ik ga niet naar dat feest. (Dat heb ik zelf besloten.)", answers: ["Jag tänker inte gå på {den festen|den där festen|festen}.", "Jag ska inte gå på {den festen|den där festen|festen}."], feedback: [{ contains: "kommer inte att gå", tip: "Een eigen besluit: tänker inte (of ska inte). kommer att is een voorspelling." }] }
          - { id: dyqw, type: translate, prompt: "Over een week krijg je de uitslag.", answers: ["Du {kommer att få|kommer få|får} {svaret|resultatet|provsvaret} om en vecka.", "Om en vecka {kommer du att få|kommer du få|får du} {svaret|resultatet|provsvaret}."], feedback: [{ contains: "i en vecka", tip: "Over een week (in de toekomst) = om en vecka." }] }
          - { id: 54p7, type: translate, prompt: "Volgend jaar verhuizen we. (Dat hebben we besloten.)", answers: ["Vi ska flytta nästa år.", "Nästa år ska vi flytta.", "Vi flyttar nästa år.", "Nästa år flyttar vi."], feedback: [{ contains: "nästa år vi", tip: "Na Nästa år vooraan komt eerst het werkwoord." }] }
          - { id: udab, type: translate, prompt: "Ik denk dat de behandeling bij de fysiotherapeut drie maanden gaat duren.", answers: ["Jag tror [att ]behandlingen hos fysioterapeuten {kommer att ta|kommer ta|tar} tre månader.", "Jag tror [att ]behandlingen hos fysioterapeuten {kommer att pågå|kommer pågå|pågår} [i ]tre månader."], feedback: [{ contains: ["går att ta", "går ta"], tip: "Nederlands gaan + infinitief is geen gå in het Zweeds: gebruik kommer att." }, { contains: "ska ta", tip: "Ska kan ook, maar dan klinkt het als een planning of iets wat je gehoord hebt. Oefen hier de voorspelling na Jag tror att: kommer att." }, { contains: "jag tänker att", tip: "Denken dat (een verwachting) = tro att." }] }
          - { id: j58q, type: translate, prompt: "Morgen ga ik de huisartsenpraktijk bellen om een nieuwe afspraak te maken.", answers: ["{I morgon|Imorgon} {ska jag ringa|tänker jag ringa|ringer jag} [till ]vårdcentralen {för att|och} {boka [en ]ny tid|få en ny tid}.", "Jag {ska ringa|tänker ringa|ringer} [till ]vårdcentralen {i morgon|imorgon} {för att|och} {boka [en ]ny tid|få en ny tid}."], feedback: [{ contains: ["går att ringa", "går ringa"], tip: "Nederlands gaan + infinitief is geen gå in het Zweeds: gebruik ska." }, { contains: ["kommer att ringa", "kommer ringa"], tip: "Het is jouw plan, geen voorspelling: ska." }, { contains: ["i morgon jag", "imorgon jag"], tip: "Na I morgon vooraan komt eerst het werkwoord: I morgon ska jag ringa." }] }
          - { id: d8ta, type: translate, prompt: "Als je nu stopt met roken, zul je je over een jaar veel beter voelen.", answers: ["Om du {slutar [att ]röka nu|nu slutar [att ]röka} [så ]kommer du[ att] {må|känna dig} mycket bättre om ett år.", "Du kommer[ att] {må|känna dig} mycket bättre om ett år om du {slutar [att ]röka nu|nu slutar [att ]röka}."], feedback: [{ contains: ["ska må", "ska känna"], tip: "Beter voelen kun je niet beslissen: een voorspelling is kommer att." }, { contains: ["nu du kommer", "röka du kommer"], tip: "Na de om-zin komt eerst het werkwoord: …, kommer du att må bättre." }, { contains: "i ett år", tip: "Over een jaar (in de toekomst) = om ett år." }] }
          - { id: zhvu, type: translate, prompt: "Na de operatie is Ruud van plan om elke dag een uur te wandelen.", answers: ["Efter operationen {tänker|ska} Ruud {promenera|gå} [i ]en timme varje dag.", "Efter operationen {har Ruud tänkt|planerar Ruud [att ]} {promenera|gå} [i ]en timme varje dag.", "Ruud {tänker|ska|har tänkt|planerar [att ]} {promenera|gå} [i ]en timme varje dag efter operationen."], feedback: [{ contains: ["operationen ruud tänker", "operationen ruud ska"], tip: "Na Efter operationen vooraan komt eerst het werkwoord: Efter operationen tänker Ruud." }, { contains: ["kommer att promenera", "kommer promenera", "kommer att gå"], tip: "Een eigen plan is geen voorspelling: tänker (of ska)." }, { contains: "tänker att", tip: "Na tänker (van plan zijn) komt geen att: tänker promenera." }] }

      - id: framtid-kiezen-maken
        title: Plan of voorspelling? Kies en vertaal
        instruction: Kies eerst welke vorm voor de toekomst past. Vertaal daarna de zin.
        topic: framtid
        shuffle: true
        items:
          - id: wqfy
            type: steps
            steps:
              - { type: mc, prompt: "Na de operatie ga je je veel beter voelen. Welke vorm past het best?", options: ["ska (plan, afspraak)", "kommer att (voorspelling)", "tänker (eigen besluit)", "presens (vaste tijd)"], answer: 1, shuffle: false, tip: "Niemand kan beslissen dat je je beter voelt: het is een voorspelling, dus kommer att." }
