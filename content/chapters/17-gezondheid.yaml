              - { type: translate, prompt: "Vertaal: Het zal een tijdje duren voordat je knie weer helemaal goed is.", answers: ["Det kommer[ att] ta {ett tag|en stund|tid|lite tid} innan {knät|ditt knä} {är|blir} helt bra igen.", "Det tar {ett tag|en stund|tid|lite tid} innan {knät|ditt knä} {är|blir} helt bra igen."], feedback: [{ contains: "det ska ta", tip: "Hoe lang het duurt, beslist niemand: kommer att." }, { contains: ["ditt knät", "din knä"], tip: "knä is een ett-woord: ditt knä, of gewoon knät." }] }
          - id: 5fyr
            type: steps
            steps:
