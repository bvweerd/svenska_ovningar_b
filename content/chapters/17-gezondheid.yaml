              - { type: translate, prompt: "Vertaal: Erik en ik gaan zaterdag samen hardlopen.", answers: ["{Erik och jag|Jag och Erik} ska {springa|jogga} tillsammans på lördag.", "På lördag ska {Erik och jag|jag och Erik} {springa|jogga} tillsammans.", "{Erik och jag|Jag och Erik} {springer|joggar} tillsammans på lördag.", "På lördag {springer|joggar} {Erik och jag|jag och Erik} tillsammans."], feedback: [{ contains: ["kommer att springa", "kommer springa", "kommer att jogga"], tip: "Een afspraak is geen voorspelling: ska." }, { contains: ["går att springa", "går springa", "går och springa"], tip: "Nederlands gaan + infinitief is geen gå in het Zweeds: gebruik ska." }] }
