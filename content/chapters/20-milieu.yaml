chapter: 20
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kies tussen någon en ingen, en zet ze op de goede plek", topics: [nagon-ingen] }
  - { text: "Ik kan algemene uitspraken doen met man, en en ens", topics: [man-en-ens] }

grammar:
  - id: nagon-ingen
    title: Någon / ingen
    summary: "*någon/något/några* = (een) enig(e), iemand; *ingen/inget/inga* = geen. Bij een samengesteld werkwoord of in een bijzin gebruik je **inte någon**: *Jag har **inte** sett **någon**.* (niet ~~*har sett ingen*~~)"
    body: |
      | | en-woord | ett-woord | meervoud |
      |---|---|---|---|
      | iets, enig | någon | något | några |
      | geen | ingen | inget | inga |

      - *Har du **någon** penna? – Nej, jag har **ingen** penna.*
      - *Finns det **något** bröd? – Nej, det finns **inget** bröd.*
      - *Har du **några** syskon? – Nej, jag har **inga** syskon.*
      - Als zelfstandig woord: *någon* = iemand, *ingen* = niemand, *något/någonting* = iets, *inget/ingenting* = niets.

      ### Wanneer inte någon in plaats van ingen?
      *ingen* kan alleen staan waar *inte* zou staan: direct na een enkelvoudig werkwoord in de hoofdzin. In andere gevallen (ook na een voorzetsel) gebruik je **inte … någon**:

      | goed | fout |
      |---|---|
      | *Jag har **ingen** bil.* | |
      | *Jag har **inte** sett **någon**.* | ~~*Jag har sett ingen.*~~ |
      | *Jag kan **inte** se **något**.* | ~~*Jag kan se inget.*~~ |
      | *… eftersom jag **inte** har **någon** bil.* | ~~*… eftersom jag har ingen bil.*~~ |
      | *Jag pratade **inte** med **någon**.* | ~~*Jag pratade med ingen.*~~ |

      Als **onderwerp** vooraan mag *ingen* altijd: ***Ingen** kom på mötet.*

  - id: man-en-ens
    title: Man, en, ens
    summary: "*man* = men (onderwerp), *en* = je/iemand (voorwerp), *ens* = je/iemands (bezit): *Man blir glad när någon hjälper **en**. Det är skönt när **ens** vänner ringer.* Wederkerend: *Man ska ta med **sig** **sitt** skräp.*"
    body: |
      *man* is algemeen: *men, je, iedereen*. Het heeft eigen vormen:

      | functie | vorm | voorbeeld |
      |---|---|---|
      | onderwerp | **man** | ***Man** sorterar soporna.* |
      | voorwerp | **en** | *Det är irriterande när någon stör **en**.* |
      | bezit | **ens** | *Det är härligt när **ens** vänner hälsar på.* |
      | wederkerend | **sig / sin, sitt, sina** | ***Man** ska ta med **sig** **sitt** skräp.* |

      Verwijst het bezit naar *man* zelf als onderwerp in dezelfde zin, dan **sin/sitt/sina** (zoals bij *han, hon*): *Man ska ta hand om **sina** saker.*

      Je kunt *man* in het Nederlands vaak vertalen met *je*: *Hier mag je niet roken* = *Här får **man** inte röka.* Gebruik dan geen *du*, tenzij je echt de ander bedoelt.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-sopor
        title: "Lezen: afval scheiden"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: man-en-ens
        textTitle: Sopsortering – en svensk nationalsport?
        text: |
          När Bas flyttade till Linköping trodde han att han kunde mycket om miljö. Men ingen hade berättat för honom hur noga svenskarna är med att sortera sina sopor. I hans kök finns det nu fem olika påsar: matavfall, plast, papper, glas och metall.

          Burkar och plastflaskor med pant lämnar man tillbaka i butiken, och då får man några kronor tillbaka. Tidningar, batterier och glas tar man till en återvinningsstation. Det finns nästan ingenting som man bara slänger.

          – I början tyckte jag att det var lite överdrivet, säger Bas. Men nu känns det konstigt när någon slänger en burk bland de vanliga soporna. Man vänjer sig!

          Många svenskar köper också allt mer begagnat. På loppisar och i appar kan man hitta nästan vad som helst, från barnkläder till soffor.
        items:
          - { id: 9ywd, type: mc, prompt: "Hur många olika påsar har Bas i köket?", options: ["fem", "tre", "två", "sju"], answer: 0 }
          - { id: vsbg, type: truefalse, statement: "Någon hade berättat för Bas hur man sorterar.", answer: false, correction: { answers: ["Ingen hade berättat för {honom|Bas}[ hur man sorterar].", "{Bas|Han} visste inte hur man sorterar."] } }
          - { id: m9wr, type: mc, prompt: "Vad gör man med burkar med pant?", options: ["Man lämnar tillbaka dem i butiken.", "Man slänger dem i soporna.", "Man tar dem till en loppis.", "Man behåller dem."], answer: 0 }
          - { id: yzxy, type: mc, prompt: "Vart tar man batterier?", options: ["till en återvinningsstation", "till butiken", "till posten", "till grannen"], answer: 0 }
          - { id: hb39, type: truefalse, statement: "Bas tycker fortfarande att sorteringen är överdriven.", answer: false, correction: { answers: ["{Bas|Han} tyckte det [bara ]i början.", "Nu känns det konstigt när någon slänger en burk[ bland de vanliga soporna]."] } }
          - { id: fpec, type: mc, prompt: "Wat betekent *begagnat*?", options: ["tweedehands", "nieuw", "duur", "kapot"], answer: 0 }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-milieu
        title: Milieu
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: vvk5
            type: match
            pairs:
              - ["sopor", "afval, vuilnis"]
              - ["matavfall", "etensresten, keukenafval"]
              - ["pant", "statiegeld"]
              - ["en återvinningsstation", "een inzamelpunt voor recycling"]
              - ["en loppis", "een rommelmarkt"]
              - ["begagnad", "tweedehands"]
          - id: pa6d
            type: match
            pairs:
              - ["klimatet", "het klimaat"]
              - ["utsläpp", "uitstoot"]
              - ["hållbar", "duurzaam"]
              - ["källsortera", "afval scheiden"]
              - ["slänga", "weggooien"]
              - ["spara energi", "energie besparen"]

  - id: nagon
    title: "Grammatik: någon / ingen"
    exercises:
      - id: nagon-kiezen
        title: Welke vorm?
        instruction: Kies de goede vorm.
        topic: nagon-ingen
        shuffle: true
        items:
          - { id: fcv8, type: gap, text: "Har du ___ planer i helgen?", gaps: [{ answers: ["några"], options: ["någon", "något", "några"], shuffle: false, feedback: [{ match: ["någon", "något"], tip: "planer is meervoud: några." }] }] }
          - { id: 8evh, type: gap, text: "Nej, jag har ___ planer.", gaps: [{ answers: ["inga"], options: ["ingen", "inget", "inga"], shuffle: false, feedback: [{ match: ["ingen", "inget"], tip: "planer is meervoud: inga." }] }] }
          - { id: xc9n, type: gap, text: "Finns det ___ mjölk kvar?", gaps: [{ answers: ["någon"], options: ["någon", "något", "några"], shuffle: false, feedback: [{ match: "något", tip: "mjölk is een en-woord: någon." }] }] }
          - { id: qvft, type: gap, text: "Det finns ___ bröd kvar.", gaps: [{ answers: ["inget"], options: ["ingen", "inget", "inga"], shuffle: false, feedback: [{ match: "ingen", tip: "bröd is een ett-woord: inget." }] }] }
          - { id: efvm, type: gap, text: "Är det ___ som vill ha kaffe?", gaps: [{ answers: ["någon", "några"], options: ["någon", "något", "några"], shuffle: false }] }
          - { id: y34s, type: gap, text: "___ visste vad som hade hänt.", gaps: [{ answers: ["Ingen"], options: ["Ingen", "Inget", "Inga"], shuffle: false, tip: "Niemand = ingen." }] }
          - { id: dn9x, type: gap, text: "Jag har inte ___ tid i dag.", gaps: [{ answers: ["någon"], options: ["någon", "något", "några"], shuffle: false, feedback: [{ match: "något", tip: "tid is een en-woord: någon." }] }] }
          - { id: t9y7, type: gap, text: "Finns det ___ ledigt rum?", gaps: [{ answers: ["något"], options: ["någon", "något", "några"], shuffle: false, feedback: [{ match: "någon", tip: "rum is een ett-woord: något." }] }] }

      - id: nagon-ontkennen
        title: Maak de zin ontkennend
        instruction: Maak de zin ontkennend. Let op **ingen** of **inte någon**.
        topic: nagon-ingen
        items:
          - { id: vatz, type: transform, prompt: "Jag har en bil.", answers: ["Jag har ingen bil.", "Jag har inte någon bil."] }
          - { id: rgdc, type: transform, prompt: "Jag har sett någon.", answers: ["Jag har inte sett någon."], feedback: [{ match: "Jag har sett ingen.", tip: "Bij har + supinum: inte … någon. Jag har inte sett någon." }, { match: "Jag har ingen sett.", tip: "Gebruik inte … någon: Jag har inte sett någon." }] }
          - { id: 2pse, type: transform, prompt: "Vi kan köpa något.", answers: ["Vi kan inte köpa {något|någonting}."], feedback: [{ match: ["Vi kan köpa inget.", "Vi kan köpa ingenting."], tip: "Na een modaal werkwoord: inte … något." }] }
          - { id: umcw, type: transform, prompt: "Det finns mat i kylen.", answers: ["Det finns ingen mat i kylen.", "Det finns inte någon mat i kylen."] }
          - { id: wvkk, type: transform, prompt: "Hon sa att hon hade några frågor.", answers: ["Hon sa att hon inte hade några frågor."], feedback: [{ match: "Hon sa att hon hade inga frågor.", tip: "In een bijzin: inte … några." }] }
          - { id: x9k8, type: transform, prompt: "Jag har hittat något.", answers: ["Jag har inte hittat {något|någonting}."], feedback: [{ match: ["Jag har hittat inget.", "Jag har hittat ingenting."], tip: "Bij har + supinum: inte … något." }] }
          - { id: medb, type: transform, prompt: "Jag känner någon i Umeå.", answers: ["Jag känner ingen i Umeå.", "Jag känner inte någon i Umeå."] }
          - { id: brqb, type: transform, prompt: "Vi har köpt några presenter.", answers: ["Vi har inte köpt några presenter."], feedback: [{ match: "Vi har köpt inga presenter.", tip: "Bij har + supinum: inte … några." }] }

      - id: nagon-goed-fout
        title: Goed of fout?
        instruction: Is de zin goed of fout?
        topic: nagon-ingen
        items:
          - id: gtvb
            type: sort
            categories: ["goed", "fout"]
            items:
              - { text: "Jag har ingen tid i dag.", cat: 0 }
              - { text: "Jag har sett ingen.", cat: 1, tip: "Bij har + supinum: Jag har inte sett någon." }
              - { text: "Jag kan inte se någon.", cat: 0 }
              - { text: "Eftersom jag har ingen bil, cyklar jag.", cat: 1, tip: "In een bijzin: eftersom jag inte har någon bil." }
              - { text: "Ingen kom på mötet.", cat: 0 }
              - { text: "Hon har ätit ingenting.", cat: 1, tip: "Hon har inte ätit någonting." }

  - id: man
    title: "Grammatik: man, en, ens"
    exercises:
      - id: man-kiezen
        title: Man, en of ens?
        instruction: Kies de vorm die past.
        topic: man-en-ens
        shuffle: true
        items:
          - { id: 5gda, type: gap, text: "___ ska sortera sina sopor.", gaps: [{ answers: ["Man"], options: ["Man", "En", "Ens"], shuffle: false }] }
          - { id: muqx, type: gap, text: "Det är irriterande när någon stör ___ mitt i natten.", gaps: [{ answers: ["en"], options: ["man", "en", "ens"], shuffle: false, feedback: [{ match: "man", tip: "Hier is het voorwerp: en." }] }] }
          - { id: bebf, type: gap, text: "Det är härligt när ___ vänner hälsar på.", gaps: [{ answers: ["ens"], options: ["man", "en", "ens"], shuffle: false }] }
          - { id: 96ut, type: gap, text: "Man ska ta med sig ___ skräp hem.", gaps: [{ answers: ["sitt"], options: ["sitt", "ens", "hans"], shuffle: false, feedback: [{ match: "ens", tip: "Het bezit hoort bij het onderwerp man in dezelfde zin: sitt." }] }] }
          - { id: 5wrh, type: gap, text: "Det känns bra när någon hjälper ___.", gaps: [{ answers: ["en"], options: ["man", "en", "ens"], shuffle: false }] }
          - { id: fyc5, type: gap, text: "Det är svårt när ingen lyssnar på ___.", gaps: [{ answers: ["en"], options: ["man", "en", "ens"], shuffle: false, feedback: [{ match: "man", tip: "Na een voorzetsel (på) komt de objectvorm: en." }] }] }
          - { id: q2j8, type: gap, text: "___ vet aldrig vad som kan hända.", gaps: [{ answers: ["Man"], options: ["Man", "En", "Ens"], shuffle: false }] }
          - { id: 4r3t, type: gap, text: "Det är tråkigt när ___ cykel blir stulen.", gaps: [{ answers: ["ens"], options: ["man", "en", "ens"], shuffle: false, tip: "Bezit bij man, als man niet het onderwerp is: ens." }] }

      - id: man-vertalen
        title: Vertaal met man
        instruction: Vertaal naar het Zweeds. Gebruik **man**.
        topic: man-en-ens
        items:
          - { id: qh9k, type: translate, prompt: "Hier mag je niet roken.", answers: ["Här får man inte röka.", "Man får inte röka här."], feedback: [{ contains: "du", tip: "Je in algemene zin = man." }] }
          - { id: 3x94, type: translate, prompt: "Je moet je afval scheiden.", answers: ["Man måste {sortera|källsortera} {sina sopor|sitt avfall|sitt skräp}.", "Man ska {sortera|källsortera} {sina sopor|sitt avfall|sitt skräp}."], feedback: [{ contains: "ens sopor", tip: "Het bezit hoort bij man als onderwerp: sina sopor." }] }
          - { id: 4jep, type: translate, prompt: "Het is fijn als iemand je helpt.", answers: ["Det är {skönt|trevligt|härligt|fint} {när|om} någon hjälper en."] }
          - { id: rvny, type: translate, prompt: "In Zweden drinkt men veel koffie.", answers: ["I Sverige dricker man mycket kaffe.", "Man dricker mycket kaffe i Sverige."], feedback: [{ contains: "sverige man dricker", tip: "Na I Sverige vooraan komt eerst het werkwoord: dricker man." }] }
          - { id: yqqh, type: translate, prompt: "Je weet maar nooit.", answers: ["Man vet aldrig.", "Man kan aldrig veta."], feedback: [{ contains: "du vet", tip: "Je in algemene zin = man." }] }
          - { id: 28qv, type: translate, prompt: "Je moet je rijbewijs meenemen.", answers: ["Man {måste|ska} ta med [sig ]sitt körkort."], feedback: [{ contains: "ens körkort", tip: "Het bezit hoort bij man als onderwerp: sitt körkort." }, { contains: "du", tip: "Je in algemene zin = man." }] }
          - { id: mrch, type: translate, prompt: "Het is fijn als je vrienden je bellen.", answers: ["Det är {skönt|trevligt|roligt|härligt|fint} {när|om} ens vänner ringer[ till] en."], feedback: [{ contains: "sina vänner", tip: "man is hier niet het onderwerp: ens vänner." }] }
          - { id: 3jp7, type: translate, prompt: "Hier kun je goed eten.", answers: ["Här kan man äta gott.", "Man kan äta gott här.", "Här äter man gott.", "Man äter gott här."] }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-kommun
        title: "Luisteren: nieuwe regels in de gemeente"
        instruction: Luister naar het bericht van de gemeente. Is de bewering **rätt** of **fel**?
        topic: nagon-ingen
        listen: true
        textTitle: Information från kommunen
        text: |
          Från och med den första mars ändras sophämtningen i kommunen. Matavfallet hämtas varje vecka, men de vanliga soporna hämtas bara varannan vecka.

          Alla hushåll får ett nytt, brunt kärl för matavfall. Ni behöver inte göra någonting själva, kärlet levereras till er under februari.

          Glas, plast och papper ska ni som vanligt lämna på återvinningsstationen. Har ni frågor kan ni ringa kommunens kundtjänst eller läsa mer på vår webbplats.
        items:
          - { id: huuf, type: truefalse, statement: "Ändringen börjar den första mars.", answer: true }
          - { id: hybm, type: truefalse, statement: "De vanliga soporna hämtas varje vecka.", answer: false, correction: { answers: ["De vanliga soporna hämtas [bara ]varannan vecka."] } }
          - { id: tq3x, type: truefalse, statement: "Man måste hämta det nya kärlet själv.", answer: false, correction: { answers: ["Man behöver inte göra någonting[ själv].", "Ni behöver inte göra någonting[ själva].", "Kärlet levereras[ under februari]."] } }
          - { id: mbmg, type: truefalse, statement: "Glas ska man lämna på återvinningsstationen.", answer: true }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: nagon-ingen
        shuffle: true
        items:
          - { id: 8fx2, type: listen, say: "Jag har inte sett någon." }
          - { id: b4s4, type: listen, say: "Man ska sortera sina sopor." }
          - { id: cjnr, type: listen, say: "Det finns inget bröd kvar." }
          - { id: w7at, type: listen, say: "Ingen visste vad som hade hänt." }

  - id: praktiskt
    title: Praktiskt · over gewoontes en regels
    exercises:
      - id: dialoog-sortera
        title: De nieuwe buurman
        instruction: Zet het gesprek in de goede volgorde.
        topic: man-en-ens
        items:
          - id: gsxk
            type: dialogue
            lines:
              - "Bas: Ursäkta, var slänger man glasburkar här?"
              - "Grannen: Dem tar man till återvinningsstationen bakom affären."
              - "Bas: Okej. Och mjölkpaketen?"
              - "Grannen: De är av papper, så de ska också dit. Man sköljer ur dem först."
              - "Bas: Tack! Det fanns ingen sådan station där jag bodde förut."
              - "Grannen: Man vänjer sig snabbt. Fråga bara om det är något!"

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat past.
        topic: man-en-ens
        shuffle: true
        items:
          - { id: g2dk, type: mc, prompt: "Je vraagt hoe iets hier gaat.", options: ["Hur gör man här?", "Hur gör du här?", "Hur gör en här?", "Hur gör ens här?"], answer: 0 }
          - { id: fvj3, type: mc, prompt: "Je legt een regel uit.", options: ["Man får inte grilla på balkongen.", "En får inte grilla på balkongen.", "Ens får inte grilla på balkongen.", "Ingen får inte grilla på balkongen."], answer: 0 }
          - { id: tuvx, type: mc, prompt: "Je zegt dat niemand het je heeft verteld.", options: ["Ingen har berättat det för mig.", "Någon har inte berättat det för mig.", "Inte någon har berättat det för mig inte.", "Ingen har inte berättat det för mig."], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een reactie op een artikel."
    exercises:
      - id: skriva-insandare
        title: Reageer op het artikel
        instruction: Schrijf een ingezonden brief.
        topic: man-en-ens
        items:
          - id: j9hf
            type: free
            prompt: "Je hebt het artikel over afval scheiden gelezen. Schrijf een korte reactie voor de krant (70–110 woorden). Vertel hoe het bij jou is (in Nederland of Zweden), wat je goed of lastig vindt en wat *men* volgens jou zou moeten doen. Gebruik **man** en minstens één keer **ingen** of **inte någon**."
            minWords: 65
            require:
              - { any: ["man"], label: "Je gebruikt man" }
              - { any: ["ingen", "inget", "inga", "inte någon", "inte något", "inte några", "ingenting"], label: "Je gebruikt ingen/inget/inga of inte någon" }
              - { any: ["tycker", "anser", "tror"], label: "Je geeft je mening" }
              - { any: ["borde", "skulle", "måste"], label: "Je zegt wat men zou moeten doen" }
            model: "Jag läste artikeln om sopsortering med stort intresse. I Nederländerna sorterar man också sina sopor, men inte lika noga som i Sverige. När jag flyttade hit visste jag ingenting om pant eller återvinningsstationer. Nu tycker jag att systemet är bra, men det är svårt för nya invånare. Ingen förklarar hur man gör. Jag tycker att kommunen borde skicka information på flera språk till alla som flyttar hit. Då skulle fler sortera rätt från början. Linda Bos, Linköping"

  - id: herhaling
    title: Herhaling
    exercises:
      - id: herhaling-13-20
        title: Hoofdstuk 13 tot en met 20 door elkaar
        instruction: Gemengde vragen.
        shuffle: true
        items:
          - { id: bhtj, type: gap, topic: passiv-s, text: "Matavfallet ___ (hämta) varje vecka.", gaps: [{ answers: ["hämtas"] }] }
          - { id: 9w7j, type: gap, topic: partikelverb, text: "Glöm inte att ___ lampan när du går.", gaps: [{ answers: ["släcka"], options: ["släcka", "sätta på", "tända"], tip: "Een lamp uitdoen: släcka (of stänga av)." }] }
          - { id: n9m6, type: gap, topic: deponens, text: "Det ___ (finnas) ingen återvinningsstation i närheten.", gaps: [{ answers: ["finns"] }] }
          - { id: kxk2, type: gap, topic: villkor, text: "Om alla ___ (sortera) sina sopor, skulle vi spara mycket energi.", gaps: [{ answers: ["sorterade"] }] }
          - { id: rmky, type: gap, topic: indirekt-fraga, text: "Vet du ___ hämtar soporna?", gaps: [{ answers: ["vem som"], options: ["vem som", "vem", "vad som"], shuffle: false }] }
          - { id: qrk9, type: transform, topic: nagon-ingen, prompt: "Jag har köpt något.", answers: ["Jag har inte köpt {något|någonting}."] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: nagon-ingen
        shuffle: true
        items:
          - { id: w7df, type: findError, sentence: "Jag har sett ingen i parken.", wrong: [2, 3], answers: ["Jag har inte sett någon i parken."], tip: "Bij har + supinum." }
          - { id: 77fx, type: findError, sentence: "Det finns ingen bröd kvar.", wrong: [2], answers: ["Det finns inget bröd kvar."], tip: "bröd is een ett-woord." }
          - { id: 87fg, type: findError, sentence: "Har du någon syskon?", wrong: [2], answers: ["Har du några syskon?", "Har du något syskon?"], tip: "syskon is een ett-woord: något (één) of några (meer)." }
          - { id: q5d9, type: findError, topic: man-en-ens, sentence: "Man ska ta med ens skräp hem.", wrong: [4], answers: ["Man ska ta med sig sitt skräp hem.", "Man ska ta med sitt skräp hem."], tip: "Het bezit hoort bij het onderwerp man." }
          - { id: rdms, type: findError, sentence: "Eftersom jag har ingen bil cyklar jag.", wrong: [2, 3], answers: ["Eftersom jag inte har någon bil cyklar jag."], tip: "In een bijzin: inte … någon." }

