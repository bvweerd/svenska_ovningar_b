chapter: 14
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan vertellen wat er met iets of iemand gebeurd is (lijdende vorm met bli)", topics: [passiv-bli] }
  - { text: "Ik kan voltooide deelwoorden als bijvoeglijk naamwoord gebruiken", topics: [particip] }

grammar:
  - id: passiv-bli
    title: De lijdende vorm met bli
    summary: "**bli + voltooid deelwoord** dat meebuigt: *Han blev antagen. Huset blev sålt. Böckerna blev sålda.* Vaak bij een resultaat of een eenmalige gebeurtenis."
    body: |
      Naast de -s-vorm (hoofdstuk 13) heeft het Zweeds een lijdende vorm met **bli** (worden) + het **voltooid deelwoord**:

      - *Hon **blev antagen** till utbildningen.* – Ze werd toegelaten tot de opleiding.
      - *Mötet **blev inställt**.* – De vergadering werd afgelast.

      Het deelwoord buigt mee met het onderwerp, net als een bijvoeglijk naamwoord:

      | en-woord | ett-woord | meervoud |
      |---|---|---|
      | Kursen blev inställ**d** | Provet blev inställ**t** | Kurserna blev inställ**da** |
      | Uppsatsen blev godkän**d** | Arbetet blev godkän**t** | Uppsatserna blev godkän**da** |

      ### -s of bli?
      Vaak kan allebei. Grofweg:
      - **-s** voor processen, regels, gewoontes en in formele teksten: *Ansökan skickas till …*, *Kaffe serveras.*
      - **bli** voor een resultaat of een gebeurtenis die iemand overkomt, vaker in spreektaal: *Min cykel blev stulen. Jag blev bjuden på middag.*

      Met **vara** + deelwoord beschrijf je een toestand: *Dörren **är** stängd.* (de deur is dicht) tegenover *Dörren **blev** stängd klockan sex.* (werd dichtgedaan).

  - id: particip
    title: Deelwoorden als bijvoeglijk naamwoord
    summary: "Voltooid deelwoord: *en målad vägg, ett målat hus, målade väggar, den målade väggen*. Sterk: *skriven, skrivet, skrivna*. Tegenwoordig deelwoord op **-ande/-ende**: *en spännande kurs*."
    body: |
      ### Voltooid deelwoord (perfekt particip)
      Het voltooid deelwoord gebruik je als bijvoeglijk naamwoord, met de gewone uitgangen:

      | soort | en-woord | ett-woord | meervoud en bepaald |
      |---|---|---|---|
      | -ar (måla) | målad | målat | målade |
      | -er (stänga) | stängd | stängt | stängda |
      | -er met k, p, s, t (köpa) | köpt | köpt | köpta |
      | kort (sy) | sydd | sytt | sydda |
      | sterk (skriva) | skriven | skrivet | skrivna |

      - *en **bortglömd** väska*, *ett **renoverat** hus*, *de **stulna** cyklarna*
      - Bepaald: *den **målade** väggen*, *det **inställda** mötet* – de meervoudsvorm, zoals bij gewone bijvoeglijke naamwoorden.

      Sterke werkwoorden hebben een deelwoord op *-en*: *anta → antagen*, *bjuda → bjuden*, *stjäla → stulen*, *skriva → skriven*. Let ook op het onregelmatige *sälja → såld*.

      ### Tegenwoordig deelwoord (presens particip)
      Op **-ande** (meestal) of **-ende** (na een lange klinker, bijv. *le → leende*, *gå → gående*). Het verandert nooit:

      - *en **spännande** kurs, ett **spännande** program, **spännande** kurser*
      - *ett **leende** barn*, *under **kommande** år*
      - Ook als bijwoord bij een beweging: *Han kom **springande**.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-joost
        title: "Lezen: van SFI naar de universiteit"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: passiv-bli
        textTitle: Från SFI till universitetet
        text: |
          Joost flyttade från Nijmegen till Umeå för fyra år sedan. Först läste han svenska på SFI, och sedan fortsatte han på Komvux, där han läste svenska som andraspråk och samhällskunskap. Det var tufft, men lärarna var engagerade och klasserna var små. Under tiden på Komvux jobbade han extra på en förskola, och det var där han bestämde sig för att bli lärare.

          För två år sedan sökte han till lärarprogrammet på universitetet. Hans utbildning från Nederländerna måste först bedömas av en myndighet, och det tog flera månader. Men i juli kom beskedet: han hade blivit antagen!

          Nu läser Joost andra året. Han har föreläsningar tre dagar i veckan, och resten av tiden pluggar han hemma eller på biblioteket. Det svåraste är de skriftliga tentorna, eftersom man måste skriva snabbt på svenska. Han får studiemedel från CSN, men han jobbar också extra på ett café på helgerna.

          Nästa termin ska Joost göra sin första praktik. Praktikplatserna fördelas av universitetet, och han blev placerad på en högstadieskola nära där han bor. Han är lite nervös, men också förväntansfull.

          – Jag har ju själv varit nybörjare i ett nytt land, säger han. Därför tror jag att jag förstår hur det känns att inte kunna allt.

          – Det bästa med att plugga i Sverige är att man får säga emot läraren, säger Joost. Ingen blir arg om man har en annan åsikt.
        items:
          - { id: 3wyp, type: mc, prompt: "Var läste Joost svenska först?", options: ["på SFI", "på universitetet", "i Nijmegen", "på jobbet"], answer: 0 }
          - { id: 6cxb, type: truefalse, statement: "Joost läste samhällskunskap på Komvux.", answer: true }
          - { id: jm9d, type: truefalse, statement: "Hans utbildning från Nederländerna bedömdes på en vecka.", answer: false, tip: "Hoe lang duurde het?", correction: { answers: ["Det tog flera månader[ att bedöma {den|hans utbildning}]."] } }
          - { id: 32pd, type: mc, prompt: "Vad hände i juli?", options: ["Han blev antagen till lärarprogrammet.", "Han flyttade till Umeå.", "Han började på SFI.", "Han fick jobb på ett café."], answer: 0 }
          - { id: yyhs, type: truefalse, statement: "Joost tycker att de skriftliga tentorna är lätta.", answer: false, correction: { answers: ["{Joost|Han} tycker att {de skriftliga tentorna|tentorna|de} är svåra[st]."] } }
          - { id: e8sp, type: mc, prompt: "Var bestämde sig Joost för att bli lärare?", options: ["på en förskola där han jobbade extra", "på SFI", "på universitetet", "på caféet där han jobbar"], answer: 0, tip: "Lees het einde van de eerste alinea." }
          - { id: 95a4, type: mc, prompt: "Hur försörjer sig Joost?", options: ["med studiemedel och ett extrajobb", "bara med studiemedel", "hans föräldrar betalar", "han jobbar heltid"], answer: 0 }
          - { id: 2whd, type: mc, prompt: "Wat vindt Joost het beste aan studeren in Zweden?", options: ["Je mag het oneens zijn met de docent.", "De tentamens zijn makkelijk.", "Je hoeft niet naar college.", "Er is gratis koffie."], answer: 0, tip: "säga emot = tegenspreken." }
          - { id: shnm, type: truefalse, statement: "Joost fick själv välja skola för sin praktik.", answer: false, tip: "Wie verdeelt de stageplaatsen?", correction: { answers: ["{Praktikplatserna|De} fördelas av universitetet.", "Universitetet fördelar praktikplatserna.", "{Han|Joost} {blev placerad|placerades} på en högstadieskola[ nära där han bor].", "{Joost|Han} fick inte [själv ]välja skola[ för sin praktik]."] } }
          - id: gfr5
            type: multi
            prompt: "Welke vormen in de tekst zijn een lijdende vorm of een voltooid deelwoord?"
            options: ["bedömas", "antagen", "engagerade", "skriftliga", "flyttade", "pluggar"]
            answers: [0, 1, 2]
            tip: "engagerade (betrokken) is een deelwoord als bijvoeglijk naamwoord. skriftliga (schriftelijk) is een gewoon bijvoeglijk naamwoord en flyttade is gewoon preteritum."

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-studera
        title: Studeren in Zweden
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: kwbw
            type: match
            pairs:
              - ["en tenta", "een tentamen"]
              - ["en föreläsning", "een hoorcollege"]
              - ["en uppsats", "een scriptie, werkstuk"]
              - ["ett betyg", "een cijfer, beoordeling"]
              - ["en examen", "een afgeronde opleiding, een graad"]
              - ["studiemedel", "studiefinanciering"]
          - id: 36gb
            type: match
            pairs:
              - ["plugga", "studeren, blokken"]
              - ["läsa en kurs", "een cursus volgen"]
              - ["bli antagen", "toegelaten worden"]
              - ["klara tentan", "slagen voor het tentamen"]
              - ["köra på tentan", "zakken voor het tentamen"]
              - ["på distans", "op afstand, online"]

      - id: ord-lasa-plugga
        title: Läsa, studera of plugga?
        instruction: Kies het woord dat past.
        topic: woordenschat
        shuffle: true
        items:
          - { id: sasd, type: gap, text: "Jag är student och ___ juridik på universitetet.", gaps: [{ answers: ["läser"], options: ["läser", "lär", "undervisar i"], feedback: [{ match: "lär", tip: "lära = onderwijzen (iemand iets leren). Een studie volgen: läsa of studera." }] }] }
          - { id: rfu5, type: gap, text: "I kväll måste jag ___ inför tentan.", gaps: [{ answers: ["plugga"], options: ["plugga", "lära", "undervisa"] }] }
          - { id: jue6, type: gap, text: "Hon ___ sig att köra bil förra sommaren.", gaps: [{ answers: ["lärde"], options: ["lärde", "läste", "pluggade"], tip: "lära sig = (zelf) leren." }] }
          - { id: 3m9c, type: gap, text: "Han är lärare och ___ matematik på en gymnasieskola.", gaps: [{ answers: ["undervisar i"], options: ["undervisar i", "läser", "pluggar"], feedback: [{ match: "läser", tip: "Hier is hij de docent: undervisa i (lesgeven in)." }] }] }
          - { id: sfsy, type: gap, text: "Jag gick på en ___ om svensk historia i går.", gaps: [{ answers: ["föreläsning"], options: ["föreläsning", "uppsats", "examen"] }] }

  - id: bli-passiv
    title: "Grammatik: de lijdende vorm met bli"
    exercises:
      - id: vara-of-bli
        title: Toestand of gebeurtenis?
        instruction: Kies **är/var** (toestand) of **blev** (iets gebeurde).
        topic: passiv-bli
        items:
          - id: rbkp
            type: sort
            categories: ["toestand (vara)", "gebeurtenis (bli)"]
            items:
              - { text: "Biblioteket **är** stängt på söndagar.", cat: 0 }
              - { text: "Vägen **blev** avstängd efter olyckan.", cat: 1 }
              - { text: "Alla platser **är** bokade.", cat: 0 }
              - { text: "Hon **blev** överraskad av resultatet.", cat: 1, tip: "Er gebeurde iets met haar: ze werd verrast." }
              - { text: "Fönstret **var** öppet hela natten.", cat: 0 }
              - { text: "Han **blev** påkörd av en bil.", cat: 1 }

      - id: bli-invullen
        title: Bli + deelwoord
        instruction: Vul het voltooid deelwoord in de goede vorm in.
        topic: passiv-bli
        shuffle: true
        items:
          - { id: a8zu, type: gap, text: "Hon blev ___ (anta) till programmet.", gaps: [{ answers: ["antagen"], feedback: [{ match: ["antagit", "antaget"], tip: "Het onderwerp is hon (en-vorm): antagen." }, { match: "antad", tip: "anta is sterk: antagen." }] }] }
          - { id: 85t3, type: gap, text: "Provet blev ___ (ställa in).", hint: "ställa in = afgelasten; als deelwoord: inställd.", gaps: [{ answers: ["inställt"], feedback: [{ match: "inställd", tip: "Provet is een ett-woord: inställt." }] }] }
          - { id: f3sq, type: gap, text: "Alla studenter blev ___ (bjuda) på fika.", gaps: [{ answers: ["bjudna"], feedback: [{ match: ["bjuden", "bjudet"], tip: "Alla studenter is meervoud: bjudna." }] }] }
          - { id: xgyn, type: gap, text: "Uppsatsen blev ___ (godkänna).", gaps: [{ answers: ["godkänd"], feedback: [{ match: "godkänt", tip: "uppsats is een en-woord: godkänd." }] }] }
          - { id: r4wb, type: gap, text: "Brevet blev ___ (skriva) på engelska.", gaps: [{ answers: ["skrivet"], feedback: [{ match: "skriven", tip: "brev is een ett-woord: skrivet." }] }] }
          - { id: unwk, type: gap, text: "Böckerna blev ___ (sälja) på en vecka.", gaps: [{ answers: ["sålda"], feedback: [{ match: ["sålde", "säljda"], tip: "sälja → såld. Meervoud: sålda." }] }] }
          - { id: q2gr, type: gap, text: "Min cykel blev ___ (stjäla) i natt.", gaps: [{ answers: ["stulen"], feedback: [{ match: ["stjälad", "stjäld", "stulet"], tip: "stjäla is sterk: stulen (en), stulet (ett), stulna (meervoud)." }] }] }
          - { id: fgd8, type: gap, text: "Huset blev ___ (måla) i fjol.", gaps: [{ answers: ["målat"], feedback: [{ match: ["målad", "målade"], tip: "hus is een ett-woord: målat." }] }] }

      - id: s-naar-bli
        title: Van -s naar bli
        instruction: Schrijf de zin met **bli** + deelwoord.
        topic: passiv-bli
        items:
          - { id: 78bk, type: transform, prompt: "Hon antogs till utbildningen.", answers: ["Hon blev antagen till utbildningen."] }
          - { id: g8va, type: transform, prompt: "Kursen ställdes in.", answers: ["Kursen blev inställd."], feedback: [{ match: "Kursen blev inställt.", tip: "kurs is een en-woord: inställd." }] }
          - { id: wa2m, type: transform, prompt: "Breven skickades i går.", answers: ["Breven blev skickade {i går|igår}."], feedback: [{ contains: "blev skickad", tip: "breven is meervoud: skickade." }] }
          - { id: w3w7, type: transform, prompt: "Huset såldes förra året.", answers: ["Huset blev sålt förra året."], feedback: [{ contains: "blev såld", tip: "hus is een ett-woord: sålt." }] }
          - { id: tg7y, type: transform, prompt: "Jag bjöds på middag.", answers: ["Jag blev bjuden på middag."] }
          - { id: 9mah, type: transform, prompt: "Tentorna rättades snabbt.", answers: ["Tentorna blev rättade snabbt.", "Tentorna blev snabbt rättade."] }
          - { id: 86bd, type: transform, prompt: "Mötet flyttades till fredag.", answers: ["Mötet blev flyttat till fredag."], feedback: [{ contains: "blev flyttad ", tip: "möte is een ett-woord: flyttat." }] }
          - { id: mjtb, type: transform, prompt: "Studenterna informerades om ändringen.", answers: ["Studenterna blev informerade om ändringen."], feedback: [{ contains: "blev informerad ", tip: "studenterna is meervoud: informerade." }] }

      - id: bli-vertalen
        title: Vertaal met bli
        instruction: Vertaal naar het Zweeds. Gebruik **bli** + voltooid deelwoord, tenzij er iets anders staat.
        topic: passiv-bli
        shuffle: true
        items:
          - { id: bp7k, type: translate, prompt: "Joost werd vorig jaar toegelaten tot de lerarenopleiding aan de universiteit in Umeå.", answers: ["Joost blev antagen till {lärarprogrammet|lärarutbildningen} {på universitetet i Umeå|vid universitetet i Umeå|på Umeå universitet|vid Umeå universitet} {förra året|i fjol}.", "{Förra året|I fjol} blev Joost antagen till {lärarprogrammet|lärarutbildningen} {på universitetet i Umeå|vid universitetet i Umeå|på Umeå universitet|vid Umeå universitet}."], feedback: [{ contains: ["blev antaget", "blev antagit", "blev antad", "blev antagna"], tip: "anta is sterk en het onderwerp is één persoon (en-vorm): antagen." }, { contains: ["året joost blev", "fjol joost blev"], tip: "Na Förra året vooraan komt eerst het werkwoord: Förra året blev Joost …" }] }
          - { id: sybq, type: translate, prompt: "De cursus Engels werd afgelast omdat er te weinig studenten waren.", answers: ["{Kursen i engelska|Engelskakursen} blev inställd {eftersom|för att|då} det {var|fanns} för få {studenter|deltagare}."], feedback: [{ contains: "blev inställt", tip: "kurs is een en-woord: inställd." }, { contains: "blev inställda", tip: "Eén cursus, onbepaald na blev: inställd." }, { contains: "för lite studenter", tip: "Te weinig (te tellen) = för få." }] }
          - { id: fs2g, type: translate, prompt: "Mijn scriptie werd goedgekeurd, maar twee van mijn tentamens werden afgekeurd.", answers: ["{Min uppsats blev godkänd|Mitt examensarbete blev godkänt}, men två av mina {tentor|tentamina} blev underkända."], feedback: [{ contains: "uppsats blev godkänt", tip: "uppsats is een en-woord: godkänd." }, { contains: ["tentor blev underkänd", "tentor blev underkänt"], tip: "Twee tentamens: meervoud, underkända." }] }
          - { id: ycnx, type: translate, prompt: "Mijn fiets werd gestolen terwijl ik in de bibliotheek aan het studeren was.", answers: ["Min cykel blev stulen {medan|när} jag {pluggade|studerade|satt och pluggade|satt och studerade|läste} {på|i} biblioteket."], feedback: [{ contains: ["blev stjälad", "blev stjäld", "blev stulet", "blev stulna"], tip: "stjäla is sterk: stulen (en-woord), stulet (ett-woord), stulna (meervoud). cykel is een en-woord." }, { contains: "medan pluggade jag", tip: "In een bijzin komt het onderwerp direct na medan: medan jag pluggade." }] }
          - { id: 4g88, type: translate, prompt: "Alle nieuwe studenten werden na het eerste college op koffie getrakteerd.", answers: ["Alla nya studenter blev bjudna på {fika|kaffe} efter {den första|första} föreläsningen.", "Efter {den första|första} föreläsningen blev alla nya studenter bjudna på {fika|kaffe}."], feedback: [{ contains: ["blev bjuden", "blev bjudet", "blev bjudda"], tip: "bjuda is sterk en studenter is meervoud: bjudna." }] }
          - { id: tgpv, type: translate, prompt: "De stageplaatsen worden door de universiteit verdeeld, en Joost werd op een school in Umeå geplaatst.", answers: ["Praktikplatserna {fördelas|blir fördelade} av universitetet, och Joost {blev placerad|placerades} på en {skola|högstadieskola} i Umeå."], feedback: [{ contains: ["blev placerat", "blev placerade"], tip: "Joost is één persoon (en-vorm): placerad." }, { contains: "fördelar", tip: "De stageplaatsen verdelen niet zelf: fördelas (een vaste regel, dus -s)." }] }
          - { id: djp7, type: translate, prompt: "Het tentamen van vrijdag werd naar volgende week verplaatst omdat de docent ziek was.", answers: ["{Tentan på fredag|Fredagens tenta} {blev flyttad|flyttades} till nästa vecka {eftersom|för att|då} läraren var sjuk."], feedback: [{ contains: ["blev flyttat", "blev flyttade"], tip: "tenta is een en-woord: flyttad." }, { contains: "läraren är sjuk", tip: "Het gebeurde in het verleden: läraren var sjuk." }] }
          - { id: d9ey, type: translate, prompt: "Het oude schoolgebouw werd vorig jaar verkocht en wordt nu een bibliotheek.", answers: ["{Den gamla skolbyggnaden|Den gamla skolan} {blev såld|såldes} {förra året|i fjol} och {blir nu|ska nu bli} ett bibliotek.", "Det gamla skolhuset {blev sålt|såldes} {förra året|i fjol} och {blir nu|ska nu bli} ett bibliotek."], feedback: [{ contains: ["skolbyggnaden blev sålt", "skolhuset blev såld"], tip: "byggnad is een en-woord (såld), hus een ett-woord (sålt)." }, { contains: ["blev säljd", "blev säljt", "blev sålde"], tip: "sälja is onregelmatig: såld, sålt, sålda." }] }
          - { id: 7ddr, type: translate, prompt: "Toen ik de brief opende, zag ik dat mijn aanvraag was goedgekeurd.", answers: ["När jag öppnade brevet såg jag att min {ansökan|anmälan} {hade blivit godkänd|blev godkänd|var godkänd|hade godkänts}."], feedback: [{ contains: ["blivit godkänt", "blev godkänt", "var godkänt"], tip: "ansökan is een en-woord: godkänd." }, { contains: "brevet jag såg", tip: "Na een bijzin vooraan (När …) komt eerst het werkwoord: såg jag." }] }

  - id: particip
    title: "Grammatik: deelwoorden"
    exercises:
      - id: particip-tabel
        title: Drie vormen
        instruction: Vul het voltooid deelwoord in voor een en-woord, een ett-woord en het meervoud.
        topic: particip
        items:
          - id: xa32
            type: table
            columns: ["infinitief", "en-woord", "ett-woord", "meervoud"]
            rows:
              - ["måla", "målad", { answers: ["målat"] }, { answers: ["målade"] }]
              - ["stänga", { answers: ["stängd"] }, { answers: ["stängt"] }, { answers: ["stängda"] }]
              - ["köpa", { answers: ["köpt"] }, "köpt", { answers: ["köpta"] }]
              - ["skriva", { answers: ["skriven"] }, { answers: ["skrivet"] }, { answers: ["skrivna"] }]
              - ["sälja", { answers: ["såld"] }, { answers: ["sålt"] }, { answers: ["sålda"] }]

      - id: particip-bijvoeglijk
        title: Deelwoord voor een zelfstandig naamwoord
        instruction: Vul het deelwoord in de goede vorm in.
        topic: particip
        shuffle: true
        items:
          - { id: 3hvr, type: gap, text: "Jag hittade en ___ (glömma bort) väska på bussen.", hint: "Bij een deelwoord komt het partikel ervoor: glömma bort → bortglömd.", gaps: [{ answers: ["bortglömd", "kvarglömd"], feedback: [{ match: ["bortglömt", "bortglömda"], tip: "väska is een en-woord, onbepaald: bortglömd." }, { match: "glömd", tip: "Voor een vergeten voorwerp zeg je bortglömd (of kvarglömd)." }] }] }
          - { id: 56dz, type: gap, text: "Vi bor i ett nyligen ___ (renovera) hus.", gaps: [{ answers: ["renoverat"], feedback: [{ match: "renoverad", tip: "hus is een ett-woord: renoverat." }] }] }
          - { id: f6m9, type: gap, text: "De ___ (stjäla) cyklarna hittades i skogen.", gaps: [{ answers: ["stulna"], feedback: [{ match: ["stulen", "stulet"], tip: "Na de en voor een meervoud: stulna." }] }] }
          - { id: b4fb, type: gap, text: "Den ___ (skriva) uppsatsen ska lämnas in på fredag.", gaps: [{ answers: ["skrivna"], feedback: [{ match: "skriven", tip: "Na den (bepaald) krijgt het deelwoord dezelfde vorm als het meervoud: skrivna." }] }] }
          - { id: wsjf, type: gap, text: "Det ___ (ställa in) mötet ersätts av ett mejl.", gaps: [{ answers: ["inställda"], feedback: [{ match: "inställt", tip: "Na det (bepaald): de -a-vorm, inställda." }] }] }
