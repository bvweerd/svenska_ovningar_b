          - { id: mf5d, type: truefalse, statement: "Uppgifterna lämnas in på nätet.", answer: true }
          - { id: ejmz, type: truefalse, statement: "Man kan ringa Karin på fredagar.", answer: false, correction: { answers: ["{Man|Du} kan ringa {henne|Karin} [från ]måndag till torsdag[ mellan nio och elva]."] } }

