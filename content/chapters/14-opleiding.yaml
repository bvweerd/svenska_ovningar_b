        instruction: Luister naar het voicemailbericht. Is de bewering **rätt** of **fel**?
        topic: passiv-bli
        listen: true
        textTitle: Ett meddelande från Komvux
        text: |
          Hej, det här är Karin från studievägledningen på Komvux. Jag ringer angående din anmälan till kursen i engelska. Tyvärr blev kursen full, men du har fått en plats på reservlistan.

          Det finns också en distanskurs som startar den tredje februari. Den kursen är på halvfart, och de flesta uppgifterna lämnas in på nätet. Om du är intresserad kan du ringa mig på telefontiden, måndag till torsdag mellan nio och elva. Hej då!
        items:
