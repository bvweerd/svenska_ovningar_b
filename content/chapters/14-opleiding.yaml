          - id: jceh
            type: free
            prompt: "Je wilt je aanmelden voor een cursus Zweeds op afstand. Schrijf een korte mail (60–100 woorden): stel jezelf voor, zeg welke cursus je wilt volgen en waarom, en stel twee vragen (bijvoorbeeld over de start en de kosten)."
            minWords: 55
            require:
              - { any: ["hej"], label: "Je begint met een aanhef" }
              - { any: ["anmäla", "anmälan", "läsa", "söka"], label: "Je zegt welke cursus je wilt volgen" }
              - { any: ["distans"], label: "Je noemt dat je op afstand wilt studeren" }
              - { any: ["när", "hur", "vad", "kostar", "finns"], label: "Je stelt een vraag" }
              - { any: ["hälsningar"], label: "Je sluit af met (Med) vänliga hälsningar" }
            model: "Hej! Jag heter Eva Jansen och jag kommer från Nederländerna. Jag har bott i Sverige i två år och jag har läst SFI. Nu skulle jag vilja anmäla mig till kursen Svenska som andraspråk 2 på distans, eftersom jag jobbar heltid på dagarna. Jag har två frågor: När startar nästa kurs, och måste man köpa kurslitteraturen själv? Tack på förhand! Med vänliga hälsningar, Eva Jansen"

