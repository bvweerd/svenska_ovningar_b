          - { id: uwvq, type: gap, prompt: "Kies het woord dat past.", text: "Jag vill läsa på distans, ___ jag jobbar heltid på dagarna.", gaps: [{ answers: ["eftersom"], options: ["eftersom", "därför", "men"], tip: "Je geeft de reden: eftersom (omdat). Därför (daarom) begint een nieuwe hoofdzin." }] }
          - { id: dagt, type: gap, topic: particip, prompt: "Vul de goede vorm in.", text: "Är kurslitteraturen ___ (inkludera) i priset?", gaps: [{ answers: ["inkluderad"], feedback: [{ match: ["inkluderat", "inkluderade"], tip: "kurslitteraturen is een en-woord, enkelvoud: inkluderad." }] }] }
