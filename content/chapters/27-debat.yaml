chapter: 27
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan nadruk leggen met det är … som", topics: [utbrytning] }
  - { text: "Ik kan een betoog opbouwen met standpunt, argumenten en tegenargument", topics: [argumentation] }

grammar:
  - id: utbrytning
    title: "Nadruk: det är … som"
    summary: "Met ***det är/var X som*** leg je nadruk op X: *Det är **mobilerna** som är problemet.* *Det var **i Göteborg** (som) vi träffades.* In het *som*-deel: bijzinvolgorde (*som **inte** vill*)."
    body: |
      Wil je één zinsdeel benadrukken, dan zet je het tussen **det är / det var** en **som**. In het Nederlands: *het is … die/dat*.

      | gewone zin | met nadruk |
      |---|---|
      | *Min bror ringde.* | *Det var **min bror** som ringde.* |
      | *Mobilerna är problemet.* | *Det är **mobilerna** som är problemet.* |
      | *Vi träffades i Göteborg.* | *Det var **i Göteborg** (som) vi träffades.* |
      | *Jag vill ha kaffe.* | *Det är **kaffe** (som) jag vill ha.* |

      - **det är** voor nu; bij een afgerond voorval meestal **det var**. *Det är* + verleden tijd komt ook voor: *Det är min bror som ringde.*
      - *som* mag weg als het benadrukte deel **niet** het onderwerp is (net als in hoofdstuk 13).
      - Het *som*-deel is een bijzin: ***inte** vóór het werkwoord*: *Det är eleverna som **inte vill** ha ett förbud.*

      ### In vragen
      In vragen is deze constructie heel gewoon:

      - *Vem **är det som** ringer?* – Wie belt er?
      - *Vad **var det som** hände?* – Wat is er gebeurd?
      - *Är det **du som** har skrivit det här?* – Heb jij dit geschreven?

      En voor contrast: *Det är inte eleverna som är problemet, **utan** mobilerna.*

  - id: argumentation
    title: Een betoog opbouwen
    summary: "**Tes** (standpunt) → **argument** (*för det första, för det andra*) → **motargument** (*Kritiker menar att …*) → **bemötande** (*Visserligen …, men …*) → **slutsats** (*Därför anser jag att …*)."
    body: |
      Een Zweedse *debattartikel* of *insändare* heeft meestal deze opbouw:

      | deel | functie | zinnen |
      |---|---|---|
      | **tes** | je standpunt, meteen aan het begin | *Jag anser att …* · *X borde …* |
      | **argument** | redenen voor je standpunt | *För det första …* · *För det andra …* · *Dessutom …* · *Slutligen …* |
      | **motargument** | wat de andere kant zegt | *Kritiker menar att …* · *Vissa hävdar att …* · *Man kan invända att …* |
      | **bemötande** | waarom dat niet klopt | *Visserligen …, men …* · *Det argumentet håller inte, eftersom …* · *Det stämmer att …, men …* |
      | **slutsats** | herhaal je standpunt | *Därför anser jag att …* · *Sammanfattningsvis …* · *Kort sagt …* |

      In een gesprek:
      - *Får jag avbryta?* – Mag ik even onderbreken?
      - *Låt mig tala till punkt.* – Laat me even uitpraten.
      - *Det är en bra poäng, men …*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-mobil
        title: "Lezen: een opiniestuk"
        instruction: Lees het opiniestuk en beantwoord de vragen.
        topic: argumentation
        textTitle: Mobilen hör inte hemma i klassrummet
        text: |
          *Karin Sjöberg, lärare på en högstadieskola*

          Det är inte eleverna som är problemet, det är mobilerna. Efter tjugo år som lärare har jag sett hur koncentrationen i klassrummet har försämrats. För det första är det omöjligt att konkurrera med sociala medier. Varje gång en mobil plingar tappar hela klassen fokus. För det andra påverkas rasterna: i stället för att prata och leka sitter eleverna tysta med var sin skärm.

          För det tredje handlar det om elevernas hälsa. Många av mina elever berättar att de ligger vakna med mobilen långt efter midnatt och att de är trötta redan på första lektionen. Forskningen pekar åt samma håll: den som sover för lite har svårare att lära sig nytt. Det är alltså inte lärarna som har hittat på problemet, utan eleverna själva som beskriver det. Skolan kan inte bestämma vad som händer hemma på kvällarna, men den kan se till att skoldagen blir en paus från skärmen.

          Kritiker menar att mobilen är ett viktigt verktyg för lärande och att ett förbud är omodernt. Visserligen kan mobilen användas i undervisningen, men skolan har redan datorer för det. Andra hävdar att föräldrar måste kunna nå sina barn. Det argumentet håller inte: skolan har en telefon, och i en nödsituation når man barnen den vägen.

          Man kan också invända att eleverna måste lära sig att själva ta ansvar för sin mobilanvändning. Det stämmer att självdisciplin är viktigt, men det är orimligt att kräva att fjortonåringar ska stå emot appar som är byggda för att fånga deras uppmärksamhet. De flesta vuxna klarar ju inte ens det själva.

          Förra hösten testade vi ett förbud i två av skolans åttondeklasser. Eleverna lämnade in sina mobiler till mentorn varje morgon och fick tillbaka dem efter sista lektionen. Resultatet överraskade många av oss. Efter bara några veckor var det lugnare på lektionerna, och fler elever deltog i diskussionerna. Det var eleverna själva som märkte skillnaden först: flera av dem berättade att de kände sig mindre stressade. Även vi lärare märkte skillnaden, eftersom lektionerna inte längre avbröts av mobiler som plingade. En del föräldrar var skeptiska i början, men i dag är det föräldrarna som frågar varför hela skolan inte har infört samma regler.

          Därför anser jag att mobilerna ska samlas in när skoldagen börjar och lämnas tillbaka när den slutar. Det är inte ett straff, utan en möjlighet för eleverna att vara närvarande. Kort sagt: det är dags att resten av skolan följer efter.
        items:
          - { id: ywcb, type: mc, prompt: "Vad är Karins tes?", options: ["Mobilerna ska samlas in under skoldagen.", "Eleverna är problemet.", "Skolan behöver fler datorer.", "Föräldrar ska kunna ringa sina barn."], answer: 0 }
          - { id: fv96, type: mc, prompt: "Vad är hennes första argument?", options: ["Det går inte att konkurrera med sociala medier.", "Mobiler är dyra.", "Eleverna fuskar på proven.", "Föräldrarna vill ha ett förbud."], answer: 0 }
          - { id: ksht, type: truefalse, statement: "Enligt Karin pratar eleverna mer med varandra på rasterna nu.", answer: false, correction: { answers: ["{Eleverna|De} sitter tysta med var sin skärm[ på rasterna]."] } }
          - { id: 39xc, type: mc, prompt: "Hur bemöter Karin argumentet att föräldrar måste nå sina barn?", options: ["Skolan har en telefon som föräldrarna kan ringa.", "Föräldrar behöver inte nå sina barn.", "Barnen kan använda datorerna.", "Hon håller med."], answer: 0 }
          - { id: b363, type: mc, prompt: "Wat betekent *Det argumentet håller inte*?", options: ["Dat argument klopt niet.", "Dat argument houdt nooit op.", "Dat argument houd ik.", "Dat argument is te lang."], answer: 0 }
          - { id: 6nq7, type: mc, prompt: "Wat betekent *med var sin skärm*?", options: ["ieder met een eigen scherm", "met hun scherm uit", "met één scherm samen", "zonder scherm"], answer: 0 }
          - { id: z68g, type: truefalse, statement: "Förra hösten testades förbudet i hela skolan.", answer: false, correction: { answers: ["{Förbudet|Det} testades [bara ]i två[ av skolans] åttondeklasser.", "{Förbudet|Det} testades inte i hela skolan[, bara i två {klasser|åttondeklasser}]."] } }
          - { id: aqgq, type: multi, prompt: "Vad hände under testet i åttondeklasserna? (Meerdere antwoorden zijn goed.)", options: ["Det blev lugnare på lektionerna.", "Fler elever deltog i diskussionerna.", "Flera elever kände sig mindre stressade.", "Eleverna fick bättre betyg.", "Alla föräldrar protesterade mot förbudet.", "Lärarna började använda mobilerna i undervisningen."], answers: [0, 1, 2] }
          - { id: 778r, type: mc, prompt: "Varför skriver Karin att de flesta vuxna inte ens klarar det själva?", options: ["För att visa att det är orimligt att kräva så mycket självdisciplin av fjortonåringar.", "För att hon vill att även vuxna ska lämna in sina mobiler.", "För att hon tycker att föräldrarna är dåliga förebilder.", "För att hon håller med om invändningen."], answer: 0, tip: "Het staat in het bemötande: ze zwakt de invändning af." }
          - { id: rkaj, type: mc, prompt: "Vilken funktion har stycket om testet i åttondeklasserna i Karins text?", options: ["Det ger belägg för hennes tes.", "Det är ett motargument.", "Det är hennes slutsats.", "Det visar att förbudet inte fungerade."], answer: 0, tip: "Ze laat met het resultaat zien dat haar standpunt klopt." }

      - id: makkelijk-1
        title: "Makkelijk lezen: Skoluniform"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Skoluniform"
        text: |
          Ska elever ha skoluniform? Det är en fråga som ofta diskuteras. De som är för menar att det minskar stressen kring kläder. Kritiker invänder att det är eleverna själva som ska få bestämma. Det är också en fråga om pengar: vem ska betala? Kort sagt finns det argument för och emot. I Sverige är det ovanligt, men i många andra länder är det självklart. Några svenska skolor har ändå provat. Resultaten är blandade: en del elever tycker om det, medan andra vill bestämma själva.
        items:
          - { id: z3gs, type: truefalse, statement: "Kritikerna vill att eleverna själva bestämmer.", answer: true }
          - { id: daek, type: truefalse, statement: "Alla är överens om skoluniformer.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Inga bilar i centrum"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Inga bilar i centrum"
        text: |
          I Lund diskuteras om bilar ska förbjudas i centrum. Det är framför allt de som har butiker där som är oroliga. De hävdar att det kommer färre kunder. Kommunen bemöter kritiken med att fler går och cyklar när det inte finns några bilar, och att det gynnar butikerna. Dessutom menar kommunen att luften blir renare och att det blir tystare. I andra städer som har infört ett sådant förbud har antalet besökare faktiskt ökat. De som har butiker tror ändå inte på det, och debatten fortsätter i tidningen. Politikerna ska bestämma i vår.
        items:
          - { id: cku7, type: truefalse, statement: "De som har butiker är oroliga.", answer: true }
          - { id: ftdd, type: truefalse, statement: "Kommunen håller med dem som har butiker.", answer: false }

      - id: makkelijk-3
        title: "Makkelijk lezen: Läxor eller inte?"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Läxor eller inte?"
        text: |
          På Elins skola diskuterar lärarna om eleverna ska få läxor. Å ena sidan menar några lärare att läxor hjälper eleverna att repetera. Å andra sidan har inte alla elever lugn och ro hemma. Det är just de eleverna som får svårast med läxorna. Rektorn föreslår därför läxhjälp i skolan efter lektionerna. Där kan alla elever göra sina läxor med hjälp av en lärare. För det första blir det mer rättvist, och för det andra får eleverna hjälp direkt. Förslaget ska prövas under ett år.
        items:
          - { id: m4ty, type: truefalse, statement: "Alla lärare är emot läxor.", answer: false }
          - { id: p8j8, type: mc, prompt: "Vad föreslår rektorn?", options: ["Inga läxor alls.", "Läxhjälp i skolan.", "Fler läxor."], answer: 1 }
          - { id: mjt5, type: truefalse, statement: "Förslaget ska prövas under ett år.", answer: true }

      - id: makkelijk-4
        title: "Makkelijk lezen: Sommartiden"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Sommartiden"
        text: |
          Varje vår ställs klockan fram en timme, och varje höst ställs den tillbaka. Många vill att det ska upphöra. Det är framför allt sömnen som påverkas, menar de. För det första sover många sämre i några dagar efter bytet. För det andra kan det bli fler olyckor i trafiken. Andra tycker att det är skönt med ljusa kvällar på sommaren. EU har diskuterat frågan i flera år, men ännu har inget slutligt beslut fattats. Det är alltså fortfarande oklart om klockan kommer att ställas om i framtiden.
        items:
          - { id: smjt, type: mc, prompt: "Vad menar de som vill sluta ställa om klockan?", options: ["Att sömnen påverkas.", "Att kvällarna blir för ljusa.", "Att det kostar för mycket."], answer: 0 }
          - { id: ft2y, type: truefalse, statement: "EU har bestämt att klockan inte ska ställas om längre.", answer: false }
          - { id: v4c6, type: truefalse, statement: "Klockan ställs fram på våren.", answer: true }

      - id: opbouw-sorteren
        title: De opbouw van het betoog
        instruction: Welk deel van het betoog is deze zin?
        topic: argumentation
        items:
          - id: mcxv
            type: sort
            categories: ["tes", "argument", "motargument", "bemötande"]
            items:
              - { text: "Mobilerna ska samlas in när skoldagen börjar.", cat: 0 }
              - { text: "För det första är det omöjligt att konkurrera med sociala medier.", cat: 1 }
              - { text: "Kritiker menar att ett förbud är omodernt.", cat: 2 }
              - { text: "Visserligen kan mobilen användas i undervisningen, men skolan har redan datorer.", cat: 3 }
              - { text: "För det andra påverkas rasterna.", cat: 1 }
              - { text: "Andra hävdar att föräldrar måste kunna nå sina barn.", cat: 2 }
              - { text: "Det argumentet håller inte: skolan har en telefon.", cat: 3 }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-debat
        title: Debatteren
        instruction: Koppel het woord aan de betekenis.
        topic: argumentation
        items:
          - id: zkk2
            type: match
            pairs:
              - ["hävda", "beweren"]
              - ["invända", "tegenwerpen"]
              - ["bemöta", "weerleggen, reageren op"]
              - ["ett förbud", "een verbod"]
              - ["en kritiker", "een criticus"]
              - ["ett verktyg", "een instrument, hulpmiddel"]
          - id: gr85
            type: match
            pairs:
              - ["för det första", "ten eerste"]
              - ["slutligen", "ten slotte"]
              - ["kort sagt", "kortom"]
              - ["med andra ord", "met andere woorden"]
              - ["tala till punkt", "uitpraten"]
              - ["avbryta", "onderbreken"]

  - id: utbrytning
    title: "Grammatik: det är … som"
    exercises:
      - id: utbrytning-omvormen
        title: Leg de nadruk
        instruction: Leg nadruk op het **vetgedrukte** deel met *det är/var … som*.
        topic: utbrytning
        items:
          - { id: 24ek, type: transform, prompt: "**Min bror** ringde i går.", answers: ["Det {var|är} min bror som ringde {i går|igår}."] }
          - { id: 4mbg, type: transform, prompt: "**Mobilerna** är problemet.", answers: ["Det är mobilerna som är problemet."] }
          - { id: 3bd8, type: transform, prompt: "Vi träffades **i Göteborg**.", answers: ["Det var i Göteborg [som ]vi träffades."], feedback: [{ contains: "som träffades vi", tip: "Na som: bijzinvolgorde, som vi träffades." }] }
          - { id: uvpj, type: transform, prompt: "Jag vill ha **kaffe**.", answers: ["Det är kaffe [som ]jag vill ha."] }
          - { id: 58be, type: transform, prompt: "**Eleverna** vill inte ha ett förbud.", answers: ["Det är eleverna som inte vill ha [ett ]förbud."], feedback: [{ contains: "som vill inte", tip: "Het som-deel is een bijzin: som inte vill." }] }
          - { id: mmwb, type: transform, prompt: "**Regeringen** fattar beslutet.", answers: ["Det är regeringen som fattar beslutet."] }
          - { id: tvq7, type: transform, prompt: "Jag glömde **nyckeln**.", answers: ["Det var nyckeln [som ]jag glömde."], feedback: [{ contains: "som glömde jag", tip: "Na som: bijzinvolgorde, som jag glömde." }] }
          - { id: hwkf, type: transform, prompt: "**Fleur** har bakat tårtan.", answers: ["Det är Fleur som har bakat tårtan.", "Det var Fleur som {har bakat|bakade} tårtan."] }

      - id: utbrytning-vragen
        title: Vragen met nadruk
        instruction: Vertaal naar het Zweeds met *är/var det som*.
        topic: utbrytning
        items:
          - { id: w6nv, type: translate, prompt: "Wie belt er?", answers: ["Vem är det som ringer?"], feedback: [{ match: "Vem ringer?", tip: "Ook goed Zweeds, maar oefen hier: Vem är det som ringer?" }] }
          - { id: ffk6, type: translate, prompt: "Wat is er gebeurd?", answers: ["Vad var det som hände?", "Vad är det som har hänt?"], feedback: [{ match: ["Vad hände?", "Vad har hänt?"], tip: "Ook goed, maar oefen hier: Vad var det som hände?" }] }
          - { id: 6zf6, type: translate, prompt: "Heb jij dit geschreven?", answers: ["{Är|Var} det du som {har skrivit|skrev} det här?"], feedback: [{ match: "Har du skrivit det här?", tip: "Ook goed, maar oefen hier met nadruk: Är det du som har skrivit det här?" }] }
          - { id: 7j7v, type: translate, prompt: "Wie heeft dit gedaan?", answers: ["Vem {är|var} det som {har gjort|gjorde} {det här|detta}?"], feedback: [{ match: ["Vem har gjort det här?", "Vem gjorde det här?"], tip: "Ook goed Zweeds, maar oefen hier: Vem är det som har gjort det här?" }] }
          - { id: e3yy, type: translate, prompt: "Wat wil je eigenlijk?", answers: ["Vad är det [som ]du vill[ egentligen]?", "Vad är det egentligen [som ]du vill?"], feedback: [{ match: ["Vad vill du egentligen?", "Vad vill du?"], tip: "Ook goed Zweeds, maar oefen hier: Vad är det du vill?" }] }
          - { id: sxyu, type: translate, prompt: "Wie heeft er gewonnen?", answers: ["Vem {var det som vann|är det som har vunnit}?"], feedback: [{ match: ["Vem vann?", "Vem har vunnit?"], tip: "Ook goed Zweeds, maar oefen hier: Vem var det som vann?" }] }
          - { id: gm6n, type: translate, prompt: "Was het je broer die belde?", answers: ["Var det din bror som ringde?"], feedback: [{ contains: "som ringde din bror", tip: "Eerst de nadruk (det din bror), daarna som + de rest." }] }
          - { id: nv4g, type: translate, prompt: "Wanneer begint de les eigenlijk?", answers: ["När är det [som ]lektionen börjar[ egentligen]?", "När är det egentligen [som ]lektionen börjar?"], feedback: [{ match: ["När börjar lektionen egentligen?", "När börjar lektionen?"], tip: "Ook goed Zweeds, maar oefen hier: När är det som lektionen börjar?" }] }

      - id: utbrytning-lange-zinnen
        title: Nadruk in een lange zin
        instruction: Leg nadruk op het **vetgedrukte** deel met *det är/var … som*. De rest van de zin blijft hetzelfde.
        topic: utbrytning
        items:
          - { id: 635z, type: transform, prompt: "Rektorn bestämde **efter en lång diskussion med elevrådet** att förbudet skulle testas.", answers: ["Det var efter en lång diskussion med elevrådet [som ]rektorn bestämde att förbudet skulle testas."], feedback: [{ contains: "som bestämde rektorn", tip: "Na som: bijzinvolgorde, eerst het onderwerp: som rektorn bestämde." }, { contains: "elevrådet bestämde rektorn", tip: "Na het benadrukte deel volgt (som +) bijzinvolgorde: … elevrådet (som) rektorn bestämde." }] }
          - { id: 9trz, type: transform, prompt: "**Eleverna själva** märkte först att det blev lugnare på lektionerna.", answers: ["Det {var|är} eleverna själva som först märkte att det blev lugnare på lektionerna.", "Det {var|är} eleverna själva som märkte först att det blev lugnare på lektionerna."] }
          - { id: r4fj, type: transform, prompt: "**Många elever** vill inte lämna ifrån sig mobilen under skoldagen.", answers: ["Det är många elever som inte vill lämna ifrån sig mobilen under skoldagen."], feedback: [{ contains: "som vill inte", tip: "Het som-deel is een bijzin: inte vóór het werkwoord (som inte vill)." }] }

      - id: utbrytning-vertalen
        title: Vertalen met nadruk
        instruction: Vertaal naar het Zweeds. Gebruik *det är/var … som* voor het deel met nadruk.
        topic: utbrytning
        items:
          - { id: vhsw, type: translate, prompt: "Het zijn niet de leraren, maar de leerlingen zelf die het meest last hebben van de mobieltjes in de klas.", answers: ["Det är inte lärarna[,] utan eleverna själva[,] som {störs|besväras|påverkas} mest av {mobilerna|mobiltelefonerna|telefonerna} {i klassrummet|i klassen}.", "Det är eleverna själva, inte lärarna, som {störs|besväras|påverkas} mest av {mobilerna|mobiltelefonerna|telefonerna} {i klassrummet|i klassen}.", "Det är inte lärarna som {störs|besväras|påverkas} mest av {mobilerna|mobiltelefonerna|telefonerna} {i klassrummet|i klassen}, utan eleverna själva."], feedback: [{ contains: "inte lärarna men", tip: "Na een ontkenning (niet X, maar Y) gebruik je utan, niet men." }] }
          - { id: 4h4b, type: translate, prompt: "Pas na de test begrepen de ouders hoe groot het probleem eigenlijk was. (Begin met: Het was pas na de test dat …)", answers: ["Det var först efter {testet|försöket} [som ]föräldrarna {förstod|insåg|begrep} hur stort problemet egentligen var.", "Det var inte förrän efter {testet|försöket} [som ]föräldrarna {förstod|insåg|begrep} hur stort problemet egentligen var."], feedback: [{ contains: "som förstod föräldrarna", tip: "Na som: bijzinvolgorde, eerst het onderwerp (som föräldrarna förstod)." }, { contains: "hur stort var problemet", tip: "Een indirecte vraag is een bijzin: hur stort problemet egentligen var." }, { contains: "hur stort problemet var egentligen", tip: "In de bijzin staat egentligen vóór het werkwoord: hur stort problemet egentligen var." }] }
          - { id: h59y, type: translate, prompt: "Wie is het eigenlijk die beslist welke regels er op school gelden?", answers: ["Vem är det egentligen som {bestämmer|beslutar} vilka regler som gäller {i|på} skolan?", "Vem är det som egentligen {bestämmer|beslutar} vilka regler som gäller {i|på} skolan?"], feedback: [{ contains: "vilka regler gäller", tip: "vilka regler is hier het onderwerp van de bijzin: dan heb je som nodig (vilka regler som gäller)." }] }
