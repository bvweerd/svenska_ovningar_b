            steps:
              - { type: order, prompt: "**Argument 1.** Begin met *För det första*. Let op de woordvolgorde.", start: "För det första", tokens: ["får", "eleverna", "en", "tydligare", "bild", "av", "hur", "arbetslivet", "ser", "ut"], answers: ["För det första får eleverna en tydligare bild av hur arbetslivet ser ut."], feedback: [{ contains: "för det första eleverna får", tip: "För det första is een zinsdeel: daarna komt meteen het werkwoord (För det första får eleverna …)." }, { contains: "hur ser arbetslivet ut", tip: "Na hur volgt hier een bijzin, zonder inversie: hur arbetslivet ser ut." }] }
              - { type: gap, prompt: "**Argument 2.** Kies het signaalwoord.", text: "___ blir det lättare för eleverna att välja rätt utbildning efter gymnasiet.", gaps: [{ answers: ["För det andra"], options: ["För det andra", "Visserligen", "Kort sagt"], tip: "Je tweede argument kondig je aan met för det andra. Visserligen hoort bij het bemötande, kort sagt bij de slutsats." }] }
              - { type: gap, topic: sambandsord, prompt: "**Argument 3.** Kies het signaalwoord.", text: "___ vill många arbetsgivare gärna anställa unga som redan har lite erfarenhet.", gaps: [{ answers: ["Dessutom"], options: ["Dessutom", "Kort sagt", "Visserligen"], tip: "Nog een argument erbij: dessutom (bovendien)." }] }
          - id: 42tv
            type: steps
            topic: argumentation
            steps:
              - { type: mc, prompt: "**Motargument.** Welke zin geeft weer wat de andere kant vindt?", options: ["Kritiker menar att det är svårt att hitta praktikplatser åt alla elever.", "För det andra blir det lättare att välja rätt utbildning.", "Därför anser jag att alla elever borde göra praktik."], answer: 0, tip: "Een motargument is wat anderen vinden: Kritiker menar att … of Vissa hävdar att …" }
              - { type: order, prompt: "**Bemötande.** Geef eerst toe, zet er dan iets tegenover.", start: "Visserligen kräver det mycket planering,", tokens: ["men", "många", "företag", "vill", "gärna", "ta", "emot", "praktikanter"], answers: ["Visserligen kräver det mycket planering, men många företag vill gärna ta emot praktikanter."] }
              - { type: gap, prompt: "**Bemötande.** Kies het woord dat past.", text: "Det argumentet håller inte, ___ kommunen redan i dag har kontakt med många arbetsgivare.", gaps: [{ answers: ["eftersom"], options: ["eftersom", "därför", "men"], tip: "Je geeft de reden waarom het argument niet klopt: eftersom. Na därför zou het werkwoord direct volgen (därför har kommunen)." }] }
          - id: aqng
            type: steps
            topic: argumentation
            steps:
              - { type: gap, prompt: "**Slutsats.** Je vat kort samen. Kies het signaalwoord.", text: "___ ger praktik eleverna erfarenheter som ingen lärobok kan ge dem.", gaps: [{ answers: ["Kort sagt"], options: ["Kort sagt", "Kritiker menar att", "För det andra"], tip: "Kort sagt (kortom) vat samen. Na Kritiker menar att zou geen inversie volgen, en för det andra is een nieuw argument." }] }
              - { type: translate, prompt: "**Slutsats.** Vertaal: Daarom vind ik dat alle gymnasiasten (gymnasieelever) stage moeten lopen (göra praktik).", answers: ["Därför {anser|tycker|menar} jag att alla gymnasieelever {borde|bör|ska|måste} göra praktik.", "Jag {anser|tycker|menar} därför att alla gymnasieelever {borde|bör|ska|måste} göra praktik."], feedback: [{ contains: "därför jag", tip: "Na därför vooraan komt eerst het werkwoord: Därför anser jag …" }] }

      - id: skriva-debattartikel
        title: Schrijf een opiniestuk
        instruction: "Bouw eerst je debattartikel op in vijf stappen die de app nakijkt. Daarna schrijf je het hele betoog, als je wilt."
        topic: argumentation
        items:
          - { id: m69g, type: mc, prompt: "Kies de beste tes (je standpunt).", options: ["Jag anser att kollektivtrafiken i våra städer borde vara gratis.", "Kollektivtrafik är bussar, tåg och spårvagnar.", "Jag åker ibland buss till jobbet."], answer: 0, tip: "Een tes is een standpunt waarover je van mening kunt verschillen, geen feit of ervaring." }
          - { id: dncy, type: gap, topic: utbrytning, prompt: "Kies het woord dat past.", text: "Det är bilarna ___ står för en stor del av utsläppen i staden.", gaps: [{ answers: ["som"], options: ["som", "att", "vilka"], tip: "Nadruk met det är … som." }] }
          - { id: yytk, type: order, prompt: "Weerleg het motargument: geef toe, en zet er dan iets tegenover.", start: "Visserligen kostar det pengar,", tokens: ["men", "samhället", "sparar", "pengar", "på", "färre", "olyckor"], answers: ["Visserligen kostar det pengar, men samhället sparar pengar på färre olyckor."] }
          - { id: fkvy, type: transform, topic: utbrytning, task: "Leg de nadruk op kostnaden met det är … som.", prompt: "Kostnaden är inte det stora problemet.", answers: ["Det är inte kostnaden som är det stora problemet."], feedback: [{ contains: "det är kostnaden inte", tip: "inte staat direct na det är: Det är inte kostnaden som …" }] }
          - { id: 833q, type: gap, prompt: "Je sluit af. Kies het signaalwoord.", text: "___ anser jag att vi borde testa gratis kollektivtrafik.", gaps: [{ answers: ["Därför"], options: ["Därför", "Visserligen", "För det första"], tip: "Een conclusie trek je met därför (daarom) of sammanfattningsvis." }] }
          - id: n8x3
            type: free
            prompt: "Kies een stelling, bijvoorbeeld *Mobiler borde förbjudas i skolan*, *Kollektivtrafiken borde vara gratis* of *Alla borde lära sig svenska innan de får medborgarskap*. Schrijf een betoog van 150–200 woorden met tes, twee argumenten, een motargument met bemötande en een slutsats. Gebruik minstens één keer *det är … som*."
            minWords: 140
            require:
              - { any: ["anser", "tycker", "menar"], label: "Je geeft je standpunt (tes)" }
              - { any: ["för det första", "för det andra", "dessutom", "slutligen"], label: "Je ordent je argumenten" }
              - { any: ["kritiker", "vissa", "andra hävdar", "invända", "motståndare"], label: "Je noemt een motargument" }
              - { any: ["visserligen", "håller inte", "stämmer att"], label: "Je weerlegt het motargument" }
              - { any: ["därför", "sammanfattningsvis", "kort sagt"], label: "Je sluit af met een conclusie" }
              - { any: ["det är", "det var"], label: "Je gebruikt det är … som" }
            model: "Jag anser att kollektivtrafiken i våra städer borde vara gratis. För det första är det bilarna som står för en stor del av utsläppen i staden. Om bussar och spårvagnar vore gratis skulle fler lämna bilen hemma. För det andra skulle gratis kollektivtrafik göra det lättare för personer med låga inkomster att ta sig till jobb och skola. Kritiker menar att det skulle bli för dyrt för kommunerna. Visserligen kostar det pengar, men biljettintäkterna täcker redan i dag bara en del av kostnaderna. Dessutom sparar samhället pengar på färre olyckor och kortare köer. Andra hävdar att bussarna skulle bli överfulla. Det argumentet håller inte, eftersom man kan sätta in fler avgångar. Det är alltså inte kostnaden som är det stora problemet, utan bristen på politisk vilja. Därför anser jag att vi borde testa gratis kollektivtrafik i några städer under ett par år."

