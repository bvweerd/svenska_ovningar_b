chapter: 27
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan nadruk leggen met det är … som", topics: [utbrytning] }
  - { text: "Ik kan een betoog opbouwen met standpunt, argumenten en tegenargument", topics: [argumentation] }

grammar:
  - id: utbrytning
    title: "Nadruk: det är … som"
    summary: "Met ***det är/var X som*** leg je nadruk op X: *Det är **mobilerna** som är problemet.* *Det var **i Göteborg** (som) vi träffades.* In het *som*-deel: bijzinvolgorde (*som **inte** vill*)."
    body: |
      Wil je één zinsdeel benadrukken, dan zet je het tussen **det är / det var** en **som**. In het Nederlands: *het is … die/dat*.

      | gewone zin | met nadruk |
      |---|---|
      | *Min bror ringde.* | *Det var **min bror** som ringde.* |
      | *Mobilerna är problemet.* | *Det är **mobilerna** som är problemet.* |
      | *Vi träffades i Göteborg.* | *Det var **i Göteborg** (som) vi träffades.* |
      | *Jag vill ha kaffe.* | *Det är **kaffe** (som) jag vill ha.* |

      - **det är** voor nu; bij een afgerond voorval meestal **det var**. *Det är* + verleden tijd komt ook voor: *Det är min bror som ringde.*
      - *som* mag weg als het benadrukte deel **niet** het onderwerp is (net als in hoofdstuk 13).
      - Het *som*-deel is een bijzin: ***inte** vóór het werkwoord*: *Det är eleverna som **inte vill** ha ett förbud.*

      ### In vragen
      In vragen is deze constructie heel gewoon:

      - *Vem **är det som** ringer?* – Wie belt er?
      - *Vad **var det som** hände?* – Wat is er gebeurd?
      - *Är det **du som** har skrivit det här?* – Heb jij dit geschreven?

      En voor contrast: *Det är inte eleverna som är problemet, **utan** mobilerna.*

  - id: argumentation
    title: Een betoog opbouwen
    summary: "**Tes** (standpunt) → **argument** (*för det första, för det andra*) → **motargument** (*Kritiker menar att …*) → **bemötande** (*Visserligen …, men …*) → **slutsats** (*Därför anser jag att …*)."
    body: |
      Een Zweedse *debattartikel* of *insändare* heeft meestal deze opbouw:

      | deel | functie | zinnen |
      |---|---|---|
      | **tes** | je standpunt, meteen aan het begin | *Jag anser att …* · *X borde …* |
      | **argument** | redenen voor je standpunt | *För det första …* · *För det andra …* · *Dessutom …* · *Slutligen …* |
      | **motargument** | wat de andere kant zegt | *Kritiker menar att …* · *Vissa hävdar att …* · *Man kan invända att …* |
      | **bemötande** | waarom dat niet klopt | *Visserligen …, men …* · *Det argumentet håller inte, eftersom …* · *Det stämmer att …, men …* |
      | **slutsats** | herhaal je standpunt | *Därför anser jag att …* · *Sammanfattningsvis …* · *Kort sagt …* |

      In een gesprek:
      - *Får jag avbryta?* – Mag ik even onderbreken?
      - *Låt mig tala till punkt.* – Laat me even uitpraten.
      - *Det är en bra poäng, men …*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-mobil
        title: "Lezen: een opiniestuk"
        instruction: Lees het opiniestuk en beantwoord de vragen.
        topic: argumentation
        textTitle: Mobilen hör inte hemma i klassrummet
        text: |
          *Karin Sjöberg, lärare på en högstadieskola*

          Det är inte eleverna som är problemet, det är mobilerna. Efter tjugo år som lärare har jag sett hur koncentrationen i klassrummet har försämrats. För det första är det omöjligt att konkurrera med sociala medier. Varje gång en mobil plingar tappar hela klassen fokus. För det andra påverkas rasterna: i stället för att prata och leka sitter eleverna tysta med var sin skärm.

          Kritiker menar att mobilen är ett viktigt verktyg för lärande och att ett förbud är omodernt. Visserligen kan mobilen användas i undervisningen, men skolan har redan datorer för det. Andra hävdar att föräldrar måste kunna nå sina barn. Det argumentet håller inte: skolan har en telefon, och i en nödsituation når man barnen den vägen.

          Därför anser jag att mobilerna ska samlas in när skoldagen börjar och lämnas tillbaka när den slutar. Det är inte ett straff, utan en möjlighet för eleverna att vara närvarande.
        items:
          - { id: ywcb, type: mc, prompt: "Vad är Karins tes?", options: ["Mobilerna ska samlas in under skoldagen.", "Eleverna är problemet.", "Skolan behöver fler datorer.", "Föräldrar ska kunna ringa sina barn."], answer: 0 }
          - { id: fv96, type: mc, prompt: "Vad är hennes första argument?", options: ["Det går inte att konkurrera med sociala medier.", "Mobiler är dyra.", "Eleverna fuskar på proven.", "Föräldrarna vill ha ett förbud."], answer: 0 }
          - { id: ksht, type: truefalse, statement: "Enligt Karin pratar eleverna mer med varandra på rasterna nu.", answer: false, correction: { answers: ["{Eleverna|De} sitter tysta med var sin skärm[ på rasterna]."] } }
          - { id: 39xc, type: mc, prompt: "Hur bemöter Karin argumentet att föräldrar måste nå sina barn?", options: ["Skolan har en telefon som föräldrarna kan ringa.", "Föräldrar behöver inte nå sina barn.", "Barnen kan använda datorerna.", "Hon håller med."], answer: 0 }
          - { id: b363, type: mc, prompt: "Wat betekent *Det argumentet håller inte*?", options: ["Dat argument klopt niet.", "Dat argument houdt nooit op.", "Dat argument houd ik.", "Dat argument is te lang."], answer: 0 }
          - { id: 6nq7, type: mc, prompt: "Wat betekent *med var sin skärm*?", options: ["ieder met een eigen scherm", "met hun scherm uit", "met één scherm samen", "zonder scherm"], answer: 0 }

      - id: opbouw-sorteren
        title: De opbouw van het betoog
        instruction: Welk deel van het betoog is deze zin?
        topic: argumentation
        items:
          - id: mcxv
            type: sort
            categories: ["tes", "argument", "motargument", "bemötande"]
            items:
              - { text: "Mobilerna ska samlas in när skoldagen börjar.", cat: 0 }
              - { text: "För det första är det omöjligt att konkurrera med sociala medier.", cat: 1 }
              - { text: "Kritiker menar att ett förbud är omodernt.", cat: 2 }
              - { text: "Visserligen kan mobilen användas i undervisningen, men skolan har redan datorer.", cat: 3 }
              - { text: "För det andra påverkas rasterna.", cat: 1 }
              - { text: "Andra hävdar att föräldrar måste kunna nå sina barn.", cat: 2 }
              - { text: "Det argumentet håller inte: skolan har en telefon.", cat: 3 }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-debat
        title: Debatteren
        instruction: Koppel het woord aan de betekenis.
        topic: argumentation
        items:
          - id: zkk2
            type: match
            pairs:
              - ["hävda", "beweren"]
              - ["invända", "tegenwerpen"]
              - ["bemöta", "weerleggen, reageren op"]
              - ["ett förbud", "een verbod"]
              - ["en kritiker", "een criticus"]
              - ["ett verktyg", "een instrument, hulpmiddel"]
          - id: gr85
            type: match
            pairs:
              - ["för det första", "ten eerste"]
              - ["slutligen", "ten slotte"]
              - ["kort sagt", "kortom"]
              - ["med andra ord", "met andere woorden"]
              - ["tala till punkt", "uitpraten"]
              - ["avbryta", "onderbreken"]

  - id: utbrytning
    title: "Grammatik: det är … som"
    exercises:
      - id: utbrytning-omvormen
        title: Leg de nadruk
        instruction: Leg nadruk op het **vetgedrukte** deel met *det är/var … som*.
        topic: utbrytning
        items:
          - { id: 24ek, type: transform, prompt: "**Min bror** ringde i går.", answers: ["Det {var|är} min bror som ringde {i går|igår}."] }
          - { id: 4mbg, type: transform, prompt: "**Mobilerna** är problemet.", answers: ["Det är mobilerna som är problemet."] }
          - { id: 3bd8, type: transform, prompt: "Vi träffades **i Göteborg**.", answers: ["Det var i Göteborg [som ]vi träffades."], feedback: [{ contains: "som träffades vi", tip: "Na som: bijzinvolgorde, som vi träffades." }] }
          - { id: uvpj, type: transform, prompt: "Jag vill ha **kaffe**.", answers: ["Det är kaffe [som ]jag vill ha."] }
          - { id: 58be, type: transform, prompt: "**Eleverna** vill inte ha ett förbud.", answers: ["Det är eleverna som inte vill ha [ett ]förbud."], feedback: [{ contains: "som vill inte", tip: "Het som-deel is een bijzin: som inte vill." }] }
          - { id: mmwb, type: transform, prompt: "**Regeringen** fattar beslutet.", answers: ["Det är regeringen som fattar beslutet."] }
          - { id: tvq7, type: transform, prompt: "Jag glömde **nyckeln**.", answers: ["Det var nyckeln [som ]jag glömde."], feedback: [{ contains: "som glömde jag", tip: "Na som: bijzinvolgorde, som jag glömde." }] }
          - { id: hwkf, type: transform, prompt: "**Fleur** har bakat tårtan.", answers: ["Det är Fleur som har bakat tårtan.", "Det var Fleur som {har bakat|bakade} tårtan."] }

      - id: utbrytning-vragen
        title: Vragen met nadruk
        instruction: Vertaal naar het Zweeds met *är/var det som*.
        topic: utbrytning
        items:
          - { id: w6nv, type: translate, prompt: "Wie belt er?", answers: ["Vem är det som ringer?"], feedback: [{ match: "Vem ringer?", tip: "Ook goed Zweeds, maar oefen hier: Vem är det som ringer?" }] }
          - { id: ffk6, type: translate, prompt: "Wat is er gebeurd?", answers: ["Vad var det som hände?", "Vad är det som har hänt?"], feedback: [{ match: ["Vad hände?", "Vad har hänt?"], tip: "Ook goed, maar oefen hier: Vad var det som hände?" }] }
          - { id: 6zf6, type: translate, prompt: "Heb jij dit geschreven?", answers: ["{Är|Var} det du som {har skrivit|skrev} det här?"], feedback: [{ match: "Har du skrivit det här?", tip: "Ook goed, maar oefen hier met nadruk: Är det du som har skrivit det här?" }] }
          - { id: 7j7v, type: translate, prompt: "Wie heeft dit gedaan?", answers: ["Vem {är|var} det som {har gjort|gjorde} {det här|detta}?"], feedback: [{ match: ["Vem har gjort det här?", "Vem gjorde det här?"], tip: "Ook goed Zweeds, maar oefen hier: Vem är det som har gjort det här?" }] }
          - { id: e3yy, type: translate, prompt: "Wat wil je eigenlijk?", answers: ["Vad är det [som ]du vill[ egentligen]?", "Vad är det egentligen [som ]du vill?"], feedback: [{ match: ["Vad vill du egentligen?", "Vad vill du?"], tip: "Ook goed Zweeds, maar oefen hier: Vad är det du vill?" }] }
          - { id: sxyu, type: translate, prompt: "Wie heeft er gewonnen?", answers: ["Vem {var det som vann|är det som har vunnit}?"], feedback: [{ match: ["Vem vann?", "Vem har vunnit?"], tip: "Ook goed Zweeds, maar oefen hier: Vem var det som vann?" }] }
          - { id: gm6n, type: translate, prompt: "Was het je broer die belde?", answers: ["Var det din bror som ringde?"], feedback: [{ contains: "som ringde din bror", tip: "Eerst de nadruk (det din bror), daarna som + de rest." }] }
          - { id: nv4g, type: translate, prompt: "Wanneer begint de les eigenlijk?", answers: ["När är det [som ]lektionen börjar[ egentligen]?", "När är det egentligen [som ]lektionen börjar?"], feedback: [{ match: ["När börjar lektionen egentligen?", "När börjar lektionen?"], tip: "Ook goed Zweeds, maar oefen hier: När är det som lektionen börjar?" }] }

  - id: argument
    title: "Grammatik: argumenteren"
    exercises:
      - id: argument-kiezen
        title: Verbindingen in een betoog
        instruction: Kies het woord dat past.
        topic: argumentation
        shuffle: true
        items:
          - { id: crmr, type: gap, text: "___ är det omöjligt att konkurrera med sociala medier.", gaps: [{ answers: ["För det första"], options: ["För det första", "Slutligen", "Däremot"], shuffle: false }] }
          - { id: h63n, type: gap, text: "___ kan mobilen användas i undervisningen, men skolan har redan datorer.", gaps: [{ answers: ["Visserligen"], options: ["Visserligen", "Därför", "Slutligen"], shuffle: false }] }
          - { id: 22fb, type: gap, text: "Kritiker ___ att ett förbud är omodernt.", gaps: [{ answers: ["menar"], options: ["menar", "betyder", "säger om"], shuffle: false, feedback: [{ match: "betyder", tip: "betyda = betekenen. Een mening hebben: mena." }] }] }
          - { id: gavx, type: gap, text: "Det argumentet ___ inte.", gaps: [{ answers: ["håller"], options: ["håller", "stannar", "går"], shuffle: false }] }
          - { id: xkt6, type: gap, text: "___ anser jag att mobilerna ska samlas in.", gaps: [{ answers: ["Därför"], options: ["Därför", "Visserligen", "För det första"], shuffle: false }] }
          - { id: puxx, type: gap, text: "Det är inte ett straff, ___ en möjlighet.", gaps: [{ answers: ["utan"], options: ["utan", "men", "eller"], shuffle: false, feedback: [{ match: "men", tip: "Na een ontkenning (inte X, maar Y): utan." }] }] }
          - { id: 5twa, type: gap, text: "___ vill jag säga att frågan berör alla.", gaps: [{ answers: ["Slutligen"], options: ["Slutligen", "Visserligen", "Däremot"], shuffle: false }] }
          - { id: 5ftg, type: gap, text: "Jag ___ att vi behöver nya regler.", gaps: [{ answers: ["anser"], options: ["anser", "betyder", "tycker om"], shuffle: false, feedback: [{ match: "tycker om", tip: "tycka om = houden van. Een mening geven: anser (of tycker, zonder om)." }] }] }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-debatt
        title: "Luisteren: een debat samengevat"
        instruction: Luister naar de samenvatting van het debat. Is de bewering **rätt** of **fel**?
        topic: argumentation
        listen: true
        textTitle: Kvällens debatt
        text: |
          I kvällens debatt möttes läraren Karin Sjöberg och elevrådets ordförande Amir Hassan. Frågan var om mobiler ska förbjudas i skolan.

          Karin menade att det är mobilerna som stör koncentrationen, och att eleverna mår bättre utan dem. Amir höll inte med. Han hävdade att eleverna själva borde få vara med och bestämma reglerna. Visserligen kan mobilen störa, sa han, men ett totalförbud lär inte eleverna att ta ansvar.

          Båda var dock överens om en sak: det är vuxna som måste vara bra förebilder.
        items:
          - { id: tyz4, type: truefalse, statement: "Amir är elevrådets ordförande.", answer: true }
          - { id: 8e8p, type: truefalse, statement: "Amir höll med Karin.", answer: false, correction: { answers: ["{Amir|Han} höll inte med {Karin|henne}.", "{Amir|Han} höll inte med."] } }
          - { id: sj68, type: truefalse, statement: "Amir vill att eleverna ska vara med och bestämma reglerna.", answer: true }
          - { id: h4vv, type: truefalse, statement: "De var överens om att det är eleverna som måste vara förebilder.", answer: false, correction: { answers: ["Det är vuxna som måste vara [bra ]förebilder."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: utbrytning
        shuffle: true
        items:
          - { id: 67t4, type: listen, say: "Det är inte eleverna som är problemet." }
          - { id: btzv, type: listen, say: "Vem var det som ringde?" }
          - { id: gp4z, type: listen, say: "Det argumentet håller inte." }
          - { id: j7w5, type: listen, say: "Visserligen kan mobilen störa, men ett förbud är fel." }

  - id: praktiskt
    title: Praktiskt · argumenteren in een gesprek
    exercises:
      - id: dialoog-debatt
        title: Een discussie in de klas
        instruction: Zet de discussie in de goede volgorde.
        topic: argumentation
        items:
          - id: ewxn
            type: dialogue
            lines:
              - "Läraren: Ska vi ha kortare sommarlov? Vad tycker ni?"
              - "Sofia: Jag är för. Det är under sommaren som många glömmer det de har lärt sig."
              - "Erik: Får jag avbryta? Det är också då man vilar och hinner jobba extra."
              - "Sofia: Låt mig tala till punkt. Jag menar inte att vi ska ta bort lovet, bara förkorta det."
              - "Erik: Okej, det är en bra poäng. Men hur lång tid tänker du dig?"
              - "Sofia: Kanske sex veckor i stället för tio."

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat je zegt.
        topic: argumentation
        shuffle: true
        items:
          - { id: n4rd, type: mc, prompt: "Je wilt iemand beleefd onderbreken.", options: ["Får jag avbryta?", "Var tyst nu!", "Sluta prata!", "Du har fel, punkt."], answer: 0 }
          - { id: 49qz, type: mc, prompt: "Je wilt uitpraten.", options: ["Låt mig tala till punkt.", "Låt mig avbryta.", "Låt mig hålla med.", "Låt mig sluta."], answer: 0 }
          - { id: abaf, type: mc, prompt: "Je geeft iets toe, maar houdt je standpunt.", options: ["Det är en bra poäng, men jag tycker ändå att …", "Du har helt rätt, jag ger upp.", "Det där är dumt.", "Jag vet inte."], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een betoog."
    exercises:
      - id: skriva-debattartikel
        title: Schrijf een opiniestuk
        instruction: Schrijf een korte *debattartikel*.
        topic: argumentation
        items:
          - id: n8x3
            type: free
            prompt: "Kies een stelling, bijvoorbeeld *Mobiler borde förbjudas i skolan*, *Kollektivtrafiken borde vara gratis* of *Alla borde lära sig svenska innan de får medborgarskap*. Schrijf een betoog van 150–200 woorden met tes, twee argumenten, een motargument met bemötande en een slutsats. Gebruik minstens één keer *det är … som*."
            minWords: 140
            require:
              - { any: ["anser", "tycker", "menar"], label: "Je geeft je standpunt (tes)" }
              - { any: ["för det första", "för det andra", "dessutom", "slutligen"], label: "Je ordent je argumenten" }
              - { any: ["kritiker", "vissa", "andra hävdar", "invända", "motståndare"], label: "Je noemt een motargument" }
              - { any: ["visserligen", "håller inte", "stämmer att"], label: "Je weerlegt het motargument" }
              - { any: ["därför", "sammanfattningsvis", "kort sagt"], label: "Je sluit af met een conclusie" }
              - { any: ["det är", "det var"], label: "Je gebruikt det är … som" }
            model: "Jag anser att kollektivtrafiken i våra städer borde vara gratis. För det första är det bilarna som står för en stor del av utsläppen i staden. Om bussar och spårvagnar vore gratis skulle fler lämna bilen hemma. För det andra skulle gratis kollektivtrafik göra det lättare för personer med låga inkomster att ta sig till jobb och skola. Kritiker menar att det skulle bli för dyrt för kommunerna. Visserligen kostar det pengar, men biljettintäkterna täcker redan i dag bara en del av kostnaderna. Dessutom sparar samhället pengar på färre olyckor och kortare köer. Andra hävdar att bussarna skulle bli överfulla. Det argumentet håller inte, eftersom man kan sätta in fler avgångar. Det är alltså inte kostnaden som är det stora problemet, utan bristen på politisk vilja. Därför anser jag att vi borde testa gratis kollektivtrafik i några städer under ett par år."

  - id: herhaling
    title: Herhaling
    exercises:
      - id: herhaling-b2-27
        title: Door elkaar
        instruction: Gemengde vragen.
        shuffle: true
        items:
          - { id: b88p, type: gap, topic: villkor, text: "Om mobilerna ___ (förbjuda), skulle eleverna koncentrera sig bättre.", gaps: [{ answers: ["förbjöds", "blev förbjudna", "skulle förbjudas"] }] }
          - { id: an5g, type: gap, topic: subjunktioner-b1, text: "___ mobilen kan vara användbar, stör den ofta.", gaps: [{ answers: ["Även om", "Trots att"], options: ["Även om", "Trots att", "Innan"], shuffle: false }] }
          - { id: dzwm, type: gap, topic: nominalisering, text: "förbjuda → ___", gaps: [{ answers: ["ett förbud"] }] }
          - { id: 3cnd, type: gap, topic: particip-konstruktion, text: "den av regeringen ___ (föreslå) lagen", gaps: [{ answers: ["föreslagna"] }] }
          - { id: pchr, type: gap, topic: asikt, text: "Jag håller inte med ___ det.", gaps: [{ answers: ["om"], options: ["om", "på", "för"], shuffle: false }] }
          - { id: wru8, type: transform, topic: utbrytning, prompt: "**Föräldrarna** bestämmer.", answers: ["Det är föräldrarna som bestämmer."] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: utbrytning
        shuffle: true
        items:
          - { id: q5aa, type: findError, sentence: "Det är eleverna som vill inte ha förbud.", wrong: [4, 5], answers: ["Det är eleverna som inte vill ha [ett ]förbud."], tip: "Het som-deel is een bijzin." }
          - { id: f2xv, type: findError, sentence: "Det var min bror som ringer i går.", wrong: [5], answers: ["Det {var|är} min bror som ringde {i går|igår}."], tip: "Kijk naar de tijd." }
          - { id: cb6y, type: findError, sentence: "Vem är det som ringer du?", wrong: [5], answers: ["Vem är det som ringer?"], tip: "Er staat een woord te veel." }
          - { id: dcqu, type: findError, topic: argumentation, sentence: "Det är inte ett straff men en möjlighet.", wrong: [5], answers: ["Det är inte ett straff utan en möjlighet."], tip: "Na een ontkenning: niet men." }
          - { id: q472, type: findError, topic: argumentation, sentence: "Kritiker betyder att förbudet är omodernt.", wrong: [1], answers: ["Kritiker menar att förbudet är omodernt.", "Kritiker hävdar att förbudet är omodernt."], tip: "Welk werkwoord betekent een mening hebben?" }

vocab:
  - { sv: "en debatt", nl: "een debat", def: "debatten", pl: "debatter", plDef: "debatterna", ex: "Efter programmet blev det en het **debatt** i sociala medier.", exNl: "Na het programma ontstond er een fel debat op sociale media." }
  - { sv: "en debattartikel", nl: "een opiniestuk", def: "debattartikeln", pl: "debattartiklar", plDef: "debattartiklarna", ex: "Hon skrev en **debattartikel** om skolans mobilförbud.", exNl: "Ze schreef een opiniestuk over het mobielverbod van de school." }
