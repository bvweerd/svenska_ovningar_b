          - id: aydv
            type: steps
            steps:
              - { type: mc, prompt: "Maak één zin: *Linnea har en hyresvärd. Hans telefon är alltid avstängd.* Welk woord begint de bijzin?", options: ["där (plaats)", "dit (richting)", "vars (bezit)", "när (tijd)"], answer: 2, shuffle: false, tip: "Het gaat om de telefoon ván de verhuurder (hans telefon): vars." }
              - { type: transform, prompt: "Maak één zin: Linnea har en hyresvärd. Hans telefon är alltid avstängd.", answers: ["Linnea har en hyresvärd vars telefon alltid är avstängd."], feedback: [{ contains: "vars telefonen", tip: "Na vars staat het woord onbepaald: vars telefon." }, { contains: "vars telefon är alltid", tip: "In de bijzin staat alltid vóór het werkwoord: vars telefon alltid är avstängd." }, { contains: "som hans telefon", tip: "som + hans wordt in één woord vars: vars telefon." }] }
          - id: setz
            type: steps
            steps:
