              - { type: translate, prompt: "Vertaal: Ik woon in een huurflat waar alle huurders één wasruimte delen.", answers: ["Jag bor i {ett hyreshus|en hyreslägenhet|en hyresrätt} där alla hyresgäster delar[ på] en [gemensam ]tvättstuga."], feedback: [{ contains: "dit alla", tip: "Delen is geen beweging naar een plek: där." }, { contains: "där delar", tip: "In de bijzin komt het onderwerp direct na där: där alla hyresgäster delar." }] }
