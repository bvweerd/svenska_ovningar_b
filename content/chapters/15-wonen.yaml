  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-felanmalan
        title: "Luisteren: een storing melden"
        instruction: Luister naar het bericht aan de verhuurder. Is de bewering **rätt** of **fel**?
        topic: partikelverb
        listen: true
        textTitle: En felanmälan
        text: |
          Hej, jag heter Anouk de Boer och jag bor på Storgatan tolv, lägenhet elva noll två. Jag ringer för att göra en felanmälan.

          Elementet i sovrummet har slutat fungera, så det är väldigt kallt i lägenheten. Jag har försökt skruva upp det, men ingenting händer. Dessutom droppar det från kranen i köket, och det låter hela natten.

          Ni får gärna komma in och laga det när jag inte är hemma, men ring mig först, så att jag vet när ni kommer. Tack på förhand!
        items:
          - { id: 7ew3, type: truefalse, statement: "Anouk ringer för att boka tvättstugan.", answer: false, correction: { answers: ["{Anouk|Hon} ringer för att göra en felanmälan."] } }
          - { id: 9nk5, type: truefalse, statement: "Elementet i sovrummet fungerar inte.", answer: true }
          - { id: 8w38, type: truefalse, statement: "Det droppar från kranen i badrummet.", answer: false, correction: { answers: ["Det droppar från kranen i köket."] } }
          - { id: wjeg, type: truefalse, statement: "Hyresvärden får komma in när Anouk inte är hemma.", answer: true }
          - { id: 7nsf, type: truefalse, statement: "Hyresvärden behöver inte ringa innan.", answer: false, correction: { answers: ["{Hyresvärden|De|Ni} ska ringa [{henne|Anouk} ]först.", "{Anouk|Hon} vill att {de|hyresvärden} ringer först."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: partikelverb
        shuffle: true
        items:
          - { id: ebng, type: listen, say: "Kan du stänga av teven?" }
          - { id: fjt5, type: listen, say: "Jag kände inte igen henne." }
          - { id: cfj8, type: listen, say: "Det är huset där jag bodde som barn." }
          - { id: jdea, type: listen, say: "Tvättmaskinen har gått sönder igen." }

