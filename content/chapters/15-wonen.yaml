            model: "Hej! Jag heter Pieter Smit och jag bor på Storgatan 12, lägenhet 1102. Jag vill göra en felanmälan. Kylskåpet i köket har gått sönder. Det har inte fungerat sedan i lördags, och nu är all mat varm. Jag har försökt stänga av det och sätta på det igen, men det hjälper inte. Ni får gärna komma in och titta på det, men ring mig först. Jag är hemma på eftermiddagarna. Med vänliga hälsningar, Pieter Smit"

