              - { type: translate, prompt: "Vertaal: De kelder waar we de oude meubels naartoe hebben gebracht, is vochtig.", answers: ["Källaren dit vi {har burit|har flyttat|har tagit|bar|flyttade|tog}[ ner] de gamla möblerna är fuktig.", "Källaren [som ]vi {har burit|har flyttat|har tagit|bar|flyttade|tog}[ ner] de gamla möblerna till är fuktig."], feedback: [{ contains: "där vi har", tip: "Iets naar de kelder brengen is een beweging: dit." }, { contains: "möblerna ner", tip: "Het partikel komt vóór het lijdend voorwerp: burit ner de gamla möblerna." }] }
          - id: 9vq2
            type: steps
            steps:
              - { type: mc, prompt: "Ken je het café waar Femke en Ingrid elke zaterdag koffie drinken? Welk woord begint de bijzin?", options: ["där (plaats)", "dit (richting)", "vars (bezit)", "när (tijd)"], answer: 0, shuffle: false, tip: "Ze zitten in het café, er is geen beweging naartoe: där." }
