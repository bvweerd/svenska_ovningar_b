              - { type: translate, prompt: "Vertaal: Uppsala is de stad waar Lotte na haar opleiding naartoe wil verhuizen.", answers: ["Uppsala är staden dit Lotte vill flytta efter {sin utbildning|utbildningen}.", "Uppsala är staden [som ]Lotte vill flytta till efter {sin utbildning|utbildningen}."], feedback: [{ contains: "där lotte", tip: "flytta is een beweging naartoe: dit." }, { contains: "hennes utbildning", tip: "De opleiding is van Lotte zelf, het onderwerp van de bijzin: sin utbildning." }] }
