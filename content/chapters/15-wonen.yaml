chapter: 15
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan met werkwoorden met een partikel een probleem in huis beschrijven", topics: [partikelverb] }
  - { text: "Ik kies tussen där, dit en vars", topics: [dar-dit-vars] }

grammar:
  - id: partikelverb
    title: Werkwoorden met een partikel
    summary: "Werkwoord + beklemtoond partikel met een eigen betekenis: *stänga **av*** (uitzetten), *känna **igen*** (herkennen). Het partikel komt **vóór** het lijdend voorwerp, ook vóór *den/det*: *Stäng **av** teven! Stäng **av** den!*"
    body: |
      Veel Zweedse werkwoorden krijgen een **partikel** (een klein woord als *av, på, upp, in, ut, igen*). Samen hebben ze vaak een andere betekenis, en de **klemtoon ligt op het partikel**:

      | werkwoord | met partikel |
      |---|---|
      | *stänga* (sluiten) | *stänga **av*** (uitzetten) |
      | *sätta* (zetten) | *sätta **på*** (aanzetten) |
      | *känna* (kennen) | *känna **igen*** (herkennen) |
      | *gå* (lopen) | *gå **sönder*** (kapotgaan) |
      | *hälsa* (groeten) | *hälsa **på*** (op bezoek gaan) |
      | *byta* (ruilen) | *byta **ut*** (vervangen) |
      | *glömma* (vergeten) | *glömma **bort*** (vergeten; vaak hetzelfde als *glömma*) |

      ### Waar staat het partikel?
      Anders dan in het Nederlands staat het partikel **direct na het werkwoord**, vóór het lijdend voorwerp, ook als dat een voornaamwoord is:

      - *Stäng **av** teven!* – Zet de tv uit!
      - *Stäng **av** den!* – Zet hem uit! (niet ~~*Stäng den av*~~)
      - *Kan du sätta **på** radion?*

      Uitzondering: een wederkerend *sig* staat wél vóór het partikel: *Hon satte **sig ner***. Daarover meer in hoofdstuk 22.

      Is het partikelwerkwoord zelf de persoonsvorm in een hoofdzin, dan staan **inte** en andere bijwoorden tussen werkwoord en partikel:

      - *Jag kände **inte igen** henne.* – Ik herkende haar niet.
      - *Han stängde **aldrig av** datorn.*

      Met een hulpwerkwoord of in een bijzin blijven werkwoord en partikel bij elkaar en staat *inte* ervóór:

      - *Jag **kunde inte känna igen** henne.*
      - *Jag tror att hon **inte har flyttat in** än.*

      ### Let op de klemtoon
      *Vi hälsar **PÅ** mormor* = we gaan bij oma op bezoek. *Vi **HÄLSAR** på mormor* = we groeten oma. In geschreven tekst blijkt het uit de context.

  - id: dar-dit-vars
    title: Där, dit, vars en när
    summary: "**där** = waar (plaats), **dit** = waarheen (beweging), **vars** = wiens/waarvan, **när/då** = waarop (tijd): *huset där jag bor, staden dit vi flyttade, grannen vars hund skäller.*"
    body: |
      Naast *som* (hoofdstuk 13) kun je een bijzin beginnen met:

      | woord | betekenis | voorbeeld |
      |---|---|---|
      | **där** | waar (plaats, geen beweging) | *Det är huset **där** jag bodde som barn.* |
      | **dit** | waarheen (beweging naar) | *Malmö är staden **dit** vi flyttade.* |
      | **vars** | wiens, waarvan | *Jag har en granne **vars** hund skäller hela natten.* |
      | **när / då** | waarop (tijd) | *Minns du dagen **när** vi flyttade in?* |

      Net als bij *hemma/hem* (hoofdstuk 5) en *här/hit*: is er een beweging naartoe (*flytta, åka, gå*), dan gebruik je **dit**.

      In plaats van *där* kun je ook *som … i/på* gebruiken: *staden som jag bor i* = *staden där jag bor*.

      **vars** geldt voor en-woorden, ett-woorden en meervoud: *grannen vars hund …*, *barnet vars mamma …*, *familjerna vars barn …*. Het woord na *vars* staat onbepaald: *vars hund*, niet ~~*vars hunden*~~.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-tvattstugan
        title: "Lezen: de wasruimte"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: partikelverb
        textTitle: Tvättstugan
        text: |
          När Femke flyttade in i sin lägenhet i Malmö visste hon inte mycket om svenska hyreshus. Den första veckan lärde hon sig ett viktigt ord: tvättstuga. I huset där hon bor finns det inga tvättmaskiner i lägenheterna. I stället delar alla hyresgäster på en tvättstuga i källaren, dit man går med sin tvätt. Det tyckte Femke var konstigt i början. I Nederländerna hade hon haft en egen tvättmaskin i badrummet.

          Man måste boka en tid i förväg. Femke bokade en tid på lördagsförmiddagen, men när hon kom ner var maskinerna redan upptagna. En granne, vars tid egentligen var slut, hade inte tagit ut sin tvätt. Femke väntade i tjugo minuter. Sedan skrev hon en lapp och satte upp den på dörren: ”Hej! Jag har bokat tvättstugan nu, men någon har glömt sin tvätt i maskinerna. Kan du ta ut den så snart som möjligt? Femke, lägenhet 2A.”

          Dagen efter hittade hon ett svar under sin lapp: ”Förlåt! Jag glömde bort tiden. Du får gärna låna min tid på onsdag. Ingrid, lägenhet 4B.” Nu hälsar Femke på Ingrid i trapphuset varje dag, och ibland fikar de tillsammans. Ingrid är pensionerad lärare och har bott i huset i trettio år. Hon har förklarat för Femke hur allt fungerar: när soporna hämtas, var cyklarna ska stå och vem man ringer när något går sönder.
        items:
          - { id: gy7y, type: mc, prompt: "Var tvättar man i Femkes hus?", options: ["i tvättstugan i källaren", "i lägenheten", "på en tvättinrättning", "hos grannen"], answer: 0 }
          - { id: crme, type: truefalse, statement: "Man kan tvätta när man vill.", answer: false, tip: "Wat moet je eerst doen?", correction: { answers: ["{Man|Du} måste boka en tid[ i förväg]."] } }
          - { id: 2zgp, type: truefalse, statement: "När Femke kom ner var maskinerna lediga.", answer: false, correction: { answers: ["{Maskinerna|De} var [redan ]upptagna."] } }
          - { id: gq59, type: mc, prompt: "Vad gjorde Femke efter tjugo minuter?", options: ["Hon skrev en lapp och satte upp den.", "Hon tog ut grannens tvätt.", "Hon ringde hyresvärden.", "Hon gick hem och gav upp."], answer: 0 }
          - { id: 6w7d, type: mc, prompt: "Varför hade Ingrid inte tagit ut sin tvätt?", options: ["Hon hade glömt bort tiden.", "Hon var sjuk.", "Hon var på semester.", "Maskinen hade gått sönder."], answer: 0 }
          - { id: 27ad, type: truefalse, statement: "Femke och Ingrid är ovänner nu.", answer: false, correction: { answers: ["{De|Femke och Ingrid} fikar [tillsammans ]ibland.", "{De|Femke och Ingrid} är vänner[ nu]."] } }
          - { id: d6bb, type: truefalse, statement: "Femke hade en egen tvättmaskin i Nederländerna.", answer: true }
          - { id: abc6, type: mc, prompt: "Vad bad Femke om på lappen?", options: ["att grannen skulle ta ut sin tvätt", "att grannen skulle laga maskinen", "att få låna grannens tid", "att grannen skulle ringa henne"], answer: 0 }
          - { id: jp5m, type: truefalse, statement: "Ingrid har bott i huset i tre år.", answer: false, tip: "Lees de laatste alinea nog eens.", correction: { answers: ["{Ingrid|Hon} har bott i huset i trettio år."] } }
          - id: by3j
            type: multi
            prompt: "Welke werkwoorden met een partikel staan in de tekst?"
            options: ["flyttade in", "tagit ut", "satte upp", "glömde bort", "lärde sig", "delar på"]
            answers: [0, 1, 2, 3, 5]
            tip: "lära sig is een wederkerend werkwoord, geen partikelwerkwoord. dela på (samen delen) telt wel mee."

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-wonen
        title: Huren en wonen
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: 9v6k
            type: match
            pairs:
              - ["en hyresvärd", "een verhuurder"]
              - ["en hyresgäst", "een huurder"]
              - ["en tvättstuga", "een gezamenlijke wasruimte"]
              - ["ett trapphus", "een trappenhuis"]
              - ["ett element", "een radiator"]
              - ["en felanmälan", "een storingsmelding"]
          - id: b3ee
            type: match
            pairs:
              - ["hyra i andra hand", "onderhuren"]
              - ["flytta in", "intrekken"]
              - ["flytta ut", "verhuizen uit, vertrekken"]
              - ["gå sönder", "kapotgaan"]
              - ["byta ut", "vervangen"]
              - ["hälsa på", "op bezoek gaan"]

  - id: partikel
    title: "Grammatik: werkwoorden met een partikel"
    exercises:
      - id: partikel-kiezen
        title: Het goede werkwoord
        instruction: Kies wat past.
        topic: partikelverb
        shuffle: true
        items:
          - { id: r6cv, type: gap, text: "Kan du ___ teven? Jag försöker sova.", gaps: [{ answers: ["stänga av"], options: ["stänga av", "sätta på", "stänga"], feedback: [{ match: "stänga", tip: "stäng teven zonder av hoor je in de spreektaal, maar de standaardvorm voor een apparaat uitzetten is stänga av. stänga alleen = dichtdoen." }] }] }
          - { id: p3va, type: gap, text: "Det är mörkt. Kan du ___ lampan?", gaps: [{ answers: ["tända"], options: ["tända", "stänga av", "känna igen"], tip: "Een lamp aandoen: tända (of sätta på, slå på)." }] }
          - { id: nk56, type: gap, text: "Diskmaskinen har ___. Vi måste ringa hyresvärden.", gaps: [{ answers: ["gått sönder"], options: ["gått sönder", "gått ut", "gått bort"], feedback: [{ match: "gått bort", tip: "gå bort = overlijden (of: uitgaan naar een feest). Kapotgaan: gå sönder." }] }] }
          - { id: 24ax, type: gap, text: "Vi ska ___ mormor på söndag.", gaps: [{ answers: ["hälsa på"], options: ["hälsa på", "hälsa", "besöka på"], feedback: [{ match: "hälsa", tip: "hälsa alleen = groeten. Op bezoek gaan: hälsa på." }] }] }
          - { id: 8dx9, type: gap, text: "Hyresvärden ska ___ alla fönster i huset.", gaps: [{ answers: ["byta ut"], options: ["byta ut", "byta om", "byta in"], tip: "Iets vervangen door iets nieuws: byta ut." }] }
          - { id: gtdp, type: gap, text: "Förlåt, jag ___ helt att du skulle komma.", gaps: [{ answers: ["glömde bort"], options: ["glömde bort", "glömde av", "glömde ut"] }] }
          - { id: buce, type: gap, text: "Kan du ___ soporna?", gaps: [{ answers: ["gå ut med"], options: ["gå ut med", "gå ut", "gå bort med"], tip: "Het afval buitenzetten: gå ut med soporna." }] }
          - { id: ztfc, type: gap, text: "Vi har ___ alla lådor nu.", gaps: [{ answers: ["packat upp"], options: ["packat upp", "packat ut", "packat bort"], tip: "Uitpakken: packa upp." }] }

      - id: partikel-zinsbouw
        title: Waar staat het partikel?
        instruction: Zet de woorden in de goede volgorde.
        topic: partikelverb
        shuffle: true
        items:
          - { id: g94p, type: order, start: "Jag", tokens: ["kände", "inte", "igen", "honom"], answers: ["Jag kände inte igen honom."] }
          - { id: 3krb, type: order, start: "Kan du", tokens: ["sätta", "på", "radion"], answers: ["Kan du sätta på radion?"] }
          - { id: udfu, type: order, start: "Han", tokens: ["stängde", "aldrig", "av", "datorn"], answers: ["Han stängde aldrig av datorn."] }
          - { id: emd9, type: order, start: "Jag tror att", tokens: ["hon", "inte", "har", "flyttat", "in", "än"], answers: ["Jag tror att hon inte har flyttat in än."] }
          - { id: e3qs, type: order, start: "Glöm", tokens: ["inte", "bort", "att", "låsa", "dörren"], answers: ["Glöm inte bort att låsa dörren."] }
          - { id: b578, type: order, start: "Vi", tokens: ["har", "inte", "packat", "upp", "lådorna"], answers: ["Vi har inte packat upp lådorna."] }
          - { id: sdfm, type: order, start: "Kan du", tokens: ["slå", "av", "den"], answers: ["Kan du slå av den?"] }
          - { id: zxx8, type: order, start: "När", tokens: ["flyttade", "ni", "in"], answers: ["När flyttade ni in?"] }

      - id: partikel-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds.
        topic: partikelverb
        items:
          - { id: 4cds, type: translate, prompt: "Zet de tv uit!", answers: ["{Stäng|Slå} av {teven|tv:n}!"], feedback: [{ contains: "stäng teven av", tip: "Het partikel komt direct na het werkwoord: Stäng av teven!" }, { contains: "stäng tv:n av", tip: "Het partikel komt direct na het werkwoord: Stäng av tv:n!" }] }
          - { id: d7e6, type: translate, prompt: "Zet hem uit!", answers: ["{Stäng|Slå} av den!"], feedback: [{ match: "Stäng den av!", tip: "In het Zweeds komt het partikel ook vóór den: Stäng av den!" }] }
          - { id: m7eq, type: translate, prompt: "Ik herkende haar niet.", answers: ["Jag kände inte igen henne."], feedback: [{ match: "Jag kände henne inte igen.", tip: "Het partikel staat direct na inte, vóór het voorwerp: kände inte igen henne." }, { match: "Jag kände igen inte henne.", tip: "inte staat tussen werkwoord en partikel: kände inte igen." }] }
          - { id: zxbz, type: translate, prompt: "Wanneer trekken jullie in?", answers: ["När flyttar ni in?", "När ska ni flytta in?"] }
          - { id: 6r4b, type: translate, prompt: "De wasmachine is kapotgegaan.", answers: ["Tvättmaskinen har gått sönder.", "Tvättmaskinen gick sönder."] }
          - { id: uj2j, type: translate, prompt: "Doe de lamp aan!", answers: ["Tänd lampan!", "{Sätt|Slå} på lampan!"], feedback: [{ contains: "lampan på", tip: "Het partikel komt direct na het werkwoord: Sätt på lampan!" }] }
          - { id: c6pk, type: translate, prompt: "Morgen ga ik bij oma op bezoek.", answers: ["{I morgon|Imorgon} {ska jag hälsa|hälsar jag} på {mormor|farmor}.", "Jag {ska hälsa|hälsar} på {mormor|farmor} {i morgon|imorgon}.", "{I morgon|Imorgon} {ska jag besöka|besöker jag} {mormor|farmor}.", "Jag {ska besöka|besöker} {mormor|farmor} {i morgon|imorgon}."], feedback: [{ contains: "besöka på", tip: "Op bezoek gaan: hälsa på (of besöka, zonder på)." }] }
          - { id: 5j3e, type: translate, prompt: "De kraan is kapot.", answers: ["Kranen {har gått sönder|är sönder|gick sönder|är trasig}."], feedback: [{ contains: "kaputt", tip: "Kapot = sönder." }] }
          - { id: usx3, type: translate, prompt: "Vergeet niet de computer uit te zetten voordat je vanavond naar huis gaat.", answers: ["Glöm inte [bort ]att {stänga|slå} av datorn innan du {går|åker} hem i kväll.", "Glöm inte [bort ]att {stänga|slå} av datorn i kväll innan du {går|åker} hem."], feedback: [{ contains: ["stänga datorn av", "slå datorn av"], tip: "Het partikel komt direct na het werkwoord: stänga av datorn." }, { contains: "innan går du", tip: "In een bijzin komt het onderwerp direct na innan: innan du går hem." }] }
          - { id: eh9e, type: translate, prompt: "Ik herkende mijn buurvrouw niet toen ik haar in de supermarkt zag.", answers: ["Jag kände inte igen min granne när jag såg henne {i affären|i mataffären|i butiken|på snabbköpet|i snabbköpet}."], feedback: [{ contains: ["kände min granne inte igen", "kände inte min granne igen", "kände igen inte"], tip: "inte staat tussen werkwoord en partikel, het voorwerp komt erna: kände inte igen min granne." }, { contains: "när såg jag", tip: "In een bijzin komt het onderwerp direct na när: när jag såg henne." }] }
          - { id: xmr3, type: translate, prompt: "De verhuurder gaat volgende week alle oude ramen in het gebouw vervangen.", answers: ["Hyresvärden {ska byta ut|kommer att byta ut|byter ut} alla gamla fönster i {huset|byggnaden} nästa vecka.", "Nästa vecka {ska hyresvärden byta ut|kommer hyresvärden att byta ut|byter hyresvärden ut} alla gamla fönster i {huset|byggnaden}."], feedback: [{ contains: "fönster ut", tip: "Het partikel komt vóór het lijdend voorwerp: byta ut alla gamla fönster." }, { contains: ["går att byta", "går byta"], tip: "Nederlands gaan + infinitief is in het Zweeds ska (of kommer att)." }, { contains: ["byta alla", "byter alla", "byter hyresvärden alla"], tip: "Byta alla fönster is goed Zweeds, maar oefen hier het partikelwerkwoord: byta ut alla gamla fönster." }] }
          - { id: wpnx, type: translate, prompt: "Toen we in de nieuwe flat trokken, ging de wasmachine meteen kapot.", answers: ["När vi {flyttade in i|flyttade till} den nya lägenheten gick tvättmaskinen sönder {direkt|med en gång|genast}.", "När vi {flyttade in i|flyttade till} den nya lägenheten gick tvättmaskinen {direkt|genast} sönder."], feedback: [{ contains: "lägenheten tvättmaskinen gick", tip: "Na een bijzin vooraan (När …) komt eerst het werkwoord: gick tvättmaskinen sönder." }, { contains: "flyttade i den", tip: "Intrekken in een woning = flytta in i: När vi flyttade in i den nya lägenheten." }] }
          - { id: 3fgx, type: translate, prompt: "Op zondag gaan we vaak op bezoek bij Ingrid, die drie verdiepingen boven ons woont.", answers: ["{På söndagar|På söndagarna|Om söndagarna} {hälsar vi ofta på Ingrid|besöker vi ofta Ingrid}, som bor tre våningar {ovanför|över} oss."], feedback: [{ contains: ["söndagar vi", "söndagarna vi"], tip: "Na På söndagar vooraan komt eerst het werkwoord: På söndagar hälsar vi …" }, { contains: "besöker vi ofta på", tip: "Op bezoek gaan: hälsa på, of besöka zonder på." }, { contains: ["ingrid vars", "ingrid där"], tip: "Ingrid is een persoon die ergens woont: som bor …" }] }
          - { id: x2c5, type: translate, prompt: "Ingrid legde Femke uit wanneer het afval wordt opgehaald en wie je belt als er iets kapotgaat.", answers: ["Ingrid förklarade för Femke när soporna {hämtas|blir hämtade} och vem {man|du} {ringer|ska ringa} {när|om} något går sönder."], feedback: [{ contains: ["när hämtas soporna", "när blir soporna"], tip: "In een indirecte vraag komt eerst het onderwerp: när soporna hämtas." }, { contains: ["vem ringer man", "vem ringer du"], tip: "In een indirecte vraag komt eerst het onderwerp: vem man ringer." }, { contains: "går något sönder", tip: "In een bijzin komt het onderwerp direct na när: när något går sönder." }] }

  - id: dar-dit-vars
    title: "Grammatik: där, dit en vars"
    exercises:
      - id: dar-dit-kiezen
        title: Där, dit, vars of när?
        instruction: Kies het woord dat past.
        topic: dar-dit-vars
        shuffle: true
        items:
          - { id: jm5u, type: gap, text: "Det är huset ___ jag bodde som barn.", gaps: [{ answers: ["där"], options: ["där", "dit", "vars", "när"], shuffle: false, feedback: [{ match: "dit", tip: "Bij bodde is er geen beweging: där." }] }] }
          - { id: yq75, type: gap, text: "Malmö är staden ___ vi flyttade förra året.", gaps: [{ answers: ["dit"], options: ["där", "dit", "vars", "när"], shuffle: false, feedback: [{ match: "där", tip: "flytta is een beweging naartoe: dit." }] }] }
          - { id: bugb, type: gap, text: "Jag har en granne ___ hund skäller hela natten.", gaps: [{ answers: ["vars"], options: ["där", "dit", "vars", "när"], shuffle: false }] }
          - { id: hy5w, type: gap, text: "Tvättstugan, ___ alla går med sin tvätt, ligger i källaren.", gaps: [{ answers: ["dit"], options: ["där", "dit", "vars", "när"], shuffle: false, feedback: [{ match: "där", tip: "gå med sin tvätt: je gaat ernaartoe, dus dit." }] }] }
          - { id: 797d, type: gap, text: "Kvarteret ___ vi bor är lugnt.", gaps: [{ answers: ["där"], options: ["där", "dit", "vars", "när"], shuffle: false }] }
          - { id: jggh, type: gap, text: "Hyresvärden, ___ nummer står på tavlan, svarar aldrig.", gaps: [{ answers: ["vars"], options: ["där", "dit", "vars", "när"], shuffle: false }] }
          - { id: fhy3, type: gap, text: "Minns du dagen ___ vi flyttade in?", gaps: [{ answers: ["när"], options: ["där", "dit", "vars", "när"], shuffle: false, feedback: [{ match: "där", tip: "Het gaat om een tijd (*dagen* = de dag): när." }] }] }
          - { id: gt5f, type: gap, text: "Vi åkte till stugan, ___ vi stannade en vecka.", gaps: [{ answers: ["där"], options: ["där", "dit", "vars", "när"], shuffle: false, feedback: [{ match: "dit", tip: "Het gaat om waar ze bleven (stannade, geen beweging): där." }] }] }

      - id: dar-vars-combineren
        title: Twee zinnen worden één
        instruction: Maak van twee zinnen één zin met **där**, **dit** of **vars**.
        topic: dar-dit-vars
        items:
          - { id: dq57, type: transform, prompt: "Det är en stad. Jag vill bo i staden.", answers: ["Det är en stad där jag vill bo.", "Det är en stad [som ]jag vill bo i."] }
          - { id: dn84, type: transform, prompt: "Jag har en kompis. Hans lägenhet har två balkonger.", answers: ["Jag har en kompis vars lägenhet har två balkonger."], feedback: [{ contains: "vars lägenheten", tip: "Na vars staat het woord onbepaald: vars lägenhet." }] }
          - { id: y3cb, type: transform, prompt: "Vi åker till Gotland. Där har vi ett sommarhus.", answers: ["Vi åker till Gotland, där vi har ett sommarhus."], feedback: [{ contains: "där har vi", tip: "In de bijzin komt het onderwerp direct na där: där vi har." }] }
          - { id: 7bu6, type: transform, prompt: "Hon träffade en man. Mannens dotter går i samma klass.", answers: ["Hon träffade en man vars dotter går i samma klass[ som hennes]."] }
          - { id: 6qag, type: transform, prompt: "Jag åker till Umeå. Min syster bor där.", answers: ["Jag åker till Umeå, där min syster bor."], feedback: [{ contains: "dit min syster bor", tip: "bo is geen beweging: där." }] }
          - { id: 3aqv, type: transform, prompt: "Vi flyttade till Västerås. Bram har sitt jobb där.", answers: ["Vi flyttade till Västerås, där Bram har sitt jobb."], feedback: [{ contains: "dit bram", tip: "Bram heeft daar zijn werk (geen beweging): där." }, { contains: "där har bram", tip: "In de bijzin komt het onderwerp direct na där: där Bram har." }] }
          - { id: g28s, type: transform, prompt: "Där är affären. Vi ska gå dit.", answers: ["Där är affären dit vi ska gå.", "Där är affären [som ]vi ska gå till."] }
