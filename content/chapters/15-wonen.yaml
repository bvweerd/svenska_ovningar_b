              - { type: transform, prompt: "Maak één zin met *dagen*: Jag minns dagen. Den dagen fick vi nycklarna till lägenheten.", answers: ["Jag minns [den ]dagen {när|då} vi fick nycklarna till lägenheten."], feedback: [{ contains: "där vi fick", tip: "Het gaat om een tijd (dagen), niet om een plaats: när." }, { contains: "när fick vi", tip: "In de bijzin komt het onderwerp direct na när: när vi fick." }] }
          - id: q9sr
