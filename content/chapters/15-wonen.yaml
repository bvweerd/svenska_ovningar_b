          - { id: 6pv4, type: transform, prompt: "Jag har en granne. Grannens barn spelar trummor varje kväll.", answers: ["Jag har en granne vars barn spelar trummor varje kväll."], feedback: [{ contains: "vars barnen", tip: "Na vars staat het woord onbepaald: vars barn." }, { contains: ["som grannens", "som hans", "som hennes"], tip: "Van wie zijn de kinderen? som + hans/hennes wordt in één woord vars." }] }
