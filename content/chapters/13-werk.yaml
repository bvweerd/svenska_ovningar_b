chapter: 13
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan de lijdende vorm met -s herkennen en maken, zoals in vacatures en regels (kaffe serveras, huset byggdes)", topics: [passiv-s] }
  - { text: "Ik kan iemand of iets nader beschrijven met som", topics: [relativ-som] }
  - { text: "Ik ken de vaste zinnen voor een korte, formele mail", topics: [formell-mail] }

grammar:
  - id: passiv-s
    title: De lijdende vorm met -s
    summary: "Werkwoord + **-s**: *Kaffe serveras klockan tio. Huset byggdes 1925. Mejlet har skickats.* Wie het doet, komt (als dat nodig is) na **av**."
    body: |
      Met de lijdende vorm (passief) staat de **handeling** centraal, niet wie het doet. In het Zweeds plak je meestal een **-s** aan het werkwoord. Dat zie je veel in vacatures, regels, nieuws en formele teksten.

      - *Personalen **anställs** av chefen.* – Het personeel wordt door de baas aangenomen.
      - *Ansökan **skickas** till Petra.* – De sollicitatie wordt naar Petra gestuurd.

      Wie het doet, noem je alleen als dat nodig is, met **av**: *Boken skrevs **av** en känd författare.*

      ### De vormen
      | infinitief | presens | preteritum | supinum |
      |---|---|---|---|
      | måla*s* | mål**as** | målad**es** | har målat**s** |
      | köpa*s* | köp**s** | köpt**es** | har köpt**s** |
      | bygga*s* | bygg**s** | byggd**es** | har byggt**s** |
      | läsa*s* | läs**es** | läst**es** | har läst**s** |
      | skriva*s* | skriv**s** | skrev**s** | har skrivit**s** |
      | göra*s* | gör**s** | gjord**es** | har gjort**s** |

      Zo onthoud je het:
      - **presens**: *-ar* wordt *-as*; *-er* wordt *-s* (*köper → köps*). Eindigt de stam op een *s*, dan *-es*: *läser → läses*.
      - **preteritum**: de gewone verleden tijd + *-s*: *målade → målades*, *skrev → skrevs*.
      - **supinum**: *har* + supinum + *-s*: *har målats*.
      - Na een modaal werkwoord: infinitief + *-s*: *Ansökan **måste skickas** före fredag.*

      ### Let op
      - Werkwoorden als *hoppas, finns, trivs* en *ses* eindigen ook op -s, maar zijn **niet** lijdend. Die komen in hoofdstuk 16 terug.
      - In advertenties zie je soms de ouderwetse vorm op **-es**: *Lägenhet uthyres, Personal sökes*. Gewoon Zweeds is *söks*.

  - id: relativ-som
    title: Betrekkelijke bijzinnen met som
    summary: "**som** = die/dat: *en kollega **som** kommer från Chile*. In de bijzin staat *inte* vóór het werkwoord: *ett jobb som **inte kräver** erfarenhet*. Is *som* lijdend voorwerp, dan mag het weg."
    body: |
      Met **som** voeg je informatie toe over een zelfstandig naamwoord. *Som* is hetzelfde voor en-woorden, ett-woorden en meervoud.

      - *Jag har en kollega. Hon kommer från Chile.* → *Jag har en kollega **som** kommer från Chile.*
      - *Det är ett företag **som** säljer möbler.*

      ### Bijzinvolgorde
      Een *som*-zin is een bijzin. Woorden als *inte, aldrig, alltid* staan daarom **vóór** het werkwoord:

      - *en chef som **inte lyssnar***
      - *en kollega som **aldrig kommer** i tid*

      ### Wanneer mag som weg?
      - Is *som* het **onderwerp** van de bijzin, dan moet het blijven: *Mannen **som** bor här är polis.*
      - Is *som* het **lijdend voorwerp**, dan mag het weg: *Boken (som) jag läser är spännande.*

      Een snelle test: staat er direct na *som* een onderwerp (*jag, du, hon, Petra* …)? Dan mag *som* weg.

      ### Voorzetsel aan het eind
      Het voorzetsel blijft achteraan staan, net als vaak in het Nederlands: *kontoret som jag jobbar **på***, *kollegan som jag delar rum **med***.

      Verder herhaal je het woord niet: ~~*annonsen som du skickade **den***~~ → *annonsen som du skickade*.

  - id: formell-mail
    title: Een formele mail
    summary: "Begin met **Hej Petra,** of **Hej!** (ook formeel heel gewoon). Gebruik **jag skriver angående …**, **jag ser fram emot att …** en sluit af met **Med vänliga hälsningar**."
    body: |
      Zweden spreken elkaar bijna altijd met **du** aan, ook in formele situaties. Een sollicitatie begint dus gewoon met *Hej Petra,* of, als je geen naam weet, met *Hej!*. *Ni* gebruik je als je een organisatie of meerdere mensen aanspreekt: *Jag ser fram emot att höra från **er**.*

      | Deel | Voorbeeld |
      |---|---|
      | aanhef | *Hej Petra,* · *Hej!* |
      | reden | *Jag skriver angående tjänsten som …* · *Jag vill ansöka om tjänsten som …* |
      | ervaring | *Jag har arbetat med … i fyra år.* · *Jag har erfarenhet av …* |
      | motivatie | *Jag är intresserad av …* · *Jag tycker om att …* |
      | bijlage | *Jag bifogar mitt cv.* · *Bifogat finns mitt cv.* |
      | afsluiting | *Jag ser fram emot att höra från er.* · *Tack för att du läser min ansökan.* |
      | groet | *Med vänliga hälsningar* · *Vänliga hälsningar* |

      Informeel (vrienden, collega's): *Tjena!*, *Hörs!*, *Ses!*, *Kram!*. Die passen niet in een sollicitatie.

sections:
  - id: lasa
    title: Läsa · lezen
    intro: Een vacature lezen en begrijpen.
    exercises:
      - id: lasa-annons
        title: "Lezen: een vacature"
        instruction: Lees de vacature en beantwoord de vragen.
        topic: woordenschat
        textTitle: "Lindhem AB söker kundtjänstmedarbetare"
        text: |
          Lindhem AB säljer möbler och inredning på nätet. Företaget grundades 2009 i Örebro och har i dag 120 anställda. Våra möbler tillverkas i Sverige och Polen, och alla varor som beställs på webbplatsen levereras inom fem arbetsdagar. Under det senaste året har antalet kunder ökat kraftigt, och därför behöver vi förstärka vår kundtjänst.

          Vi söker nu en kundtjänstmedarbetare på heltid. Du kommer att svara på frågor från kunder via telefon, chatt och mejl. Arbetet sker på vårt kontor i Örebro, men en dag i veckan kan du arbeta hemifrån. I arbetet ingår också att ta hand om klagomål och returer. Du blir en del av ett team på åtta personer, och du får en grundlig introduktion under de första veckorna.

          Vi söker dig som har minst ett års erfarenhet av kundservice, talar och skriver svenska och engelska obehindrat och tycker om att lösa problem. Det är meriterande om du kan ett tredje språk, till exempel tyska eller nederländska.

          Tjänsten är en tillsvidareanställning med sex månaders provanställning. Vi erbjuder flexibla arbetstider och betalar halva ditt gymkort. Kontoret ligger bara fem minuters promenad från centralstationen. Lön enligt överenskommelse. Intervjuer hålls löpande, så skicka din ansökan så snart som möjligt, dock senast den 15 maj. Ansökan skickas via vår webbplats. Frågor om tjänsten besvaras av rekryteringsansvarig Petra Lind.
        items:
          - { id: mtu8, type: mc, prompt: "Vad säljer Lindhem?", options: ["möbler och inredning", "kläder och skor", "resor", "telefoner"], answer: 0 }
          - { id: rpdg, type: mc, prompt: "Hur ofta kan man arbeta hemifrån?", options: ["en dag i veckan", "två dagar i veckan", "varje dag", "aldrig"], answer: 0 }
          - { id: txtt, type: mc, prompt: "Vad är meriterande?", options: ["att kunna ett tredje språk", "att bo i Örebro", "att ha egen bil", "att ha jobbat på Lindhem förut"], answer: 0, tip: "Zoek het woord meriterande in de tekst." }
          - { id: 7mf5, type: truefalse, statement: "Man måste ha minst ett års erfarenhet av kundservice.", answer: true }
          - { id: hyhv, type: truefalse, statement: "Tjänsten är på deltid.", answer: false, tip: "Lees de tweede alinea nog eens.", correction: { answers: ["{Tjänsten|Den|Jobbet} är på heltid.", "Det är en heltidstjänst."] } }
          - { id: waue, type: truefalse, statement: "Man ska vänta till den 15 maj med att skicka sin ansökan.", answer: false, tip: "Wanneer worden de gesprekken gehouden?", correction: { answers: ["{Man ska|Man bör|Man kan} skicka {sin ansökan|ansökan|den} {så snart [som ]möjligt|direkt|nu}[, dock senast den 15 maj].", "{Du ska|Du bör|Du kan} skicka {din ansökan|ansökan|den} {så snart [som ]möjligt|direkt|nu}[, dock senast den 15 maj].", "{Man ska skicka sin|Du ska skicka din} ansökan senast den 15 maj.", "{Man|Du} behöver inte vänta[ till den 15 maj]."] } }
          - { id: cg3k, type: truefalse, statement: "Lindhems möbler tillverkas bara i Sverige.", answer: false, tip: "Lees de eerste alinea nog eens.", correction: { answers: ["{Möblerna|De|Lindhems möbler} tillverkas [både ]i Sverige och [i ]Polen.", "{Möblerna|De|Lindhems möbler} tillverkas inte bara i Sverige.", "{Möblerna|De|Lindhems möbler} tillverkas också i Polen."] } }
          - { id: 6bhn, type: mc, prompt: "Wat betekent *Lön enligt överenskommelse*?", options: ["Het salaris wordt in overleg bepaald.", "Het salaris staat vast in de cao.", "Er is geen salaris.", "Het salaris is voor iedereen gelijk."], answer: 0 }
          - { id: qrmd, type: mc, prompt: "Wat is een *tillsvidareanställning*?", options: ["een vaste aanstelling", "een tijdelijk contract", "een stage", "een oproepcontract"], answer: 0, tip: "tills vidare = tot nader order, dus zonder einddatum." }
          - id: j2wt
            type: multi
            topic: passiv-s
            prompt: "Welke werkwoorden in de tekst staan in de lijdende vorm?"
            options: ["grundades", "hålls", "skickas", "besvaras", "söker", "sker"]
            answers: [0, 1, 2, 3]
            tip: "sker (gebeurt) eindigt op -r: dat is gewoon presens van ske."

      - id: makkelijk-1
        title: "Makkelijk lezen: Ett nytt jobb"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Ett nytt jobb"
        text: |
          Linda har fått ett nytt jobb på ett kafé i Göteborg. Kaféet öppnas klockan sju varje morgon, och Linda börjar halv sju. Först bakas bullarna, sedan görs smörgåsarna. På förmiddagen kommer många kunder, och då måste alla jobba snabbt. Chefen, som heter Amir, är lugn och snäll. Lönen betalas ut den 25:e varje månad. Linda har en provanställning på sex månader. Om allt går bra får hon sedan en tillsvidareanställning. Hon trivs redan bra.
        items:
          - { id: 57z2, type: truefalse, statement: "Kaféet öppnas klockan sju.", answer: true }
          - { id: 5kqd, type: truefalse, statement: "Linda har en tillsvidareanställning.", answer: false }
          - { id: 294g, type: truefalse, statement: "Chefen heter Amir.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Ett tack efter intervjun"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Ett tack efter intervjun"
        text: |
          Hej Petra! Tack för intervjun i måndags. Jag tyckte att det var ett bra samtal. Jag fick veta mycket om tjänsten och om företaget, som jag tycker är intressant. Ni frågade om jag kan börja i juni. Det kan jag gärna. Mina papper har redan skickats via er webbplats, men jag bifogar mitt cv en gång till. Jag ser fram emot att höra från er. Med vänliga hälsningar, Daan Visser
        items:
          - { id: 3arx, type: truefalse, statement: "Intervjun var i måndags.", answer: true }
          - { id: m78q, type: truefalse, statement: "Daan kan inte börja i juni.", answer: false }
          - { id: hjmr, type: truefalse, statement: "Daan bifogar sitt cv.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: Första dagen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Första dagen"
        text: |
          Ali började på ett nytt jobb i en butik i måndags. Hans chef, som heter Karin, visade honom runt. Sedan fick han en tröja med företagets namn på. Alla i butiken har en sådan. Butiken öppnas klockan nio och stängs klockan sju. Personalen äter lunch i ett rum bakom butiken. Ali fick en kollega, Johan, som ska hjälpa honom den första veckan. På kvällen var Ali trött men nöjd.
        items:
          - { id: brrm, type: truefalse, statement: "Ali började i butiken i måndags.", answer: true }
          - { id: hukz, type: mc, prompt: "Vem ska hjälpa Ali den första veckan?", options: ["Karin.", "Johan.", "Amir."], answer: 1 }
          - { id: xyvt, type: truefalse, statement: "Butiken stängs klockan fem.", answer: false }

      - id: makkelijk-4
        title: "Makkelijk lezen: Schemat"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Schemat"
        text: |
          På sjukhuset där Sofia jobbar skickas schemat ut fyra veckor innan. Sofia jobbar ofta kväll, men nästa vecka har hon två dagpass. Om man vill byta ett pass, måste chefen säga ja. Sofia vill byta sitt pass på lördag, eftersom hennes syster fyller trettio. Hon frågar sin kollega Erik, som gärna vill byta. Chefen säger ja, och schemat ändras samma dag. Nu kan Sofia gå på festen.
        items:
          - { id: tw3s, type: truefalse, statement: "Schemat skickas ut en vecka innan.", answer: false }
          - { id: j2jr, type: mc, prompt: "Varför vill Sofia byta pass?", options: ["Hon är sjuk.", "Hennes syster fyller år.", "Hon ska resa bort."], answer: 1 }
          - { id: vs6q, type: truefalse, statement: "Erik vill gärna byta pass med Sofia.", answer: true }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-uttryck
        title: Uitdrukkingen op het werk
        instruction: Koppel de uitdrukking aan de betekenis.
        topic: woordenschat
        items:
          - id: x988
            type: match
            pairs:
              - ["söka ett jobb", "solliciteren naar een baan"]
              - ["gå på intervju", "op sollicitatiegesprek gaan"]
              - ["jobba övertid", "overwerken"]
              - ["vara sjukskriven", "ziek gemeld zijn"]
              - ["säga upp sig", "ontslag nemen"]
              - ["bli uppsagd", "ontslagen worden"]
              - ["gå i pension", "met pensioen gaan"]
          - id: t4ss
            type: match
            pairs:
              - ["på heltid", "voltijds"]
              - ["på deltid", "deeltijds"]
              - ["en provanställning", "een proeftijd"]
              - ["en arbetsgivare", "een werkgever"]
              - ["meriterande", "een pré"]
              - ["obehindrat", "vloeiend, zonder moeite"]

      - id: ord-invullen
        title: Het goede woord
        instruction: Kies het woord dat past.
        topic: woordenschat
        shuffle: true
        items:
          - { id: bnh3, type: gap, text: "Hon har stor ___ av kundservice.", gaps: [{ answers: ["erfarenhet"], options: ["erfarenhet", "utbildning", "lön", "semester"] }] }
          - { id: th5k, type: gap, text: "Vilken ___ har du? – Jag har läst ekonomi på universitetet.", gaps: [{ answers: ["utbildning"], options: ["erfarenhet", "utbildning", "lön", "semester"] }] }
          - { id: 8rna, type: gap, text: "Hur hög är ___? – 32 000 kronor i månaden.", gaps: [{ answers: ["lönen"], options: ["lönen", "tjänsten", "chefen", "kravet"] }] }
          - { id: tet8, type: gap, text: "Vi har ___ varje måndag klockan nio.", gaps: [{ answers: ["möte"], options: ["möte", "intervju", "kollega", "lön"] }] }
          - { id: 84qq, type: gap, text: "Jag har jobbat här i fem år och jag ___ jättebra.", gaps: [{ answers: ["trivs"], options: ["trivs", "söker", "anställs", "slutar"], feedback: [{ match: "anställs", tip: "anställs = wordt aangenomen. Hier gaat het om je prettig voelen: trivs." }] }] }
          - { id: nkcq, type: gap, text: "Företaget ska ___ tre nya säljare i höst.", gaps: [{ answers: ["anställa"], options: ["anställa", "arbeta", "trivas", "säga upp sig"], feedback: [{ match: "säga upp sig", tip: "säga upp sig = zelf ontslag nemen. Nieuwe verkopers in dienst nemen: anställa." }] }] }

      - id: ord-jobbet-gap
        title: "Woorden in een zin: op het werk"
        instruction: Kies het woord dat past.
        topic: woordenschat
        shuffle: true
        items:
          - { id: 98pe, type: gap, text: "Min ___ betalar för en kurs i svenska, eftersom jag behöver svenska i jobbet.", gaps: [{ answers: ["arbetsgivare"], options: ["arbetsgivare", "sökande", "referens", "rast"], feedback: [{ match: "sökande", tip: "*en sökande* is een sollicitant. Wie je cursus betaalt: je *arbetsgivare* (werkgever)." }] }] }
          - { id: awmg, type: gap, text: "Det finns många ___ i annonsen: man ska ha körkort, tala engelska och ha minst fem års erfarenhet.", gaps: [{ answers: ["krav"], options: ["krav", "avtal", "raster", "referenser"], feedback: [{ match: "avtal", tip: "*ett avtal* is een overeenkomst. Wat je moet hebben of kunnen: *krav* (eisen)." }] }] }
          - { id: 3yth, type: gap, text: "Det viktigaste för mig är att ___ på jobbet och ha trevliga kollegor.", gaps: [{ answers: ["trivas"], options: ["trivas", "avsluta", "befordra", "rekrytera"], feedback: [{ match: "befordra", tip: "*befordra* is promotie geven. Het naar je zin hebben = *trivas*." }] }] }
          - { id: dc39, type: gap, text: "Han tänker ___ och börja på ett annat företag i höst.", gaps: [{ answers: ["säga upp sig"], options: ["säga upp sig", "bli uppsagd", "hoppa in", "befordra"], feedback: [{ match: "bli uppsagd", tip: "*bli uppsagd* is ontslagen worden, en dat plan je niet. Zelf ontslag nemen = *säga upp sig*." }] }] }
          - { id: z9dp, type: gap, text: "Företaget går dåligt, och Ali är rädd för att ___.", gaps: [{ answers: ["bli uppsagd"], options: ["bli uppsagd", "säga upp sig", "hoppa in", "samarbeta"], feedback: [{ match: "säga upp sig", tip: "*säga upp sig* is zelf ontslag nemen. Als het slecht gaat met het bedrijf, ben je bang om *uppsagd* (ontslagen) te worden." }] }] }
          - { id: ne96, type: gap, text: "Vår ___ har ett stort kök där alla äter lunch tillsammans.", gaps: [{ answers: ["arbetsplats"], options: ["arbetsplats", "anställning", "arbetsuppgift", "bransch"], feedback: [{ match: "anställning", tip: "*en anställning* is een dienstverband. De plek waar je werkt: *arbetsplats*." }] }] }
          - { id: gqha, type: gap, text: "Hon fick en fast ___ efter sex månader som vikarie.", gaps: [{ answers: ["anställning"], options: ["anställning", "arbetsplats", "praktik", "uppsägning"], feedback: [{ match: "praktik", tip: "*en praktik* is een stage. Een vaste baan = *en fast anställning*." }] }] }
          - { id: ahpu, type: gap, text: "En av mina ___ är att svara på mejl från kunder.", gaps: [{ answers: ["arbetsuppgifter"], options: ["arbetsuppgifter", "raster", "referenser", "kompetenser"], feedback: [{ match: "kompetenser", tip: "*kompetenser* zijn bekwaamheden. Wat je moet doen op je werk: *arbetsuppgifter*." }] }] }
          - { id: 6ztd, type: gap, text: "Som chef har man ett stort ___ för sina medarbetare.", gaps: [{ answers: ["ansvar"], options: ["ansvar", "avtal", "krav", "yrkesliv"], feedback: [{ match: "krav", tip: "*ett krav* is een eis. Verantwoordelijkheid = *ansvar*." }] }] }
          - { id: hyeg, type: gap, text: "Vi tar en kort ___ klockan tio och dricker kaffe.", gaps: [{ answers: ["rast"], options: ["rast", "praktik", "bransch", "anställning"], feedback: [{ match: "praktik", tip: "*en praktik* is een stage. Een korte pauze = *en rast*." }] }] }
          - { id: 7yag, type: gap, text: "Under sitt långa ___ har hon jobbat på fem olika sjukhus.", gaps: [{ answers: ["yrkesliv"], options: ["yrkesliv", "avtal", "ansvar", "krav"], feedback: [{ match: "ansvar", tip: "*ansvar* is verantwoordelijkheid. Je hele loopbaan = *yrkesliv*." }] }] }
          - { id: kjvv, type: gap, text: "Han ___ för ekonomin på företaget, så alla fakturor går till honom.", gaps: [{ answers: ["ansvarar"], options: ["ansvarar", "samarbetar", "rekryterar", "befordrar"], feedback: [{ match: "samarbetar", tip: "*samarbeta* is samenwerken. Verantwoordelijk zijn voor = *ansvara för*." }] }] }
          - { id: z4mn, type: gap, text: "Hon ___ kundkontakterna, medan jag tar hand om ekonomin.", gaps: [{ answers: ["sköter"], options: ["sköter", "rekryterar", "befordrar", "trivs"], feedback: [{ match: "rekryterar", tip: "*rekrytera* is personeel werven. Iets regelen of beheren = *sköta*." }] }] }

      - id: ord-rattigheter-gap
        title: "Woorden in een zin: rechten en regels"
        instruction: Kies het woord dat past.
        topic: woordenschat
        shuffle: true
        items:
          - { id: 2djf, type: gap, text: "Om man är med i en ___, kan man få hjälp vid problem med chefen.", gaps: [{ answers: ["fackförening"], options: ["fackförening", "bransch", "praktik", "anställning"], feedback: [{ match: "bransch", tip: "*en bransch* is een sector. Een vakbond = *en fackförening*." }] }] }
          - { id: 6b8y, type: gap, text: "Reglerna om lön och semester står i ___, som gäller för hela branschen.", gaps: [{ answers: ["kollektivavtalet"], options: ["kollektivavtalet", "yrkeslivet", "ansvaret", "kravet"], feedback: [{ match: "kravet", tip: "*ett krav* is een eis. Afspraken over loon en vakantie voor een hele sector: *kollektivavtalet* (de cao)." }] }] }
          - { id: xb4c, type: gap, text: "Företaget måste spara pengar, så hon fick sin ___ i februari och slutar i maj.", gaps: [{ answers: ["uppsägning"], options: ["uppsägning", "löneförhöjning", "anställning", "föräldraledighet"], feedback: [{ match: "löneförhöjning", tip: "*en löneförhöjning* is een loonsverhoging. Het bedrijf moet bezuinigen, dus ze krijgt haar ontslag: *uppsägning*." }] }] }
          - { id: ruzy, type: gap, text: "Efter tre år utan ___ bad han chefen om mer pengar.", gaps: [{ answers: ["löneförhöjning"], options: ["löneförhöjning", "uppsägning", "föräldraledighet", "rast"], feedback: [{ match: "uppsägning", tip: "*en uppsägning* is een ontslag. Meer geld = *en löneförhöjning*." }] }] }
          - { id: uya7, type: gap, text: "I Sverige har både mamman och pappan rätt till ___ när de får barn.", gaps: [{ answers: ["föräldraledighet"], options: ["föräldraledighet", "löneförhöjning", "uppsägning", "praktik"], feedback: [{ match: "löneförhöjning", tip: "*en löneförhöjning* is een loonsverhoging. Verlof als je een kind krijgt = *föräldraledighet*." }] }] }
          - { id: kd93, type: gap, text: "Bra ljus, tysta rum och trevliga kollegor ger en bra ___.", gaps: [{ answers: ["arbetsmiljö"], options: ["arbetsmiljö", "arbetsuppgift", "anställning", "bransch"], feedback: [{ match: "arbetsuppgift", tip: "*en arbetsuppgift* is een taak. Licht, rust en collega's samen: *arbetsmiljö* (werkomgeving)." }] }] }
          - { id: r2b6, type: gap, text: "Under utbildningen gör alla studenter tio veckors ___ på ett företag.", gaps: [{ answers: ["praktik"], options: ["praktik", "rast", "uppsägning", "föräldraledighet"], feedback: [{ match: "rast", tip: "*en rast* is een pauze. Tien weken meewerken tijdens je opleiding = *praktik* (stage)." }] }] }
          - { id: s859, type: gap, text: "Vi skrev ett ___ om priset innan vi började jobba ihop.", gaps: [{ answers: ["avtal"], options: ["avtal", "ansvar", "krav", "yrkesliv"], feedback: [{ match: "krav", tip: "*ett krav* is een eis. Een afspraak op papier = *ett avtal*." }] }] }
          - { id: b2h6, type: gap, text: "Jobbet är bara ___: det slutar när läraren som jobbar där kommer tillbaka från sin föräldraledighet.", gaps: [{ answers: ["tillfälligt"], options: ["tillfälligt", "flexibelt", "kunnigt", "ansvarsfullt"], feedback: [{ match: "flexibelt", tip: "*flexibel* is flexibel. Een baan die stopt = *tillfällig* (tijdelijk)." }] }] }
          - { id: 944j, type: gap, text: "Han är ___ sedan i våras och söker nytt jobb varje dag.", gaps: [{ answers: ["arbetslös"], options: ["arbetslös", "flexibel", "kunnig", "stressig"], feedback: [{ match: "kunnig", tip: "*kunnig* is deskundig. Zonder werk = *arbetslös*." }] }] }
          - { id: d3mn, type: gap, text: "Min chef är väldigt ___: jag får börja och sluta när jag vill.", gaps: [{ answers: ["flexibel"], options: ["flexibel", "stressig", "arbetslös", "tillfällig"], feedback: [{ match: "stressig", tip: "*stressig* is hectisch. Wie je laat kiezen, is *flexibel*." }] }] }
          - { id: 658g, type: gap, text: "Det är ett ___ jobb, för man fattar viktiga beslut varje dag.", gaps: [{ answers: ["ansvarsfullt"], options: ["ansvarsfullt", "arbetslöst", "kunnigt", "flexibelt"], feedback: [{ match: "kunnigt", tip: "*kunnig* zeg je van een persoon (deskundig). Een baan met grote beslissingen is *ansvarsfull*." }] }] }
          - { id: w34d, type: gap, text: "Före jul är det väldigt ___ i butiken, och vi hinner knappt äta lunch.", gaps: [{ answers: ["stressigt"], options: ["stressigt", "flexibelt", "kunnigt", "tillfälligt"], feedback: [{ match: "flexibelt", tip: "*flexibel* is flexibel. Geen tijd om te eten = *stressigt* (hectisch)." }] }] }

      - id: ord-karriar-gap
        title: "Woorden in een zin: personeel en loopbaan"
        instruction: Kies het woord dat past.
        topic: woordenschat
        shuffle: true
        items:
          - { id: 7g6d, type: gap, text: "Det finns över hundra ___ till jobbet, så det tar tid att läsa alla ansökningar.", gaps: [{ answers: ["sökande"], options: ["sökande", "arbetsgivare", "branscher", "referenser"], feedback: [{ match: "arbetsgivare", tip: "*en arbetsgivare* is een werkgever. Wie solliciteert: *en sökande* (meervoud ook *sökande*)." }] }] }
          - { id: 9kbr, type: gap, text: "Kan du ge mig namnet på en tidigare chef som kan vara ___?", gaps: [{ answers: ["referens"], options: ["referens", "sökande", "arbetsgivare", "kompetens"], feedback: [{ match: "sökande", tip: "*en sökande* is een sollicitant. Iemand die iets goeds over je kan zeggen: *en referens*." }] }] }
          - { id: gqwc, type: gap, text: "Företaget växer och ska ___ tio nya ingenjörer i år.", gaps: [{ answers: ["rekrytera"], options: ["rekrytera", "befordra", "avsluta", "utföra"], feedback: [{ match: "befordra", tip: "*befordra* is promotie geven (aan wie er al werkt). Nieuwe mensen aannemen = *rekrytera*." }] }] }
          - { id: mwem, type: gap, text: "I vårt team ___ alla, och ingen jobbar ensam.", gaps: [{ answers: ["samarbetar"], options: ["samarbetar", "sköter", "ansvarar", "utför"], feedback: [{ match: "ansvarar", tip: "*ansvara för* is verantwoordelijk zijn voor iets. Samenwerken = *samarbeta*." }] }] }
          - { id: n3pa, type: gap, text: "Kan du ___ för mig på fredag? Jag måste gå till tandläkaren.", gaps: [{ answers: ["hoppa in"], options: ["hoppa in", "säga upp sig", "avsluta", "befordra"], feedback: [{ match: "säga upp sig", tip: "*säga upp sig* is ontslag nemen. Voor iemand invallen = *hoppa in*." }] }] }
          - { id: h8gn, type: gap, text: "Vi måste ___ projektet före sommaren.", gaps: [{ answers: ["avsluta"], options: ["avsluta", "rekrytera", "trivas", "hoppa in"], feedback: [{ match: "rekrytera", tip: "*rekrytera* is personeel werven. Iets afronden = *avsluta*." }] }] }
          - { id: 8scx, type: gap, text: "Elektrikern ___ arbetet snabbt och noggrant.", gaps: [{ answers: ["utförde"], options: ["utförde", "rekryterade", "befordrade", "trivdes"], feedback: [{ match: "rekryterade", tip: "*rekrytera* is personeel werven. Werk uitvoeren = *utföra*." }] }] }
          - { id: n4tu, type: gap, text: "Hon är väldigt ___ inom IT och hjälper alla med datorerna.", gaps: [{ answers: ["kunnig"], options: ["kunnig", "arbetslös", "tillfällig", "stressig"], feedback: [{ match: "tillfällig", tip: "*tillfällig* is tijdelijk. Iemand die er veel van weet, is *kunnig*." }] }] }
          - { id: qtsd, type: gap, text: "Han har jobbat i samma ___ i tjugo år: hotell och restauranger.", gaps: [{ answers: ["bransch"], options: ["bransch", "rast", "praktik", "anställning"], feedback: [{ match: "anställning", tip: "*en anställning* is een dienstverband. Een hele sector, zoals hotels en restaurants: *en bransch*." }] }] }
          - { id: twsx, type: gap, text: "Vilka ___ behöver man för det här jobbet? Man måste kunna både programmera och leda ett team.", gaps: [{ answers: ["kompetenser"], options: ["kompetenser", "raster", "branscher", "uppsägningar"], feedback: [{ match: "branscher", tip: "*branscher* zijn sectoren. Wat je moet kunnen: *kompetenser*." }] }] }
          - { id: jxkd, type: gap, text: "Efter två år blev hon ___ till chef för hela avdelningen.", gaps: [{ answers: ["befordrad"], options: ["befordrad", "uppsagd", "arbetslös", "avslutad"], feedback: [{ match: "uppsagd", tip: "*bli uppsagd* is ontslagen worden. Chef worden = *bli befordrad* (promotie krijgen)." }] }] }

  - id: passiv
    title: "Grammatik: de lijdende vorm"
    exercises:
      - id: ontdek-passiv-s
        title: Ontdek de regel – de lijdende vorm met -s
        instruction: Bekijk de voorbeelden en ontdek zelf de regel. Pas hem daarna toe. De uitleg staat ook op de kaart.
        topic: passiv-s
        items:
          - id: bks7
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *Man målar huset. → Huset målas.* *Man serverar kaffe klockan tio. → Kaffe serveras klockan tio.* Wat valt op?", options: ["Het lijdend voorwerp wordt het onderwerp, en het werkwoord krijgt -s.", "Het werkwoord krijgt -de, het onderwerp blijft hetzelfde.", "Er komt altijd av + persoon achter."], answer: 0, tip: "*huset* en *kaffe* staan nu vooraan als onderwerp, en *målar* wordt *målas*." }
              - { type: gap, text: "Man städar kontoret varje dag. → Kontoret ___ varje dag.", gaps: [{ answers: ["städas"], feedback: [{ match: "städar", tip: "Dat is de actieve vorm. Het kantoor doet niets zelf: städar wordt städas." }, { match: "städades", tip: "Dat is de verleden tijd. De zin staat in de presens: städas." }] }] }
          - id: ycyy
            type: steps
            steps:
              - { type: mc, prompt: "Kijk: *köper → köps*, *bygger → byggs*, maar *läser → läses*. Wanneer wordt het -es?", options: ["Als de stam al op een s eindigt.", "Bij lange werkwoorden.", "In de verleden tijd."], answer: 0, tip: "läs- eindigt al op een s: dan schrijf je -es, läses." }
              - { type: gap, text: "Man läser alla ansökningar noga. → Alla ansökningar ___ noga.", gaps: [{ answers: ["läses"], feedback: [{ match: "läss", retry: true, tip: "Dat hoor je soms in spreektaal, maar in geschreven Zweeds is het läses: de stam eindigt al op s." }, { match: "läsas", tip: "läsas is de infinitief (na bijvoorbeeld måste). Presens: läses." }] }] }

      - id: passiv-of-niet
        title: Lijdend of niet?
        instruction: Is het werkwoord op **-s** een lijdende vorm, of een werkwoord dat altijd op -s eindigt?
        topic: passiv-s
        items:
          - id: hp2f
            type: sort
            prompt: "Deel de zinnen in."
            categories: ["lijdende vorm", "altijd op -s"]
            items:
              - { text: "Dörren **stängs** automatiskt.", cat: 0 }
              - { text: "Jag **hoppas** att du mår bra.", cat: 1, tip: "hoppas (hopen) eindigt altijd op -s; er wordt niets met iemand gedaan." }
              - { text: "Det **finns** kaffe i köket.", cat: 1, tip: "finnas (er zijn) eindigt altijd op -s." }
              - { text: "Rapporten **skrevs** av två forskare.", cat: 0 }
              - { text: "Vi **ses** i morgon!", cat: 1, tip: "ses = elkaar zien. Dat is wederkerig, niet lijdend." }
              - { text: "Bilen **tvättas** varje lördag.", cat: 0 }
              - { text: "Hon **trivs** på sitt nya jobb.", cat: 1, tip: "trivas = het naar je zin hebben; altijd op -s." }
              - { text: "Lönen **betalas** ut i slutet av månaden.", cat: 0 }

      - id: passiv-presens
        title: Lijdende vorm – presens
        instruction: Vul de lijdende vorm in de **presens** in.
        topic: passiv-s
        shuffle: true
        items:
          - { id: ek4w, type: gap, text: "Kaffe ___ (servera) varje morgon klockan nio.", gaps: [{ answers: ["serveras"], feedback: [{ match: "serverar", tip: "Dat is de actieve vorm. De koffie doet niets zelf: gebruik de -s-vorm." }, { match: "serverades", tip: "Dat is de verleden tijd. Varje morgon vraagt om de presens." }] }] }
          - { id: yjaq, type: gap, text: "Ansökan ___ (skicka) till Petra Lind.", gaps: [{ answers: ["skickas"], feedback: [{ match: "skickar", tip: "Dat is de actieve vorm. De sollicitatie wordt verstuurd: skickas." }] }] }
          - { id: 2gzy, type: gap, text: "På kontoret ___ (tala) både svenska och engelska.", gaps: [{ answers: ["talas"] }] }
          - { id: ryww, type: gap, text: "Mötet ___ (hålla) i konferensrummet.", gaps: [{ answers: ["hålls"], feedback: [{ match: ["hållas", "hålles"], tip: "hålla → håller: haal -er weg en zet er -s achter: hålls." }, { match: "håller", tip: "Dat is de actieve vorm: hålls." }] }] }
          - { id: je52, type: gap, text: "Lönen ___ (betala) ut den 25:e varje månad.", gaps: [{ answers: ["betalas"] }] }
          - { id: x23z, type: gap, text: "Tidningen ___ (läsa) av många.", gaps: [{ answers: ["läses"], feedback: [{ match: ["läss", "läsas"], tip: "De stam eindigt al op s: dan wordt het -es: läses." }] }] }
          - { id: f3ut, type: gap, text: "Alla nya medarbetare ___ (visa) runt den första dagen.", gaps: [{ answers: ["visas"] }] }
          - { id: 2gcf, type: gap, text: "Beslutet ___ (fatta) av chefen.", gaps: [{ answers: ["fattas"] }] }

      - id: passiv-preteritum
        title: Lijdende vorm – verleden tijd
        instruction: Vul de lijdende vorm in de **preteritum** in.
        topic: passiv-s
        shuffle: true
        items:
          - { id: my5c, type: gap, text: "Huset ___ (bygga) 1925.", gaps: [{ answers: ["byggdes"], feedback: [{ match: "byggs", tip: "Dat is de presens. 1925 is verleden: byggde + s." }, { match: "byggades", tip: "bygga is een -er-werkwoord: byggde → byggdes." }] }] }
          - { id: f6qf, type: gap, text: "Tjänsten ___ (annonsera) i mars.", gaps: [{ answers: ["annonserades"] }] }
          - { id: 57vu, type: gap, text: "Hon ___ (anställa) förra året.", gaps: [{ answers: ["anställdes"], feedback: [{ match: "anställde", tip: "Dat is actief: zij nam iemand aan. Hier wordt zij aangenomen: anställdes." }] }] }
          - { id: wxgs, type: gap, text: "Boken ___ (skriva) av en känd författare.", gaps: [{ answers: ["skrevs"], feedback: [{ match: ["skrivades", "skrivdes"], tip: "skriva is sterk: skrev. Met -s: skrevs." }] }] }
          - { id: tzsf, type: gap, text: "Mejlet ___ (skicka) i går kväll.", gaps: [{ answers: ["skickades"] }] }
          - { id: 9xcf, type: gap, text: "Företaget ___ (köpa) av en tysk koncern.", gaps: [{ answers: ["köptes"], feedback: [{ match: "köpades", tip: "köpa → köpte (k, p, s, t: -te). Met -s: köptes." }] }] }
          - { id: vbp5, type: gap, text: "Min cykel ___ (stjäla) utanför jobbet.", gaps: [{ answers: ["stals"], feedback: [{ match: ["stjäldes", "stjälades"], tip: "stjäla is sterk: stal. Met -s: stals." }] }] }
          - { id: xuqk, type: gap, text: "Mötet ___ (ställa in) på grund av sjukdom.", hint: "ställa in = afgelasten. Het partikel blijft achter het werkwoord staan.", gaps: [{ answers: ["ställdes in", "inställdes"], feedback: [{ match: "ställdes", tip: "Vergeet het partikel niet: ställdes in." }] }] }

      - id: passiv-omvormen
        title: Van actief naar lijdend
        instruction: Schrijf de zin in de lijdende vorm met **-s**. Noem wie het doet alleen als dat in de zin staat (met *av*).
        topic: passiv-s
        items:
          - { id: wdka, type: transform, prompt: "Chefen leder mötet.", answers: ["Mötet leds av chefen."], feedback: [{ match: "Mötet ledes av chefen.", tip: "leda → leder: haal -er weg en zet -s erachter: leds." }] }
          - { id: 72rj, type: transform, prompt: "Många läser tidningen.", answers: ["Tidningen läses av många."] }
          - { id: yvu8, type: transform, prompt: "Man öppnar butiken klockan tio.", answers: ["Butiken öppnas klockan tio.", "Klockan tio öppnas butiken."], feedback: [{ contains: "av man", tip: "Man is onbepaald: dat laat je in de lijdende vorm weg." }] }
          - { id: n5se, type: transform, prompt: "Någon stal min cykel i går.", answers: ["Min cykel stals {i går|igår}.", "{I går|Igår} stals min cykel."], feedback: [{ contains: "blev stulen", tip: "Dat is ook goed Zweeds (bli-passief, volgend hoofdstuk). Gebruik hier de -s-vorm: stals." }, { contains: "av någon", tip: "Någon (iemand) is onbepaald: laat het weg." }] }
          - { id: 52mq, type: transform, prompt: "Företaget anställde tre nya ingenjörer.", answers: ["Tre nya ingenjörer anställdes[ av företaget]."] }
          - { id: n2dh, type: transform, prompt: "Man har renoverat kontoret.", answers: ["Kontoret har renoverats."], feedback: [{ match: "Kontoret renoverades.", tip: "Goed bedacht, maar houd de voltooide tijd aan: har + supinum + s." }] }
          - { id: 9w4f, type: transform, prompt: "Man måste skicka ansökan före fredag.", answers: ["Ansökan måste skickas före fredag.", "Före fredag måste ansökan skickas."], feedback: [{ contains: "måste skickar", tip: "Na een modaal werkwoord komt de infinitief: skicka + s = skickas." }] }
          - { id: 4sj3, type: transform, prompt: "Man städar kontoret varje kväll.", answers: ["Kontoret städas varje kväll.", "Varje kväll städas kontoret."], feedback: [{ contains: "av man", tip: "Man is onbepaald: dat laat je in de lijdende vorm weg." }] }

      - id: passiv-vertalen
        title: Vertaal met de lijdende vorm
        instruction: Vertaal naar het Zweeds. Gebruik de lijdende vorm met **-s**.
        topic: passiv-s
        shuffle: true
        items:
          - { id: dyfm, type: translate, prompt: "In de eerste week worden alle nieuwe medewerkers door de baas op kantoor rondgeleid.", answers: ["Alla {nya medarbetare|nyanställda} visas runt {på kontoret av chefen|av chefen på kontoret} {under den första veckan|under första veckan|den första veckan|första veckan}.", "{Under den första veckan|Under första veckan|Den första veckan|Första veckan} visas alla {nya medarbetare|nyanställda} runt {på kontoret av chefen|av chefen på kontoret}."], feedback: [{ contains: "visar runt", tip: "De medewerkers doen niets zelf: ze worden rondgeleid, visas runt." }] }
          - { id: 9nme, type: translate, prompt: "Het kantoor in Örebro werd in 2009 gebouwd en is vorig jaar helemaal gerenoveerd.", answers: ["Kontoret i Örebro byggdes [år ]2009 och {renoverades helt|renoverades helt och hållet|totalrenoverades} {förra året|i fjol}.", "Kontoret i Örebro byggdes [år ]2009 och {förra året|i fjol} {renoverades det helt|renoverades det helt och hållet|totalrenoverades det}."], feedback: [{ contains: "byggades", tip: "bygga is een -er-werkwoord: byggde → byggdes." }, { contains: ["har renoverats", "har det renoverats"], tip: "Met een afgesloten tijdstip in het verleden (förra året) gebruik je de preteritum: renoverades." }, { contains: "renoverade", tip: "Het kantoor renoveert niet zelf: renoverades." }] }
          - { id: b3vr, type: translate, prompt: "Alle sollicitaties moeten uiterlijk 15 mei via onze website worden verstuurd.", answers: ["Alla ansökningar {måste|ska} skickas[ in] {via vår webbplats senast [den ]15 maj|senast [den ]15 maj via vår webbplats|via vår hemsida senast [den ]15 maj|senast [den ]15 maj via vår hemsida}.", "Senast [den ]15 maj {måste|ska} alla ansökningar skickas[ in] via vår {webbplats|hemsida}."], feedback: [{ contains: ["måste skickar", "ska skickar"], tip: "Na een modaal werkwoord komt de infinitief, hier met -s: skickas." }, { contains: ["måste skickades", "ska skickades"], tip: "Na måste komt een infinitief: skickas." }] }
          - { id: kywm, type: translate, prompt: "Vragen over de functie worden beantwoord door Petra Lind, niet door de baas zelf.", answers: ["Frågor om {tjänsten|jobbet} besvaras av Petra Lind, inte [av ]chefen själv.", "Frågor om {tjänsten|jobbet} besvaras inte av chefen själv utan av Petra Lind."], feedback: [{ contains: "besvarar", tip: "De vragen doen niets zelf: ze worden beantwoord, besvaras." }, { contains: "frågor för tjänsten", tip: "Vragen over = frågor om." }] }
          - { id: kjat, type: translate, prompt: "Alle producten die op de website besteld worden, worden binnen vijf werkdagen geleverd.", answers: ["Alla {varor|produkter} som beställs {på webbplatsen|på hemsidan|via webbplatsen|via hemsidan} levereras inom fem arbetsdagar."], feedback: [{ contains: "som beställer", tip: "De producten bestellen niet zelf: som beställs." }, { contains: "levererar", tip: "De producten leveren niet zelf: levereras." }] }
          - { id: nj9a, type: translate, prompt: "Mijn cv is al verstuurd, maar het is nog niet door de baas gelezen.", answers: ["Mitt cv har redan skickats, men det har inte lästs av chefen {än|ännu}.", "Mitt cv har redan skickats, men det har {än|ännu} inte lästs av chefen.", "Mitt cv har redan skickats, men det har inte lästs {än|ännu} av chefen."], feedback: [{ contains: ["har läses", "har lästes", "har läst av"], tip: "Voltooide tijd in de lijdende vorm: har + supinum + s, har lästs." }, { contains: ["chefen har inte läst", "chefen har ännu inte läst", "chefen har än inte läst"], tip: "Goed Zweeds, maar gebruik hier de lijdende vorm: det har inte lästs av chefen." }, { contains: ["har skickat men", "har redan skickat"], tip: "Het cv verstuurt niet zelf: har skickats." }] }
          - { id: fdp4, type: translate, prompt: "De vergadering van maandag is afgelast omdat de baas ziek is.", answers: ["{Mötet på måndag|Måndagens möte|Måndagsmötet} {har ställts in|har inställts|ställdes in} {eftersom|för att|då} chefen är sjuk."], feedback: [{ contains: ["har ställt in", "ställde in"], tip: "De vergadering wordt afgelast, ze doet niets zelf: har ställts in." }, { contains: "har ställts av", tip: "Afgelasten = ställa in, als lijdende vorm har ställts in." }] }
          - { id: 3qwu, type: translate, prompt: "Het meubelbedrijf werd vorig jaar door een Zweedse familie uit Örebro gekocht.", answers: ["{Möbelföretaget|Företaget} köptes av en svensk familj från Örebro {förra året|i fjol}.", "{Möbelföretaget|Företaget} köptes {förra året|i fjol} av en svensk familj från Örebro.", "{Förra året|I fjol} köptes {möbelföretaget|företaget} av en svensk familj från Örebro."], feedback: [{ contains: "köpades", tip: "köpa → köpte (k, p, s, t: -te). Met -s: köptes." }, { contains: "familj ur örebro", tip: "Uit (een plaats) = från." }] }
          - { id: zz8a, type: translate, prompt: "Op kantoor worden zowel Zweeds als Engels gesproken, maar de meeste vergaderingen worden in het Zweeds gehouden.", answers: ["På kontoret {talas|pratas} [det ]både svenska och engelska, men de flesta {mötena|möten} hålls på svenska.", "Det {talas|pratas} både svenska och engelska på kontoret, men de flesta {mötena|möten} hålls på svenska.", "Både svenska och engelska {talas|pratas} på kontoret, men de flesta {mötena|möten} hålls på svenska."], feedback: [{ contains: ["talar man", "pratar man", "man talar", "man pratar"], tip: "Goed Zweeds, maar gebruik hier de lijdende vorm: på kontoret talas både svenska och engelska." }, { contains: ["hållas", "hålles", "håller"], tip: "hålla → håller: haal -er weg en zet -s erachter: hålls." }, { contains: "i svenska", tip: "In het Zweeds (een taal) = på svenska." }] }

  - id: som
    title: "Grammatik: zinnen met som"
    exercises:
      - id: som-combineren
        title: Twee zinnen worden één
        instruction: Maak van twee zinnen één zin met **som**.
        topic: relativ-som
        items:
          - { id: msmn, type: transform, prompt: "Jag har en kollega. Hon kommer från Chile.", answers: ["Jag har en kollega som kommer från Chile."] }
          - { id: gghb, type: transform, prompt: "Vi söker en person. Personen talar tyska.", answers: ["Vi söker en person som talar tyska."], feedback: [{ contains: "som personen", tip: "som vervangt het onderwerp: laat personen weg." }] }
          - { id: 4xcd, type: transform, prompt: "Det är ett företag. Det säljer möbler.", answers: ["Det är ett företag som säljer möbler."], feedback: [{ contains: "som det", tip: "som vervangt det: laat det weg." }] }
          - { id: gusj, type: transform, prompt: "Jag läste annonsen. Du skickade den till mig.", answers: ["Jag läste annonsen [som ]du skickade till mig."], feedback: [{ contains: "skickade den", tip: "som vervangt den: laat den weg." }] }
          - { id: g3hu, type: transform, prompt: "Hon har en chef. Chefen lyssnar inte på henne.", answers: ["Hon har en chef som inte lyssnar på henne."], feedback: [{ contains: "som lyssnar inte", tip: "In een bijzin staat inte vóór het werkwoord: som inte lyssnar." }] }
          - { id: p6jm, type: transform, prompt: "Det är kontoret. Jag jobbar på kontoret.", answers: ["Det är kontoret [som ]jag jobbar på.", "Det är kontoret där jag jobbar."], feedback: [{ contains: "på kontoret", tip: "Herhaal kontoret niet. Het voorzetsel blijft achteraan: … som jag jobbar på." }] }
          - { id: qjbk, type: transform, prompt: "Jag ringde till kunden. Han hade skickat ett klagomål.", answers: ["Jag ringde till kunden som hade skickat ett klagomål."] }
          - { id: 47he, type: transform, prompt: "Vi har en ny chef. Alla tycker om henne.", answers: ["Vi har en ny chef som alla tycker om."], feedback: [{ contains: "om henne", tip: "som vervangt henne: laat henne weg. Het voorzetsel om blijft achteraan." }] }

      - id: som-weglaten
        title: Mag som weg?
        instruction: Mag **som** in deze zin weg, of moet het blijven?
        topic: relativ-som
        items:
          - id: hwsu
            type: sort
            categories: ["som mag weg", "som moet blijven"]
            items:
              - { text: "Boken (som) jag läser är spännande.", cat: 0 }
              - { text: "Mannen (som) bor bredvid oss är polis.", cat: 1, tip: "som is hier het onderwerp (wie woont er?): het moet blijven." }
              - { text: "Jobbet (som) hon fick är på heltid.", cat: 0 }
              - { text: "En kollega (som) inte dricker kaffe.", cat: 1, tip: "Na som komt geen onderwerp: som is zelf het onderwerp." }
              - { text: "Mejlet (som) du skickade kom fram.", cat: 0 }
              - { text: "Företaget (som) grundades 2009 har 120 anställda.", cat: 1, tip: "som is het onderwerp van grundades: het moet blijven." }

      - id: som-zinsbouw
        title: Bijzinnen met som bouwen
        instruction: Zet de woorden in de goede volgorde.
        topic: relativ-som
        shuffle: true
        items:
          - { id: 7s2c, type: order, start: "Jag har en kollega", tokens: ["som", "aldrig", "kommer", "i tid"], answers: ["Jag har en kollega som aldrig kommer i tid."] }
          - { id: 977g, type: order, start: "Det är ett jobb", tokens: ["som", "jag", "verkligen", "vill", "ha"], answers: ["Det är ett jobb som jag verkligen vill ha."] }
          - { id: r2h5, type: order, start: "Hon sökte en tjänst", tokens: ["som", "inte", "krävde", "erfarenhet"], answers: ["Hon sökte en tjänst som inte krävde erfarenhet."] }
          - { id: bhey, type: order, start: "Det är kollegan", tokens: ["som", "jag", "delar", "rum", "med"], answers: ["Det är kollegan som jag delar rum med."] }
          - { id: 7z5t, type: order, start: "Det här är rapporten", tokens: ["som", "chefen", "inte", "har", "läst"], answers: ["Det här är rapporten som chefen inte har läst."] }
          - { id: ry7d, type: order, start: "Vi söker någon", tokens: ["som", "kan", "börja", "direkt"], answers: ["Vi söker någon som kan börja direkt."] }
          - { id: z2wt, type: order, start: "Han fick ett jobb", tokens: ["som", "han", "alltid", "har", "drömt om"], answers: ["Han fick ett jobb som han alltid har drömt om."] }
          - { id: jxba, type: order, start: "Hon är den enda", tokens: ["som", "aldrig", "är", "sjuk"], answers: ["Hon är den enda som aldrig är sjuk."] }
          - { id: w6yr, type: order, start: "Vi söker en medarbetare", tokens: ["som", "har", "minst", "ett", "års", "erfarenhet", "av", "kundservice"], answers: ["Vi söker en medarbetare som har minst ett års erfarenhet av kundservice."] }
          - { id: 3yk9, type: order, start: "Jag fick ett mejl från en kund", tokens: ["som", "inte", "var", "nöjd", "med", "sin", "beställning"], answers: ["Jag fick ett mejl från en kund som inte var nöjd med sin beställning."] }

      - id: som-vertalen
        title: Vertaal met som
        instruction: Vertaal naar het Zweeds. Gebruik een bijzin met **som**.
        topic: relativ-som
        shuffle: true
        items:
          - { id: g3hr, type: translate, prompt: "Ik zoek een baan die niet te ver van mijn huis ligt.", answers: ["Jag {söker|letar efter} ett {jobb|arbete} som inte ligger för långt {från mitt hem|från mitt hus|hemifrån|från där jag bor}."], feedback: [{ contains: "som ligger inte", tip: "In een bijzin staat inte vóór het werkwoord: som inte ligger." }, { contains: ["jobb att", "arbete att", "jobb det", "arbete det"], tip: "die/dat (betrekkelijk) = som." }] }
          - { id: hn9d, type: translate, prompt: "De collega met wie ik een kamer deel, werkt al tien jaar bij het bedrijf.", answers: ["Kollegan [som ]jag delar {rum|ett rum|kontor} med har [redan ]{jobbat|arbetat} {på|hos} företaget i tio år.", "Kollegan [som ]jag delar {rum|ett rum|kontor} med har [redan ]{jobbat|arbetat} i tio år {på|hos} företaget."], feedback: [{ contains: ["med vem", "med som"], tip: "Het voorzetsel blijft achteraan: kollegan som jag delar rum med." }, { contains: "med vilken", tip: "Dat is correct, maar stijf. Gewoner: kollegan som jag delar rum med (voorzetsel achteraan)." }, { contains: ["med jobbar", "med arbetar"], tip: "Iets wat al tien jaar duurt en nog doorgaat: perfectum, har jobbat … i tio år." }, { contains: "sedan tio år", tip: "Hoe lang iets al duurt: i tio år." }] }
          - { id: ee2d, type: translate, prompt: "Het is een bedrijf dat meubels verkoopt aan klanten in heel Europa.", answers: ["Det är ett företag som säljer möbler till kunder {i|över} hela Europa."], feedback: [{ contains: ["företag att", "företag det", "företag vilket"], tip: "dat (betrekkelijk) = som." }, { contains: "i heel europa", tip: "Heel Europa = hela Europa." }] }
          - { id: 2f6u, type: translate, prompt: "Ze heeft een baas die nooit luistert als iemand een nieuw idee heeft.", answers: ["Hon har en chef som aldrig lyssnar {när|om} någon har en ny idé."], feedback: [{ contains: "som lyssnar aldrig", tip: "In een bijzin staat aldrig vóór het werkwoord: som aldrig lyssnar." }, { contains: ["ett nytt idé", "ett ny idé", "en nytt idé"], tip: "idé is een en-woord: en ny idé." }] }
          - { id: c7kw, type: translate, prompt: "De mail die je gisteren naar de klant stuurde, is nooit aangekomen.", answers: ["{Mejlet|Mailet} [som ]du skickade {till kunden i går|i går till kunden} {kom aldrig fram|har aldrig kommit fram}."], feedback: [{ contains: "skickade det", tip: "som vervangt het voorwerp al: laat det weg." }] }
          - { id: 5wrd, type: translate, prompt: "Wij zoeken iemand die Zweeds en Engels spreekt en graag problemen oplost.", answers: ["Vi söker någon som {talar|pratar} svenska och engelska och [som ]{gärna löser problem|tycker om att lösa problem|gillar att lösa problem}."], feedback: [{ contains: "som löser gärna", tip: "In een bijzin staat gärna vóór het werkwoord: som gärna löser problem." }] }
          - { id: taq3, type: translate, prompt: "Het kantoor waar ik werk ligt maar vijf minuten lopen van het station.", answers: ["Kontoret [som ]jag {jobbar|arbetar} på ligger bara fem minuters {promenad|gång} från {stationen|centralstationen}.", "Kontoret där jag {jobbar|arbetar} ligger bara fem minuters {promenad|gång} från {stationen|centralstationen}.", "Kontoret [som ]jag {jobbar|arbetar} på ligger bara fem minuter {till fots|att gå} från {stationen|centralstationen}.", "Kontoret där jag {jobbar|arbetar} ligger bara fem minuter {till fots|att gå} från {stationen|centralstationen}."], feedback: [{ contains: ["på det ligger", "på kontoret ligger"], tip: "Herhaal kontoret niet: kontoret som jag jobbar på." }] }
          - { id: gjn9, type: translate, prompt: "De klant die gisteren belde, wil zijn geld terug voor de lamp die hij bestelde.", answers: ["Kunden som ringde i går vill ha {tillbaka pengarna|pengarna tillbaka|tillbaka sina pengar|sina pengar tillbaka} för lampan [som ]han {beställde|hade beställt}."], feedback: [{ contains: ["beställde den", "beställt den"], tip: "som vervangt het voorwerp al: laat den weg." }, { contains: "hans pengar", tip: "Het geld hoort bij het onderwerp kunden: sina pengar (of gewoon pengarna)." }] }

      - id: langere-zinnen
        title: "Vertaal: langere zinnen"
