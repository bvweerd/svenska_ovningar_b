        items:
          - { id: g7ch, type: translate, topic: passiv-s, prompt: "Alle sollicitaties die na eind mei binnenkomen, worden helaas niet behandeld.", answers: ["Alla ansökningar som kommer in efter den sista maj behandlas tyvärr inte.", "{Alla|De} ansökningar som {kommer in|inkommer} efter [den ]sista maj behandlas tyvärr inte[ av oss].", "{Alla|De} ansökningar som {kommer in|inkommer} efter slutet av maj behandlas tyvärr inte[ av oss]."], feedback: [{ contains: "behandlar", tip: "Ze worden behandeld: passief met -s (behandlas)." }] }
          - { id: nktq, type: translate, topic: relativ-som, prompt: "We zoeken een nauwkeurige medewerker die zelfstandig kan werken en die ervaring heeft met verkoop.", answers: ["Vi söker en noggrann medarbetare som kan arbeta självständigt och som har erfarenhet av försäljning.", "Vi söker en noggrann medarbetare som kan {arbeta|jobba} självständigt och [som ]har erfarenhet {av|inom} försäljning."], feedback: [{ contains: "som han kan", tip: "Som is zelf het onderwerp: som kan …" }] }
          - { id: 2yyv, type: translate, topic: passiv-s, prompt: "Het salaris wordt de vijfentwintigste van elke maand uitbetaald en de vakantie wordt samen met je leidinggevende gepland.", answers: ["Lönen betalas ut den tjugofemte varje månad och semestern planeras tillsammans med din chef.", "Lönen {betalas ut|utbetalas} den {tjugofemte|25:e} {varje|i varje} månad[,] och semestern planeras tillsammans med din chef."], feedback: [{ contains: "betalar ut", tip: "Wordt uitbetaald: passief met -s (betalas ut)." }] }

