          - { id: 2j5k, type: mc, prompt: "Je wilt weten hoe de werktijden eruitzien.", options: ["Hur ser arbetstiderna ut?", "Hur ser du ut?", "Hur dags är det?", "Hur länge har du jobbat här?"], answer: 0 }
          - { id: 49qb, type: mc, prompt: "Aan het eind bedank je voor het gesprek.", options: ["Tack för att jag fick komma hit.", "Tack för maten.", "Tack för senast.", "Varsågod."], answer: 0, optionTips: [null, "Dat zeg je na het eten.", "Dat zeg je de volgende keer dat je iemand ziet: bedankt voor de vorige keer.", "Dat zeg je als je iemand iets geeft."] }
          - { id: zfw7, type: mc, prompt: "Ze vragen naar je zwakke punten. Wat is een goed antwoord?", options: ["Ibland är jag för noggrann, men jag har lärt mig att prioritera.", "Jag har inga svaga sidor.", "Jag gillar inte att jobba.", "Det vet jag inte."], answer: 0 }

