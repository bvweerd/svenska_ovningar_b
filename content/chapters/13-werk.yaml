  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een korte sollicitatiemail."
    exercises:
      - id: skriva-formeel
        title: Formeel of informeel?
        instruction: Past de zin in een sollicitatiemail, of alleen in een berichtje aan een vriend?
        topic: formell-mail
        items:
          - id: ypws
            type: sort
            categories: ["sollicitatiemail", "berichtje aan een vriend"]
            items:
              - { text: "Med vänliga hälsningar", cat: 0 }
              - { text: "Kram!", cat: 1 }
              - { text: "Jag skriver angående tjänsten som kundtjänstmedarbetare.", cat: 0 }
              - { text: "Tjena! Läget?", cat: 1 }
              - { text: "Jag ser fram emot att höra från er.", cat: 0 }
              - { text: "Hörs!", cat: 1 }
              - { text: "Jag bifogar mitt cv.", cat: 0 }
              - { text: "Hej Petra,", cat: 0, tip: "In Zweden begin je ook een formele mail gewoon met Hej + voornaam." }

      - id: skriva-mail-zinnen
        title: Zinnen voor je mail
        instruction: Kies het woord dat past.
        topic: formell-mail
        items:
          - { id: mz7z, type: gap, text: "Jag vill ___ om tjänsten som kundtjänstmedarbetare.", gaps: [{ answers: ["ansöka"], options: ["ansöka", "söka", "leta"], feedback: [{ match: "söka", tip: "Een baan: söka tjänsten (zonder om) of ansöka om tjänsten. söka om gebruik je bij bijv. een vergunning of toelage (söka om bidrag), of in de betekenis opnieuw solliciteren." }] }] }
          - { id: c3fe, type: gap, text: "Jag har arbetat med kundservice ___ fyra år.", gaps: [{ answers: ["i"], options: ["i", "för", "på", "sedan"], feedback: [{ match: "för", tip: "för fyra år sedan = vier jaar geleden. Voor hoe lang iets duurt: i fyra år." }] }] }
          - { id: mmxb, type: gap, text: "Jag är intresserad ___ att arbeta hos er.", gaps: [{ answers: ["av"], options: ["av", "för", "på", "i"], tip: "intresserad av = geïnteresseerd in." }] }
          - { id: zmju, type: gap, text: "Jag ___ mitt cv och mitt personliga brev.", gaps: [{ answers: ["bifogar"], options: ["bifogar", "bifogas", "bifogades"], feedback: [{ match: ["bifogas", "bifogades"], tip: "Dat is de lijdende vorm. Jij voegt het toe: jag bifogar." }] }] }
          - { id: bmgg, type: gap, text: "Jag ser fram emot ___ höra från er.", gaps: [{ answers: ["att"], options: ["att", "för", "om", "till"] }] }
          - { id: r6mv, type: gap, text: "Tack ___ att du läser min ansökan.", gaps: [{ answers: ["för"], options: ["för", "att", "om", "till"] }] }

      - id: skriva-ansokan
        title: Schrijf je sollicitatiemail
        instruction: "Bouw eerst je sollicitatiemail aan Lindhem AB op in vier stappen die de app nakijkt. Daarna schrijf je de hele mail, als je wilt."
        topic: formell-mail
        items:
          - { id: 2ksd, type: mc, prompt: "Je schrijft aan Petra Lind over de vacature. Welke zin past direct na de aanhef?", options: ["Jag skriver angående tjänsten som kundtjänstmedarbetare.", "Tja, jag vill gärna ha jobbet hos er!", "Jag skriver för att jag har tråkigt på mitt jobb."], answer: 0, tip: "Een formele mail begint zakelijk en zegt waarover hij gaat: Jag skriver angående …" }
          - { id: dfrk, type: order, topic: relativ-som, prompt: "Vertel over je ervaring. Maak de zin af met een bijzin met som.", start: "Jag har arbetat i fyra år på ett företag", tokens: ["som", "säljer", "cyklar"], answers: ["Jag har arbetat i fyra år på ett företag som säljer cyklar."] }
          - { id: 6y2r, type: translate, topic: relativ-som, prompt: "Ik ben vooral geïnteresseerd in een bedrijf dat groeit.", answers: ["Jag är {särskilt|speciellt|framför allt|framförallt|främst|i synnerhet|mest} intresserad av [att arbeta på ]ett företag som växer."], feedback: [{ contains: "intresserad i", tip: "geïnteresseerd in = intresserad av." }, { contains: "företag att", tip: "dat (betrekkelijk) = som: ett företag som växer." }] }
          - { id: 79d3, type: gap, prompt: "Kies het goede woord voor de afsluiting.", text: "Med ___ hälsningar, Lotte de Vries", gaps: [{ answers: ["vänliga"], options: ["vänliga", "vänlig", "vänligt"], tip: "hälsningar is meervoud: Med vänliga hälsningar." }] }
          - id: gd3d
            type: free
            prompt: "Schrijf een mail aan Petra Lind (80–120 woorden). Zeg op welke functie je solliciteert, wat je ervaring is en waarom je de baan wilt. Gebruik minstens één zin met **som**, en sluit netjes af."
            minWords: 70
            require:
              - { any: ["hej", "bästa"], label: "Je begint met een aanhef (Hej Petra, …)" }
              - { any: ["angående", "ansöka", "söker"], label: "Je zegt waarvoor je schrijft (angående / ansöka om …)" }
              - { any: ["erfarenhet", "arbetat", "jobbat"], label: "Je vertelt over je ervaring" }
              - { any: ["som"], label: "Je gebruikt een bijzin met som" }
              - { any: ["hälsningar"], label: "Je sluit af met (Med) vänliga hälsningar" }
            model: "Hej Petra! Jag skriver angående tjänsten som kundtjänstmedarbetare. Jag såg annonsen på er webbplats. Jag har arbetat med kundservice i fyra år på ett företag som säljer cyklar. Där svarade jag på frågor från kunder via telefon och chatt. Jag talar svenska, engelska och nederländska. Jag tycker om att lösa problem och jag är lugn och noggrann. Jag är särskilt intresserad av att arbeta på ett företag som växer. Jag bifogar mitt cv och ser fram emot att höra från er. Med vänliga hälsningar, Lotte de Vries"

