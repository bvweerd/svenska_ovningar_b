  - id: lyssna
    title: Lyssna · luisteren
    intro: Deze oefeningen gebruiken de voorleesfunctie van je browser. Werkt het niet? Kijk bij „Luisteren instellen”.
    exercises:
      - id: lyssna-forsta-dagen
        title: "Luisteren: de eerste werkdag"
        instruction: Luister naar Sanne. Is de bewering **rätt** of **fel**? Lukt het niet, dan kun je de tekst laten zien.
        topic: relativ-som
        listen: true
        textTitle: Första dagen på jobbet
        text: |
          Hej! Jag heter Sanne och jag kommer från Utrecht. I måndags var min första dag som sjuksköterska på vårdcentralen i Västerås. Jag var ganska nervös, men alla var väldigt trevliga.

          Först visade min chef Ulla mig runt. Sedan fick jag träffa kollegorna som jobbar i samma team. Vi fikade tillsammans klockan tio, och det gör man nästan varje dag här.

          Det som var svårast var alla förkortningar som används i journalerna. Men jag fick en lista av en kollega som också har flyttat hit från ett annat land. Efter lunch fick jag följa med en läkare som träffade patienter. Jag trivs redan jättebra!
        items:
          - { id: vrvq, type: truefalse, statement: "Sanne jobbar som läkare.", answer: false, correction: { answers: ["{Sanne|Hon} jobbar som sjuksköterska."] } }
          - { id: kfyk, type: truefalse, statement: "Hennes chef visade henne runt.", answer: true }
          - { id: 7rm5, type: truefalse, statement: "De fikar nästan varje dag klockan tio.", answer: true }
          - { id: t8fe, type: truefalse, statement: "Sanne tyckte att förkortningarna var lätta.", answer: false, correction: { answers: ["{Sanne|Hon} tyckte att förkortningarna var svåra.", "Förkortningarna var {svårast|det svåraste}."] } }
          - { id: yrrh, type: truefalse, statement: "En kollega gav henne en lista.", answer: true }

      - id: lyssna-vorm
        title: Welke vorm hoor je?
        instruction: Luister en kies de vorm die je hoort.
        topic: passiv-s
        shuffle: true
        items:
          - { id: he8b, type: listen, say: "Huset byggdes för hundra år sedan.", prompt: "Welk werkwoord hoor je?", options: ["byggdes", "byggs", "bygger"], answer: 0 }
          - { id: ra9u, type: listen, say: "Fönstren tvättas varje vår.", prompt: "Welk werkwoord hoor je?", options: ["tvättas", "tvättades", "tvättar"], answer: 0 }
          - { id: p2ah, type: listen, say: "Frågor besvaras av Petra.", prompt: "Welk werkwoord hoor je?", options: ["besvaras", "besvarades", "besvarar"], answer: 0 }
          - { id: tjxe, type: listen, say: "Mötet ställdes in i går.", prompt: "Welk werkwoord hoor je?", options: ["ställdes in", "ställs in", "ställer in"], answer: 0 }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en maak de zin die je hoort.
        topic: passiv-s
        shuffle: true
        items:
          - { id: eeyh, type: listen, say: "Ansökan skickas via vår webbplats." }
          - { id: xaf8, type: listen, say: "Jag har en kollega som kommer från Chile." }
          - { id: ysf5, type: listen, say: "Tjänsten är på heltid." }
          - { id: nsxv, type: listen, say: "Intervjuer hålls löpande." }
