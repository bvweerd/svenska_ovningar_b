            type: dialogue
            lines:
              - "Rekryteraren: Välkommen! Berätta lite om dig själv."
              - "Lotte: Tack. Jag heter Lotte och jag har jobbat med kundservice i fyra år."
              - "Rekryteraren: Varför söker du just den här tjänsten?"
              - "Lotte: Jag tycker om att lösa problem, och jag vill arbeta på ett företag som växer."
              - "Rekryteraren: Vad är dina starka sidor?"
              - "Lotte: Jag är lugn och noggrann, och jag är bra på att lyssna."
              - "Rekryteraren: Har du några frågor till oss?"
              - "Lotte: Ja, när kan jag få besked?"

