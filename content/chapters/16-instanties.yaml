              - { text: "Hon **lyckades** till slut.", cat: 1 }
              - { text: "Vi **hörs**!", cat: 2 }

      - id: deponens-vertalen
        title: Vertaal met een werkwoord op -s
        instruction: Vertaal naar het Zweeds. Elke zin heeft een werkwoord dat altijd op **-s** eindigt, of een **-s** voor *elkaar*.
        topic: deponens
        shuffle: true
        items:
          - { id: ze6h, type: translate, prompt: "Ik hoop dat mijn aanvraag voor een persoonsnummer snel behandeld wordt.", answers: ["Jag hoppas [att ]min ansökan om [ett ]personnummer {handläggs|behandlas|blir behandlad|kommer att handläggas|kommer att behandlas} {snabbt|fort}."], feedback: [{ contains: "hoppar", tip: "hopen = hoppas (altijd met -s). hoppa is springen." }, { contains: ["ansökan för", "ansökan till"], tip: "Een aanvraag voor iets = en ansökan om." }] }
          - { id: uezk, type: translate, prompt: "In het begin had Marloes het niet naar haar zin in Göteborg, maar nu wel.", answers: ["{I början|Till en början|Först} trivdes Marloes inte i Göteborg, men nu {trivs hon[ där]|gör hon det}.", "Marloes trivdes inte i Göteborg i början, men nu {trivs hon[ där]|gör hon det}.", "Marloes trivdes inte i början i Göteborg, men nu {trivs hon[ där]|gör hon det}."], feedback: [{ contains: ["trivades", "trivde "], tip: "trivas is onregelmatig: trivs – trivdes – trivts." }, { contains: ["början marloes trivdes", "början marloes trivs"], tip: "Na I början vooraan komt eerst het werkwoord: I början trivdes Marloes inte." }, { contains: "nu hon trivs", tip: "Na nu vooraan komt eerst het werkwoord: men nu trivs hon." }] }
          - { id: 2f6k, type: translate, prompt: "Ik herinner me niet meer wanneer ik de brief van Skatteverket kreeg.", answers: ["Jag {minns inte|minns inte längre|kommer inte ihåg|kommer inte längre ihåg|kommer inte ihåg längre} när jag fick {brevet från Skatteverket|Skatteverkets brev}."], feedback: [{ contains: ["minnas inte", "minnes inte"], tip: "Presens van minnas: minns." }, { contains: "när fick jag", tip: "In een indirecte vraag komt eerst het onderwerp: när jag fick." }, { contains: "kommer ihåg inte", tip: "inte staat tussen kommer en ihåg: jag kommer inte ihåg." }] }
