          - { id: jgg3, type: gap, text: "Vi hade inte ___ sedan i somras, så det var roligt att ses igen.", gaps: [{ answers: ["setts"], options: ["setts", "sett", "ses"], feedback: [{ match: "sett", tip: "Elkaar gezien: ook het supinum houdt de -s, setts." }, { match: "ses", tip: "Na hade komt het supinum: setts." }] }] }

      - id: s-sorteren
        title: Welke -s is het?
        instruction: Is het een lijdende vorm, een werkwoord dat altijd op -s eindigt, of *elkaar*?
        topic: deponens
        items:
