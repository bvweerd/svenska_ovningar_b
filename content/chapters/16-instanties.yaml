chapter: 16

grammar:
  - id: deponens
    title: Werkwoorden die altijd op -s eindigen
    summary: "Sommige werkwoorden hebben **altijd -s**, zonder lijdende betekenis: *hoppas, minnas, trivas, finnas, lyckas, kännas*. Vervoeging: *trivs – trivdes – har trivts*."
    body: |
      Deze werkwoorden zien eruit als een lijdende vorm, maar hebben een gewone, actieve betekenis. Er bestaat geen vorm zonder -s (of die betekent iets anders).

      | infinitief | presens | preteritum | supinum | betekenis |
      |---|---|---|---|---|
      | hoppas | hoppas | hoppades | hoppats | hopen |
      | lyckas | lyckas | lyckades | lyckats | lukken, slagen |
      | trivas | trivs | trivdes | trivts | het naar je zin hebben |
      | minnas | minns | mindes | mints | zich herinneren |
      | kännas | känns | kändes | känts | aanvoelen |
      | finnas | finns | fanns | funnits | er zijn, bestaan |
      | synas | syns | syntes | synts | te zien zijn |
      | umgås | umgås | umgicks | umgåtts | omgaan met |

      Let op: ***hoppa*** zonder -s betekent *springen*. *Jag hoppas att du kommer* = ik hoop dat je komt.

      ### Elkaar: wederkerige -s
      Met **-s** kun je ook *elkaar* uitdrukken:

      - *Vi **ses** i morgon!* – We zien elkaar morgen.
      - *De **träffades** på en kurs.* – Ze hebben elkaar op een cursus ontmoet.
      - *Vi **hörs**!* – We spreken elkaar (nog)!
      - *De **kramas**.* – Ze omhelzen elkaar.

  - id: myndighetssprak
    title: Taal van instanties
    summary: "Brieven van instanties zijn formeel: veel **lijdende vormen**, zelfstandige naamwoorden en vaste woorden als *ärende, handläggare, beslut, senast, inkomma, enligt*."
    body: |
      Zweedse overheidsinstanties schrijven steeds eenvoudiger (*klarspråk*), maar je komt nog veel formele woorden tegen:

      | formeel | betekenis | gewoon Zweeds |
      |---|---|---|
      | ett ärende | een zaak, dossier | en fråga |
      | en handläggare | behandelend ambtenaar | den som tar hand om ärendet |
      | handläggningstid | behandeltijd | hur lång tid det tar |
      | ett beslut | een besluit | |
      | inkomma | binnenkomen | komma in |
      | erhålla | ontvangen | få |
      | senast | uiterlijk | inte senare än |
      | enligt | volgens | |
      | överklaga | in beroep gaan | |
      | bifoga | bijvoegen | skicka med |

      Typische zinnen:
      - *Ansökan ska ha **inkommit** senast den 1 mars.* – De aanvraag moet uiterlijk 1 maart binnen zijn.
      - *Du kan **överklaga** beslutet inom tre veckor.*
      - *Ange ditt **ärendenummer** när du kontaktar oss.*

      Zelf schrijf je gewoon en beleefd: *Hej! Jag har en fråga om …*, *Mitt ärendenummer är …*, *Tack på förhand!*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-personnummer
        title: "Lezen: het persoonsnummer"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: deponens
        textTitle: Personnumret
        text: |
          Det första man lär sig när man flyttar till Sverige är att nästan allt hänger på personnumret. Utan personnummer är det svårt att öppna ett bankkonto, skaffa ett mobilabonnemang eller boka en tid hos tandläkaren.

          Marloes flyttade till Göteborg i januari. Hon hade fått jobb på ett företag och skulle stanna i minst tre år. Därför ansökte hon om folkbokföring hos Skatteverket. Hon fyllde i en blankett och visade sitt pass och sitt anställningsavtal. Handläggaren sa att handläggningstiden var ungefär sex veckor.

          – De veckorna kändes väldigt långa, minns Marloes. Jag fick använda mitt nederländska bankkort överallt, och jag kunde inte ens få ett lånekort på biblioteket.

          Till slut kom ett brev med hennes nya personnummer. Nu trivs hon i Göteborg och hoppas att hon kan stanna längre än tre år.
        items:
          - { type: mc, prompt: "Varför är personnumret så viktigt?", options: ["Man behöver det för nästan allt.", "Man får inte bo i Sverige utan det.", "Det är gratis.", "Man får det på flygplatsen."], answer: 0 }
          - { type: truefalse, statement: "Marloes skulle stanna i Sverige i minst tre år.", answer: true }
          - { type: mc, prompt: "Vad visade Marloes för handläggaren?", options: ["sitt pass och sitt anställningsavtal", "sitt bankkort", "sitt körkort och sitt hyreskontrakt", "ingenting"], answer: 0 }
          - { type: truefalse, statement: "Handläggningstiden var ungefär sex månader.", answer: false, correction: { answers: ["{Handläggningstiden|Den} var ungefär sex veckor."] } }
          - { type: truefalse, statement: "Veckorna utan personnummer kändes korta.", answer: false, correction: { answers: ["{Veckorna|De} kändes [väldigt ]långa."] } }
          - { type: mc, prompt: "Hur mår Marloes nu?", options: ["Hon trivs i Göteborg.", "Hon längtar hem.", "Hon vill flytta till Stockholm.", "Hon är arg på Skatteverket."], answer: 0 }
          - type: multi
            prompt: "Welke werkwoorden in de tekst eindigen altijd op -s?"
            options: ["kändes", "minns", "trivs", "hoppas", "ansökte", "visade"]
            answers: [0, 1, 2, 3]

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-instanties
        title: Woorden van instanties
        instruction: Koppel het woord aan de betekenis.
        topic: myndighetssprak
        items:
          - type: match
            pairs:
              - ["ett ärende", "een zaak, dossier"]
              - ["en handläggare", "behandelend ambtenaar"]
              - ["en blankett", "een formulier"]
              - ["ett beslut", "een besluit"]
              - ["överklaga", "in beroep gaan"]
              - ["senast", "uiterlijk"]
          - type: match
            pairs:
              - ["inkomma", "komma in"]
              - ["erhålla", "få"]
              - ["bifoga", "skicka med"]
              - ["erforderlig", "som behövs"]
              - ["tillhandahålla", "ge, erbjuda"]

      - id: ord-brief
        title: Wat staat er in de brief?
        instruction: Kies wat de zin betekent.
        topic: myndighetssprak
        shuffle: true
        items:
          - { type: mc, prompt: "*Ansökan ska ha inkommit senast den 1 mars.*", options: ["De aanvraag moet uiterlijk 1 maart binnen zijn.", "Je mag de aanvraag pas na 1 maart sturen.", "De aanvraag is op 1 maart binnengekomen.", "Op 1 maart krijg je antwoord."], answer: 0 }
          - { type: mc, prompt: "*Du kan överklaga beslutet inom tre veckor.*", options: ["Je kunt binnen drie weken in beroep gaan tegen het besluit.", "Het besluit wordt over drie weken genomen.", "Je krijgt het besluit binnen drie weken.", "Het besluit geldt drie weken."], answer: 0 }
          - { type: mc, prompt: "*Ange ärendenummer vid kontakt med oss.*", options: ["Noem je dossiernummer als je contact opneemt.", "Bel ons niet.", "Je krijgt een nummer als je belt.", "Neem contact op met de behandelaar."], answer: 0 }
          - { type: mc, prompt: "*Handläggningstiden är för närvarande cirka åtta veckor.*", options: ["Het duurt op dit moment ongeveer acht weken.", "Je moet binnen acht weken reageren.", "Het loket is acht weken dicht.", "De afspraak duurt acht minuten."], answer: 0 }

  - id: deponens
    title: "Grammatik: werkwoorden op -s"
    exercises:
      - id: deponens-tabel
        title: De vormen
        instruction: Vul de ontbrekende vormen in.
        topic: deponens
        items:
          - type: table
            columns: ["infinitief", "presens", "preteritum", "supinum"]
            rows:
              - ["hoppas", "hoppas", { answers: ["hoppades"] }, { answers: ["hoppats"] }]
              - ["trivas", { answers: ["trivs"] }, { answers: ["trivdes"] }, "trivts"]
              - ["minnas", { answers: ["minns"] }, { answers: ["mindes"] }, "mints"]
              - ["finnas", { answers: ["finns"] }, { answers: ["fanns"] }, { answers: ["funnits"] }]
              - ["lyckas", "lyckas", { answers: ["lyckades"] }, { answers: ["lyckats"] }]

      - id: deponens-invullen
        title: In de zin
        instruction: Vul het werkwoord in de goede vorm in.
        topic: deponens
        shuffle: true
        items:
          - { type: gap, text: "Jag ___ (hoppas) att du mår bättre nu.", gaps: [{ answers: ["hoppas"], feedback: [{ match: "hoppar", tip: "hoppa = springen. Hopen is altijd hoppas." }] }] }
          - { type: gap, text: "Hon ___ (trivas) inte på sitt förra jobb.", gaps: [{ answers: ["trivdes"], feedback: [{ match: "trivs", tip: "förra jobb: verleden tijd, trivdes." }] }] }
          - { type: gap, text: "Det ___ (finnas) inga lediga tider i går.", gaps: [{ answers: ["fanns"], feedback: [{ match: "finns", tip: "i går: verleden tijd, fanns." }] }] }
          - { type: gap, text: "___ (minnas) du när vi träffades första gången?", gaps: [{ answers: ["Minns"], feedback: [{ match: ["Minnas", "Minnes"], tip: "Presens van minnas: minns." }] }] }
          - { type: gap, text: "Jag har aldrig ___ (lyckas) lära mig åka skidor.", gaps: [{ answers: ["lyckats"], feedback: [{ match: "lyckat", tip: "Ook het supinum houdt de -s: lyckats." }] }] }
          - { type: gap, text: "Hur ___ (kännas) det i dag?", gaps: [{ answers: ["känns"], feedback: [{ match: "kännes", tip: "kännes is ouderwets; gewoon Zweeds is känns." }] }] }
          - { type: gap, text: "Vi ___ (umgås) mycket när vi bodde i samma stad.", gaps: [{ answers: ["umgicks"], feedback: [{ match: ["umgåddes", "umgåtts"], tip: "umgås gaat als gå: umgicks." }] }] }

      - id: elkaar
        title: Elkaar
        instruction: Kies de vorm die *elkaar* uitdrukt.
        topic: deponens
        shuffle: true
        items:
          - { type: gap, text: "Hej då! Vi ___ i morgon!", gaps: [{ answers: ["ses"], options: ["ses", "ser", "seende"] }] }
          - { type: gap, text: "Ska vi ___ på lunchen och prata om det?", gaps: [{ answers: ["träffas"], options: ["träffas", "träffa", "träffar"], feedback: [{ match: "träffa", tip: "Zonder voorwerp en met de betekenis elkaar: träffas." }] }] }
          - { type: gap, text: "Vi ___ på telefon i går kväll.", gaps: [{ answers: ["hördes"], options: ["hördes", "hörde", "hör"] }] }
          - { type: gap, text: "Barnen ___ alltid när de ses.", gaps: [{ answers: ["kramas"], options: ["kramas", "kramar", "kramade"] }] }

      - id: s-sorteren
        title: Welke -s is het?
        instruction: Is het een lijdende vorm, een werkwoord dat altijd op -s eindigt, of *elkaar*?
        topic: deponens
        items:
          - type: sort
            categories: ["lijdend", "altijd -s", "elkaar"]
            items:
              - { text: "Ansökan **skickas** via e-post.", cat: 0 }
              - { text: "Vi **ses** på fredag!", cat: 2 }
              - { text: "Jag **hoppas** att det går bra.", cat: 1 }
              - { text: "Breven **sorteras** på posten.", cat: 0 }
              - { text: "De **träffades** på en kurs.", cat: 2 }
              - { text: "Det **finns** en blankett på webbplatsen.", cat: 1 }
              - { text: "Hon **lyckades** till slut.", cat: 1 }
              - { text: "Vi **hörs**!", cat: 2 }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-telefonval
        title: "Luisteren: het keuzemenu"
        instruction: Luister naar het telefoonmenu van een instantie. Is de bewering **rätt** of **fel**?
        topic: myndighetssprak
        listen: true
        textTitle: Telefonvalet
        text: |
          Välkommen till Skatteverket. Om du har frågor om folkbokföring och personnummer, tryck ett. Om du har frågor om id-kort, tryck två. Om du har frågor om din deklaration, tryck tre.

          Just nu är väntetiden ungefär tjugo minuter. Du kan också hitta svar på många frågor på vår webbplats. Om du redan har ett ärende hos oss, ha ditt ärendenummer redo när du pratar med en handläggare.
        items:
          - { type: truefalse, statement: "Frågor om id-kort: tryck ett.", answer: false, correction: { answers: ["{Frågor om id-kort|Då}: tryck två.", "Man trycker två[ för id-kort]."] } }
          - { type: truefalse, statement: "Väntetiden är ungefär tjugo minuter.", answer: true }
          - { type: truefalse, statement: "Man kan hitta svar på webbplatsen.", answer: true }
          - { type: truefalse, statement: "Man ska ha sitt passnummer redo.", answer: false, correction: { answers: ["{Man|Du} ska ha {sitt|ditt} ärendenummer redo."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: deponens
        shuffle: true
        items:
          - { type: listen, say: "Jag hoppas att du trivs här." }
          - { type: listen, say: "Det fanns inga lediga tider." }
          - { type: listen, say: "Vi ses på måndag!" }
          - { type: listen, say: "Ansökan ska ha inkommit senast den första mars." }

  - id: praktiskt
    title: Praktiskt · bij het loket
    exercises:
      - id: dialoog-loket
        title: Een id-kaart aanvragen
        instruction: Zet het gesprek in de goede volgorde.
        topic: myndighetssprak
        items:
          - type: dialogue
            lines:
              - "Handläggaren: Hej, välkommen fram. Vad gäller det?"
              - "Daan: Hej! Jag vill ansöka om ett id-kort."
              - "Handläggaren: Har du betalat avgiften?"
              - "Daan: Ja, här är kvittot."
              - "Handläggaren: Bra. Då behöver jag se ditt pass också."
              - "Daan: Varsågod. Hur lång tid tar det innan jag får kortet?"
              - "Handläggaren: Ungefär två veckor. Du får ett brev när du kan hämta det."

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat je zegt.
        topic: myndighetssprak
        shuffle: true
        items:
          - { type: mc, prompt: "Je wilt weten hoe lang het duurt.", options: ["Hur lång är handläggningstiden?", "Hur lång är du?", "Hur länge har ni öppet?", "Hur långt är det dit?"], answer: 0 }
          - { type: mc, prompt: "Je hebt al een lopende zaak.", options: ["Jag har redan ett ärende hos er.", "Jag har redan ett beslut.", "Jag har redan överklagat.", "Jag har redan en handläggare hemma."], answer: 0 }
          - { type: mc, prompt: "Je begrijpt de brief niet.", options: ["Jag förstår inte riktigt brevet. Kan du förklara?", "Brevet är fel.", "Jag vill överklaga brevet.", "Jag har inte fått något brev."], answer: 0 }
          - { type: mc, prompt: "Je bent het niet eens met het besluit.", options: ["Hur gör jag för att överklaga beslutet?", "Hur gör jag för att bifoga beslutet?", "Var kan jag hämta beslutet?", "När kommer beslutet?"], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een formele mail met een vraag."
    exercises:
      - id: skriva-fraga
        title: Stel je vraag
        instruction: Schrijf een mail aan een instantie.
        topic: myndighetssprak
        items:
          - type: free
            prompt: "Je hebt zes weken geleden een persoonsnummer aangevraagd en nog niets gehoord. Schrijf een korte mail (60–100 woorden) aan de instantie: wie je bent, wanneer je het aangevraagd hebt, je dossiernummer, en wat je wilt weten."
            minWords: 55
            require:
              - { any: ["hej"], label: "Je begint met een aanhef" }
              - { any: ["ärende", "ärendenummer"], label: "Je noemt je dossier (ärende / ärendenummer)" }
              - { any: ["ansökte", "ansökan", "ansökt"], label: "Je zegt wat je hebt aangevraagd" }
              - { any: ["hoppas", "undrar", "skulle vilja veta"], label: "Je stelt beleefd je vraag (jag undrar … / jag hoppas …)" }
              - { any: ["hälsningar"], label: "Je sluit netjes af" }
            model: "Hej! Jag heter Daan Visser och jag ansökte om folkbokföring den 3 februari. Mitt ärendenummer är 123-456. Handläggaren sa att handläggningstiden var ungefär sex veckor, men jag har inte fått något besked än. Jag undrar om ni behöver mer information från mig, och när jag kan räkna med ett beslut. Jag behöver personnumret för att kunna öppna ett bankkonto. Jag hoppas att ni kan hjälpa mig. Tack på förhand! Med vänliga hälsningar, Daan Visser"

  - id: herhaling
    title: Herhaling
    exercises:
      - id: herhaling-13-16
        title: Hoofdstuk 13 tot en met 16 door elkaar
        instruction: Gemengde vragen.
        shuffle: true
        items:
          - { type: gap, topic: passiv-s, text: "Blanketten ___ (fylla i) av den sökande.", hint: "fylla i = invullen.", gaps: [{ answers: ["fylls i", "ifylls"] }] }
          - { type: gap, topic: passiv-bli, text: "Ansökan blev ___ (godkänna) efter sex veckor.", gaps: [{ answers: ["godkänd"] }] }
          - { type: gap, topic: dar-dit-vars, text: "Det är kontoret ___ jag ska gå i morgon.", gaps: [{ answers: ["dit"], options: ["där", "dit", "vars"], shuffle: false, tip: "gå = beweging naartoe: dit." }] }
          - { type: translate, topic: partikelverb, prompt: "Ik herkende de ambtenaar niet.", answers: ["Jag kände inte igen handläggaren."] }
          - { type: gap, topic: deponens, text: "Vi ___ (träffas) på en kurs för tre år sedan.", gaps: [{ answers: ["träffades"] }] }
          - { type: transform, topic: relativ-som, prompt: "Jag fick ett brev. Jag förstod inte brevet.", answers: ["Jag fick ett brev [som ]jag inte förstod."], feedback: [{ contains: "förstod inte", tip: "In de bijzin staat inte vóór het werkwoord: som jag inte förstod." }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: deponens
        shuffle: true
        items:
          - { type: findError, sentence: "Jag hoppar att du kan komma.", wrong: [1], answers: ["Jag hoppas att du kan komma."], tip: "Springen of hopen?" }
          - { type: findError, sentence: "Det finnas många blanketter här.", wrong: [1], answers: ["Det finns många blanketter här."], tip: "Presens van finnas." }
          - { type: findError, sentence: "Vi träffar i morgon klockan tio.", wrong: [1], answers: ["Vi {träffas|ses} {i morgon|imorgon} klockan tio."], tip: "We zien elkaar." }
          - { type: findError, sentence: "Jag har aldrig lyckat med det.", wrong: [3], answers: ["Jag har aldrig lyckats med det."], tip: "lyckas houdt altijd de -s." }
          - { type: findError, sentence: "Hon trivs inte på jobbet förra året.", wrong: [1], answers: ["Hon trivdes inte på jobbet förra året."], tip: "Kijk naar förra året." }

