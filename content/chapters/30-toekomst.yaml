chapter: 30

grammar:
  - id: framtid-b2
    title: Verwachtingen en voltooide toekomst
    summary: "*Om tio år **kommer** vi **att ha flyttat**.* (voltooid toekomend) · *Det **lär** bli regn.* (zal wel) · *Priserna **väntas** stiga. Befolkningen **beräknas** öka.* (verwacht wordt dat)"
    body: |
      ### Voltooide toekomst
      Iets wat in de toekomst al **afgerond** zal zijn: **kommer att ha + supinum**.

      - *Om tio år **kommer** jag **att ha flyttat** tillbaka.* – Over tien jaar zal ik terugverhuisd zijn.
      - *När du kommer hem **kommer** jag **att ha lagat** mat.*

      ### Verwachtingen
      | vorm | betekenis | voorbeeld |
      |---|---|---|
      | **lär** + infinitief | zal wel (verwachting) | *Det **lär** bli kallt i helgen.* |
      | **lär** + infinitief | schijnt, naar verluidt | *Han **lär** vara mycket rik.* |
      | **ska** + infinitief | naar verluidt, volgens de verwachting | *Det **ska** bli kallt i helgen, enligt SMHI.* |
      | **torde** + infinitief | zal waarschijnlijk (formeel) | *Kostnaden **torde** bli hög.* |
      | **väntas** + infinitief | wordt verwacht | *Priserna **väntas** stiga.* |
      | **beräknas** + infinitief | wordt berekend/geschat | *Befolkningen **beräknas** öka.* |
      | **förväntas** + infinitief | wordt verwacht | *Efterfrågan **förväntas** öka.* |
      | **kan komma att** + infinitief | zou kunnen gaan | *Reglerna **kan komma att** ändras.* |

      De vormen op **-s** (*väntas, beräknas, förväntas*) zijn lijdend: wie verwacht, wordt niet gezegd. Dat is typisch voor nieuws en rapporten. Vergelijk: *Man väntar sig att priserna stiger.* → *Priserna **väntas stiga**.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-2050
        title: "Lezen: Zweden in 2050"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: framtid-b2
        textTitle: Hur ser Sverige ut år 2050?
        text: |
          Ingen kan veta exakt hur framtiden blir, men det finns trender som framtidsforskare följer noga. Befolkningen väntas bli allt äldre, eftersom vi lever längre och föder färre barn. Det kommer att ställa nya krav på vården och äldreomsorgen, och fler kommer sannolikt att behöva jobba längre upp i åldern.

          Arbetslivet lär också förändras. Många rutinuppgifter beräknas tas över av datorer, medan nya yrken som vi i dag inte ens kan föreställa oss kommer att växa fram. Distansarbete, som var ovanligt före 2020, kommer troligen att vara en självklarhet.

          Klimatet är kanske den största frågan. Om vi lyckas, kommer de flesta bilar och lastbilar att ha gått över till el långt före 2050. Om vi misslyckas, kan extremväder komma att bli allt vanligare även i Sverige.

          – Framtiden är inte något som bara händer oss, säger en framtidsforskare. Det är något vi skapar tillsammans, genom de beslut vi fattar i dag.
        items:
          - { type: mc, prompt: "Varför blir befolkningen äldre?", options: ["Vi lever längre och föder färre barn.", "Många unga flyttar utomlands.", "Fler barn föds.", "Det står inte i texten."], answer: 0 }
          - { type: mc, prompt: "Vad kommer sannolikt att hända på arbetsmarknaden?", options: ["Datorer tar över rutinuppgifter och nya yrken växer fram.", "Alla yrken försvinner.", "Ingenting förändras.", "Alla får jobba hemifrån."], answer: 0 }
          - { type: truefalse, statement: "Distansarbete var vanligt före 2020.", answer: false, correction: { answers: ["Distansarbete var ovanligt före 2020."] } }
          - { type: mc, prompt: "Vad händer om vi lyckas med klimatet?", options: ["De flesta fordon kommer att ha gått över till el.", "Extremväder blir vanligare.", "Alla slutar köra bil.", "Bensin blir billigare."], answer: 0 }
          - { type: mc, prompt: "Vad menar framtidsforskaren?", options: ["Vi skapar framtiden själva genom våra beslut.", "Framtiden är redan bestämd.", "Man kan inte göra något åt framtiden.", "Forskare vet exakt hur framtiden blir."], answer: 0 }
          - type: multi
            prompt: "Welke vormen in de tekst drukken een verwachting uit?"
            options: ["väntas", "lär", "beräknas", "kommer troligen att", "följer", "lever"]
            answers: [0, 1, 2, 3]

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-toekomst
        title: De toekomst
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - type: match
            pairs:
              - ["en framtidsforskare", "een toekomstonderzoeker"]
              - ["äldreomsorg", "ouderenzorg"]
              - ["ett yrke", "een beroep"]
              - ["en självklarhet", "een vanzelfsprekendheid"]
              - ["föreställa sig", "zich voorstellen"]
              - ["växa fram", "ontstaan, opkomen"]
          - type: match
            pairs:
              - ["lyckas", "slagen"]
              - ["misslyckas", "mislukken"]
              - ["extremväder", "extreem weer"]
              - ["gå över till", "overstappen op"]
              - ["upp i åldern", "op latere leeftijd"]
              - ["fatta ett beslut", "een besluit nemen"]

  - id: framtid
    title: "Grammatik: verwachtingen"
    exercises:
      - id: framtid-b2-invullen
        title: Voltooide toekomst
        instruction: Vul de voltooide toekomst in (**kommer att ha** + supinum).
        topic: framtid-b2
        shuffle: true
        items:
          - { type: gap, text: "Om tio år ___ jag ___ (flytta) tillbaka till Nederländerna.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha flyttat"], feedback: [{ match: "att flytta", tip: "Het is dan al gebeurd: att ha flyttat." }] }] }
          - { type: gap, text: "När du kommer hem, ___ jag redan ___ (laga) mat.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha lagat"] }] }
          - { type: gap, text: "År 2040 ___ de flesta bilar ___ (gå) över till el.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha gått"], feedback: [{ match: "att ha gåtts", tip: "Supinum van gå: gått." }] }] }

      - id: framtid-b2-kiezen
        title: Het goede woord
        instruction: Kies wat past.
        topic: framtid-b2
        shuffle: true
        items:
          - { type: gap, text: "Det ___ bli kallt i helgen, enligt prognosen.", gaps: [{ answers: ["lär"], options: ["lär", "tänker", "vill"], shuffle: false, tip: "Zal wel (verwachting): lär." }] }
          - { type: gap, text: "Priserna ___ stiga under nästa år.", gaps: [{ answers: ["väntas"], options: ["väntas", "väntar", "vänta"], shuffle: false, feedback: [{ match: "väntar", tip: "De prijzen wachten niet zelf: lijdend, väntas." }] }] }
          - { type: gap, text: "Befolkningen ___ öka med två procent.", gaps: [{ answers: ["beräknas"], options: ["beräknas", "beräknar", "räknar"], shuffle: false }] }
          - { type: gap, text: "Reglerna kan ___ att ändras.", gaps: [{ answers: ["komma"], options: ["komma", "kommer", "kommit"], shuffle: false, tip: "kan komma att = zou kunnen gaan." }] }

      - id: framtid-b2-omvormen
        title: Formeel verwachten
        instruction: Herschrijf de zin met **väntas**, **beräknas** of **förväntas**.
        topic: framtid-b2
        items:
          - { type: transform, prompt: "Man väntar sig att priserna stiger.", answers: ["Priserna väntas stiga."], feedback: [{ contains: "väntas att", tip: "Zonder att: Priserna väntas stiga." }, { contains: "väntas stiger", tip: "Na väntas: infinitief, stiga." }] }
          - { type: transform, prompt: "Man beräknar att befolkningen ökar.", answers: ["Befolkningen beräknas öka."], feedback: [{ contains: "beräknas ökar", tip: "Na beräknas: infinitief, öka." }] }
          - { type: transform, prompt: "Man förväntar sig att efterfrågan ökar.", answers: ["Efterfrågan förväntas öka.", "Efterfrågan väntas öka."] }
          - { type: transform, prompt: "Man tror att arbetslösheten sjunker.", task: "Begin met: Arbetslösheten väntas …", answers: ["Arbetslösheten väntas sjunka."] }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-framtid
        title: "Luisteren: een toekomstonderzoeker"
        instruction: Luister naar het fragment. Is de bewering **rätt** of **fel**?
        topic: framtid-b2
        listen: true
        textTitle: Ett samtal om framtiden
        text: |
          Många frågar mig vilka jobb som kommer att finnas om tjugo år. Ärligt talat vet ingen det. Men vi vet att förmågan att lära sig nytt kommer att bli allt viktigare.

          Den som har lärt sig ett nytt språk som vuxen, till exempel svenska, har redan visat att den kan anpassa sig. Det är en egenskap som arbetsgivare lär värdera högt i framtiden.

          Mitt råd är därför enkelt: sluta aldrig att lära dig. Om tio år kommer du att ha glömt det mesta du läser i dag, men du kommer att ha kvar förmågan att lära.
        items:
          - { type: truefalse, statement: "Forskaren vet exakt vilka jobb som kommer att finnas.", answer: false, correction: { answers: ["Ingen vet det.", "{Forskaren|Hon|Han} vet inte[ det]."] } }
          - { type: truefalse, statement: "Förmågan att lära sig nytt blir allt viktigare.", answer: true }
          - { type: truefalse, statement: "Att lära sig ett språk som vuxen visar att man kan anpassa sig.", answer: true }
          - { type: truefalse, statement: "Forskaren råder oss att sluta lära oss när vi är vuxna.", answer: false, correction: { answers: ["{Forskaren|Hon|Han} råder oss att aldrig sluta lära oss.", "Sluta aldrig att lära dig."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: framtid-b2
        shuffle: true
        items:
          - { type: listen, say: "Priserna väntas stiga nästa år." }
          - { type: listen, say: "Om tio år kommer jag att ha flyttat." }
          - { type: listen, say: "Det lär bli kallt i helgen." }
          - { type: listen, say: "Framtiden är något vi skapar tillsammans." }

  - id: praktiskt
    title: Praktiskt · plannen en verwachtingen
    exercises:
      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat past.
        topic: framtid-b2
        shuffle: true
        items:
          - { type: mc, prompt: "Je vertelt over een vast plan.", options: ["Nästa år ska jag börja plugga igen.", "Nästa år lär jag börja plugga igen.", "Nästa år väntas jag börja plugga igen.", "Nästa år beräknas jag plugga."], answer: 0 }
          - { type: mc, prompt: "Je doet een voorzichtige voorspelling.", options: ["Det kommer nog att bli svårt, men vi får se.", "Det har blivit svårt.", "Det tänker bli svårt.", "Det blev svårt i morgon."], answer: 0 }
          - { type: mc, prompt: "Je vraagt naar iemands plannen.", options: ["Vad har du för planer inför framtiden?", "Vad lär du i framtiden?", "Vad väntas du?", "Vad beräknas du göra?"], answer: 0 }
          - { type: mc, prompt: "Je zegt wat je hoopt.", options: ["Jag hoppas att jag har ett jobb som jag trivs med.", "Jag hoppar att jag har ett jobb.", "Jag hoppas jag trivs jobbet.", "Jag hoppas att jag trivs ett jobb."], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een toekomstvisie."
    exercises:
      - id: skriva-framtid
        title: Jouw toekomst
        instruction: Schrijf een toekomstvisie.
        topic: framtid-b2
        items:
          - type: free
            prompt: "Hoe ziet jouw leven (of de wereld) er over tien jaar uit? Schrijf 150–200 woorden. Gebruik *ska* (plannen), *kommer att* (voorspellingen), *kommer att ha* + supinum, een voorwaarde met *om*, en minstens één van *lär, väntas, beräknas*. Sluit af met een conclusie."
            minWords: 140
            require:
              - { any: ["ska"], label: "Je noemt een plan (ska)" }
              - { any: ["kommer att"], label: "Je doet een voorspelling (kommer att)" }
              - { any: ["kommer att ha", "kommer jag att ha", "kommer vi att ha"], label: "Je gebruikt kommer att ha + supinum" }
              - { any: ["om"], label: "Je gebruikt een voorwaarde met om" }
              - { any: ["lär", "väntas", "beräknas", "förväntas"], label: "Je gebruikt lär, väntas of beräknas" }
            model: "Om tio år kommer mycket att ha förändrats, både i världen och i mitt eget liv. Jag ska fortsätta att bo i Sverige, men jag hoppas att jag har flyttat till en mindre stad, närmare naturen. Då kommer jag att ha bott här i femton år, och jag kommer förhoppningsvis att tala svenska nästan lika bra som nederländska. På jobbet lär datorerna ha tagit över många av de tråkiga uppgifterna. Det kan låta skrämmande, men om vi är beredda att lära oss nya saker, kommer det att finnas nya möjligheter. Klimatet är det jag oroar mig mest för. Elbilar väntas bli helt vanliga, men det räcker inte. Vi måste också ändra hur vi reser och vad vi äter. Sammanfattningsvis tror jag att framtiden blir varken bättre eller sämre av sig själv. Det är vi som bestämmer."

  - id: herhaling
    title: Herhaling B1 en B2
    intro: Een gemengde herhaling van alle hoofdstukken, als opwarmer voor de eindtoets.
    exercises:
      - id: herhaling-alles
        title: Alles door elkaar
        instruction: Gemengde vragen uit hoofdstuk 13 tot en met 30.
        shuffle: true
        items:
          - { type: gap, topic: passiv-bli, text: "Uppsatsen blev ___ (godkänna).", gaps: [{ answers: ["godkänd"] }] }
          - { type: translate, topic: partikelverb, prompt: "Ik herkende hem niet.", answers: ["Jag kände inte igen honom."] }
          - { type: gap, topic: deponens, text: "Hon ___ (trivas) bra på sitt förra jobb.", gaps: [{ answers: ["trivdes"] }] }
          - { type: gap, topic: prep-verb, text: "Vi väntar ___ svar.", gaps: [{ answers: ["på"] }] }
          - { type: transform, topic: villkor, prompt: "Om jag har tid, kommer jag.", task: "Maak het denkbeeldig.", answers: ["Om jag hade tid[,] skulle jag komma.", "Hade jag tid[,] skulle jag komma."] }
          - { type: gap, topic: indirekt-fraga, text: "Berätta ___ hände!", gaps: [{ answers: ["vad som"], options: ["vad som", "vad", "vem"], shuffle: false }] }
          - { type: gap, topic: nagon-ingen, text: "Jag har inte hört ___.", gaps: [{ answers: ["något", "någonting"] }] }
          - { type: gap, topic: jamforelse, text: "Ju äldre man blir, ___ klokare blir man.", gaps: [{ answers: ["desto", "ju"] }] }
          - { type: gap, topic: nominalisering, text: "utveckla → ___", gaps: [{ answers: ["en utveckling"] }] }
          - { type: transform, topic: utbrytning, prompt: "**Klimatet** är den största frågan.", answers: ["Det är klimatet som är den största frågan."] }

  - id: eindtoets
    title: Eindtoets B2
    intro: Twintig vragen over de stof van B2 (hoofdstuk 25–30), met een paar vragen uit B1.
    exercises:
      - id: eindtoets-b2
        title: Eindtoets B2
        instruction: Gemengde vragen op B2-niveau.
        items:
          - { type: gap, topic: nominalisering, text: "Priserna ökade kraftigt. → Det skedde en ___ ökning av priserna.", gaps: [{ answers: ["kraftig"] }] }
          - { type: gap, topic: nominalisering, text: "en ökning ___ försäljningen", gaps: [{ answers: ["av"], options: ["av", "med", "till"], shuffle: false }] }
          - { type: gap, topic: trender, text: "Räntan steg från 2 till 3 procent, alltså med en ___.", gaps: [{ answers: ["procentenhet"], options: ["procent", "procentenhet"], shuffle: false }] }
          - { type: mc, topic: trender, prompt: "Wat betekent *knappt hälften*?", options: ["iets minder dan de helft", "iets meer dan de helft", "precies de helft", "bijna niets"], answer: 0 }
          - { type: transform, topic: particip-konstruktion, prompt: "metoden som forskarna utvecklade", task: "Begin met: den av forskarna …", answers: ["den av forskarna utvecklade metoden"] }
          - { type: gap, topic: particip-konstruktion, text: "ett snabbt ___ (växa) problem", gaps: [{ answers: ["växande"] }] }
          - { type: mc, topic: nominalfras, prompt: "Welke formulering is voorzichtig?", options: ["Resultaten tyder på att …", "Studien bevisar att …", "Det är helt klart att …", "Alla vet att …"], answer: 0 }
          - { type: transform, topic: utbrytning, prompt: "**Min syster** hittade vraket.", answers: ["Det var min syster som hittade vraket."] }
          - { type: gap, topic: argumentation, text: "Det är inte ett straff, ___ en möjlighet.", gaps: [{ answers: ["utan"], options: ["utan", "men", "eller"], shuffle: false }] }
          - { type: gap, topic: argumentation, text: "___ kan det låta dyrt, men det lönar sig.", gaps: [{ answers: ["Visserligen"], options: ["Visserligen", "Därför", "Slutligen"], shuffle: false }] }
          - { type: gap, topic: register, text: "Jag såg ___ på stationen.", gaps: [{ answers: ["dem"], options: ["de", "dem"], shuffle: false }] }
          - { type: mc, topic: idiom, prompt: "*Det är ingen ko på isen* betekent:", options: ["Er is geen haast.", "Het is glad buiten.", "Er is een probleem.", "Het is te koud."], answer: 0 }
          - { type: gap, topic: register, text: "Vi har ___ din ansökan. (formeel)", gaps: [{ answers: ["erhållit"], options: ["erhållit", "fått tag på", "kollat"], shuffle: false }] }
          - { type: transform, topic: bisats-adverb, prompt: "Han kom inte heller.", task: "Hon sa att …", answers: ["Hon sa att han inte heller kom."] }
          - { type: transform, topic: fundament, prompt: "Många turister finns på museet.", answers: ["Det finns många turister på museet."] }
          - { type: gap, topic: bisats-adverb, text: "Vasa ___ (segla) bara 1 300 meter när det sjönk.", gaps: [{ answers: ["hade seglat"] }] }
          - { type: transform, topic: framtid-b2, prompt: "Man väntar sig att priserna stiger.", answers: ["Priserna väntas stiga."] }
          - { type: gap, topic: framtid-b2, text: "Om tio år kommer jag ___ flyttat.", gaps: [{ answers: ["att ha"] }] }
          - { type: transform, topic: subjunktioner-b1, prompt: "Det regnade. Vi gick ut ändå. (trots att)", answers: ["Trots att det regnade[,] gick vi ut.", "Vi gick ut[,] trots att det regnade."] }
          - { type: gap, topic: bestamd-utan-artikel, text: "Vi ses nästa ___.", gaps: [{ answers: ["vecka"], options: ["vecka", "veckan"], shuffle: false }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: framtid-b2
        shuffle: true
        items:
          - { type: findError, sentence: "Priserna väntas att stiga.", wrong: [2], answers: ["Priserna väntas stiga."], tip: "Na väntas komt geen att." }
          - { type: findError, sentence: "Befolkningen beräknar öka.", wrong: [1], answers: ["Befolkningen beräknas öka."], tip: "De bevolking rekent niet zelf." }
          - { type: findError, sentence: "Om tio år kommer jag att har flyttat.", wrong: [6], answers: ["Om tio år kommer jag att ha flyttat."], tip: "Na att: infinitief." }
          - { type: findError, sentence: "Det tänker bli kallt i helgen.", wrong: [1], answers: ["Det {lär|kommer att|ska} bli kallt i helgen."], tip: "Het weer heeft geen plannen." }
          - { type: findError, topic: bisats-adverb, sentence: "Jag tror att det blir inte lätt.", wrong: [4, 5], answers: ["Jag tror att det inte blir lätt."], tip: "Bijzinvolgorde." }

