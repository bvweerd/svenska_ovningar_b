  - { text: "Ik kan de grammatica van B2 ook door elkaar toepassen", topics: [nominalisering, trender, particip-konstruktion, nominalfras, utbrytning, argumentation, register, idiom, bisats-adverb, fundament] }

grammar:
  - id: framtid-b2
    title: Verwachtingen en voltooide toekomst
    summary: "*Om tio år **kommer** vi **att ha flyttat**.* (voltooid toekomend) · *Det **lär** bli regn.* (zal wel) · *Priserna **väntas** stiga. Befolkningen **beräknas** öka.* (verwacht wordt dat)"
    body: |
      ### Voltooide toekomst
      Iets wat in de toekomst al **afgerond** zal zijn: **kommer att ha + supinum**.

      - *Om tio år **kommer** jag **att ha flyttat** tillbaka.* – Over tien jaar zal ik terugverhuisd zijn.
      - *När du kommer hem **kommer** jag **att ha lagat** mat.*

      ### Verwachtingen
      | vorm | betekenis | voorbeeld |
      |---|---|---|
      | **lär** + infinitief | zal wel (verwachting) | *Det **lär** bli kallt i helgen.* |
      | **lär** + infinitief | schijnt, naar verluidt | *Han **lär** vara mycket rik.* |
      | **ska** + infinitief | naar verluidt, volgens de verwachting | *Det **ska** bli kallt i helgen, enligt SMHI.* |
      | **torde** + infinitief | zal waarschijnlijk (formeel) | *Kostnaden **torde** bli hög.* |
      | **väntas** + infinitief | wordt verwacht | *Priserna **väntas** stiga.* |
      | **beräknas** + infinitief | wordt berekend/geschat | *Befolkningen **beräknas** öka.* |
      | **förväntas** + infinitief | wordt verwacht | *Efterfrågan **förväntas** öka.* |
      | **kan komma att** + infinitief | zou kunnen gaan | *Reglerna **kan komma att** ändras.* |

      De vormen op **-s** (*väntas, beräknas, förväntas*) zijn lijdend: wie verwacht, wordt niet gezegd. Dat is typisch voor nieuws en rapporten. Vergelijk: *Man väntar sig att priserna stiger.* → *Priserna **väntas stiga**.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-2050
        title: "Lezen: Zweden in 2050"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: framtid-b2
        textTitle: Hur ser Sverige ut år 2050?
        text: |
          Ingen kan veta exakt hur framtiden blir, men det finns trender som framtidsforskare följer noga. Befolkningen väntas bli allt äldre, eftersom vi lever längre och föder färre barn. Det kommer att ställa nya krav på vården och äldreomsorgen, och fler kommer sannolikt att behöva jobba längre upp i åldern.

          Enligt befolkningsprognoserna beräknas medellivslängden fortsätta att öka, och antalet personer över 80 år väntas stiga kraftigt fram till 2050. Det betyder att varje person i arbetsför ålder kommer att behöva försörja fler äldre än i dag. Samtidigt förväntas allt fler flytta till storstäderna, medan många mindre orter kan komma att förlora både invånare och service som skolor, butiker och vårdcentraler.

          Arbetslivet lär också förändras. Många rutinuppgifter beräknas tas över av datorer, medan nya yrken som vi i dag inte ens kan föreställa oss kommer att växa fram. Distansarbete, som var ovanligt före 2020, kommer troligen att vara en självklarhet.

          För den enskilda människan innebär det att utbildning inte längre blir något man gör en gång i livet. Den som börjar arbeta i dag lär behöva byta yrke flera gånger, och förmågan att lära sig nytt torde bli viktigare än någon enskild examen. Redan nu erbjuder många arbetsgivare kurser för sina anställda, och den trenden väntas fortsätta.

          Klimatet är kanske den största frågan. Om vi lyckas, kommer de flesta bilar och lastbilar att ha gått över till el långt före 2050. Om vi misslyckas, kan extremväder komma att bli allt vanligare även i Sverige.

          Utvecklingen går redan snabbt. Elbilar, som för bara tio år sedan var ganska ovanliga, säljs i dag i stora mängder, och flera stora industriprojekt för fossilfri produktion planeras i norra Sverige. När fabrikerna står klara, kommer de att ha skapat tusentals nya jobb, åtminstone om allt går enligt planen.

          Alla är dock inte lika säkra på vad som väntar. Kritiker påpekar att prognoser ofta har slagit fel. På 1960-talet trodde många att vi år 2000 skulle ha flygande bilar och åka på semester till månen, men nästan ingen förutsåg att alla skulle bära runt på en liten dator i fickan. Det visar hur svårt det är att förutsäga vilka förändringar som verkligen kommer att få betydelse.

          – Framtiden är inte något som bara händer oss, säger en framtidsforskare. Det är något vi skapar tillsammans, genom de beslut vi fattar i dag.
        items:
          - { id: xw3e, type: mc, prompt: "Varför blir befolkningen äldre?", options: ["Vi lever längre och föder färre barn.", "Många unga flyttar utomlands.", "Fler barn föds.", "Det står inte i texten."], answer: 0 }
          - { id: 74es, type: mc, prompt: "Vad kommer sannolikt att hända på arbetsmarknaden?", options: ["Datorer tar över rutinuppgifter och nya yrken växer fram.", "Alla yrken försvinner.", "Ingenting förändras.", "Alla får jobba hemifrån."], answer: 0 }
          - { id: dgk8, type: truefalse, statement: "Distansarbete var vanligt före 2020.", answer: false, correction: { answers: ["Distansarbete var ovanligt före 2020."] } }
          - { id: je6j, type: mc, prompt: "Vad händer om vi lyckas med klimatet?", options: ["De flesta fordon kommer att ha gått över till el.", "Extremväder blir vanligare.", "Alla slutar köra bil.", "Bensin blir billigare."], answer: 0 }
          - { id: zk2s, type: mc, prompt: "Vad menar framtidsforskaren?", options: ["Vi skapar framtiden själva genom våra beslut.", "Framtiden är redan bestämd.", "Man kan inte göra något åt framtiden.", "Forskare vet exakt hur framtiden blir."], answer: 0 }
          - id: b6pz
            type: multi
            prompt: "Welke vormen in de tekst drukken een verwachting uit?"
            options: ["väntas", "lär", "beräknas", "kommer troligen att", "följer", "lever"]
            answers: [0, 1, 2, 3]
          - { id: swef, type: mc, prompt: "Vad kan hända med många mindre orter?", options: ["De kan förlora invånare och service.", "De väntas växa snabbare än storstäderna.", "De kommer att få fler skolor och vårdcentraler.", "Det står inte i texten."], answer: 0 }
          - { id: d2kt, type: truefalse, statement: "Enligt texten räcker det att utbilda sig en gång i livet.", answer: false, tip: "Lees de alinea over opleiding nog eens.", correction: { answers: ["Det räcker inte[ att utbilda sig en gång i livet].", "Utbildning blir inte längre något man gör en gång i livet.", "{Man|Den som börjar arbeta i dag|Många} lär behöva byta yrke flera gånger.", "{Man|Vi} {måste|behöver} {fortsätta [att ]lära sig|lära sig nytt} hela livet."] } }
          - { id: th5b, type: mc, prompt: "Vad antyder orden *åtminstone om allt går enligt planen*?", options: ["Att det inte är säkert att alla nya jobb verkligen skapas.", "Att fabrikerna redan är färdiga.", "Att jobben redan finns i dag.", "Att ingen vill arbeta i norra Sverige."], answer: 0 }
          - { id: teky, type: mc, prompt: "Varför nämner texten flygande bilar och semester på månen?", options: ["För att visa att prognoser kan slå fel.", "För att flygande bilar väntas bli vanliga år 2050.", "För att 1960-talet var en bra tid för framtidsforskning.", "För att kritikerna vill bygga flygande bilar."], answer: 0, tip: "Wat wil de schrijver met dit voorbeeld uit de jaren zestig laten zien?" }

      - id: makkelijk-1
        title: "Makkelijk lezen: Om tjugo år"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Om tjugo år"
        text: |
          Hur kommer vi att leva om tjugo år? Många tror att vi kommer att jobba mer hemifrån och resa mindre. Elbilar lär bli vanligare, och kanske kör bilarna själva. Förhoppningsvis blir städerna grönare. Men ingen vet säkert, och framtiden är svår att förutse. Forskare påpekar att många förutsägelser från förr har visat sig vara fel. På sjuttiotalet trodde många att vi skulle ha flygande bilar i dag. Därför bör man nog ta alla framtidsscenarier med en nypa salt. Det enda säkra är att mycket kommer att förändras.
        items:
          - { id: a2vq, type: truefalse, statement: "Många tror att vi kommer att resa mer.", answer: false }
          - { id: h8qf, type: truefalse, statement: "Det är svårt att veta hur framtiden blir.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Robotar i vården"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Robotar i vården"
        text: |
          På ett äldreboende i Västerås testas robotar som hjälper personalen. Robotarna delar ut mat och påminner de äldre om att ta sina mediciner. Personalen får då mer tid att prata med de boende. Ärligt talat var många skeptiska i början, men nu är de flesta positiva. Robotarna kan dock inte ersätta människor. De kan inte trösta någon som är ledsen eller förstå vad en äldre person behöver. Det är fortfarande personalen som har ansvaret. Kommunen ska utvärdera försöket efter ett år och bestämma om fler boenden ska få robotar.
        items:
          - { id: sdgc, type: truefalse, statement: "Robotarna ersätter all personal.", answer: false }
          - { id: 8mj3, type: truefalse, statement: "Personalen får mer tid att prata med de boende.", answer: true }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
