  - id: framtid
    title: "Grammatik: verwachtingen"
    exercises:
      - id: framtid-b2-invullen
        title: Voltooide toekomst
        instruction: Vul de voltooide toekomst in (**kommer att ha** + supinum).
        topic: framtid-b2
        shuffle: true
        items:
          - { id: seq2, type: gap, text: "Om tio år ___ jag ___ (flytta) tillbaka till Nederländerna.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha flyttat"], feedback: [{ match: "att flytta", tip: "Het is dan al gebeurd: att ha flyttat." }] }] }
          - { id: 5szn, type: gap, text: "När du kommer hem, ___ jag redan ___ (laga) mat.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha lagat"] }] }
          - { id: 3cyt, type: gap, text: "År 2040 ___ de flesta bilar ___ (gå) över till el.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha gått"], feedback: [{ match: "att ha gåtts", tip: "Supinum van gå: gått." }] }] }
          - { id: zfgn, type: gap, text: "Innan sommaren ___ vi ___ (måla) huset.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha målat"], feedback: [{ match: "att måla", tip: "Het is dan al gebeurd: att ha målat." }] }] }
          - { id: mjgf, type: gap, text: "Om ett år ___ hon ___ (ta) examen.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha tagit"], feedback: [{ match: "att ha tagat", tip: "ta is sterk: tagit." }] }] }
          - { id: c66z, type: gap, text: "När filmen börjar ___ vi redan ___ (äta).", gaps: [{ answers: ["kommer"] }, { answers: ["att ha ätit"], feedback: [{ match: "att ha ätat", tip: "äta is sterk: ätit." }] }] }
          - { id: utmh, type: gap, text: "År 2050 ___ havsnivån ___ (stiga) flera decimeter.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha stigit"], feedback: [{ match: "att ha stigat", tip: "stiga is sterk: stigit." }] }] }
          - { id: 7xnv, type: gap, text: "Till jul ___ jag ___ (läsa) alla böckerna.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha läst"] }] }

      - id: framtid-b2-kiezen
        title: Het goede woord
        instruction: Kies wat past.
        topic: framtid-b2
        shuffle: true
        items:
          - { id: gq7v, type: gap, text: "Det ___ bli kallt i helgen, enligt prognosen.", gaps: [{ answers: ["lär"], options: ["lär", "tänker", "vill"], shuffle: false, tip: "Zal wel (verwachting): lär." }] }
          - { id: hbeb, type: gap, text: "Priserna ___ stiga under nästa år.", gaps: [{ answers: ["väntas"], options: ["väntas", "väntar", "vänta"], shuffle: false, feedback: [{ match: "väntar", tip: "De prijzen wachten niet zelf: lijdend, väntas." }] }] }
          - { id: jdaf, type: gap, text: "Befolkningen ___ öka med två procent.", gaps: [{ answers: ["beräknas"], options: ["beräknas", "beräknar", "räknar"], shuffle: false }] }
          - { id: hkg5, type: gap, text: "Reglerna kan ___ att ändras.", gaps: [{ answers: ["komma"], options: ["komma", "kommer", "kommit"], shuffle: false, tip: "kan komma att = zou kunnen gaan." }] }
          - { id: n4kf, type: gap, text: "Projektet ___ vara klart i maj.", gaps: [{ answers: ["beräknas"], options: ["beräknas", "beräknar", "tänker"], shuffle: false }] }
          - { id: t2kr, type: gap, text: "Det ___ bli svårt att hitta bostad i framtiden.", gaps: [{ answers: ["lär"], options: ["lär", "vill", "tänker"], shuffle: false, tip: "Zal wel (verwachting): lär." }] }
          - { id: qu9c, type: gap, text: "Fler ___ att jobba hemifrån.", gaps: [{ answers: ["kommer"], options: ["kommer", "lär", "väntas"], shuffle: false, tip: "Alleen kommer heeft att nodig: kommer att jobba." }] }
          - { id: pbwg, type: gap, text: "Skatterna kan ___ att höjas.", gaps: [{ answers: ["komma"], options: ["komma", "kommer", "kommit"], shuffle: false, tip: "kan komma att = zou kunnen gaan." }] }

      - id: framtid-b2-omvormen
        title: Formeel verwachten
        instruction: Herschrijf de zin met **väntas**, **beräknas** of **förväntas**.
        topic: framtid-b2
        items:
          - { id: tjc3, type: transform, prompt: "Man väntar sig att priserna stiger.", answers: ["Priserna {väntas|förväntas} stiga."], feedback: [{ contains: "väntas att", tip: "Zonder att: Priserna väntas stiga." }, { contains: "väntas stiger", tip: "Na väntas: infinitief, stiga." }] }
          - { id: 94k3, type: transform, prompt: "Man beräknar att befolkningen ökar.", answers: ["Befolkningen beräknas öka."], feedback: [{ contains: "beräknas ökar", tip: "Na beräknas: infinitief, öka." }] }
          - { id: 4vch, type: transform, prompt: "Man förväntar sig att efterfrågan ökar.", answers: ["Efterfrågan förväntas öka.", "Efterfrågan väntas öka."] }
          - { id: zdx9, type: transform, prompt: "Man tror att arbetslösheten sjunker.", task: "Begin met: Arbetslösheten väntas …", answers: ["Arbetslösheten väntas sjunka."] }
          - { id: 82s6, type: transform, prompt: "Man väntar sig att räntan sjunker.", answers: ["Räntan {väntas|förväntas} sjunka."], feedback: [{ contains: "väntas sjunker", tip: "Na väntas: infinitief, sjunka." }] }
          - { id: vw4m, type: transform, prompt: "Man beräknar att kostnaden blir två miljoner.", answers: ["Kostnaden beräknas bli två miljoner."], feedback: [{ contains: "beräknas blir", tip: "Na beräknas: infinitief, bli." }] }
          - { id: 4uyh, type: transform, prompt: "Man förväntar sig att fler flyttar till städerna.", answers: ["Fler {förväntas|väntas} flytta till städerna."] }
          - { id: 7hq6, type: transform, prompt: "Man tror att bygget är klart 2030.", task: "Begin met: Bygget väntas …", answers: ["Bygget väntas vara klart [år ]2030."], feedback: [{ contains: "väntas är", tip: "Na väntas: infinitief, vara." }] }

      - id: framtid-b2-vertalen
        title: Verwachtingen vertalen
        instruction: Vertaal de zin. Gebruik de vormen van dit hoofdstuk (kommer att ha, väntas, beräknas, lär, kan komma att).
        topic: framtid-b2
        shuffle: true
        items:
          - { id: gagf, type: translate, prompt: "Wanneer het nieuwe ziekenhuis klaar is, zullen de kosten waarschijnlijk meer dan verdubbeld zijn.", answers: ["När det nya sjukhuset {är klart|är färdigt|står klart|blir klart} kommer kostnaderna {sannolikt|troligen|förmodligen|antagligen} att ha mer än {fördubblats|dubblerats}.", "När det nya sjukhuset {är klart|är färdigt|står klart|blir klart} {lär|torde} kostnaderna ha mer än {fördubblats|dubblerats}.", "Kostnaderna kommer {sannolikt|troligen|förmodligen|antagligen} att ha mer än {fördubblats|dubblerats} när det nya sjukhuset {är klart|är färdigt|står klart|blir klart}."], feedback: [{ contains: ["klart kostnaderna", "färdigt kostnaderna"], tip: "De bijzin met när telt als plaats 1: daarna komt meteen het werkwoord (… kommer kostnaderna …)." }, { contains: "att har", tip: "Na att komt de infinitief: att ha fördubblats." }] }
          - { id: b2rx, type: translate, prompt: "Volgens de prognose wordt verwacht dat het aantal gepensioneerden de komende tien jaar sterk zal stijgen.", answers: ["Enligt prognosen {väntas|förväntas|beräknas} antalet pensionärer {öka|stiga} {kraftigt|starkt} [under ]{de närmaste tio åren|de kommande tio åren|de tio närmaste åren|de tio kommande åren}.", "Antalet pensionärer {väntas|förväntas|beräknas} {öka|stiga} {kraftigt|starkt} [under ]{de närmaste tio åren|de kommande tio åren|de tio närmaste åren|de tio kommande åren} enligt prognosen."], feedback: [{ contains: ["väntas att", "beräknas att"], tip: "Na väntas, förväntas en beräknas volgt de infinitief zonder att: antalet pensionärer väntas öka." }, { contains: "prognosen antalet", tip: "Na Enligt prognosen vooraan komt het werkwoord op plaats 2: Enligt prognosen väntas antalet …" }] }
          - { id: fxth, type: translate, prompt: "Volgens de krant wordt verwacht dat de nieuwe spoorlijn tussen Stockholm en Göteborg pas in 2040 klaar is.", answers: ["Enligt tidningen {väntas|förväntas|beräknas} den nya {järnvägen|järnvägslinjen|järnvägsförbindelsen} mellan Stockholm och Göteborg {bli|vara} {klar|färdig} först [år ]2040.", "Den nya {järnvägen|järnvägslinjen|järnvägsförbindelsen} mellan Stockholm och Göteborg {väntas|förväntas|beräknas} {bli|vara} {klar|färdig} först [år ]2040 enligt tidningen.", "Enligt tidningen {väntas|förväntas|beräknas} den nya {järnvägen|järnvägslinjen|järnvägsförbindelsen} mellan Stockholm och Göteborg inte {bli|vara} {klar|färdig} förrän [år ]2040."], feedback: [{ contains: ["väntas att", "beräknas att"], tip: "Na väntas, förväntas en beräknas volgt de infinitief zonder att." }, { contains: "tidningen den nya", tip: "Na Enligt tidningen vooraan komt het werkwoord op plaats 2: Enligt tidningen väntas den nya järnvägen …" }] }
          - { id: xszv, type: translate, prompt: "Als alles volgens plan verloopt, zullen we tegen de zomer alle ramen in het huis vervangen hebben.", answers: ["Om allt går {enligt planen|som planerat|enligt plan} kommer vi att ha {bytt|bytt ut|ersatt} alla {fönster|fönstren} i huset {till|före|innan} sommaren.", "Om allt går {enligt planen|som planerat|enligt plan} kommer vi {till|före|innan} sommaren att ha {bytt|bytt ut|ersatt} alla {fönster|fönstren} i huset.", "{Till|Före|Innan} sommaren kommer vi att ha {bytt|bytt ut|ersatt} alla {fönster|fönstren} i huset om allt går {enligt planen|som planerat|enligt plan}."], feedback: [{ contains: ["planen vi", "plan vi", "planerat vi"], tip: "De bijzin met om telt als plaats 1: daarna komt meteen het werkwoord (… kommer vi att ha bytt …)." }, { contains: "att har", tip: "Na att komt de infinitief: att ha bytt." }] }
          - { id: q6d2, type: translate, prompt: "Over tien jaar zullen veel van de huidige beroepen waarschijnlijk door computers overgenomen zijn.", answers: ["Om tio år kommer många av {dagens yrken|de nuvarande yrkena} {sannolikt|troligen|förmodligen|antagligen} att ha {tagits över|övertagits|blivit övertagna} av datorer.", "Många av {dagens yrken|de nuvarande yrkena} kommer {sannolikt|troligen|förmodligen|antagligen} att ha {tagits över|övertagits|blivit övertagna} av datorer om tio år.", "Om tio år lär många av {dagens yrken|de nuvarande yrkena} ha {tagits över|övertagits|blivit övertagna} av datorer."], feedback: [{ contains: "tio år många", tip: "Na Om tio år vooraan komt het werkwoord op plaats 2: Om tio år kommer många …" }, { contains: "att har", tip: "Na att komt de infinitief: att ha tagits över." }] }
