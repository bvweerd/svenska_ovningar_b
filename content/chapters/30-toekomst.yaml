chapter: 30
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan verwachtingen uitspreken en de voltooid toekomende tijd gebruiken", topics: [framtid-b2] }
  - { text: "Ik kan de grammatica van B2 ook door elkaar toepassen", topics: [nominalisering, trender, particip-konstruktion, nominalfras, utbrytning, argumentation, register, idiom, bisats-adverb, fundament] }

grammar:
  - id: framtid-b2
    title: Verwachtingen en voltooide toekomst
    summary: "*Om tio år **kommer** vi **att ha flyttat**.* (voltooid toekomend) · *Det **lär** bli regn.* (zal wel) · *Priserna **väntas** stiga. Befolkningen **beräknas** öka.* (verwacht wordt dat)"
    body: |
      ### Voltooide toekomst
      Iets wat in de toekomst al **afgerond** zal zijn: **kommer att ha + supinum**.

      - *Om tio år **kommer** jag **att ha flyttat** tillbaka.* – Over tien jaar zal ik terugverhuisd zijn.
      - *När du kommer hem **kommer** jag **att ha lagat** mat.*

      ### Verwachtingen
      | vorm | betekenis | voorbeeld |
      |---|---|---|
      | **lär** + infinitief | zal wel (verwachting) | *Det **lär** bli kallt i helgen.* |
      | **lär** + infinitief | schijnt, naar verluidt | *Han **lär** vara mycket rik.* |
      | **ska** + infinitief | naar verluidt, volgens de verwachting | *Det **ska** bli kallt i helgen, enligt SMHI.* |
      | **torde** + infinitief | zal waarschijnlijk (formeel) | *Kostnaden **torde** bli hög.* |
      | **väntas** + infinitief | wordt verwacht | *Priserna **väntas** stiga.* |
      | **beräknas** + infinitief | wordt berekend/geschat | *Befolkningen **beräknas** öka.* |
      | **förväntas** + infinitief | wordt verwacht | *Efterfrågan **förväntas** öka.* |
      | **kan komma att** + infinitief | zou kunnen gaan | *Reglerna **kan komma att** ändras.* |

      De vormen op **-s** (*väntas, beräknas, förväntas*) zijn lijdend: wie verwacht, wordt niet gezegd. Dat is typisch voor nieuws en rapporten. Vergelijk: *Man väntar sig att priserna stiger.* → *Priserna **väntas stiga**.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-2050
        title: "Lezen: Zweden in 2050"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: framtid-b2
        textTitle: Hur ser Sverige ut år 2050?
        text: |
          Ingen kan veta exakt hur framtiden blir, men det finns trender som framtidsforskare följer noga. Befolkningen väntas bli allt äldre, eftersom vi lever längre och föder färre barn. Det kommer att ställa nya krav på vården och äldreomsorgen, och fler kommer sannolikt att behöva jobba längre upp i åldern.

          Arbetslivet lär också förändras. Många rutinuppgifter beräknas tas över av datorer, medan nya yrken som vi i dag inte ens kan föreställa oss kommer att växa fram. Distansarbete, som var ovanligt före 2020, kommer troligen att vara en självklarhet.

          Klimatet är kanske den största frågan. Om vi lyckas, kommer de flesta bilar och lastbilar att ha gått över till el långt före 2050. Om vi misslyckas, kan extremväder komma att bli allt vanligare även i Sverige.

          – Framtiden är inte något som bara händer oss, säger en framtidsforskare. Det är något vi skapar tillsammans, genom de beslut vi fattar i dag.
        items:
          - { id: xw3e, type: mc, prompt: "Varför blir befolkningen äldre?", options: ["Vi lever längre och föder färre barn.", "Många unga flyttar utomlands.", "Fler barn föds.", "Det står inte i texten."], answer: 0 }
          - { id: 74es, type: mc, prompt: "Vad kommer sannolikt att hända på arbetsmarknaden?", options: ["Datorer tar över rutinuppgifter och nya yrken växer fram.", "Alla yrken försvinner.", "Ingenting förändras.", "Alla får jobba hemifrån."], answer: 0 }
          - { id: dgk8, type: truefalse, statement: "Distansarbete var vanligt före 2020.", answer: false, correction: { answers: ["Distansarbete var ovanligt före 2020."] } }
          - { id: je6j, type: mc, prompt: "Vad händer om vi lyckas med klimatet?", options: ["De flesta fordon kommer att ha gått över till el.", "Extremväder blir vanligare.", "Alla slutar köra bil.", "Bensin blir billigare."], answer: 0 }
          - { id: zk2s, type: mc, prompt: "Vad menar framtidsforskaren?", options: ["Vi skapar framtiden själva genom våra beslut.", "Framtiden är redan bestämd.", "Man kan inte göra något åt framtiden.", "Forskare vet exakt hur framtiden blir."], answer: 0 }
          - id: b6pz
            type: multi
            prompt: "Welke vormen in de tekst drukken een verwachting uit?"
            options: ["väntas", "lär", "beräknas", "kommer troligen att", "följer", "lever"]
            answers: [0, 1, 2, 3]

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-toekomst
        title: De toekomst
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: 6z4j
            type: match
            pairs:
              - ["en framtidsforskare", "een toekomstonderzoeker"]
              - ["äldreomsorg", "ouderenzorg"]
              - ["ett yrke", "een beroep"]
              - ["en självklarhet", "een vanzelfsprekendheid"]
              - ["föreställa sig", "zich voorstellen"]
              - ["växa fram", "ontstaan, opkomen"]
          - id: ya3k
            type: match
            pairs:
              - ["lyckas", "slagen"]
              - ["misslyckas", "mislukken"]
              - ["extremväder", "extreem weer"]
              - ["gå över till", "overstappen op"]
              - ["upp i åldern", "op latere leeftijd"]
              - ["fatta ett beslut", "een besluit nemen"]

  - id: framtid
    title: "Grammatik: verwachtingen"
    exercises:
      - id: framtid-b2-invullen
        title: Voltooide toekomst
        instruction: Vul de voltooide toekomst in (**kommer att ha** + supinum).
        topic: framtid-b2
        shuffle: true
        items:
          - { id: seq2, type: gap, text: "Om tio år ___ jag ___ (flytta) tillbaka till Nederländerna.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha flyttat"], feedback: [{ match: "att flytta", tip: "Het is dan al gebeurd: att ha flyttat." }] }] }
          - { id: 5szn, type: gap, text: "När du kommer hem, ___ jag redan ___ (laga) mat.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha lagat"] }] }
          - { id: 3cyt, type: gap, text: "År 2040 ___ de flesta bilar ___ (gå) över till el.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha gått"], feedback: [{ match: "att ha gåtts", tip: "Supinum van gå: gått." }] }] }
          - { id: zfgn, type: gap, text: "Innan sommaren ___ vi ___ (måla) huset.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha målat"], feedback: [{ match: "att måla", tip: "Het is dan al gebeurd: att ha målat." }] }] }
          - { id: mjgf, type: gap, text: "Om ett år ___ hon ___ (ta) examen.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha tagit"], feedback: [{ match: "att ha tagat", tip: "ta is sterk: tagit." }] }] }
          - { id: c66z, type: gap, text: "När filmen börjar ___ vi redan ___ (äta).", gaps: [{ answers: ["kommer"] }, { answers: ["att ha ätit"], feedback: [{ match: "att ha ätat", tip: "äta is sterk: ätit." }] }] }
          - { id: utmh, type: gap, text: "År 2050 ___ havsnivån ___ (stiga) flera decimeter.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha stigit"], feedback: [{ match: "att ha stigat", tip: "stiga is sterk: stigit." }] }] }
          - { id: 7xnv, type: gap, text: "Till jul ___ jag ___ (läsa) alla böckerna.", gaps: [{ answers: ["kommer"] }, { answers: ["att ha läst"] }] }

      - id: framtid-b2-kiezen
        title: Het goede woord
        instruction: Kies wat past.
        topic: framtid-b2
        shuffle: true
        items:
          - { id: gq7v, type: gap, text: "Det ___ bli kallt i helgen, enligt prognosen.", gaps: [{ answers: ["lär"], options: ["lär", "tänker", "vill"], shuffle: false, tip: "Zal wel (verwachting): lär." }] }
          - { id: hbeb, type: gap, text: "Priserna ___ stiga under nästa år.", gaps: [{ answers: ["väntas"], options: ["väntas", "väntar", "vänta"], shuffle: false, feedback: [{ match: "väntar", tip: "De prijzen wachten niet zelf: lijdend, väntas." }] }] }
          - { id: jdaf, type: gap, text: "Befolkningen ___ öka med två procent.", gaps: [{ answers: ["beräknas"], options: ["beräknas", "beräknar", "räknar"], shuffle: false }] }
          - { id: hkg5, type: gap, text: "Reglerna kan ___ att ändras.", gaps: [{ answers: ["komma"], options: ["komma", "kommer", "kommit"], shuffle: false, tip: "kan komma att = zou kunnen gaan." }] }
          - { id: n4kf, type: gap, text: "Projektet ___ vara klart i maj.", gaps: [{ answers: ["beräknas"], options: ["beräknas", "beräknar", "tänker"], shuffle: false }] }
          - { id: t2kr, type: gap, text: "Det ___ bli svårt att hitta bostad i framtiden.", gaps: [{ answers: ["lär"], options: ["lär", "vill", "tänker"], shuffle: false, tip: "Zal wel (verwachting): lär." }] }
          - { id: qu9c, type: gap, text: "Fler ___ att jobba hemifrån.", gaps: [{ answers: ["kommer"], options: ["kommer", "lär", "väntas"], shuffle: false, tip: "Alleen kommer heeft att nodig: kommer att jobba." }] }
          - { id: pbwg, type: gap, text: "Skatterna kan ___ att höjas.", gaps: [{ answers: ["komma"], options: ["komma", "kommer", "kommit"], shuffle: false, tip: "kan komma att = zou kunnen gaan." }] }

      - id: framtid-b2-omvormen
        title: Formeel verwachten
        instruction: Herschrijf de zin met **väntas**, **beräknas** of **förväntas**.
        topic: framtid-b2
        items:
          - { id: tjc3, type: transform, prompt: "Man väntar sig att priserna stiger.", answers: ["Priserna {väntas|förväntas} stiga."], feedback: [{ contains: "väntas att", tip: "Zonder att: Priserna väntas stiga." }, { contains: "väntas stiger", tip: "Na väntas: infinitief, stiga." }] }
          - { id: 94k3, type: transform, prompt: "Man beräknar att befolkningen ökar.", answers: ["Befolkningen beräknas öka."], feedback: [{ contains: "beräknas ökar", tip: "Na beräknas: infinitief, öka." }] }
          - { id: 4vch, type: transform, prompt: "Man förväntar sig att efterfrågan ökar.", answers: ["Efterfrågan förväntas öka.", "Efterfrågan väntas öka."] }
          - { id: zdx9, type: transform, prompt: "Man tror att arbetslösheten sjunker.", task: "Begin met: Arbetslösheten väntas …", answers: ["Arbetslösheten väntas sjunka."] }
          - { id: 82s6, type: transform, prompt: "Man väntar sig att räntan sjunker.", answers: ["Räntan {väntas|förväntas} sjunka."], feedback: [{ contains: "väntas sjunker", tip: "Na väntas: infinitief, sjunka." }] }
          - { id: vw4m, type: transform, prompt: "Man beräknar att kostnaden blir två miljoner.", answers: ["Kostnaden beräknas bli två miljoner."], feedback: [{ contains: "beräknas blir", tip: "Na beräknas: infinitief, bli." }] }
          - { id: 4uyh, type: transform, prompt: "Man förväntar sig att fler flyttar till städerna.", answers: ["Fler {förväntas|väntas} flytta till städerna."] }
          - { id: 7hq6, type: transform, prompt: "Man tror att bygget är klart 2030.", task: "Begin met: Bygget väntas …", answers: ["Bygget väntas vara klart [år ]2030."], feedback: [{ contains: "väntas är", tip: "Na väntas: infinitief, vara." }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: framtid-b2
        shuffle: true
        items:
          - { id: grsc, type: findError, sentence: "Priserna väntas att stiga.", wrong: [2], answers: ["Priserna {väntas|förväntas} stiga."], tip: "Na väntas komt geen att." }
          - { id: n85z, type: findError, sentence: "Befolkningen beräknar öka.", wrong: [1], answers: ["Befolkningen beräknas öka."], tip: "De bevolking rekent niet zelf." }
          - { id: 8rqr, type: findError, sentence: "Om tio år kommer jag att har flyttat.", wrong: [6], answers: ["Om tio år kommer jag att ha flyttat."], tip: "Na att: infinitief." }
          - { id: tn2j, type: findError, sentence: "Det tänker bli kallt i helgen.", wrong: [1], answers: ["Det {lär|kommer att|ska} bli kallt i helgen."], tip: "Het weer heeft geen plannen." }
          - { id: sdm2, type: findError, topic: bisats-adverb, sentence: "Jag tror att det blir inte lätt.", wrong: [4, 5], answers: ["Jag tror att det inte blir lätt."], tip: "Bijzinvolgorde." }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-framtid
        title: "Luisteren: een toekomstonderzoeker"
        instruction: Luister naar het fragment. Is de bewering **rätt** of **fel**?
        topic: framtid-b2
        listen: true
        textTitle: Ett samtal om framtiden
        text: |
          Många frågar mig vilka jobb som kommer att finnas om tjugo år. Ärligt talat vet ingen det. Men vi vet att förmågan att lära sig nytt kommer att bli allt viktigare.

          Den som har lärt sig ett nytt språk som vuxen, till exempel svenska, har redan visat att den kan anpassa sig. Det är en egenskap som arbetsgivare lär värdera högt i framtiden.

          Mitt råd är därför enkelt: sluta aldrig att lära dig. Om tio år kommer du att ha glömt det mesta du läser i dag, men du kommer att ha kvar förmågan att lära.
        items:
          - { id: d584, type: truefalse, statement: "Forskaren vet exakt vilka jobb som kommer att finnas.", answer: false, correction: { answers: ["Ingen vet det.", "{Forskaren|Hon|Han} vet inte[ det]."] } }
          - { id: h874, type: truefalse, statement: "Förmågan att lära sig nytt blir allt viktigare.", answer: true }
          - { id: 2z55, type: truefalse, statement: "Att lära sig ett språk som vuxen visar att man kan anpassa sig.", answer: true }
          - { id: uqvv, type: truefalse, statement: "Forskaren råder oss att sluta lära oss när vi är vuxna.", answer: false, correction: { answers: ["{Forskaren|Hon|Han} råder oss att aldrig sluta lära oss.", "Sluta aldrig att lära dig."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: framtid-b2
        shuffle: true
        items:
          - { id: 55gu, type: listen, say: "Priserna väntas stiga nästa år." }
          - { id: cbrv, type: listen, say: "Om tio år kommer jag att ha flyttat." }
          - { id: kw5b, type: listen, say: "Det lär bli kallt i helgen." }
          - { id: 3tqq, type: listen, say: "Framtiden är något vi skapar tillsammans." }

  - id: praktiskt
    title: Praktiskt · plannen en verwachtingen
    exercises:
      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat past.
        topic: framtid-b2
        shuffle: true
        items:
          - { id: tdwe, type: mc, prompt: "Je vertelt over een vast plan.", options: ["Nästa år ska jag börja plugga igen.", "Nästa år lär jag börja plugga igen.", "Nästa år väntas jag börja plugga igen.", "Nästa år beräknas jag plugga."], answer: 0 }
          - { id: 7grk, type: mc, prompt: "Je doet een voorzichtige voorspelling.", options: ["Det kommer nog att bli svårt, men vi får se.", "Det har blivit svårt.", "Det tänker bli svårt.", "Det blev svårt i morgon."], answer: 0 }
          - { id: 25k7, type: mc, prompt: "Je vraagt naar iemands plannen.", options: ["Vad har du för planer inför framtiden?", "Vad lär du i framtiden?", "Vad väntas du?", "Vad beräknas du göra?"], answer: 0 }
          - { id: mask, type: mc, prompt: "Je zegt wat je hoopt.", options: ["Jag hoppas att jag har ett jobb som jag trivs med.", "Jag hoppar att jag har ett jobb.", "Jag hoppas jag trivs jobbet.", "Jag hoppas att jag trivs ett jobb."], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een toekomstvisie."
    exercises:
      - id: skriva-betoog
        title: Betoog in stappen
        instruction: "Bouw een betoog op in vier delen: tes, argumenten, motargument met bemötande en slutsats. De app kijkt elke stap na. Daarna schrijf je het hele betoog, als je wilt."
        topic: argumentation
        items:
          - id: ssqe
            type: steps
            topic: argumentation
            steps:
              - { type: mc, prompt: "**Tes.** Welke zin is een goede tes (een standpunt)?", options: ["Robotar borde få en större roll i äldreomsorgen.", "Antalet pensionärer i Sverige väntas öka de närmaste åren.", "Min mormor fick besök av en robot på sitt boende förra veckan."], answer: 0, tip: "Een tes is een standpunt waarover je van mening kunt verschillen, geen verwachting die je meldt en geen eigen ervaring." }
              - { type: order, topic: framtid-b2, prompt: "**Tes.** Ik ben ervan overtuigd dat robots het personeel niet zullen vervangen, maar helpen. Let op de plaats van *inte* in de bijzin.", start: "Jag är övertygad om att", tokens: ["robotar", "inte", "kommer", "att", "ersätta", "personalen", "utan", "hjälpa", "den"], answers: ["Jag är övertygad om att robotar inte kommer att ersätta personalen utan hjälpa den."], feedback: [{ contains: "robotar kommer inte", tip: "Na om att volgt een bijzin: inte staat vóór het werkwoord (robotar inte kommer att)." }] }
          - id: aasu
            type: steps
            topic: argumentation
            steps:
              - { type: gap, topic: framtid-b2, prompt: "**Argument 1.** Je doet een voorspelling. Kies het woord dat past.", text: "För det första ___ antalet äldre att öka kraftigt de närmaste åren.", gaps: [{ answers: ["kommer"], options: ["kommer", "ska", "lär"], tip: "Een voorspelling met att: kommer att öka. Ska en lär staan zonder att." }] }
              - { type: gap, prompt: "**Argument 2.** Kies het signaalwoord.", text: "___ kan robotar ta över tunga lyft, så att personalen orkar mer.", gaps: [{ answers: ["Dessutom"], options: ["Dessutom", "Å andra sidan", "Kort sagt"], tip: "Nog een argument erbij: dessutom (bovendien). Kort sagt hoort bij de slutsats." }] }
              - { type: order, topic: framtid-b2, prompt: "**Argument 3.** Maak de bijzin met *eftersom* af.", start: "Vi måste planera redan nu,", tokens: ["eftersom", "det", "väntas", "bli", "brist", "på", "personal", "inom", "vården"], answers: ["Vi måste planera redan nu, eftersom det väntas bli brist på personal inom vården."], feedback: [{ contains: "eftersom väntas det", tip: "Na eftersom volgt een bijzin, zonder inversie: eftersom det väntas …" }] }
          - id: ngg3
            type: steps
            topic: argumentation
            steps:
              - { type: mc, prompt: "**Motargument.** Welke zin geeft weer wat de andere kant vindt?", options: ["Vissa hävdar att äldre människor behöver mänsklig kontakt, inte maskiner.", "Dessutom kan robotar ta över tunga lyft.", "Sammanfattningsvis anser jag att robotar är en bra lösning."], answer: 0, tip: "Een motargument is wat anderen vinden: Vissa hävdar att … of Kritiker menar att …" }
              - { type: order, prompt: "**Bemötande.** Geef eerst toe, zet er dan iets tegenover.", start: "Visserligen kan en robot aldrig ersätta en människa,", tokens: ["men", "den", "kan", "frigöra", "tid", "för", "samtal"], answers: ["Visserligen kan en robot aldrig ersätta en människa, men den kan frigöra tid för samtal."] }
              - { type: gap, topic: framtid-b2, prompt: "**Bemötande.** Kies het woord dat past.", text: "___ tekniken kostar mycket i början, kommer den att löna sig på sikt.", gaps: [{ answers: ["Trots att"], options: ["Trots att", "Eftersom", "Därför"], tip: "Hoewel het in het begin veel kost: trots att. Eftersom geeft een reden, en na därför zou het werkwoord direct volgen." }] }
          - id: hapw
            type: steps
            topic: argumentation
            steps:
              - { type: translate, topic: framtid-b2, prompt: "**Slutsats.** Vertaal: Over tien jaar zullen robots een vanzelfsprekend (självklar) deel van de zorg zijn.", answers: ["Om tio år kommer robotar [att ]{vara|utgöra} en självklar del {av|i} {vården|omsorgen|äldreomsorgen}.", "Robotar kommer [att ]{vara|utgöra} en självklar del {av|i} {vården|omsorgen|äldreomsorgen} om tio år.", "Om tio år {är|blir} robotar en självklar del {av|i} {vården|omsorgen|äldreomsorgen}."], feedback: [{ contains: "om tio år robotar", tip: "Na Om tio år vooraan komt eerst het werkwoord: Om tio år kommer robotar …" }] }
              - { type: gap, prompt: "**Slutsats.** Je sluit af. Kies het signaalwoord.", text: "___ anser jag att robotar kan göra äldreomsorgen både bättre och mer mänsklig.", gaps: [{ answers: ["Sammanfattningsvis"], options: ["Sammanfattningsvis", "Visserligen", "Dessutom"], tip: "Een slutsats begin je met sammanfattningsvis. Dessutom voegt nog een argument toe, visserligen geeft iets toe." }] }
          - id: nw2m
            type: free
            prompt: "Schrijf nu het hele betoog (100–150 woorden) over de stelling *Robotar borde få en större roll i äldreomsorgen*, of kies zelf een stelling over de toekomst (bijvoorbeeld: *Alla borde få jobba fyra dagar i veckan*). Gebruik de vier delen: tes, twee of drie argumenten, een motargument met bemötande en een slutsats, en minstens één voorspelling met *kommer att* of *väntas*."
            minWords: 90
            require:
              - { any: ["anser", "tycker", "övertygad", "borde"], label: "Je geeft je tes" }
              - { any: ["för det första", "dessutom", "eftersom"], label: "Je ordent je argumenten (för det första, dessutom, eftersom)" }
              - { any: ["visserligen", "trots att", "å andra sidan", "det stämmer att"], label: "Je bemöter een motargument (visserligen … men, trots att)" }
              - { any: ["sammanfattningsvis", "därför", "kort sagt"], label: "Je sluit af met een slutsats" }
              - { any: ["kommer att", "väntas", "beräknas"], label: "Je doet een voorspelling (kommer att, väntas)" }
            model: "Robotar borde få en större roll i äldreomsorgen. Jag är övertygad om att robotar inte kommer att ersätta personalen utan hjälpa den. För det första kommer antalet äldre att öka kraftigt de närmaste åren. Vi måste planera redan nu, eftersom det väntas bli brist på personal inom vården. Dessutom kan robotar ta över tunga lyft, så att personalen orkar mer. Vissa hävdar att äldre människor behöver mänsklig kontakt, inte maskiner. Visserligen kan en robot aldrig ersätta en människa, men den kan frigöra tid för samtal. Trots att tekniken kostar mycket i början, kommer den att löna sig på sikt. Om tio år kommer robotar att vara en självklar del av vården. Sammanfattningsvis anser jag att robotar kan göra äldreomsorgen både bättre och mer mänsklig."

      - id: skriva-framtid
        title: Jouw toekomst
        instruction: "Bouw eerst je toekomstvisie op in vijf stappen die de app nakijkt. Daarna schrijf je de hele tekst, als je wilt."
        topic: framtid-b2
        items:
          - { id: vs3n, type: mc, prompt: "Kies de beste openingszin.", options: ["Om tio år kommer mycket att ha förändrats.", "Om tio år mycket kommer att ha förändrats.", "Om tio år kommer mycket att har förändrats."], answer: 0, tip: "Na Om tio år komt het werkwoord op plaats 2, en na att komt de infinitief: att ha förändrats." }
          - { id: wkte, type: gap, prompt: "Je vertelt over een besluit dat je al hebt genomen. Kies het woord dat past.", text: "Jag ___ fortsätta att bo i Sverige, det har jag bestämt.", gaps: [{ answers: ["ska"], options: ["ska", "lär", "väntas"], tip: "Een plan of besluit: ska. Lär en väntas gaan over verwachtingen." }] }
          - { id: ejhm, type: gap, prompt: "Je noemt een verwachting van anderen. Kies het woord dat past.", text: "Elbilar ___ bli helt vanliga.", gaps: [{ answers: ["väntas"], options: ["väntas", "vill", "tänker"], tip: "Er wordt verwacht dat …: väntas. Vill en tänker gaan over wat mensen willen of van plan zijn." }] }
          - { id: aymn, type: translate, prompt: "Dan zal ik hier vijftien jaar gewoond hebben.", answers: ["Då kommer jag [att ]ha bott här [i ]femton år.", "Då har jag bott här [i ]femton år."], feedback: [{ contains: "då jag", tip: "Na då vooraan komt het werkwoord op plaats 2: Då kommer jag …" }] }
          - { id: qh8t, type: order, prompt: "Maak de zin af. Let op de woordvolgorde na de om-zin.", start: "Om vi är beredda att lära oss nya saker,", tokens: ["kommer", "det", "att", "finnas", "nya", "möjligheter"], answers: ["Om vi är beredda att lära oss nya saker, kommer det att finnas nya möjligheter."] }
          - id: 3fa2
            type: free
            prompt: "Hoe ziet jouw leven (of de wereld) er over tien jaar uit? Schrijf 150–200 woorden. Gebruik *ska* (plannen), *kommer att* (voorspellingen), *kommer att ha* + supinum, een voorwaarde met *om*, en minstens één van *lär, väntas, beräknas*. Sluit af met een conclusie."
            minWords: 140
            require:
              - { any: ["ska"], label: "Je noemt een plan (ska)" }
              - { any: ["kommer att"], label: "Je doet een voorspelling (kommer att)" }
              - { any: ["kommer att ha", "kommer jag att ha", "kommer vi att ha"], label: "Je gebruikt kommer att ha + supinum" }
              - { any: ["om"], label: "Je gebruikt een voorwaarde met om" }
              - { any: ["lär", "väntas", "beräknas", "förväntas"], label: "Je gebruikt lär, väntas of beräknas" }
            model: "Om tio år kommer mycket att ha förändrats, både i världen och i mitt eget liv. Jag ska fortsätta att bo i Sverige, men jag hoppas att jag har flyttat till en mindre stad, närmare naturen. Då kommer jag att ha bott här i femton år, och jag kommer förhoppningsvis att tala svenska nästan lika bra som nederländska. På jobbet lär datorerna ha tagit över många av de tråkiga uppgifterna. Det kan låta skrämmande, men om vi är beredda att lära oss nya saker, kommer det att finnas nya möjligheter. Klimatet är det jag oroar mig mest för. Elbilar väntas bli helt vanliga, men det räcker inte. Vi måste också ändra hur vi reser och vad vi äter. Sammanfattningsvis tror jag att framtiden blir varken bättre eller sämre av sig själv. Det är vi som bestämmer."

