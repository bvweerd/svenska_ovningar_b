  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een kort verslag."
    exercises:
      - id: skriva-betoog
        title: Betoog in stappen
        instruction: "Bouw een betoog op in vier delen: standpunt, argumenten, tegenargument met weerlegging en conclusie. De app kijkt elke stap na. Daarna schrijf je het hele betoog, als je wilt."
        topic: asikt
        items:
          - id: py4z
            type: steps
            topic: asikt
            steps:
              - { type: mc, prompt: "**Standpunt.** Welke zin is een goede tes (een standpunt)?", options: ["Fler företag borde låta de anställda arbeta hemifrån två dagar i veckan.", "Många anställda arbetar i dag hemifrån en eller två dagar i veckan.", "Jag arbetade hemifrån i går, och det gick ganska bra."], answer: 0, tip: "Een tes is een standpunt waarover je van mening kunt verschillen, geen feit en geen eigen ervaring." }
              - { type: order, prompt: "**Standpunt.** Ik vind dat werkgevers niet moeten eisen dat het personeel elke dag op kantoor zit. Let op de plaats van *inte* in de bijzin.", start: "Jag anser att", tokens: ["arbetsgivare", "inte", "borde", "kräva", "att", "personalen", "sitter", "på", "kontoret", "varje", "dag"], answers: ["Jag anser att arbetsgivare inte borde kräva att personalen sitter på kontoret varje dag.", "Jag anser att arbetsgivare inte borde kräva att personalen varje dag sitter på kontoret."], feedback: [{ contains: "arbetsgivare borde inte", tip: "Na anser att volgt een bijzin: inte staat vóór het werkwoord (arbetsgivare inte borde)." }, { contains: "personalen inte sitter", tip: "Let op de betekenis: werkgevers moeten iets níet eisen. inte hoort bij borde kräva: arbetsgivare inte borde kräva." }] }
          - id: fsyc
            type: steps
            topic: sambandsord
            steps:
              - { type: gap, prompt: "**Argument 1.** Kies het signaalwoord.", text: "___ sparar de anställda tid och pengar när de slipper resa till jobbet.", gaps: [{ answers: ["För det första"], options: ["För det första", "Visserligen", "Sammanfattningsvis"], tip: "Je eerste argument kondig je aan met för det första. Visserligen hoort bij een tegenargument, sammanfattningsvis bij de conclusie." }] }
              - { type: order, prompt: "**Argument 2.** Begin met *Dessutom*. Let op de woordvolgorde.", start: "Dessutom", tokens: ["visar", "flera", "undersökningar", "att", "många", "arbetar", "mer", "effektivt", "hemma"], answers: ["Dessutom visar flera undersökningar att många arbetar mer effektivt hemma.", "Dessutom visar flera undersökningar att många arbetar hemma mer effektivt."], feedback: [{ contains: "dessutom flera undersökningar visar", tip: "dessutom vooraan is een zinsdeel: daarna komt meteen het werkwoord (Dessutom visar …)." }] }
              - { type: gap, topic: subjunktioner-b1, prompt: "**Argument 3.** Kies de goede volgorde in de bijzin.", text: "Företagen kan också spara pengar, eftersom de ___ lika stora kontor längre.", gaps: [{ answers: ["inte behöver"], options: ["inte behöver", "behöver inte"], shuffle: false, tip: "Na eftersom volgt een bijzin: inte staat vóór het werkwoord." }] }
          - id: vryn
            type: steps
            topic: asikt
            steps:
              - { type: mc, prompt: "**Tegenargument.** Welke zin geeft weer wat de andere kant vindt?", options: ["Många chefer menar att samarbetet blir sämre när kollegorna sällan träffas.", "För det första sparar de anställda tid och pengar.", "Därför anser jag att fler borde få arbeta hemifrån."], answer: 0, tip: "Een tegenargument is wat anderen vinden: Många chefer menar att … of Vissa hävdar att …" }
              - { type: order, prompt: "**Weerlegging.** Geef eerst toe, zet er dan iets tegenover.", start: "Visserligen är det viktigt att träffas,", tokens: ["men", "det", "räcker", "med", "ett", "par", "dagar", "i", "veckan"], answers: ["Visserligen är det viktigt att träffas, men det räcker med ett par dagar i veckan."] }
              - { type: order, topic: subjunktioner-b1, prompt: "**Weerlegging.** Maak de zin af. De bijzin met *trots att* staat vooraan.", start: "Trots att många chefer är skeptiska,", tokens: ["har", "hemarbetet", "fungerat", "bra", "på", "de", "flesta", "arbetsplatser"], answers: ["Trots att många chefer är skeptiska, har hemarbetet fungerat bra på de flesta arbetsplatser."], feedback: [{ contains: "skeptiska hemarbetet har", tip: "Staat de bijzin vooraan, dan begint de hoofdzin met het werkwoord: …, har hemarbetet fungerat …" }] }
          - id: ukax
            type: steps
            topic: asikt
            steps:
              - { type: transform, topic: nominalisering, task: "**Conclusie.** Vat je sterkste argument zakelijk samen: gebruik *leder till en minskning av*.", prompt: "Hemarbete gör att utsläppen från trafiken minskar.", answers: ["{Hemarbete|Hemarbetet} leder till en minskning av {utsläppen från trafiken|trafikens utsläpp|trafikutsläppen}."], feedback: [{ contains: "minskningen av", tip: "Na leder till en … komt de onbepaalde vorm: en minskning." }] }
              - { type: gap, prompt: "**Conclusie.** Je sluit af. Kies het signaalwoord.", text: "___ anser jag att hemarbete är bra för både anställda och arbetsgivare.", gaps: [{ answers: ["Sammanfattningsvis"], options: ["Sammanfattningsvis", "Visserligen", "För det första"], tip: "Een conclusie begin je met sammanfattningsvis of därför." }] }
          - id: bvat
            type: free
            prompt: "Schrijf nu het hele betoog (100–150 woorden) over de stelling *Fler företag borde låta de anställda arbeta hemifrån två dagar i veckan*, of kies zelf een stelling over werk en geld. Gebruik de vier delen: standpunt, twee of drie argumenten, een tegenargument met weerlegging en een conclusie."
            minWords: 90
            require:
              - { any: ["anser", "tycker", "enligt min mening"], label: "Je geeft je standpunt" }
              - { any: ["för det första", "dessutom", "eftersom"], label: "Je ordent je argumenten (för det första, dessutom, eftersom)" }
              - { any: ["visserligen", "trots att", "å andra sidan", "det stämmer att"], label: "Je weerlegt een tegenargument (visserligen … men, trots att)" }
              - { any: ["sammanfattningsvis", "därför"], label: "Je sluit af met een conclusie" }
            model: "Jag anser att arbetsgivare inte borde kräva att personalen sitter på kontoret varje dag. Fler företag borde låta de anställda arbeta hemifrån två dagar i veckan. För det första sparar de anställda tid och pengar när de slipper resa till jobbet. Dessutom visar flera undersökningar att många arbetar mer effektivt hemma. Företagen kan också spara pengar, eftersom de inte behöver lika stora kontor längre. Hemarbete leder dessutom till en minskning av utsläppen från trafiken. Många chefer menar att samarbetet blir sämre när kollegorna sällan träffas. Visserligen är det viktigt att träffas, men det räcker med ett par dagar i veckan. Trots att många chefer är skeptiska, har hemarbetet fungerat bra på de flesta arbetsplatser. Sammanfattningsvis anser jag att hemarbete är bra för både anställda och arbetsgivare."

      - id: skriva-rapport
        title: Beschrijf de cijfers
        instruction: "Bouw eerst je verslag op in vier stappen die de app nakijkt. Daarna schrijf je het hele verslag, als je wilt."
        topic: trender
        items:
          - { id: wz2b, type: mc, prompt: "Kies de beste openingszin voor een zakelijk verslag.", options: ["Under perioden 2020–2024 förändrades antalet besökare kraftigt.", "Under perioden 2020–2024 förändrade antalet besökare kraftigt.", "Jag tycker att biblioteket är jättebra!"], answer: 0, tip: "Het aantal veranderde zelf: förändras (förändrades). Een verslag is zakelijk, zonder je eigen mening." }
          - { id: qapq, type: gap, topic: nominalisering, prompt: "Vul het zelfstandig naamwoord in.", text: "År 2021 skedde en ___ (minska) till 9 000 besökare.", gaps: [{ answers: ["minskning"], feedback: [{ match: ["minskande", "minskelse", "minsk"], tip: "minska wordt minskning (zoals öka → ökning)." }] }] }
          - { id: dgcr, type: gap, prompt: "Kies de goede vorm. (Van 9 000 naar 15 000 bezoekers.)", text: "Därefter följde en ___ ökning.", gaps: [{ answers: ["kraftig"], options: ["kraftig", "kraftigt", "svag"], tip: "ökning is een en-woord: kraftig zonder -t. En 9 000 → 15 000 is een sterke stijging." }] }
          - { id: rfc3, type: gap, prompt: "Kies het woord dat past. (Van 18 000 naar 18 300.)", text: "Jämfört med 2023 ökade antalet bara ___ under 2024.", gaps: [{ answers: ["marginellt"], options: ["marginellt", "kraftigt", "dramatiskt"], tip: "300 bezoekers meer is heel weinig: marginellt." }] }
          - id: g4t2
            type: free
            prompt: "Bezoekers van de stadsbibliotheek per jaar: 2020: 12 000 · 2021: 9 000 · 2022: 15 000 · 2023: 18 000 · 2024: 18 300. Beschrijf de ontwikkeling in 80–120 woorden, in zakelijke stijl. Noem het laagste en het hoogste punt, gebruik minstens twee nominalisaties (*ökning, minskning* …) en woorden als *kraftigt, svagt, drygt, jämfört med*. Geef een mogelijke verklaring."
            minWords: 75
            require:
              - { any: ["ökning", "minskning", "uppgång", "nedgång", "förändring"], label: "Je gebruikt een nominalisatie" }
              - { any: ["kraftig", "kraftigt", "svag", "svagt", "gradvis", "stadigt", "marginell", "marginellt"], label: "Je zegt hoe snel het ging (kraftigt, svagt …)" }
              - { any: ["jämfört med", "jämfört"], label: "Je vergelijkt (jämfört med)" }
              - { any: ["beror", "förklaring", "eftersom", "på grund av"], label: "Je geeft een verklaring" }
            model: "Under perioden 2020–2024 förändrades antalet besökare på stadsbiblioteket kraftigt. År 2020 hade biblioteket 12 000 besökare. Året därpå skedde en minskning till 9 000, vilket troligen berodde på pandemin och begränsade öppettider. Därefter följde en kraftig ökning: 2022 kom 15 000 besökare och 2023 hela 18 000. Jämfört med 2023 ökade antalet bara marginellt under 2024, till 18 300, vilket är den högsta nivån under perioden. En möjlig förklaring till uppgången är bibliotekets nya kafé och de populära språkcaféerna."

  - id: herhaling
    title: Herhaling
    exercises:
      - id: herhaling-b1-25
        title: B1 en hoofdstuk 25 door elkaar
        instruction: Gemengde vragen.
        shuffle: true
        items:
          - { id: pezp, type: gap, topic: passiv-s, text: "Ett beslut ___ (fatta) i maj.", gaps: [{ answers: ["fattades"] }] }
          - { id: z2qp, type: gap, topic: framtid, text: "Ledningen tror att försäljningen ___ att öka.", gaps: [{ answers: ["kommer"], options: ["kommer", "ska", "tänker"], shuffle: false }] }
          - { id: fgtd, type: transform, topic: indirekt-tal-b1, prompt: "Chefen: ”Vi har ökat försäljningen.”", task: "Chefen sa att …", answers: ["Chefen {sa|sade} att de {hade|har} ökat försäljningen."] }
          - { id: gh9b, type: gap, topic: jamforelse, text: "Försäljningen var ___ hög som i fjol.", gaps: [{ answers: ["lika"], options: ["lika", "mer", "än"], shuffle: false }] }
          - { id: hzr3, type: gap, topic: sambandsord, text: "E-handeln växte. ___ minskade butiksförsäljningen.", gaps: [{ answers: ["Däremot"], options: ["Däremot", "Dessutom", "Därför"], shuffle: false }] }
          - { id: bybc, type: gap, topic: nominalisering, text: "minska → ___", gaps: [{ answers: ["en minskning"] }] }
          - { id: aqtc, type: gap, topic: trender, text: "Arbetslösheten ___ (sjunka) med två procentenheter förra året.", gaps: [{ answers: ["sjönk"] }] }
          - { id: cmc2, type: gap, topic: nominalisering, text: "minska → en ___", gaps: [{ answers: ["minskning"] }] }
          - { id: f9n7, type: gap, topic: subjunktioner-b1, text: "___ priserna steg, köpte folk lika mycket som förut.", gaps: [{ answers: ["Trots att"], options: ["Trots att", "Eftersom", "Så att"], shuffle: false }] }
          - { id: ny5w, type: gap, topic: asikt, text: "Jag ___ att distansarbete passar de flesta som arbetar på kontor.", gaps: [{ answers: ["anser"], options: ["anser", "undrar", "frågar"], shuffle: false }] }
          - { id: zmzq, type: gap, topic: partikelverb-2, text: "Vi hann inte ___ tåget, så vi fick vänta en timme på nästa.", gaps: [{ answers: ["med"], options: ["med", "av", "fram"], shuffle: false, feedback: [{ match: ["av", "fram"], tip: "Iets halen (op tijd zijn voor) = hinna med." }] }] }

      - id: herhaling-woorden
        title: Woorden van eerder
        instruction: Kies het woord dat past. Deze woorden komen uit eerdere hoofdstukken.
        topic: woordenschat
        shuffle: true
        items:
          - { id: m9cu, type: gap, text: "Alla medborgare över 18 år får ___ i valet.", gaps: [{ answers: ["rösta"], options: ["rösta", "stödja", "demonstrera", "bidra"], feedback: [{ match: "demonstrera", tip: "*demonstrera* betekent „demonstreren”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: pnad, type: gap, text: "Hon är ___ och driver ett eget litet kafé.", gaps: [{ answers: ["företagare"], options: ["företagare", "statsminister", "minoritet", "välfärd"], feedback: [{ match: "statsminister", tip: "*statsminister* betekent „een minister-president, een premier”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 8stv, type: gap, text: "___ i riksdagen röstade för en ny lag om yttrandefrihet.", gaps: [{ answers: ["Majoriteten"], options: ["Majoriteten", "Välfärden", "Integrationen", "Diskrimineringen"], feedback: [{ match: "Välfärden", tip: "*välfärd* betekent „de sociale voorzieningen, de verzorgingsstaat”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 3a4e, type: gap, text: "Arbetet i föreningen är ___: ingen får betalt.", gaps: [{ answers: ["frivilligt"], options: ["frivilligt", "jämlikt", "orättvist", "rättvist"], feedback: [{ match: "jämlikt", tip: "*jämlik* betekent „gelijk (met gelijke rechten en kansen)”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: cnzk, type: gap, text: "Det är ___ att vissa grupper har svårare att få jobb. Det är diskriminering.", gaps: [{ answers: ["orättvist"], options: ["orättvist", "frivilligt", "jämlikt", "rättvist"], feedback: [{ match: "frivilligt", tip: "*frivillig* betekent „vrijwillig”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: kmug, type: gap, text: "Det råder stor ___ i Stockholm, så många bor i andra hand.", gaps: [{ answers: ["bostadsbrist"], options: ["bostadsbrist", "välfärd", "jämställdhet", "majoritet"], feedback: [{ match: "välfärd", tip: "*välfärd* betekent „de sociale voorzieningen, de verzorgingsstaat”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: z85x, type: gap, text: "Varje medborgare har både rättigheter och ___.", gaps: [{ answers: ["skyldigheter"], options: ["skyldigheter", "majoriteter", "folkomröstningar", "minoriteter"], feedback: [{ match: "minoriteter", tip: "*minoritet* betekent „een minderheid”. Lees de zin nog eens: wat past hier?" }] }] }

