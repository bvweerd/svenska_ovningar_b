chapter: 25
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan zakelijk formuleren met zelfstandige naamwoorden in plaats van werkwoorden", topics: [nominalisering] }
  - { text: "Ik kan cijfers en ontwikkelingen beschrijven (stijgen, dalen, een piek bereiken)", topics: [trender] }

grammar:
  - id: nominalisering
    title: Nominalisatie
    summary: "In zakelijke teksten wordt een werkwoord vaak een zelfstandig naamwoord: *Priserna ökade kraftigt* → *en kraftig **ökning** av priserna*. Met **-ning/-ing** (en-woord) of zonder uitgang (vaak ett-woord): *besluta → ett **beslut***."
    body: |
      Op B2-niveau lees en schrijf je veel **nominale stijl**: wat in een gewone zin een werkwoord is, wordt een zelfstandig naamwoord. Dat maakt een tekst korter en formeler.

      | gewone zin | nominaal |
      |---|---|
      | *Priserna **ökade** kraftigt.* | *en kraftig **ökning** av priserna* |
      | *Arbetslösheten **minskade**.* | ***minskningen** av arbetslösheten* |
      | *Företaget **beslutade** att stänga.* | *företagets **beslut** att stänga* |
      | *Man **förbättrade** arbetsmiljön.* | ***förbättringen** av arbetsmiljön* |

      ### Vormen
      | uitgang | voorbeelden |
      |---|---|
      | **-ning / -ing** (en) | *öka → ökning, minska → minskning, utveckla → utveckling, förändra → förändring, sälja → försäljning* |
      | geen uitgang (meestal ett) | *besluta → ett beslut, köpa → ett köp, falla → ett fall* |
      | **-else** (en/ett) | *betyda → en betydelse, uppleva → en upplevelse, fängsla → ett fängelse* |
      | eigen woord | *stiga → en uppgång, sjunka → en nedgång* |

      ### Bijvoeglijk naamwoord in plaats van bijwoord
      Het bijwoord bij het werkwoord wordt een bijvoeglijk naamwoord bij het zelfstandig naamwoord: *öka **kraftigt** → en **kraftig** ökning*, *öka **svagt** → en **svag** ökning*.

      ### Welk voorzetsel?
      - **av**: wát verandert: *en ökning **av** försäljningen*
      - **med**: hoeveel: *en ökning **med** tio procent*
      - **från … till**: *en minskning **från** tolv **till** åtta procent*

  - id: trender
    title: Ontwikkelingen beschrijven
    summary: "*öka/stiga, minska/sjunka, ligga still, nå en topp*, met *kraftigt, svagt, gradvis, stadigt*. Let op: van 5 naar 7 procent is een stijging met **två procentenheter**, niet *två procent*."
    body: |
      | richting | werkwoord | zelfstandig naamwoord |
      |---|---|---|
      | omhoog | *öka, stiga, gå upp* | *en ökning, en uppgång* |
      | omlaag | *minska, sjunka, falla, gå ner* | *en minskning, en nedgång, ett ras (sterk)* |
      | gelijk | *ligga still, vara oförändrad* | |
      | hoogste punt | *nå en topp* | *en topp* |
      | laagste punt | *nå botten, nå sin lägsta nivå* | *en bottennivå* |

      **Hoe snel?** *kraftigt* (sterk), *svagt* (licht), *gradvis* (geleidelijk), *stadigt* (gestaag), *plötsligt* (plotseling), *marginellt* (marginaal, minimaal).

      **Ongeveer:** *drygt* (iets meer dan), *knappt* (iets minder dan), *omkring / cirka* (ongeveer). *drygt hälften* = iets meer dan de helft.

      **Procent of procentpunt?** Stijgt de werkloosheid van 5 naar 7 procent, dan is dat een stijging met *två **procentenheter*** (en met 40 *procent*).

      **Vergelijken:** *jämfört med i fjol*, *under samma period*, *under perioden 2019–2024*.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-hemarbete
        title: "Lezen: thuiswerken"
        instruction: Lees het verslag en beantwoord de vragen.
        topic: trender
        textTitle: Hemarbete – en bestående förändring?
        text: |
          På försäkringsbolaget Norrsken arbetade knappt tio procent av de anställda hemifrån minst en dag i veckan år 2019. Under pandemin skedde en kraftig ökning, och år 2021 nådde andelen en topp på drygt åttio procent. Därefter följde en gradvis minskning, men andelen har aldrig återgått till den tidigare nivån. I dag ligger den stadigt på omkring femtio procent.

          Utvecklingen skiljer sig dock kraftigt mellan företagets avdelningar. Inom it-avdelningen arbetar drygt sjuttio procent av personalen hemifrån varje vecka, medan andelen inom kundtjänsten bara ligger på omkring tjugo procent. Enligt ledningen beror skillnaden på att kundtjänstens arbete kräver ett nära samarbete och en snabb hantering av kundernas ärenden.

          Ledningen ser både för- och nackdelar med utvecklingen. Sjukfrånvaron har minskat med två procentenheter, och företaget har kunnat spara pengar genom en minskning av kontorsytan. Samtidigt uppger många chefer att samarbetet och introduktionen av nyanställda har försvårats.

          Besparingen är betydande. Efter flytten till mindre lokaler år 2022 sjönk hyreskostnaderna med knappt en tredjedel, från 24 till 17 miljoner kronor per år. Kostnaderna för it-utrustning och digitala mötesverktyg har visserligen ökat, men enligt ekonomichefen Maria Holm är ökningen marginell jämfört med besparingen.

          En enkät bland de anställda från i våras visar också en tydlig förändring av attityderna. Andelen som är nöjda med sin arbetssituation har ökat från 62 till 74 procent sedan 2019. Samtidigt uppger var fjärde medarbetare att gränsen mellan arbete och fritid har blivit otydligare, och många nämner en ökning av antalet mejl på kvällarna.

          Hur hemarbetet påverkar produktiviteten är svårare att mäta. Antalet hanterade försäkringsärenden per medarbetare har visserligen ökat svagt sedan 2019, men enligt ledningen kan ökningen lika gärna bero på införandet av nya digitala system. Det går alltså inte att säga med säkerhet vilken roll hemarbetet har spelat.

          Företagets beslut att erbjuda flexibla arbetsplatser har kombinerats med ett krav: alla medarbetare ska vara på kontoret minst två dagar i veckan.

          Kravet har mötts av blandade reaktioner. Facket välkomnar en tydlig regel men kritiserar bristen på dialog inför beslutet. Ledningen räknar ändå med att andelen hemarbete kommer att ligga kvar på ungefär dagens nivå under de närmaste åren. För att kunna följa utvecklingen ska en ny enkät genomföras varje höst.

          – Hemarbetet är ingen tillfällig trend utan en bestående förändring, säger personalchefen Johan Ek. Vår uppgift är att se till att förändringen gynnar både medarbetarna och företaget.
        items:
          - { id: 8rsj, type: mc, prompt: "Hur stor andel arbetade hemifrån år 2019?", options: ["knappt tio procent", "drygt tio procent", "omkring femtio procent", "drygt åttio procent"], answer: 0 }
          - { id: hxqy, type: mc, prompt: "När nådde andelen en topp?", options: ["2021", "2019", "2020", "i dag"], answer: 0 }
          - { id: ssgb, type: truefalse, statement: "Andelen har återgått till samma nivå som före pandemin.", answer: false, correction: { answers: ["{Andelen|Den} har aldrig återgått till den tidigare nivån.", "{Andelen|Den} ligger [i dag ]på omkring femtio procent."] } }
          - { id: bjnx, type: mc, prompt: "Vad har hänt med sjukfrånvaron?", options: ["Den har minskat med två procentenheter.", "Den har ökat med två procent.", "Den är oförändrad.", "Den har minskat med två procent."], answer: 0 }
          - { id: skyn, type: mc, prompt: "Vilken nackdel nämner cheferna?", options: ["Samarbetet och introduktionen av nyanställda har försvårats.", "Lönerna har ökat.", "Kontoren är för små.", "Ingen vill jobba hemma."], answer: 0 }
          - { id: 7ra9, type: mc, prompt: "Wat betekent *drygt åttio procent*?", options: ["iets meer dan tachtig procent", "iets minder dan tachtig procent", "precies tachtig procent", "ongeveer acht procent"], answer: 0 }
          - id: u52d
            type: multi
            prompt: "Welke woorden in de tekst zijn nominalisaties (een werkwoord dat een zelfstandig naamwoord is geworden)?"
            options: ["ökning", "minskning", "utvecklingen", "beslut", "introduktionen", "andelen"]
            answers: [0, 1, 2, 3, 4]
            tip: "andel (aandeel) komt niet van een werkwoord."
          - { id: 2t2g, type: mc, prompt: "Hur stor andel av personalen inom kundtjänsten arbetar hemifrån?", options: ["omkring tjugo procent", "drygt sjuttio procent", "omkring femtio procent", "knappt tio procent"], answer: 0 }
          - { id: wbq9, type: mc, prompt: "Ungefär hur mycket sparar Norrsken i dag på hyran varje år, jämfört med före flytten?", options: ["omkring sju miljoner kronor", "omkring 17 miljoner kronor", "omkring 24 miljoner kronor", "ingenting, eftersom it-kostnaderna har ökat lika mycket"], answer: 0, tip: "Reken zelf: van 24 naar 17 miljoen kronor per jaar." }
          - id: bpkr
            type: multi
            prompt: "Welke nadelen van thuiswerken worden in de tekst genoemd? Let op: ze staan in verschillende alinea's."
            options: ["Samarbetet har försvårats.", "Introduktionen av nyanställda har blivit svårare.", "Gränsen mellan arbete och fritid har blivit otydligare.", "Många får fler mejl på kvällarna.", "Sjukfrånvaron har ökat.", "Hyreskostnaderna har stigit."]
            answers: [0, 1, 2, 3]
            tip: "Het ziekteverzuim (sjukfrånvaron) is juist gedaald, en de huurkosten ook."

      - id: makkelijk-1
        title: "Makkelijk lezen: Bageriet"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Bageriet"
        text: |
          Ett litet bageri i Lund har haft ett bra år. Försäljningen ökade med 20 procent, framför allt tack vare kaffe och smörgåsar till kontoren i närheten. Ägaren Sofia berättar att ökningen kom efter att bageriet började leverera på morgnarna. Kostnaderna har också stigit, eftersom mjöl och el har blivit dyrare. Men vinsten blev ändå större än förra året. Nästa år planerar Sofia att öppna en butik till. Hon vill också anställa två personer till, eftersom personalen redan har mycket att göra. Bageriet har i dag åtta anställda.
        items:
          - { id: ndrs, type: truefalse, statement: "Försäljningen ökade med 20 procent.", answer: true }
          - { id: fww6, type: truefalse, statement: "Vinsten blev mindre än förra året.", answer: false }
          - { id: 9am6, type: truefalse, statement: "Sofia vill öppna en butik till.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Hemma eller på kontoret?"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Hemma eller på kontoret?"
        text: |
          Allt fler arbetar hemifrån några dagar i veckan. En undersökning visar att andelen har fördubblats på fem år. Många uppger att de blir mer effektiva hemma. Samtidigt saknar en del sina kollegor. Därför har många företag infört regler: två dagar på kontoret, resten hemma. De flesta anställda verkar nöjda med den lösningen. Forskarna bakom undersökningen påpekar dock att det finns stora skillnader mellan olika yrken. En sjuksköterska eller en busschaufför kan inte arbeta hemifrån. För dem har ingenting förändrats. Frågan om hur arbetslivet ska se ut i framtiden kommer därför att diskuteras länge.
        items:
          - { id: hnfp, type: truefalse, statement: "Andelen som arbetar hemifrån har fördubblats.", answer: true }
          - { id: 5df7, type: truefalse, statement: "Alla vill bara arbeta hemma.", answer: false }

      - id: makkelijk-3
        title: "Makkelijk lezen: Kaféet på hörnet"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Kaféet på hörnet"
        text: |
          Petra öppnade sitt kafé för tre år sedan. Sedan dess har antalet kunder ökat varje år. Förra året steg försäljningen med femton procent. Men i år har kostnaderna också ökat kraftigt. Priset på kaffe har stigit, och hyran har höjts. Därför har Petra fått höja priserna lite. En kopp kaffe kostar nu trettiofem kronor i stället för trettio. Några kunder har klagat, men de flesta kommer tillbaka ändå. Petra tror att höjningen är nödvändig för att kaféet ska överleva. Hennes plan är att börja sälja lunch i höst, så att intäkterna blir större.
        items:
          - { id: ak24, type: truefalse, statement: "Försäljningen ökade med femton procent förra året.", answer: true }
          - { id: pptf, type: mc, prompt: "Vad kostar en kopp kaffe nu?", options: ["Trettio kronor.", "Trettiofem kronor.", "Fyrtio kronor."], answer: 1 }
          - { id: 22vx, type: truefalse, statement: "Petra säljer redan lunch.", answer: false }

      - id: makkelijk-4
        title: "Makkelijk lezen: Unga sparar"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Unga sparar"
        text: |
          Allt fler unga svenskar sparar pengar varje månad. Enligt en ny undersökning har andelen unga som sparar ökat från fyrtio till sextio procent på fem år. En förklaring är att det har blivit lättare att spara via mobilen. En annan förklaring är att många är oroliga för framtiden. Samtidigt har antalet människor som betalar med kontanter minskat kraftigt. I dag betalar de flesta med kort eller med mobilen. Ekonomen Karin Berg tror att utvecklingen kommer att fortsätta. Hon menar att det är bra att unga tänker på sin ekonomi tidigt.
        items:
          - { id: bx7z, type: mc, prompt: "Hur stor andel av de unga sparar nu?", options: ["Fyrtio procent.", "Femtio procent.", "Sextio procent."], answer: 2 }
          - { id: 9y58, type: truefalse, statement: "Fler betalar med kontanter nu.", answer: false }
          - { id: h8qm, type: truefalse, statement: "Det har blivit lättare att spara via mobilen.", answer: true }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-trender
        title: Ontwikkelingen
        instruction: Koppel het woord aan de betekenis.
        topic: trender
        items:
          - id: e8ez
            type: match
            pairs:
              - ["kraftigt", "sterk"]
              - ["svagt", "licht, zwak"]
              - ["gradvis", "geleidelijk"]
              - ["stadigt", "gestaag"]
              - ["drygt", "iets meer dan"]
              - ["knappt", "iets minder dan"]
          - id: 5hj4
            type: match
            pairs:
              - ["en andel", "een aandeel"]
              - ["en ledning", "een directie"]
              - ["sjukfrånvaro", "ziekteverzuim"]
              - ["uppge", "verklaren, opgeven"]
              - ["försvåra", "bemoeilijken"]
              - ["en procentenhet", "een procentpunt"]

  - id: nominal
    title: "Grammatik: nominalisatie"
    exercises:
      - id: nominal-vormen
        title: Van werkwoord naar zelfstandig naamwoord
        instruction: Schrijf het zelfstandig naamwoord met **en** of **ett**.
        topic: nominalisering
        shuffle: true
        items:
          - { id: 53qz, type: gap, text: "öka → ___", gaps: [{ answers: ["en ökning"], feedback: [{ match: "ökning", tip: "Schrijf het lidwoord erbij: en ökning." }] }] }
          - { id: 4a3c, type: gap, text: "minska → ___", gaps: [{ answers: ["en minskning"], feedback: [{ match: "minskning", tip: "Schrijf het lidwoord erbij: en minskning." }] }] }
          - { id: sn2y, type: gap, text: "förbättra → ___", gaps: [{ answers: ["en förbättring"], feedback: [{ match: "förbättring", tip: "Schrijf het lidwoord erbij." }] }] }
          - { id: jnqc, type: gap, text: "utveckla → ___", gaps: [{ answers: ["en utveckling"], feedback: [{ match: "utveckling", tip: "Schrijf het lidwoord erbij." }] }] }
          - { id: sh6w, type: gap, text: "besluta → ___", gaps: [{ answers: ["ett beslut"], feedback: [{ match: "en beslut", tip: "beslut is een ett-woord." }, { match: "en beslutning", tip: "Zonder uitgang: ett beslut." }] }] }
          - { id: s8uf, type: gap, text: "sälja → ___", gaps: [{ answers: ["en försäljning"], feedback: [{ match: ["en säljning", "säljning"], tip: "Het zelfstandig naamwoord is försäljning." }] }] }
          - { id: 3d7h, type: gap, text: "förändra → ___", gaps: [{ answers: ["en förändring"], feedback: [{ match: "förändring", tip: "Schrijf het lidwoord erbij." }] }] }
          - { id: u7r3, type: gap, text: "köpa → ___", gaps: [{ answers: ["ett köp"], feedback: [{ match: "en köp", tip: "köp is een ett-woord." }, { match: ["en köpning", "köpning"], tip: "Zonder uitgang: ett köp." }] }] }

      - id: nominal-omvormen
        title: Maak het nominaal
        instruction: Herschrijf de zin als woordgroep met een zelfstandig naamwoord.
        topic: nominalisering
        items:
          - { id: havn, type: transform, prompt: "Priserna ökade kraftigt.", task: "Begin met: en kraftig …", answers: ["en kraftig ökning av priserna", "en kraftig prisökning"], feedback: [{ contains: "ökning med priserna", tip: "Wát stijgt: av. en kraftig ökning av priserna." }, { contains: "kraftigt ökning", tip: "Bij een zelfstandig naamwoord: bijvoeglijk naamwoord zonder -t, en kraftig ökning." }] }
          - { id: 38x5, type: transform, prompt: "Arbetslösheten minskade.", task: "Begin met: minskningen …", answers: ["minskningen av arbetslösheten"] }
          - { id: h5qe, type: transform, prompt: "Företaget beslutade att stänga kontoret.", task: "Begin met: företagets …", answers: ["företagets beslut [om ]att stänga kontoret"] }
          - { id: awfr, type: transform, prompt: "Man förbättrade arbetsmiljön.", task: "Begin met: förbättringen …", answers: ["förbättringen av arbetsmiljön"] }
          - { id: ysme, type: transform, prompt: "Försäljningen ökade med tio procent.", task: "Begin met: en ökning …", answers: ["en ökning av försäljningen med tio procent", "en ökning med tio procent av försäljningen"], feedback: [{ contains: "ökning med försäljningen", tip: "Wát stijgt: av försäljningen. Hoeveel: med tio procent." }] }
          - { id: wv7e, type: transform, prompt: "Regeringen höjde skatten.", task: "Begin met: regeringens …", answers: ["regeringens höjning av skatten", "regeringens skattehöjning"], feedback: [{ contains: "höjning med skatten", tip: "Wát wordt verhoogd: av. regeringens höjning av skatten." }] }
          - { id: 244q, type: transform, prompt: "Kostnaderna minskade snabbt.", task: "Begin met: den snabba …", answers: ["den snabba minskningen av kostnaderna", "den snabba kostnadsminskningen"], feedback: [{ contains: "snabb minskningen", tip: "Na den: snabba." }] }
          - { id: 66y2, type: transform, prompt: "Man utvecklade en ny app.", task: "Begin met: utvecklingen …", answers: ["utvecklingen av en ny app"] }

      - id: nominal-voorzetsel
        title: av, med, från of till?
        instruction: Kies het voorzetsel.
        topic: nominalisering
        shuffle: true
        items:
          - { id: ay78, type: gap, text: "en ökning ___ försäljningen", gaps: [{ answers: ["av"], options: ["av", "med", "till"], shuffle: false, tip: "Wát stijgt: av." }] }
          - { id: nrhh, type: gap, text: "en ökning ___ tio procent", gaps: [{ answers: ["med"], options: ["av", "med", "till"], shuffle: false, tip: "Hoeveel: med." }] }
          - { id: 4qqw, type: gap, text: "en minskning från tolv ___ åtta procent", gaps: [{ answers: ["till"], options: ["av", "med", "till"], shuffle: false }] }
          - { id: ycp9, type: gap, text: "en förbättring ___ arbetsmiljön", gaps: [{ answers: ["av"], options: ["av", "med", "från"], shuffle: false }] }
          - { id: 2qec, type: gap, text: "en höjning ___ skatten", gaps: [{ answers: ["av"], options: ["av", "med", "till"], shuffle: false, tip: "Wát wordt verhoogd: av." }] }
          - { id: mvm9, type: gap, text: "en minskning ___ fem procent", gaps: [{ answers: ["med"], options: ["av", "med", "till"], shuffle: false, tip: "Hoeveel: med." }] }
          - { id: grsg, type: gap, text: "en ökning från 20 ___ 25 procent", gaps: [{ answers: ["till"], options: ["av", "med", "till"], shuffle: false }] }
          - { id: pbva, type: gap, text: "ett beslut ___ att stänga fabriken", gaps: [{ answers: ["om"], options: ["om", "av", "för"], shuffle: false, tip: "Een besluit over iets: beslut om." }] }

      - id: nominal-vertalen
        title: Zakelijk vertalen
        instruction: Vertaal in zakelijke stijl. Gebruik een zelfstandig naamwoord (*ökning, minskning, beslut* …) waar het Nederlands er een heeft.
        topic: nominalisering
        items:
          - { id: 4tjn, type: translate, prompt: "De sterke stijging van de energieprijzen heeft geleid tot een daling van de verkoop in de winkels.", answers: ["Den {kraftiga|starka} {ökningen|höjningen} av energipriserna {har lett|ledde} till {en minskning av försäljningen|minskad försäljning|en nedgång i försäljningen} i butikerna."], feedback: [{ contains: ["kraftig ökningen", "stark ökningen", "kraftig höjningen", "stark höjningen"], tip: "Na den: de bepaalde vorm van het bijvoeglijk naamwoord, den kraftiga ökningen." }, { contains: ["ökningen med energipriserna", "höjningen med energipriserna"], tip: "Wát stijgt: av. ökningen av energipriserna." }] }
          - { id: njpx, type: translate, prompt: "Het besluit van de directie om twee winkels in het centrum te sluiten, leidde tot harde kritiek van het personeel.", answers: ["{Ledningens|Företagsledningens} beslut {att|om att} stänga två butiker i centrum {ledde|har lett} till {hård|kraftig|stark|skarp} kritik från personalen."], feedback: [{ contains: ["ledningens beslutet", "företagsledningens beslutet"], tip: "Na een genitief (ledningens) volgt de onbepaalde vorm: ledningens beslut." }] }
          - { id: ba2t, type: translate, prompt: "Een verbetering van de werkomgeving kan op lange termijn tot een daling van het ziekteverzuim leiden.", answers: ["En förbättring av arbetsmiljön kan på lång sikt leda till {en minskning av sjukfrånvaron|minskad sjukfrånvaro|lägre sjukfrånvaro}.", "En förbättring av arbetsmiljön kan leda till {en minskning av sjukfrånvaron|minskad sjukfrånvaro|lägre sjukfrånvaro} på lång sikt.", "På lång sikt kan en förbättring av arbetsmiljön leda till {en minskning av sjukfrånvaron|minskad sjukfrånvaro|lägre sjukfrånvaro}."], feedback: [{ contains: "förbättring med arbetsmiljön", tip: "Wát verbetert: av. en förbättring av arbetsmiljön." }, { contains: "på lång sikt en förbättring", tip: "Begin je met på lång sikt, dan komt meteen het werkwoord: På lång sikt kan en förbättring …" }] }
          - { id: ekfu, type: translate, prompt: "Volgens de directie is de stijging van de omzet in het derde kwartaal vooral te danken aan de online handel.", answers: ["Enligt ledningen beror ökningen av {omsättningen|försäljningen} {under|i} {det tredje kvartalet|tredje kvartalet} {främst|framför allt|huvudsakligen} på {e-handeln|näthandeln|försäljningen på nätet}.", "Ökningen av {omsättningen|försäljningen} {under|i} {det tredje kvartalet|tredje kvartalet} beror enligt ledningen {främst|framför allt|huvudsakligen} på {e-handeln|näthandeln|försäljningen på nätet}.", "Ökningen av {omsättningen|försäljningen} {under|i} {det tredje kvartalet|tredje kvartalet} beror {främst|framför allt|huvudsakligen} på {e-handeln|näthandeln|försäljningen på nätet} enligt ledningen."], feedback: [{ contains: "enligt ledningen ökningen", tip: "Na Enligt ledningen vooraan komt eerst het werkwoord: Enligt ledningen beror ökningen …" }, { contains: ["ökningen med omsättningen", "ökningen med försäljningen"], tip: "Wát stijgt: av. ökningen av omsättningen." }] }
          - { id: 749r, type: translate, prompt: "Door de verhoging van de rente hebben veel huishoudens moeten bezuinigen op restaurantbezoeken.", answers: ["På grund av {höjningen av räntan|räntehöjningen|den höjda räntan} har många hushåll {tvingats|behövt|varit tvungna att|fått} {skära ner|dra ner} på restaurangbesök.", "Många hushåll har {tvingats|behövt|varit tvungna att|fått} {skära ner|dra ner} på restaurangbesök på grund av {höjningen av räntan|räntehöjningen|den höjda räntan}."], feedback: [{ contains: ["på grund av höjningen av räntan många", "på grund av räntehöjningen många", "på grund av den höjda räntan många"], tip: "Staat på grund av … vooraan, dan komt meteen het werkwoord: … har många hushåll." }, { contains: "höjningen med räntan", tip: "Wát wordt verhoogd: av. höjningen av räntan." }] }
          - { id: akfh, type: translate, prompt: "Een daling van de werkloosheid met twee procentpunten zou een grote verandering voor de regio betekenen.", answers: ["En minskning av arbetslösheten med två procentenheter skulle {innebära|betyda} en stor förändring för regionen.", "En minskning med två procentenheter av arbetslösheten skulle {innebära|betyda} en stor förändring för regionen."], feedback: [{ contains: "med två procent", tip: "Het verschil tussen twee percentages is een procentpunt: procentenheter." }, { contains: "minskning med arbetslösheten", tip: "Wát daalt: av arbetslösheten. Hoeveel: med två procentenheter." }] }

          - { id: hmhk, type: translate, prompt: "De directie rekent volgend jaar op een geleidelijke daling van de kosten voor elektriciteit en verwarming.", answers: ["Ledningen {räknar med|förväntar sig} en gradvis minskning av kostnaderna för {el|elektricitet} och uppvärmning {nästa år|under nästa år}.", "{Nästa år|Under nästa år} {räknar ledningen med|förväntar sig ledningen} en gradvis minskning av kostnaderna för {el|elektricitet} och uppvärmning."], feedback: [{ contains: "nästa år ledningen", tip: "Na Nästa år vooraan komt eerst het werkwoord: Nästa år räknar ledningen med …" }, { contains: "gradvisa minskning", tip: "gradvis verandert niet: en gradvis minskning." }, { contains: "minskning med kostnaderna", tip: "Wát daalt: av kostnaderna." }] }

