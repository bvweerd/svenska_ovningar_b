          - { id: 8f7v, type: order, start: "Den snabba minskningen", tokens: ["av", "kostnaderna", "har", "gjort", "det", "möjligt", "för", "företaget", "att", "anställa", "fler", "medarbetare"], answers: ["Den snabba minskningen av kostnaderna har gjort det möjligt för företaget att anställa fler medarbetare."] }
          - { id: de3d, type: order, start: "Efter en lång diskussion", tokens: ["fattade", "styrelsen", "ett", "beslut", "om", "en", "kraftig", "höjning", "av", "lönerna"], answers: ["Efter en lång diskussion fattade styrelsen ett beslut om en kraftig höjning av lönerna."], feedback: [{ contains: "diskussion styrelsen fattade", tip: "Na een zinsdeel vooraan komt eerst het werkwoord: Efter en lång diskussion fattade styrelsen …" }] }
          - { id: 2pa9, type: order, start: "Förbättringen av arbetsmiljön", tokens: ["har", "lett", "till", "en", "tydlig", "minskning", "av", "sjukfrånvaron", "bland", "de", "anställda"], answers: ["Förbättringen av arbetsmiljön har lett till en tydlig minskning av sjukfrånvaron bland de anställda."] }
          - { id: 7hwx, type: order, start: "Jämfört med samma period i fjol", tokens: ["ökade", "intäkterna", "från", "e-handeln", "med", "drygt", "tolv", "procent"], answers: ["Jämfört med samma period i fjol ökade intäkterna från e-handeln med drygt tolv procent.", "Jämfört med samma period i fjol ökade intäkterna med drygt tolv procent från e-handeln."], feedback: [{ contains: "i fjol intäkterna", tip: "Na een zinsdeel vooraan komt meteen het werkwoord: … i fjol ökade intäkterna." }] }
          - { id: qqb2, type: order, start: "Trots en svag ökning av försäljningen", tokens: ["gick", "företaget", "med", "förlust", "under", "årets", "första", "kvartal"], answers: ["Trots en svag ökning av försäljningen gick företaget med förlust under årets första kvartal.", "Trots en svag ökning av försäljningen gick företaget under årets första kvartal med förlust."], feedback: [{ contains: "försäljningen företaget gick", tip: "Trots en svag ökning … is één zinsdeel vooraan: daarna komt meteen het werkwoord (gick företaget)." }] }

      - id: nominal-herschrijven
        title: Herschrijf zakelijk
        instruction: Herschrijf de zin in nominale stijl. Begin zoals aangegeven.
        topic: nominalisering
        items:
          - { id: 4d5c, type: transform, prompt: "Elpriserna steg kraftigt under vintern, och därför minskade hushållens konsumtion.", task: "Begin met: Den kraftiga ökningen av elpriserna under vintern ledde till …", answers: ["Den kraftiga ökningen av elpriserna under vintern ledde till en minskning av hushållens konsumtion.", "Den kraftiga ökningen av elpriserna under vintern ledde till en minskning av konsumtionen hos hushållen.", "Den kraftiga ökningen av elpriserna under vintern ledde till minskad konsumtion hos hushållen."], feedback: [{ contains: ["minskning med hushållens", "minskning med konsumtionen"], tip: "Wát daalt: av. en minskning av hushållens konsumtion." }, { contains: "minskningen av", tip: "Na leder/ledde till en … komt de onbepaalde vorm: en minskning." }] }
          - { id: dra7, type: transform, prompt: "Företaget beslutade att flytta huvudkontoret till Malmö, och personalen och facket kritiserade det hårt.", task: "Begin met: Företagets beslut … (gebruik de passieve vorm)", answers: ["Företagets beslut {att|om att} flytta huvudkontoret till Malmö kritiserades {hårt|skarpt|kraftigt} av {personalen och facket|facket och personalen|både personalen och facket}.", "Företagets beslut {att|om att} flytta huvudkontoret till Malmö fick {hård|skarp|kraftig} kritik {av|från} {personalen och facket|facket och personalen|både personalen och facket}."], feedback: [{ contains: "företagets beslutet", tip: "Na een genitief volgt de onbepaalde vorm: företagets beslut." }] }
          - { id: 4mb9, type: transform, prompt: "Arbetslösheten i regionen minskade med två procentenheter under förra året, vilket förvånade många ekonomer.", task: "Begin met: Minskningen …", answers: ["Minskningen av arbetslösheten i regionen med två procentenheter {under förra året|förra året|i fjol} förvånade många ekonomer.", "Minskningen av arbetslösheten i regionen {under förra året|förra året|i fjol} med två procentenheter förvånade många ekonomer.", "Minskningen med två procentenheter av arbetslösheten i regionen {under förra året|förra året|i fjol} förvånade många ekonomer."], feedback: [{ contains: "minskningen med arbetslösheten", tip: "Wát daalt: av arbetslösheten. Hoeveel: med två procentenheter." }] }
          - { id: zapf, type: transform, prompt: "Kostnaderna för it-utrustning ökade svagt, men hyrorna sjönk kraftigt.", task: "Maak er één woordgroep van. Begin met: en svag ökning av … och en kraftig …", answers: ["en svag ökning av kostnaderna för it-utrustning och en kraftig {minskning av|nedgång i} hyrorna"], feedback: [{ contains: ["svagt ökning", "kraftigt minskning"], tip: "Bij een zelfstandig naamwoord hoort een bijvoeglijk naamwoord zonder -t: en svag ökning, en kraftig minskning." }, { contains: ["ökning med kostnaderna", "minskning med hyrorna"], tip: "Wát verandert: av." }] }
          - { id: kr99, type: transform, prompt: "Ledningen förändrade arbetstiderna, och det ledde till att sjukfrånvaron bland de anställda minskade kraftigt.", task: "Begin met: Ledningens förändring …", answers: ["Ledningens förändring av arbetstiderna ledde till en kraftig minskning av {sjukfrånvaron bland de anställda|de anställdas sjukfrånvaro}.", "Ledningens förändring av arbetstiderna ledde till en kraftigt minskad sjukfrånvaro bland de anställda."], feedback: [{ contains: "kraftigt minskning", tip: "Bij een zelfstandig naamwoord: en kraftig minskning (zonder -t)." }, { contains: "förändring med arbetstiderna", tip: "Wát verandert: av. förändring av arbetstiderna." }] }
          - { id: nbn5, type: transform, prompt: "Bolaget investerade mycket i ny teknik, och därför ökade produktionen med en tredjedel.", task: "Begin met: Bolagets stora investeringar i ny teknik ledde till …", answers: ["Bolagets stora investeringar i ny teknik ledde till en ökning av produktionen med en tredjedel.", "Bolagets stora investeringar i ny teknik ledde till en ökning med en tredjedel av produktionen."], feedback: [{ contains: "ökningen av", tip: "Na ledde till en … komt de onbepaalde vorm: en ökning." }, { contains: "ökning med produktionen", tip: "Wát stijgt: av produktionen. Hoeveel: med en tredjedel." }] }
          - { id: mte5, type: transform, prompt: "Försäljningen ökade med åtta procent jämfört med samma period i fjol.", task: "Begin met: Jämfört med samma period i fjol skedde en …", answers: ["Jämfört med samma period i fjol skedde en ökning av försäljningen med åtta procent.", "Jämfört med samma period i fjol skedde en ökning med åtta procent av försäljningen."], feedback: [{ contains: "ökning med försäljningen", tip: "Wát stijgt: av försäljningen. Hoeveel: med åtta procent." }] }

  - id: trender
    title: "Grammatik: ontwikkelingen beschrijven"
    exercises:
      - id: trend-kiezen
        title: Beschrijf de ontwikkeling
        instruction: Kies wat past.
        topic: trender
        shuffle: true
        items:
          - { id: 6qdp, type: gap, text: "Andelen ___ från tio till åttio procent.", gaps: [{ answers: ["ökade"], options: ["ökade", "minskade", "låg still"], shuffle: false }] }
          - { id: kd7u, type: gap, text: "Under 2022 och 2023 ___ priserna på samma nivå.", gaps: [{ answers: ["låg"], options: ["låg", "steg", "föll"], shuffle: false, tip: "Op hetzelfde niveau blijven: ligga still / ligga på samma nivå." }] }
          - { id: ghsk, type: gap, text: "Arbetslösheten steg från fem till sju procent, alltså med två ___.", gaps: [{ answers: ["procentenheter"], options: ["procent", "procentenheter"], shuffle: false, feedback: [{ match: "procent", tip: "Het verschil tussen twee percentages: procentenheter." }] }] }
          - { id: 28z2, type: gap, text: "År 2021 nådde andelen en ___ på 82 procent.", gaps: [{ answers: ["topp"], options: ["topp", "nedgång", "minskning"], shuffle: false }] }
          - { id: pgdu, type: gap, text: "Försäljningen ökade ___, från 100 till 103 miljoner.", gaps: [{ answers: ["svagt"], options: ["svagt", "kraftigt", "plötsligt"], shuffle: false, tip: "Drie procent is een kleine stijging: svagt (of marginellt)." }] }
          - { id: g3sb, type: gap, text: "51 procent är ___ hälften.", gaps: [{ answers: ["drygt"], options: ["drygt", "knappt", "exakt"], shuffle: false }] }
          - { id: uhhh, type: gap, text: "Efter flera år av ökning vände trenden: priserna ___ kraftigt 2023.", gaps: [{ answers: ["föll"], options: ["föll", "steg", "låg"], shuffle: false }] }
          - { id: 8nkt, type: gap, text: "49 procent är ___ hälften.", gaps: [{ answers: ["knappt"], options: ["drygt", "knappt", "exakt"], shuffle: false, tip: "Iets minder dan: knappt." }] }

      - id: trend-sorteren
        title: Omhoog, omlaag of gelijk?
        instruction: Deel de woorden in.
        topic: trender
        items:
          - id: hjtu
            type: sort
            categories: ["omhoog", "omlaag", "gelijk"]
            items:
              - { text: "en uppgång", cat: 0 }
              - { text: "ett ras", cat: 1 }
              - { text: "oförändrad", cat: 2 }
              - { text: "stiga", cat: 0 }
              - { text: "en nedgång", cat: 1 }
              - { text: "ligga still", cat: 2 }

      - id: trend-vertalen
        title: Cijfers in zinnen
        instruction: Vertaal de zin over de ontwikkeling.
        topic: trender
        items:
          - { id: db9u, type: translate, prompt: "Tussen 2019 en 2024 steeg het aantal klanten gestaag, van 2 000 tot iets meer dan 3 000.", answers: ["Mellan 2019 och 2024 {ökade|steg} antalet kunder stadigt, från {2 000|2000} till {drygt|strax över|lite mer än} {3 000|3000}.", "Mellan 2019 och 2024 har antalet kunder {ökat|stigit} stadigt, från {2 000|2000} till {drygt|strax över|lite mer än} {3 000|3000}.", "Antalet kunder {ökade|steg} stadigt mellan 2019 och 2024, från {2 000|2000} till {drygt|strax över|lite mer än} {3 000|3000}.", "Antalet kunder har {ökat|stigit} stadigt mellan 2019 och 2024, från {2 000|2000} till {drygt|strax över|lite mer än} {3 000|3000}."], feedback: [{ contains: ["mellan 2019 och 2024 antalet", "2024 antalet kunder ökade", "2024 antalet kunder steg"], tip: "Begint de zin met Mellan 2019 och 2024, dan komt meteen het werkwoord: … ökade antalet kunder." }, { contains: "stadig från", tip: "Bij een werkwoord hoort een bijwoord: ökade stadigt." }] }
          - { id: eq5q, type: translate, prompt: "De werkloosheid onder jongeren daalde vorig jaar van twaalf naar tien procent, dus met twee procentpunten.", answers: ["{Arbetslösheten bland unga|Arbetslösheten bland ungdomar|Ungdomsarbetslösheten} {sjönk|minskade|gick ner} {i fjol|förra året} från {tolv|12} till {tio|10} procent, {alltså|det vill säga} med två procentenheter.", "{I fjol|Förra året} {sjönk|minskade|gick ner} {arbetslösheten bland unga|arbetslösheten bland ungdomar|ungdomsarbetslösheten} från {tolv|12} till {tio|10} procent, {alltså|det vill säga} med två procentenheter."], feedback: [{ contains: "med två procent", tip: "Het verschil tussen twee percentages: procentenheter (procentpunten)." }, { contains: ["i fjol arbetslösheten", "förra året arbetslösheten", "i fjol ungdomsarbetslösheten", "förra året ungdomsarbetslösheten"], tip: "Begint de zin met de tijdsbepaling, dan komt meteen het werkwoord: I fjol sjönk arbetslösheten …" }] }
          - { id: 4pue, type: translate, prompt: "Na een piek in 2021 is het aandeel thuiswerkers geleidelijk gedaald tot ongeveer de helft.", answers: ["Efter {en topp|toppen} {år 2021|2021} har andelen {hemarbetare|som arbetar hemifrån} gradvis {minskat|sjunkit} till {ungefär|omkring|cirka} hälften.", "Efter {en topp|toppen} {år 2021|2021} har andelen {hemarbetare|som arbetar hemifrån} {minskat|sjunkit} gradvis till {ungefär|omkring|cirka} hälften.", "Efter {en topp|toppen} {år 2021|2021} {minskade|sjönk} andelen {hemarbetare|som arbetar hemifrån} gradvis till {ungefär|omkring|cirka} hälften.", "Andelen {hemarbetare|som arbetar hemifrån} har gradvis {minskat|sjunkit} till {ungefär|omkring|cirka} hälften efter {en topp|toppen} {år 2021|2021}."], feedback: [{ contains: ["2021 andelen hemarbetare har", "2021 andelen hemarbetare minskade", "2021 andelen hemarbetare sjönk"], tip: "Na Efter en topp år 2021 vooraan komt meteen het werkwoord: … har andelen hemarbetare …" }, { contains: "gradvist", tip: "gradvis krijgt geen -t." }] }
          - { id: 8nst, type: translate, prompt: "Vergeleken met vorig jaar is de winst van het bedrijf bijna gehalveerd, terwijl de kosten sterk zijn gestegen.", answers: ["Jämfört med {i fjol|förra året|föregående år} har {företagets|bolagets} vinst nästan halverats, medan kostnaderna {har ökat|har stigit|ökade|steg} {kraftigt|starkt}.", "{Företagets|Bolagets} vinst har nästan halverats jämfört med {i fjol|förra året|föregående år}, medan kostnaderna {har ökat|har stigit|ökade|steg} {kraftigt|starkt}."], feedback: [{ contains: ["i fjol företagets", "förra året företagets", "föregående år företagets", "i fjol bolagets", "förra året bolagets", "föregående år bolagets"], tip: "Begint de zin met Jämfört med i fjol, dan komt meteen het werkwoord: … har företagets vinst …" }, { contains: ["företagets vinsten", "bolagets vinsten"], tip: "Na een genitief volgt de onbepaalde vorm: företagets vinst." }] }
          - { id: r5wx, type: translate, prompt: "De verkoop in de fysieke winkels is het hele jaar stabiel gebleven, maar de online verkoop is verdubbeld.", answers: ["Försäljningen i de fysiska butikerna har {legat still|varit oförändrad|legat på samma nivå|varit stabil|legat stabilt} {under hela året|hela året}, men {e-handeln|försäljningen på nätet|nätförsäljningen} har fördubblats."], feedback: [{ contains: ["har legat stilla", "har ligget"], tip: "ligga still, voltooid deelwoord: har legat still." }] }
          - { id: 93ha, type: translate, prompt: "Vóór de grote feestdagen stijgt de verkoop van gebak sterk, vaak met meer dan 30 procent.", answers: ["{Inför|Före} de stora högtiderna {ökar|stiger} försäljningen av {bakverk|bakelser} {kraftigt|starkt}, ofta med {över|mer än} 30 procent.", "Försäljningen av {bakverk|bakelser} {ökar|stiger} {kraftigt|starkt} {inför|före} de stora högtiderna, ofta med {över|mer än} 30 procent."], feedback: [{ contains: "högtiderna försäljningen", tip: "Begint de zin met Inför de stora högtiderna, dan komt meteen het werkwoord: … ökar försäljningen." }, { contains: ["av bakverken", "av bakelserna"], tip: "In het algemeen, zonder lidwoord: försäljningen av bakverk." }] }
          - { id: gpud, type: translate, prompt: "Op een brugdag daalt het aantal werknemers op kantoor vaak met de helft.", answers: ["På {en klämdag|klämdagar} {minskar|sjunker} antalet {anställda|medarbetare} på kontoret ofta med hälften.", "Antalet {anställda|medarbetare} på kontoret {minskar|sjunker} ofta med hälften på {en klämdag|klämdagar}."], feedback: [{ contains: ["klämdag antalet", "klämdagar antalet"], tip: "Begint de zin met På en klämdag, dan komt meteen het werkwoord: … minskar antalet." }, { contains: "med halva", tip: "Met de helft: med hälften." }] }

      - id: trend-invullen
        title: Lange zinnen over cijfers
        instruction: Kies het woord dat past.
        topic: trender
        shuffle: true
