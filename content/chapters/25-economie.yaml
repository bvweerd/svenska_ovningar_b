        items:
          - { id: zq4w, type: translate, topic: trender, prompt: "De verkoop steeg sterk in het eerste kwartaal, maar daarna daalde hij geleidelijk gedurende de rest van het jaar.", answers: ["Försäljningen ökade kraftigt under det första kvartalet, men därefter minskade den gradvis under resten av året.", "Försäljningen {ökade|steg} kraftigt under {det första|första} kvartalet, men {därefter|sedan} {minskade|sjönk} den gradvis under resten av året."], feedback: [{ contains: "ökade sig", tip: "öka is niet wederkerend: försäljningen ökade." }] }
          - { id: 8x8h, type: translate, topic: trender, prompt: "Het aandeel werknemers dat thuiswerkt, is volgens een nieuw onderzoek van de gemeente in vijf jaar verdubbeld.", answers: ["Andelen anställda som arbetar hemifrån har fördubblats på fem år, enligt en ny undersökning från kommunen.", "Andelen anställda som {arbetar|jobbar} hemifrån har fördubblats på fem år, enligt en ny undersökning från kommunen.", "Enligt en ny undersökning från kommunen har andelen anställda som {arbetar|jobbar} hemifrån fördubblats på fem år.", "Andelen anställda som {arbetar|jobbar} hemifrån har enligt en ny undersökning från kommunen fördubblats på fem år."], feedback: [{ contains: "har fördubblat på", tip: "Verdubbelen (vanzelf): fördubblas, met -s." }] }
          - { id: q56p, type: translate, topic: nominalisering, prompt: "De invoering van het nieuwe systeem duurde langer dan verwacht en leidde tot hogere kosten voor het bedrijf.", answers: ["Införandet av det nya systemet tog längre tid än väntat och ledde till högre kostnader för företaget.", "Införandet av det nya systemet tog längre tid än {väntat|beräknat|förväntat} och ledde till högre kostnader för företaget."], feedback: [{ contains: "Införandet på", tip: "De invoering ván: införandet av." }] }
          - { id: 84c9, type: translate, topic: trender, prompt: "De werkloosheid is dit jaar vrijwel gelijk gebleven, terwijl de inflatie is gedaald tot onder de twee procent.", answers: ["Arbetslösheten har i stort sett legat still i år, medan inflationen har sjunkit till under två procent.", "Arbetslösheten har i stort sett {legat still|legat stilla|varit oförändrad} i år, medan inflationen har {sjunkit|minskat|gått ner} till under två procent."], feedback: [{ contains: "har sjunkat", tip: "sjunka is sterk: har sjunkit." }] }
          - { id: jfuy, type: translate, topic: nominalisering, prompt: "De daling van het aantal klanten komt vooral door de toegenomen concurrentie van webwinkels in het hele land.", answers: ["Minskningen av antalet kunder beror främst på den ökade konkurrensen från nätbutiker i hela landet.", "Minskningen av antalet kunder beror {främst|framför allt} på den ökade konkurrensen från nätbutiker i hela landet."], feedback: [{ contains: "beror främst av", tip: "Komen door: bero på." }] }
          - { id: jd9f, type: translate, topic: trender, prompt: "Het bedrijf rekent erop dat de omzet het komende jaar met ruim tien procent zal stijgen.", answers: ["Företaget räknar med att omsättningen kommer att öka med drygt tio procent under det kommande året.", "Företaget räknar med att omsättningen kommer [att ]{öka|stiga} med drygt tio procent {under det kommande året|nästa år|under nästa år}."], feedback: [{ contains: "öka på drygt", tip: "Met een percentage: öka med." }] }
          - { id: gzk7, type: translate, topic: trender, prompt: "Na een aantal jaren met grote verliezen besloot de leiding twee van de vijf winkels van het bedrijf te sluiten.", answers: ["Efter flera år med stora förluster beslutade ledningen att lägga ner två av företagets fem butiker.", "Efter {flera|några|ett antal} år med stora förluster {beslutade|bestämde} ledningen att {lägga ner|stänga} två av företagets fem butiker."], feedback: [{ contains: "förluster ledningen beslutade", tip: "Na een tijdsbepaling vooraan: werkwoord eerst (beslutade ledningen)." }] }

