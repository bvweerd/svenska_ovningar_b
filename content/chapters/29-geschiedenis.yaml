          - { id: wu3s, type: gap, topic: bestamd-utan-artikel, text: "Det var första ___ skeppet seglade.", gaps: [{ answers: ["gången"], options: ["gång", "gången"], shuffle: false }] }
          - { id: k5pr, type: gap, topic: particip-konstruktion, text: "det år 1961 ___ (bärga) skeppet", gaps: [{ answers: ["bärgade"] }] }
          - { id: ys8v, type: transform, topic: utbrytning, prompt: "**Kungen** ville ha skeppet klart snabbt.", answers: ["Det var kungen som ville ha skeppet klart snabbt."] }
          - { id: qd95, type: gap, topic: sambandsord, text: "Skeppet var instabilt. ___ sjönk det.", gaps: [{ answers: ["Därför"], options: ["Därför", "Dessutom", "Däremot"], shuffle: false }] }
          - { id: dc83, type: transform, topic: fundament, prompt: "En kanon ligger fortfarande på botten.", answers: ["Det ligger fortfarande en kanon på botten.", "Det ligger en kanon på botten fortfarande."] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: h4fe, type: findError, sentence: "Vi vet att kungen var inte i Stockholm.", wrong: [4, 5], answers: ["Vi vet att kungen inte var i Stockholm."], tip: "Bijzinvolgorde." }
          - { id: gpst, type: findError, sentence: "Hon sa att han kom inte heller.", wrong: [4, 5, 6], answers: ["Hon sa att han inte heller kom."], tip: "Bijzinvolgorde, met twee bijwoorden." }
          - { id: vq9r, type: findError, topic: fundament, sentence: "År 1961 skeppet bärgades.", wrong: [2, 3], answers: ["År 1961 bärgades skeppet."], tip: "V2." }
          - { id: crkt, type: findError, topic: fundament, sentence: "Det finnas många turister här.", wrong: [1], answers: ["Det finns många turister här."], tip: "Welke vorm van finnas?" }
          - { id: z6z2, type: findError, sentence: "Skeppet sjunkit inom några minuter.", wrong: [1], answers: ["Skeppet {hade sjunkit|sjönk} inom några minuter."], tip: "In een hoofdzin mag hade niet wegvallen." }

