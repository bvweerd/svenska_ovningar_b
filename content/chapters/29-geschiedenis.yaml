          - { id: t3hj, type: order, start: "I dag", tokens: ["kan", "man", "se", "skeppet", "på museet"], answers: ["I dag kan man se skeppet på museet."] }
          - { id: e3sm, type: order, start: "På 1600-talet", tokens: ["var", "Sverige", "en stormakt"], answers: ["På 1600-talet var Sverige en stormakt."] }
          - { id: j75g, type: order, start: "Efter olyckan", tokens: ["började", "man", "undersöka", "skeppet"], answers: ["Efter olyckan började man undersöka skeppet."] }
          - { id: 5u69, type: order, start: "Varför", tokens: ["sjönk", "skeppet"], answers: ["Varför sjönk skeppet?"] }
          - { id: 63dy, type: order, start: "Det här", tokens: ["visste", "ingen", "då"], answers: ["Det här visste ingen då."] }
          - { id: ezfu, type: order, start: "Tyvärr", tokens: ["hade", "ingen", "räknat", "med vinden"], answers: ["Tyvärr hade ingen räknat med vinden."] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
      - id: zoek-de-fout
        title: Zoek de fout
        instruction: Klik op het woord dat niet klopt en verbeter de zin.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: h4fe, type: findError, sentence: "Vi vet att kungen var inte i Stockholm.", wrong: [4, 5], answers: ["Vi vet att kungen inte var i Stockholm."], tip: "Bijzinvolgorde." }
          - { id: gpst, type: findError, sentence: "Hon sa att han kom inte heller.", wrong: [4, 5, 6], answers: ["Hon sa att han inte heller kom."], tip: "Bijzinvolgorde, met twee bijwoorden." }
          - { id: vq9r, type: findError, topic: fundament, sentence: "År 1961 skeppet bärgades.", wrong: [2, 3], answers: ["År 1961 bärgades skeppet."], tip: "V2." }
          - { id: crkt, type: findError, topic: fundament, sentence: "Det finnas många turister här.", wrong: [1], answers: ["Det finns många turister här."], tip: "Welke vorm van finnas?" }
          - { id: z6z2, type: findError, sentence: "Skeppet sjunkit inom några minuter.", wrong: [1], answers: ["Skeppet {hade sjunkit|sjönk} inom några minuter."], tip: "In een hoofdzin mag hade niet wegvallen." }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-guide
        title: "Luisteren: de gids in het museum"
        instruction: Luister naar de gids. Is de bewering **rätt** of **fel**?
        topic: fundament
        listen: true
        textTitle: Välkomna till museet
        text: |
          Välkomna! Skeppet som ni ser framför er är till största delen original. Det har alltså legat på havets botten i över trehundra år.

          När vraket hade bärgats, började ett långt arbete med att bevara det. I sjutton år besprutades träet med ett speciellt konserveringsmedel, så att det inte skulle torka och spricka.

          Det finns fortfarande problem. Träet bryts långsamt ner, och därför är det alltid ganska mörkt och svalt här inne. Det är också därför som man inte får röra skeppet.
        items:
          - { id: ges2, type: truefalse, statement: "Skeppet är till största delen original.", answer: true }
