      - id: fundament-zinsbouw
        title: Tijd vooraan
        instruction: Zet de woorden in de goede volgorde. Let op V2.
        topic: fundament
        shuffle: true
        items:
          - { id: aafd, type: order, start: "År 1961", tokens: ["bärgades", "skeppet"], answers: ["År 1961 bärgades skeppet."] }
          - { id: 6ju4, type: order, start: "Under mer än trehundra år", tokens: ["låg", "Vasa", "kvar", "på botten"], answers: ["Under mer än trehundra år låg Vasa kvar på botten."] }
          - { id: t3hj, type: order, start: "I dag", tokens: ["kan", "man", "se", "skeppet", "på museet"], answers: ["I dag kan man se skeppet på museet."] }
          - { id: e3sm, type: order, start: "På 1600-talet", tokens: ["var", "Sverige", "en stormakt"], answers: ["På 1600-talet var Sverige en stormakt."] }
          - { id: j75g, type: order, start: "Efter olyckan", tokens: ["började", "man", "undersöka", "skeppet"], answers: ["Efter olyckan började man undersöka skeppet."] }
          - { id: 5u69, type: order, start: "Varför", tokens: ["sjönk", "skeppet"], answers: ["Varför sjönk skeppet?"] }
          - { id: 63dy, type: order, start: "Det här", tokens: ["visste", "ingen", "då"], answers: ["Det här visste ingen då."] }
          - { id: ezfu, type: order, start: "Tyvärr", tokens: ["hade", "ingen", "räknat", "med vinden"], answers: ["Tyvärr hade ingen räknat med vinden."] }

      - id: fundament-vertalen
        title: Wat zet je vooraan? Vertalen
        instruction: Vertaal de zin. Let op V2 en op det + werkwoord.
        topic: fundament
        shuffle: true
        items:
          - { id: tced, type: translate, prompt: "Omdat niemand de koning durfde tegen te spreken, ging het werk door, hoewel iedereen wist dat het schip instabiel was.", answers: ["{Eftersom|Då} ingen vågade {säga emot kungen|säga kungen emot|motsäga kungen} {fortsatte arbetet|gick arbetet vidare} {trots att|fast|fastän} alla visste att skeppet var instabilt.", "Arbetet {fortsatte|gick vidare} {eftersom|då} ingen vågade {säga emot kungen|säga kungen emot|motsäga kungen} {trots att|fast|fastän} alla visste att skeppet var instabilt."], feedback: [{ contains: ["kungen arbetet fortsatte", "emot arbetet fortsatte", "kungen arbetet gick", "emot arbetet gick"], tip: "De bijzin vooraan telt als plaats 1: daarna komt meteen het werkwoord (…, fortsatte arbetet)." }] }
          - { id: 4r4n, type: translate, prompt: "In 1628 was Zweden een grootmacht die bijna voortdurend oorlog voerde tegen zijn buurlanden.", answers: ["År 1628 var Sverige en stormakt som nästan {hela tiden|ständigt|jämt|alltid} {förde krig mot|låg i krig med} sina {grannländer|grannar}.", "1628 var Sverige en stormakt som nästan {hela tiden|ständigt|jämt|alltid} {förde krig mot|låg i krig med} sina {grannländer|grannar}.", "Sverige var [år ]1628 en stormakt som nästan {hela tiden|ständigt|jämt|alltid} {förde krig mot|låg i krig med} sina {grannländer|grannar}."], feedback: [{ contains: "1628 sverige var", tip: "Na een tijdsbepaling vooraan komt het werkwoord op plaats 2: År 1628 var Sverige …" }, { contains: "sina grannländerna", tip: "Na sina geen lidwoord achter het woord: sina grannländer." }] }
          - { id: rv28, type: translate, prompt: "Er is nog steeds geen museum ter wereld dat een beter bewaard schip uit de zeventiende eeuw heeft.", answers: ["Det finns {fortfarande|ännu} {inget|inte något|inte ett enda} museum {i världen|i hela världen} som har ett bättre bevarat skepp från {1600-talet|sextonhundratalet|det sjuttonde århundradet}."], feedback: [{ contains: ["inget museum finns", "något museum finns"], tip: "Nieuw, onbepaald onderwerp: begin met det (Det finns … inget museum …)." }, { contains: "bättre bevarad skepp", tip: "Skepp is een ett-woord: ett bättre bevarat skepp." }] }
          - { id: pqqm, type: translate, prompt: "Pas in de twintigste eeuw begon men te begrijpen hoe waardevol het wrak in de haven van Stockholm eigenlijk was.", answers: ["Först {på|under} {1900-talet|nittonhundratalet} började man [att ]{förstå|inse} hur värdefullt vraket i Stockholms hamn {egentligen|faktiskt} var."], feedback: [{ contains: ["1900-talet man", "nittonhundratalet man"], tip: "Na een tijdsbepaling vooraan komt het werkwoord op plaats 2: Först på 1900-talet började man …" }, { contains: "värdefullt var vraket", tip: "Een indirecte vraag (na hur) heeft de volgorde van een bijzin: hur värdefullt vraket … var." }] }

      - id: fundament-herschrijven
        title: Lange zinnen herschrijven
        instruction: Herschrijf de zin zoals gevraagd.
        topic: fundament
        items:
          - { id: jthn, type: transform, prompt: "Några okända föremål från skeppet ligger kanske fortfarande kvar i leran på botten.", task: "Begin met **det**.", answers: ["Det {ligger kanske fortfarande|kanske ligger fortfarande|kanske fortfarande ligger} några okända föremål från skeppet kvar i leran på botten.", "Det {ligger kanske fortfarande|kanske ligger fortfarande|kanske fortfarande ligger} kvar några okända föremål från skeppet i leran på botten."] }
          - { id: jrwe, type: transform, prompt: "Skeppet bärgades efter mer än trehundra år på botten av Stockholms hamn år 1961.", task: "Begin met *År 1961*.", answers: ["År 1961 bärgades skeppet efter mer än trehundra år på botten av Stockholms hamn."], feedback: [{ contains: "1961 skeppet", tip: "Na År 1961 vooraan komt het werkwoord op plaats 2: År 1961 bärgades skeppet …" }] }
          - { id: dc4m, type: transform, prompt: "Man har upptäckt många nya detaljer om livet ombord under de senaste åren.", task: "Begin met *Under de senaste åren*.", answers: ["Under de senaste åren har man upptäckt många nya detaljer om livet ombord."], feedback: [{ contains: "åren man", tip: "Na de tijdsbepaling vooraan komt het werkwoord op plaats 2: Under de senaste åren har man …" }] }
          - { id: j62u, type: transform, topic: bisats-adverb, prompt: "Kungen ville inte vänta längre, så ingen på varvet vågade stoppa det farliga projektet.", task: "Begin met *Eftersom*.", answers: ["Eftersom kungen inte {längre ville vänta|ville vänta längre} vågade ingen på varvet stoppa det farliga projektet."], feedback: [{ contains: "ville inte", tip: "In de bijzin (na eftersom) staat inte vóór het werkwoord: eftersom kungen inte längre ville vänta." }, { contains: "ingen på varvet vågade", tip: "De bijzin met eftersom telt als plaats 1: daarna komt meteen het werkwoord (… vågade ingen på varvet …)." }] }

