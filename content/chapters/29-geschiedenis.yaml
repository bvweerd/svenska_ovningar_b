          - { id: sy32, type: transform, prompt: "En vindby kom plötsligt.", answers: ["Det kom plötsligt en vindby.", "Det kom en vindby plötsligt."] }
          - { id: zuvv, type: transform, prompt: "Något konstigt hände i går.", answers: ["Det hände något konstigt {i går|igår}."] }
          - { id: 7bh9, type: transform, prompt: "Ett fel finns i texten.", answers: ["Det finns ett fel i texten."] }
          - { id: k926, type: transform, prompt: "Många människor bor i Stockholm.", answers: ["Det bor många människor i Stockholm."] }
          - { id: edzt, type: transform, prompt: "Ett tåg går klockan nio.", answers: ["Det går ett tåg klockan nio."] }

      - id: fundament-zinsbouw
        title: Tijd vooraan
        instruction: Zet de woorden in de goede volgorde. Let op V2.
        topic: fundament
        shuffle: true
        items:
          - { id: aafd, type: order, start: "År 1961", tokens: ["bärgades", "skeppet"], answers: ["År 1961 bärgades skeppet."] }
