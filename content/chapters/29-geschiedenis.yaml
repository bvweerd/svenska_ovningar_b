chapter: 29
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik zet zinsbijwoorden in lange bijzinnen op de goede plek", topics: [bisats-adverb] }
  - { text: "Ik kies bewust wat ik vooraan in de zin zet", topics: [fundament] }

grammar:
  - id: bisats-adverb
    title: Lange bijzinnen
    summary: "In een bijzin staan **alle** zinsbijwoorden vóór het werkwoord: *att han **kanske inte längre** ville segla*. In een hoofdzin staan ze ná het werkwoord: *Han ville **kanske inte längre** segla.* In geschreven Zweeds mag **hade** (en ook **har**) in een bijzin wegvallen: *när skeppet (hade) sjunkit*."
    body: |
      ### Meerdere bijwoorden
      Zinsbijwoorden zoals *inte, aldrig, kanske, nog, ju, redan, längre, heller, alltid* staan:

      - in de **hoofdzin** na het vervoegde werkwoord: *Han **ville** kanske inte längre segla.*
      - in de **bijzin** vóór het vervoegde werkwoord: *… att han kanske inte längre **ville** segla.*

      Staan er meerdere, dan meestal in deze volgorde: **ju / nog / kanske** → **inte / aldrig** → **längre / heller / alltid**:

      - *eftersom de **nog inte** hade märkt något*
      - *att hon **inte heller** kom*
      - *om man **kanske aldrig** får veta sanningen*

      ### Hade (en har) mag wegvallen
      In een **bijzin** in de voltooid verleden tijd laten Zweden in geschreven taal vaak *hade* weg:

      - *När skeppet **(hade) sjunkit**, samlades folk vid stranden.*
      - *Han berättade att han **(hade) hittat** vraket.*

      Dat geldt ook voor **har** in de voltooid tegenwoordige tijd: *Jag är glad att du **(har) kommit**.*

      In de **hoofdzin** mag dat niet: *Skeppet **hade** sjunkit.*

  - id: fundament
    title: Wat zet je vooraan?
    summary: "Vooraan staat wat al **bekend** is of de **tijd/plaats**; nieuwe informatie komt achteraan: *År 1961 bärgades skeppet.* Een nieuw, onbepaald onderwerp introduceer je met **det**: *Det står en man vid dörren. Det kom plötsligt en vindby.*"
    body: |
      Het eerste zinsdeel (*fundamentet*) mag bijna alles zijn, zolang het werkwoord op plaats 2 staat (V2). Welke keuze klinkt goed?

      - **Tijd of plaats** vooraan is heel gewoon in verhalen: ***År 1628** sjönk Vasa. **I dag** kan man se skeppet på museet.*
      - Begin met wat **al bekend** is uit de vorige zin, en eindig met het **nieuwe**: *Vasa beställdes av kungen. **Skeppet** skulle bli världens mäktigaste.*
      - Een **lang onderwerp** zet je liever niet vooraan.

      ### Det + werkwoord + nieuw onderwerp
      Is het onderwerp **nieuw en onbepaald** (*en man, många turister*), dan begin je vaak met **det** (presentatieconstructie). Typische werkwoorden: *finnas, stå, sitta, ligga, komma, hända*.

      | minder natuurlijk | natuurlijk |
      |---|---|
      | *En man står vid dörren.* | ***Det står** en man vid dörren.* |
      | *Många turister finns på museet.* | ***Det finns** många turister på museet.* |
      | *En vindby kom plötsligt.* | ***Det kom** plötsligt en vindby.* |

      Zweedse werkwoorden hebben geen meervoudsvorm, dus *det finns* blijft gewoon *det finns*. Let op het verschil met het Nederlands, waar *er is* bij meervoud *er zijn* wordt: *Det **finns** många turister.* = Er **zijn** veel toeristen.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-vasa
        title: "Lezen: de Vasa"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: fundament
        textTitle: Vasa – skeppet som sjönk på jungfruresan
        text: |
          Den 10 augusti 1628 samlades tusentals stockholmare vid stranden. Det nya krigsskeppet Vasa, som kung Gustav II Adolf hade beställt några år tidigare, skulle för första gången segla ut. Kungen var själv inte på plats, eftersom han befann sig i krig i Polen.

          Vasa hade byggts på varvet i Stockholm under ledning av en holländsk skeppsbyggare. Skeppet var nästan 70 meter långt, hade 64 kanoner ombord och var dekorerat med hundratals målade träskulpturer. Det skulle visa hela Europa att Sverige nu var en stormakt som ingen längre kunde ignorera.

          Vasa hade bara seglat omkring 1 300 meter när det plötsligt kom en vindby. Skeppet lutade, vatten forsade in genom de öppna kanonportarna, och inom några minuter hade det stolta skeppet sjunkit. Omkring trettio människor omkom.

          Varför sjönk Vasa? Redan före avfärden hade man märkt att skeppet var instabilt, men ingen vågade stoppa projektet, eftersom kungen ville att skeppet skulle bli klart så snabbt som möjligt.

          Någon tid före avfärden hade man nämligen gjort ett enkelt test. Trettio sjömän fick springa fram och tillbaka över däcket, medan amiralen såg på. Redan efter tre vändor lutade skeppet så kraftigt att man avbröt testet. Amiralen var orolig, men han ville inte försena projektet. Skeppsbyggaren, som hade lett arbetet från början, hade dessutom dött året innan. Det fanns alltså ingen som riktigt visste hur problemet skulle lösas.

          Efter olyckan greps kaptenen, som hade överlevt, och förhördes. Han försäkrade att besättningen inte hade varit berusad och att kanonerna hade suttit ordentligt fast. Till slut dömdes ingen, kanske eftersom det i praktiken var kungen själv som hade godkänt skeppets mått.

          Under mer än trehundra år låg Vasa kvar på botten. Först 1956 hittades vraket, och 1961 bärgades det. I dag kan man se skeppet på Vasamuseet i Stockholm, som har blivit ett av Sveriges mest besökta museer.

          I dag vet forskarna ganska säkert varför skeppet inte klarade vindbyn: det var för smalt och för högt, och det hade för lite tyngd längst ner. Paradoxalt nog är det olyckan som har gjort Vasa unikt. Om skeppet inte hade sjunkit, hade det troligen seglat i några decennier och sedan skrotats, precis som de flesta andra skepp från den tiden. Nu finns det i stället ett nästan helt bevarat krigsskepp från 1600-talet, och varje år kommer över en miljon besökare för att se det.
        items:
          - { id: baxz, type: mc, prompt: "När sjönk Vasa?", options: ["den 10 augusti 1628", "år 1956", "år 1961", "den 10 augusti 1728"], answer: 0 }
          - { id: fj3p, type: truefalse, statement: "Kungen såg när skeppet sjönk.", answer: false, correction: { answers: ["Kungen var inte på plats[ eftersom han var i krig i Polen].", "{Kungen|Han} var i Polen."] } }
          - { id: fbq6, type: mc, prompt: "Hur långt hade Vasa seglat?", options: ["omkring 1 300 meter", "omkring 13 kilometer", "till Polen", "några hundra meter ut på havet"], answer: 0 }
          - { id: sj3k, type: mc, prompt: "Hur kom vattnet in?", options: ["genom de öppna kanonportarna", "genom ett hål i botten", "över däcket", "genom fönstren"], answer: 0 }
          - { id: 5bnu, type: truefalse, statement: "Man visste inte före avfärden att skeppet var instabilt.", answer: false, correction: { answers: ["Man hade [redan ]märkt att skeppet var instabilt[ före avfärden]."] } }
          - { id: 7rvp, type: mc, prompt: "När bärgades Vasa?", options: ["1961", "1956", "1628", "1990"], answer: 0 }
          - { id: c55s, type: mc, prompt: "Vad hände när sjömännen sprang fram och tillbaka över däcket?", options: ["Skeppet lutade så kraftigt att man avbröt testet.", "Skeppet sjönk efter tre minuter.", "Kungen stoppade testet från Polen.", "Ingenting hände, och skeppet verkade stabilt."], answer: 0 }
          - { id: 3c2k, type: truefalse, statement: "Kaptenen dömdes för olyckan.", answer: false, tip: "Lees de alinea over het verhoor nog eens.", correction: { answers: ["Ingen dömdes[ för olyckan][ till slut].", "Till slut dömdes ingen[ för olyckan].", "{Kaptenen|Han} dömdes inte[ för olyckan]."] } }
          - id: 5duj
            type: multi
            prompt: "Welke oorzaken droegen volgens de tekst bij aan het zinken van de Vasa?"
            options: ["Skeppet var för smalt och för högt.", "Det hade för lite tyngd längst ner.", "Kanonportarna var öppna.", "Ingen vågade stoppa projektet.", "Besättningen var berusad.", "Kanonerna hade inte suttit fast."]
            answers: [0, 1, 2, 3]
            tip: "De bemanning was volgens de kapitein niet dronken, en de kanonnen zaten goed vast."
          - { id: my9r, type: mc, prompt: "Varför kan man i dag se ett nästan helt bevarat skepp från 1600-talet?", options: ["Eftersom Vasa sjönk och låg kvar på botten i stället för att skrotas.", "Eftersom Vasa seglade i flera decennier utan problem.", "Eftersom man byggde en ny kopia av skeppet på 1900-talet.", "Eftersom kungen lät bevara skeppet i en hamn."], answer: 0, tip: "Wat zou er volgens de laatste alinea met het schip gebeurd zijn als het niet was gezonken?" }

      - id: makkelijk-1
        title: "Makkelijk lezen: Det gamla huset"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Det gamla huset"
        text: |
          Huset som Johan bor i byggdes år 1890. Det har varit både skola och affär. När Johan köpte huset hittade han gamla brev på vinden. Breven, som hade skrivits av en lärare, berättade om livet i byn för hundra år sedan. Johan har nu gett breven till hembygdsföreningen. Föreningen ska nu visa breven på en utställning i byns gamla kyrka. Många i byn har redan visat intresse, och några har hittat egna gamla foton som de vill visa. Johan har också fått veta mer om sitt eget hus.
        items:
          - { id: j6jj, type: truefalse, statement: "Huset byggdes på 1800-talet.", answer: true }
          - { id: 2pwx, type: truefalse, statement: "Breven hade skrivits av en präst.", answer: false }

      - id: makkelijk-2
        title: "Makkelijk lezen: Runstenar"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Runstenar"
        text: |
          I Sverige finns det flera tusen runstenar. De flesta restes under vikingatiden, för ungefär tusen år sedan. Ofta restes stenen till minne av en släkting som hade dött. Många stenar står fortfarande kvar där de en gång restes. Texterna är skrivna med runor, ett gammalt alfabet med sexton tecken. Många stenar har också vackra mönster, ofta i form av en orm. Från början var stenarna målade i starka färger, men färgen har för länge sedan försvunnit. I dag kan man läsa om alla stenar på internet.
        items:
          - { id: zfnf, type: truefalse, statement: "De flesta runstenar restes under vikingatiden.", answer: true }
          - { id: nvmx, type: truefalse, statement: "Alla runstenar har flyttats till museer.", answer: false }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
