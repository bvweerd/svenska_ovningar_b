            type: match
            pairs:
              - ["ett krig", "een oorlog"]
              - ["ett vrak", "een wrak"]
              - ["bärga", "bergen (een schip)"]
              - ["omkomma", "omkomen"]
              - ["en jungfruresa", "een eerste reis (van een schip)"]
              - ["en avfärd", "een vertrek"]
          - id: pzz5
            type: match
            pairs:
              - ["ett århundrade", "een eeuw"]
              - ["medeltiden", "de middeleeuwen"]
              - ["en kung", "een koning"]
              - ["en drottning", "een koningin"]
              - ["befinna sig", "zich bevinden"]
              - ["våga", "durven"]

  - id: bisats
    title: "Grammatik: lange bijzinnen"
    exercises:
      - id: bisats-zinsbouw
        title: Bijwoorden in de bijzin
        instruction: Zet de woorden in de goede volgorde.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: f7er, type: order, start: "Han sa att", tokens: ["han", "kanske", "inte", "längre", "ville", "segla"], answers: ["Han sa att han kanske inte längre ville segla."] }
          - { id: ur6r, type: order, start: "Det är synd att", tokens: ["vi", "aldrig", "har", "varit", "på Vasamuseet"], answers: ["Det är synd att vi aldrig har varit på Vasamuseet."] }
          - { id: wnxk, type: order, start: "Eftersom", tokens: ["skeppet", "redan", "var", "instabilt,", "sjönk", "det", "snabbt"], answers: ["Eftersom skeppet redan var instabilt, sjönk det snabbt."] }
          - { id: msvx, type: order, start: "Jag tror att", tokens: ["de", "nog", "inte", "hade", "märkt", "något"], answers: ["Jag tror att de nog inte hade märkt något."] }
          - { id: 8vh8, type: order, start: "Hon sa att", tokens: ["hon", "tyvärr", "inte", "kunde", "komma"], answers: ["Hon sa att hon tyvärr inte kunde komma."] }
          - { id: mabx, type: order, start: "Vi vet att", tokens: ["kungen", "aldrig", "såg", "skeppet", "segla"], answers: ["Vi vet att kungen aldrig såg skeppet segla."] }
          - { id: a2tm, type: order, start: "Det är märkligt att", tokens: ["ingen", "hade", "varnat", "kungen"], answers: ["Det är märkligt att ingen hade varnat kungen."] }
          - { id: k6xj, type: order, start: "Jag undrar om", tokens: ["de", "verkligen", "förstod", "riskerna"], answers: ["Jag undrar om de verkligen förstod riskerna."] }

      - id: bisats-omvormen
        title: Hoofdzin wordt bijzin
        instruction: Maak van de hoofdzin een bijzin na het gegeven begin.
        topic: bisats-adverb
        items:
          - { id: trmp, type: transform, prompt: "Kungen var inte i Stockholm.", task: "Vi vet att …", answers: ["Vi vet att kungen inte var i Stockholm."], feedback: [{ contains: "var inte", tip: "In de bijzin: inte vóór het werkwoord." }] }
          - { id: xvad, type: transform, prompt: "Han kom inte heller.", task: "Hon sa att …", answers: ["Hon sa att han inte heller kom."], feedback: [{ contains: "kom inte", tip: "In de bijzin: inte heller vóór het werkwoord." }] }
          - { id: z8a2, type: transform, prompt: "Skeppet var kanske för smalt.", task: "Forskarna tror att …", answers: ["Forskarna tror att skeppet kanske var för smalt."], feedback: [{ contains: "var kanske", tip: "In de bijzin: kanske vóór het werkwoord." }] }
          - { id: rjbc, type: transform, prompt: "Man hade redan märkt problemet.", task: "Det är känt att …", answers: ["Det är känt att man redan [hade ]märkt problemet."], feedback: [{ contains: "hade redan", tip: "In de bijzin: redan vóór het werkwoord." }] }
          - { id: vmwp, type: transform, prompt: "Skeppet sjönk inte på grund av stormen.", task: "Man vet att …", answers: ["Man vet att skeppet inte sjönk på grund av stormen."], feedback: [{ contains: "sjönk inte", tip: "In de bijzin: inte vóór het werkwoord." }] }
          - { id: aqym, type: transform, prompt: "Kungen ville alltid ha det största skeppet.", task: "Det sägs att …", answers: ["Det sägs att kungen alltid ville ha det största skeppet."], feedback: [{ contains: "ville alltid", tip: "In de bijzin: alltid vóór het werkwoord." }] }
          - { id: 25df, type: transform, prompt: "Hon har aldrig besökt museet.", task: "Hon berättade att …", answers: ["Hon berättade att hon aldrig [{hade|har} ]besökt museet."], feedback: [{ contains: ["hade aldrig", "har aldrig"], tip: "In de bijzin: aldrig vóór het werkwoord." }] }
          - { id: h67m, type: transform, prompt: "Vi kan tyvärr inte komma.", task: "Vi skrev att …", answers: ["Vi skrev att vi tyvärr inte {kunde|kan} komma."], feedback: [{ contains: ["kunde tyvärr", "kan tyvärr"], tip: "In de bijzin: tyvärr inte vóór het werkwoord." }] }

      - id: hade-weg
        title: Mag hade weg?
        instruction: In welke zin mag **hade** wegvallen?
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 4f77, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["När skeppet hade sjunkit, samlades folk vid stranden.", "Skeppet hade sjunkit på några minuter.", "Folk hade samlats vid stranden.", "Kungen hade beställt skeppet."], answer: 0, tip: "Alleen in een bijzin (hier na när)." }
          - { id: jwtr, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Han berättade att han hade hittat vraket.", "Han hade hittat vraket.", "Då hade han hittat vraket.", "Hade han hittat vraket?"], answer: 0, tip: "Alleen in een bijzin (hier na att)." }
          - { id: eegs, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Eftersom de hade glömt nyckeln, kom de inte in.", "De hade glömt nyckeln.", "Hade de glömt nyckeln?", "Då hade de glömt nyckeln."], answer: 0, tip: "Alleen in een bijzin (hier na eftersom)." }
          - { id: hdub, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Jag vet att hon hade läst boken.", "Hon hade läst boken.", "Boken hade hon läst.", "Hade hon läst boken?"], answer: 0, tip: "Alleen in een bijzin (hier na att)." }
          - { id: ckw6, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Om jag hade vetat det, skulle jag ha kommit.", "Jag hade vetat det.", "Det hade jag vetat.", "Hade jag vetat det?"], answer: 0, tip: "Alleen in een bijzin (hier na om)." }
          - { id: n8pu, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Skeppet som hade byggts i Stockholm sjönk.", "Skeppet hade byggts i Stockholm.", "I Stockholm hade skeppet byggts.", "Hade skeppet byggts i Stockholm?"], answer: 0, tip: "Alleen in een bijzin (hier een som-zin)." }
          - { id: wy3k, type: mc, prompt: "Kies de zin waarin *hade* **niet** mag wegvallen.", options: ["Han hade redan ätit.", "När han hade ätit, gick han.", "Hon sa att han hade ätit.", "Eftersom han hade ätit, var han mätt."], answer: 0, tip: "In een hoofdzin moet hade blijven staan." }
          - { id: kv6w, type: mc, prompt: "Kies de zin waarin *hade* **niet** mag wegvallen.", options: ["Vi hade aldrig sett något liknande.", "Vi sa att vi aldrig hade sett något liknande.", "Fast vi hade sett det förut, blev vi förvånade.", "Det var något som vi aldrig hade sett."], answer: 0, tip: "In een hoofdzin moet hade blijven staan." }

      - id: pluskvamperfekt
        title: Voltooid verleden tijd
        instruction: Vul de vorm met **hade** in.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 6g4h, type: gap, text: "Vasa ___ (segla) bara 1 300 meter när det sjönk.", gaps: [{ answers: ["hade seglat"], feedback: [{ match: "seglade", tip: "Het zeilen was al gebeurd vóór het zinken: hade seglat." }] }] }
          - { id: hzj9, type: gap, text: "Man ___ (märka) redan före avfärden att skeppet var instabilt.", gaps: [{ answers: ["hade märkt"] }] }
          - { id: zwzg, type: gap, text: "Kungen ___ (beställa) skeppet några år tidigare.", gaps: [{ answers: ["hade beställt"], feedback: [{ match: "hade beställd", tip: "Na hade: het supinum, beställt." }] }] }
          - { id: 8ctz, type: gap, text: "När vraket ___ (hitta), började man planera bärgningen.", hint: "Lijdend: hade + supinum + s.", gaps: [{ answers: ["hade hittats", "hittats"] }] }
          - { id: 2urw, type: gap, text: "Bussen ___ redan ___ (gå) när vi kom fram.", gaps: [{ answers: ["hade"] }, { answers: ["gått"], feedback: [{ match: "gåt", tip: "Supinum van gå: gått." }] }] }
          - { id: pk2k, type: gap, text: "Hon ___ (bo) i Göteborg i tio år innan hon flyttade.", gaps: [{ answers: ["hade bott"], feedback: [{ match: "bodde", tip: "Het wonen ging vooraf aan het verhuizen: hade bott." }] }] }
          - { id: wmrr, type: gap, text: "Vi ___ aldrig ___ (se) något liknande.", gaps: [{ answers: ["hade"] }, { answers: ["sett"] }] }
          - { id: dmq5, type: gap, text: "Skeppet ___ (bygga) i Stockholm innan det sjösattes.", hint: "Lijdend: hade + supinum + s.", gaps: [{ answers: ["hade byggts"], feedback: [{ match: "byggdes", tip: "Het bouwen ging vooraf aan de tewaterlating: hade byggts." }] }] }

      - id: bisats-vertalen
        title: Lange bijzinnen vertalen
        instruction: Vertaal de zin. Let op de plaats van de bijwoorden in de bijzin.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 2qdx, type: translate, prompt: "De historicus schreef dat de koning waarschijnlijk nooit had begrepen hoe instabiel het schip eigenlijk was.", answers: ["Historikern skrev att kungen {troligen|förmodligen|antagligen|sannolikt} aldrig [hade ]{förstått|insett|begripit} hur instabilt skeppet {egentligen|faktiskt} var."], feedback: [{ contains: "kungen hade", tip: "In de bijzin (na att) staan troligen en aldrig vóór het werkwoord: att kungen troligen aldrig hade förstått." }, { contains: "aldrig troligen", tip: "Bij meerdere bijwoorden: eerst troligen, dan aldrig." }, { contains: "instabilt var skeppet", tip: "Een indirecte vraag (na hur) heeft de volgorde van een bijzin: hur instabilt skeppet egentligen var." }] }
          - { id: 6c2j, type: translate, prompt: "Veel bezoekers zijn verbaasd als ze horen dat het schip eigenlijk niet in een storm is gezonken.", answers: ["Många besökare {blir|är} {förvånade|överraskade} {när|då} de hör att skeppet [{faktiskt|egentligen} ]inte sjönk {i|under} en storm.", "Många besökare {blir|är} {förvånade|överraskade} {när|då} de hör att skeppet [{faktiskt|egentligen} ]inte [har ]sjunkit {i|under} en storm."], feedback: [{ contains: ["sjönk inte", "har inte sjunkit", "sjönk faktiskt", "sjönk egentligen", "har faktiskt", "har egentligen"], tip: "In de bijzin (na att) staan faktiskt en inte vóór het werkwoord: att skeppet faktiskt inte sjönk." }] }
          - { id: qxet, type: translate, prompt: "De archeologen vertelden dat ze nog nooit zoveel vondsten op één plek hadden gedaan.", answers: ["Arkeologerna {berättade|sa|sade} att de aldrig {tidigare|förut} hade {hittat|gjort} så många fynd på {ett och samma ställe|ett enda ställe|en och samma plats|en enda plats|ett ställe|en plats}.", "Arkeologerna {berättade|sa|sade} att de aldrig {tidigare|förut} {hittat|gjort} så många fynd på {ett och samma ställe|ett enda ställe|en och samma plats|en enda plats|ett ställe|en plats}.", "Arkeologerna {berättade|sa|sade} att de aldrig [hade ]{hittat|gjort} så många fynd på {ett och samma ställe|ett enda ställe|en och samma plats|en enda plats|ett ställe|en plats} {tidigare|förut}."], feedback: [{ contains: ["de hade aldrig", "de har aldrig"], tip: "In de bijzin (na att) staat aldrig vóór het werkwoord: att de aldrig tidigare hade hittat …" }] }
          - { id: 4y4v, type: translate, prompt: "Het is jammer dat bezoekers niet meer aan boord mogen, maar het hout is veel te kwetsbaar.", answers: ["Det är synd att {besökarna|besökare} inte längre får {gå|komma|kliva} ombord men träet är {alldeles för|alltför} {känsligt|ömtåligt|skört}.", "Det är synd att {besökarna|besökare} inte får {gå|komma|kliva} ombord längre men träet är {alldeles för|alltför} {känsligt|ömtåligt|skört}."], feedback: [{ contains: ["får inte", "får längre"], tip: "In de bijzin (na att) staan inte en längre vóór het werkwoord: att besökarna inte längre får gå ombord." }] }
          - { id: 9eje, type: translate, prompt: "Pas toen het wrak eindelijk geborgen was, konden de onderzoekers nagaan waarom het schip eigenlijk was gezonken.", answers: ["Först när vraket äntligen hade bärgats kunde forskarna {undersöka|ta reda på|utreda} varför skeppet egentligen {sjönk|hade sjunkit}.", "Först när vraket äntligen {bärgats|var bärgat} kunde forskarna {undersöka|ta reda på|utreda} varför skeppet egentligen {sjönk|hade sjunkit}."], feedback: [{ contains: "forskarna kunde", tip: "De bijzin vooraan telt als plaats 1: daarna komt meteen het werkwoord (…, kunde forskarna …)." }, { contains: ["varför sjönk", "varför hade"], tip: "Een indirecte vraag (na varför) heeft de volgorde van een bijzin: varför skeppet egentligen sjönk." }] }

      - id: bisats-lange-zinnen
        title: Lange zinnen bouwen
        instruction: Zet de woorden in de goede volgorde. Let op de bijwoorden in de bijzin.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 8fb4, type: order, start: "Forskarna tror att", tokens: ["skeppet", "kanske", "aldrig", "hade", "sjunkit", "om", "kanonportarna", "inte", "hade", "varit", "öppna"], answers: ["Forskarna tror att skeppet kanske aldrig hade sjunkit om kanonportarna inte hade varit öppna.", "Forskarna tror att skeppet kanske inte hade sjunkit om kanonportarna aldrig hade varit öppna.", "Forskarna tror att om kanonportarna inte hade varit öppna hade skeppet kanske aldrig sjunkit.", "Forskarna tror att skeppet kanske aldrig hade sjunkit om inte kanonportarna hade varit öppna.", "Forskarna tror att om inte kanonportarna hade varit öppna hade skeppet kanske aldrig sjunkit.", "Forskarna tror att om kanonportarna aldrig hade varit öppna hade skeppet kanske inte sjunkit."], feedback: [{ contains: "skeppet hade", tip: "In de bijzin (na att) staan kanske en aldrig vóór het werkwoord: att skeppet kanske aldrig hade sjunkit." }] }
          - { id: he2v, type: order, start: "Det är förvånande att", tokens: ["kungen", "inte", "ens", "hade", "frågat", "om", "skeppet", "verkligen", "var", "stabilt"], answers: ["Det är förvånande att kungen inte ens hade frågat om skeppet verkligen var stabilt.", "Det är förvånande att inte ens kungen hade frågat om skeppet verkligen var stabilt."], feedback: [{ contains: "kungen hade inte", tip: "In de bijzin (na att) staat inte ens vóór het werkwoord: att kungen inte ens hade frågat." }, { contains: "var verkligen", tip: "Ook na om (of) volgt een bijzin: om skeppet verkligen var stabilt." }] }
          - { id: jtb6, type: order, start: "Eftersom", tokens: ["man", "inte", "längre", "kunde", "se", "var", "vraket", "låg", "glömde", "folk", "bort", "platsen"], answers: ["Eftersom man inte längre kunde se var vraket låg glömde folk bort platsen.", "Eftersom folk inte längre kunde se var vraket låg glömde man bort platsen."], feedback: [{ contains: ["folk glömde", "man glömde"], tip: "De bijzin met eftersom telt als plaats 1: daarna komt meteen het werkwoord (… glömde folk bort platsen)." }, { contains: "kunde inte", tip: "In de bijzin staan inte en längre vóór het werkwoord: eftersom man inte längre kunde se …" }] }
          - { id: 7gej, type: order, topic: fundament, start: "När skeppet väl hade sjunkit", tokens: ["ville", "ingen", "ta", "på", "sig", "ansvaret", "för", "olyckan"], answers: ["När skeppet väl hade sjunkit ville ingen ta på sig ansvaret för olyckan.", "När skeppet väl hade sjunkit ville ingen ta ansvaret för olyckan på sig.", "När skeppet väl hade sjunkit ville ingen ta ansvaret på sig för olyckan."], feedback: [{ contains: "sjunkit ingen", tip: "De bijzin met när telt als plaats 1: daarna komt meteen het werkwoord (… ville ingen …)." }] }
          - { id: z8se, type: order, start: "Kaptenen försäkrade att", tokens: ["besättningen", "inte", "hade", "druckit", "alkohol", "och", "att", "ingen", "egentligen", "hade", "gjort", "något", "fel"], answers: ["Kaptenen försäkrade att besättningen inte hade druckit alkohol och att ingen egentligen hade gjort något fel.", "Kaptenen försäkrade att besättningen inte hade druckit alkohol och att egentligen ingen hade gjort något fel.", "Kaptenen försäkrade att {ingen egentligen|egentligen ingen} hade gjort något fel och att besättningen inte hade druckit alkohol."], feedback: [{ contains: ["besättningen hade", "ingen hade egentligen"], tip: "In beide bijzinnen (na att) staan inte en egentligen vóór het werkwoord." }] }
          - { id: 2skb, type: order, start: "Hon frågade guiden om", tokens: ["man", "verkligen", "aldrig", "hade", "försökt", "segla", "med", "en", "kopia", "av", "Vasa"], answers: ["Hon frågade guiden om man verkligen aldrig hade försökt segla med en kopia av Vasa.", "Hon frågade guiden om man aldrig verkligen hade försökt segla med en kopia av Vasa."], feedback: [{ contains: "man hade", tip: "Na om (of) volgt een bijzin: verkligen en aldrig staan vóór het werkwoord." }] }

      - id: bisats-kiezen
