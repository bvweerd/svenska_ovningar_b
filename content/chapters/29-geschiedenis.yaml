  - id: bisats
    title: "Grammatik: lange bijzinnen"
    exercises:
      - id: bisats-zinsbouw
        title: Bijwoorden in de bijzin
        instruction: Zet de woorden in de goede volgorde.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: f7er, type: order, start: "Han sa att", tokens: ["han", "kanske", "inte", "längre", "ville", "segla"], answers: ["Han sa att han kanske inte längre ville segla."] }
          - { id: ur6r, type: order, start: "Det är synd att", tokens: ["vi", "aldrig", "har", "varit", "på Vasamuseet"], answers: ["Det är synd att vi aldrig har varit på Vasamuseet."] }
          - { id: wnxk, type: order, start: "Eftersom", tokens: ["skeppet", "redan", "var", "instabilt,", "sjönk", "det", "snabbt"], answers: ["Eftersom skeppet redan var instabilt, sjönk det snabbt."] }
          - { id: msvx, type: order, start: "Jag tror att", tokens: ["de", "nog", "inte", "hade", "märkt", "något"], answers: ["Jag tror att de nog inte hade märkt något."] }

      - id: bisats-omvormen
        title: Hoofdzin wordt bijzin
        instruction: Maak van de hoofdzin een bijzin na het gegeven begin.
        topic: bisats-adverb
        items:
          - { id: trmp, type: transform, prompt: "Kungen var inte i Stockholm.", task: "Vi vet att …", answers: ["Vi vet att kungen inte var i Stockholm."], feedback: [{ contains: "var inte", tip: "In de bijzin: inte vóór het werkwoord." }] }
          - { id: xvad, type: transform, prompt: "Han kom inte heller.", task: "Hon sa att …", answers: ["Hon sa att han inte heller kom."], feedback: [{ contains: "kom inte", tip: "In de bijzin: inte heller vóór het werkwoord." }] }
          - { id: z8a2, type: transform, prompt: "Skeppet var kanske för smalt.", task: "Forskarna tror att …", answers: ["Forskarna tror att skeppet kanske var för smalt."], feedback: [{ contains: "var kanske", tip: "In de bijzin: kanske vóór het werkwoord." }] }
          - { id: rjbc, type: transform, prompt: "Man hade redan märkt problemet.", task: "Det är känt att …", answers: ["Det är känt att man redan [hade ]märkt problemet."], feedback: [{ contains: "hade redan", tip: "In de bijzin: redan vóór het werkwoord." }] }

      - id: hade-weg
        title: Mag hade weg?
        instruction: In welke zin mag **hade** wegvallen?
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 4f77, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["När skeppet hade sjunkit, samlades folk vid stranden.", "Skeppet hade sjunkit på några minuter.", "Folk hade samlats vid stranden.", "Kungen hade beställt skeppet."], answer: 0, tip: "Alleen in een bijzin (hier na när)." }
          - { id: jwtr, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Han berättade att han hade hittat vraket.", "Han hade hittat vraket.", "Då hade han hittat vraket.", "Hade han hittat vraket?"], answer: 0, tip: "Alleen in een bijzin (hier na att)." }

      - id: pluskvamperfekt
        title: Voltooid verleden tijd
        instruction: Vul de vorm met **hade** in.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 6g4h, type: gap, text: "Vasa ___ (segla) bara 1 300 meter när det sjönk.", gaps: [{ answers: ["hade seglat"], feedback: [{ match: "seglade", tip: "Het zeilen was al gebeurd vóór het zinken: hade seglat." }] }] }
          - { id: hzj9, type: gap, text: "Man ___ (märka) redan före avfärden att skeppet var instabilt.", gaps: [{ answers: ["hade märkt"] }] }
          - { id: zwzg, type: gap, text: "Kungen ___ (beställa) skeppet några år tidigare.", gaps: [{ answers: ["hade beställt"], feedback: [{ match: "hade beställd", tip: "Na hade: het supinum, beställt." }] }] }
          - { id: 8ctz, type: gap, text: "När vraket ___ (hitta), började man planera bärgningen.", hint: "Lijdend: hade + supinum + s.", gaps: [{ answers: ["hade hittats", "hittats"] }] }

  - id: fundament
    title: "Grammatik: wat zet je vooraan?"
    exercises:
      - id: det-finns
        title: Begin met det
        instruction: Herschrijf de zin met **det** vooraan.
        topic: fundament
        items:
          - { id: 9yt3, type: transform, prompt: "En man står vid dörren.", answers: ["Det står en man vid dörren."] }
          - { id: 23te, type: transform, prompt: "Många turister finns på museet.", answers: ["Det finns många turister på museet."], feedback: [{ contains: "det finnas", tip: "Het werkwoord blijft in de presens: det finns." }] }
          - { id: t72f, type: transform, prompt: "Ett skepp ligger på botten.", answers: ["Det ligger ett skepp på botten."] }
          - { id: sy32, type: transform, prompt: "En vindby kom plötsligt.", answers: ["Det kom plötsligt en vindby.", "Det kom en vindby plötsligt."] }
          - { id: zuvv, type: transform, prompt: "Något konstigt hände i går.", answers: ["Det hände något konstigt {i går|igår}."] }

      - id: fundament-zinsbouw
        title: Tijd vooraan
        instruction: Zet de woorden in de goede volgorde. Let op V2.
        topic: fundament
        shuffle: true
        items:
          - { id: aafd, type: order, start: "År 1961", tokens: ["bärgades", "skeppet"], answers: ["År 1961 bärgades skeppet."] }
          - { id: 6ju4, type: order, start: "Under mer än trehundra år", tokens: ["låg", "Vasa", "kvar", "på botten"], answers: ["Under mer än trehundra år låg Vasa kvar på botten."] }
          - { id: t3hj, type: order, start: "I dag", tokens: ["kan", "man", "se", "skeppet", "på museet"], answers: ["I dag kan man se skeppet på museet."] }

      - id: bekend-nieuw
        title: Bekend vooraan
        instruction: Welke zin sluit het best aan op de vorige zin?
        topic: fundament
        shuffle: true
        items:
          - { id: numc, type: mc, prompt: "*Kungen beställde ett nytt krigsskepp.* …", options: ["Skeppet skulle bli världens mäktigaste.", "Världens mäktigaste skulle skeppet bli.", "Bli världens mäktigaste skulle skeppet.", "Mäktigaste i världen blev skeppet skulle."], answer: 0, tip: "Begin met wat al bekend is (skeppet)." }
          - { id: 6mnj, type: mc, prompt: "*1956 hittade en amatörforskare vraket.* …", options: ["Fem år senare bärgades det.", "Det bärgades, fem år senare, som skett.", "Bärgades fem år senare det.", "Senare fem år bärgades det."], answer: 0 }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-guide
        title: "Luisteren: de gids in het museum"
        instruction: Luister naar de gids. Is de bewering **rätt** of **fel**?
        topic: fundament
        listen: true
        textTitle: Välkomna till museet
        text: |
          Välkomna! Skeppet som ni ser framför er är till största delen original. Det har alltså legat på havets botten i över trehundra år.

          När vraket hade bärgats, började ett långt arbete med att bevara det. I sjutton år besprutades träet med ett speciellt konserveringsmedel, så att det inte skulle torka och spricka.

          Det finns fortfarande problem. Träet bryts långsamt ner, och därför är det alltid ganska mörkt och svalt här inne. Det är också därför som man inte får röra skeppet.
        items:
          - { id: ges2, type: truefalse, statement: "Skeppet är till största delen original.", answer: true }
          - { id: 9fwb, type: truefalse, statement: "Träet besprutades i sju år.", answer: false, correction: { answers: ["{Träet|Det} besprutades i sjutton år."] } }
          - { id: y4z7, type: truefalse, statement: "Det är varmt och ljust i museet.", answer: false, correction: { answers: ["Det är [alltid ]ganska mörkt och svalt.", "Det är [alltid ]ganska mörkt och svalt {i museet|här inne}."] } }
          - { id: skws, type: truefalse, statement: "Man får inte röra skeppet.", answer: true }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en schrijf de zin op.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 4zxx, type: listen, say: "År sextonhundratjugoåtta sjönk Vasa.", answers: ["År {1628|sextonhundratjugoåtta} sjönk Vasa."] }
          - { id: ryke, type: listen, say: "Det kom plötsligt en vindby." }
          - { id: s7w5, type: listen, say: "Han sa att han kanske inte längre ville segla." }
          - { id: 3dsy, type: listen, say: "När vraket hade bärgats började arbetet." }

  - id: praktiskt
    title: Praktiskt · een verhaal vertellen
    exercises:
      - id: berattarfraser
        title: Een verhaal opbouwen
        instruction: Kies wat past.
        topic: fundament
        shuffle: true
        items:
          - { id: 3wr8, type: mc, prompt: "Je begint een verhaal.", options: ["Det hela började med att …", "Det hela slutade med att …", "Till slut började det …", "Efteråt började det …"], answer: 0 }
          - { id: wr5b, type: mc, prompt: "Er gebeurt iets onverwachts.", options: ["Plötsligt hände något oväntat.", "Långsamt hände något oväntat.", "Som vanligt hände något oväntat.", "Oväntat hände plötsligt vanligt."], answer: 0 }
          - { id: amxq, type: mc, prompt: "Je vertelt hoe het afliep.", options: ["Till slut …", "Först …", "Det hela började med …", "Plötsligt …"], answer: 0 }
          - { id: 4jft, type: mc, prompt: "Je springt naar veel later.", options: ["Mer än trehundra år senare …", "Trehundra år tidigare senare …", "Efter trehundra år förut …", "Trehundra senare år …"], answer: 0 }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een verhalende tekst."
    exercises:
      - id: skriva-historia
        title: Vertel een gebeurtenis
        instruction: Schrijf een verhalende tekst.
        topic: fundament
        items:
          - id: ksav
            type: free
            prompt: "Vertel over een historische gebeurtenis uit Nederland of België (bijvoorbeeld de watersnood van 1953 of de bouw van de Afsluitdijk), of over een gebeurtenis uit je familie. Schrijf 120–160 woorden. Gebruik de verleden tijd, minstens één keer **hade** + supinum, tijdsbepalingen vooraan en een zin met **det** + werkwoord (*det kom, det fanns …*)."
            minWords: 110
            require:
              - { any: ["hade"], label: "Je gebruikt hade + supinum" }
              - { any: ["år", "den", "på"], label: "Je noemt een tijd" }
              - { any: ["det kom", "det fanns", "det var", "det hände", "det stod", "det låg"], label: "Je gebruikt det + werkwoord" }
              - { any: ["plötsligt", "till slut", "först", "sedan", "senare"], label: "Je gebruikt verteltijdwoorden" }
            model: "Natten mellan den 31 januari och den 1 februari 1953 drabbades sydvästra Nederländerna av en katastrof. Det hade stormat hela dagen, och på natten steg vattnet snabbare än någon hade räknat med. Plötsligt brast vallarna på flera ställen. Det fanns ingen tid att varna alla, eftersom många byar inte hade telefon. Mer än 1 800 människor omkom, och tusentals djur drunknade. Många familjer förlorade allt de ägde. Efter katastrofen bestämde regeringen att något måste göras. Under de följande decennierna byggdes Deltaverken, ett av världens största system av dammar och slussar. I dag kan man besöka ett museum i Zeeland, där man berättar om natten då havet kom."

