  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-guide
        title: "Luisteren: de gids in het museum"
        instruction: Luister naar de gids. Is de bewering **rätt** of **fel**?
        topic: fundament
        listen: true
        textTitle: Välkomna till museet
        text: |
          Välkomna! Skeppet som ni ser framför er är till största delen original. Det har alltså legat på havets botten i över trehundra år.

          När vraket hade bärgats, började ett långt arbete med att bevara det. I sjutton år besprutades träet med ett speciellt konserveringsmedel, så att det inte skulle torka och spricka.

          Det finns fortfarande problem. Träet bryts långsamt ner, och därför är det alltid ganska mörkt och svalt här inne. Det är också därför som man inte får röra skeppet.
        items:
          - { id: ges2, type: truefalse, statement: "Skeppet är till största delen original.", answer: true }
          - { id: 9fwb, type: truefalse, statement: "Träet besprutades i sju år.", answer: false, correction: { answers: ["{Träet|Det} besprutades i sjutton år."] } }
          - { id: y4z7, type: truefalse, statement: "Det är varmt och ljust i museet.", answer: false, correction: { answers: ["Det är [alltid ]ganska mörkt och svalt.", "Det är [alltid ]ganska mörkt och svalt {i museet|här inne}."] } }
          - { id: skws, type: truefalse, statement: "Man får inte röra skeppet.", answer: true }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en maak de zin die je hoort.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 4zxx, type: listen, say: "År sextonhundratjugoåtta sjönk Vasa.", answers: ["År {1628|sextonhundratjugoåtta} sjönk Vasa."] }
          - { id: ryke, type: listen, say: "Det kom plötsligt en vindby." }
          - { id: s7w5, type: listen, say: "Han sa att han kanske inte längre ville segla." }
          - { id: 3dsy, type: listen, say: "När vraket hade bärgats började arbetet." }

