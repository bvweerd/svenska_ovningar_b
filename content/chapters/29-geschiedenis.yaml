chapter: 29
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik zet zinsbijwoorden in lange bijzinnen op de goede plek", topics: [bisats-adverb] }
  - { text: "Ik kies bewust wat ik vooraan in de zin zet", topics: [fundament] }

grammar:
  - id: bisats-adverb
    title: Lange bijzinnen
    summary: "In een bijzin staan **alle** zinsbijwoorden vóór het werkwoord: *att han **kanske inte längre** ville segla*. In een hoofdzin staan ze ná het werkwoord: *Han ville **kanske inte längre** segla.* In geschreven Zweeds mag **hade** (en ook **har**) in een bijzin wegvallen: *när skeppet (hade) sjunkit*."
    body: |
      ### Meerdere bijwoorden
      Zinsbijwoorden zoals *inte, aldrig, kanske, nog, ju, redan, längre, heller, alltid* staan:

      - in de **hoofdzin** na het vervoegde werkwoord: *Han **ville** kanske inte längre segla.*
      - in de **bijzin** vóór het vervoegde werkwoord: *… att han kanske inte längre **ville** segla.*

      Staan er meerdere, dan meestal in deze volgorde: **ju / nog / kanske** → **inte / aldrig** → **längre / heller / alltid**:

      - *eftersom de **nog inte** hade märkt något*
      - *att hon **inte heller** kom*
      - *om man **kanske aldrig** får veta sanningen*

      ### Hade (en har) mag wegvallen
      In een **bijzin** in de voltooid verleden tijd laten Zweden in geschreven taal vaak *hade* weg:

      - *När skeppet **(hade) sjunkit**, samlades folk vid stranden.*
      - *Han berättade att han **(hade) hittat** vraket.*

      Dat geldt ook voor **har** in de voltooid tegenwoordige tijd: *Jag är glad att du **(har) kommit**.*

      In de **hoofdzin** mag dat niet: *Skeppet **hade** sjunkit.*

  - id: fundament
    title: Wat zet je vooraan?
    summary: "Vooraan staat wat al **bekend** is of de **tijd/plaats**; nieuwe informatie komt achteraan: *År 1961 bärgades skeppet.* Een nieuw, onbepaald onderwerp introduceer je met **det**: *Det står en man vid dörren. Det kom plötsligt en vindby.*"
    body: |
      Het eerste zinsdeel (*fundamentet*) mag bijna alles zijn, zolang het werkwoord op plaats 2 staat (V2). Welke keuze klinkt goed?

      - **Tijd of plaats** vooraan is heel gewoon in verhalen: ***År 1628** sjönk Vasa. **I dag** kan man se skeppet på museet.*
      - Begin met wat **al bekend** is uit de vorige zin, en eindig met het **nieuwe**: *Vasa beställdes av kungen. **Skeppet** skulle bli världens mäktigaste.*
      - Een **lang onderwerp** zet je liever niet vooraan.

      ### Det + werkwoord + nieuw onderwerp
      Is het onderwerp **nieuw en onbepaald** (*en man, många turister*), dan begin je vaak met **det** (presentatieconstructie). Typische werkwoorden: *finnas, stå, sitta, ligga, komma, hända*.

      | minder natuurlijk | natuurlijk |
      |---|---|
      | *En man står vid dörren.* | ***Det står** en man vid dörren.* |
      | *Många turister finns på museet.* | ***Det finns** många turister på museet.* |
      | *En vindby kom plötsligt.* | ***Det kom** plötsligt en vindby.* |

      Zweedse werkwoorden hebben geen meervoudsvorm, dus *det finns* blijft gewoon *det finns*. Let op het verschil met het Nederlands, waar *er is* bij meervoud *er zijn* wordt: *Det **finns** många turister.* = Er **zijn** veel toeristen.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-vasa
        title: "Lezen: de Vasa"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: fundament
        textTitle: Vasa – skeppet som sjönk på jungfruresan
        text: |
          Den 10 augusti 1628 samlades tusentals stockholmare vid stranden. Det nya krigsskeppet Vasa, som kung Gustav II Adolf hade beställt några år tidigare, skulle för första gången segla ut. Kungen var själv inte på plats, eftersom han befann sig i krig i Polen.

          Vasa hade bara seglat omkring 1 300 meter när det plötsligt kom en vindby. Skeppet lutade, vatten forsade in genom de öppna kanonportarna, och inom några minuter hade det stolta skeppet sjunkit. Omkring trettio människor omkom.

          Varför sjönk Vasa? Redan före avfärden hade man märkt att skeppet var instabilt, men ingen vågade stoppa projektet, eftersom kungen ville att skeppet skulle bli klart så snabbt som möjligt.

          Under mer än trehundra år låg Vasa kvar på botten. Först 1956 hittades vraket, och 1961 bärgades det. I dag kan man se skeppet på Vasamuseet i Stockholm, som har blivit ett av Sveriges mest besökta museer.
        items:
          - { id: baxz, type: mc, prompt: "När sjönk Vasa?", options: ["den 10 augusti 1628", "år 1956", "år 1961", "den 10 augusti 1728"], answer: 0 }
          - { id: fj3p, type: truefalse, statement: "Kungen såg när skeppet sjönk.", answer: false, correction: { answers: ["Kungen var inte på plats[ eftersom han var i krig i Polen].", "{Kungen|Han} var i Polen."] } }
          - { id: fbq6, type: mc, prompt: "Hur långt hade Vasa seglat?", options: ["omkring 1 300 meter", "omkring 13 kilometer", "till Polen", "några hundra meter ut på havet"], answer: 0 }
          - { id: sj3k, type: mc, prompt: "Hur kom vattnet in?", options: ["genom de öppna kanonportarna", "genom ett hål i botten", "över däcket", "genom fönstren"], answer: 0 }
          - { id: 5bnu, type: truefalse, statement: "Man visste inte före avfärden att skeppet var instabilt.", answer: false, correction: { answers: ["Man hade [redan ]märkt att skeppet var instabilt[ före avfärden]."] } }
          - { id: 7rvp, type: mc, prompt: "När bärgades Vasa?", options: ["1961", "1956", "1628", "1990"], answer: 0 }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-geschiedenis
        title: Geschiedenis
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: sc9w
            type: match
            pairs:
              - ["ett krig", "een oorlog"]
              - ["ett vrak", "een wrak"]
              - ["bärga", "bergen (een schip)"]
              - ["omkomma", "omkomen"]
              - ["en jungfruresa", "een eerste reis (van een schip)"]
              - ["en avfärd", "een vertrek"]
          - id: pzz5
            type: match
            pairs:
              - ["ett århundrade", "een eeuw"]
              - ["medeltiden", "de middeleeuwen"]
              - ["en kung", "een koning"]
              - ["en drottning", "een koningin"]
              - ["befinna sig", "zich bevinden"]
              - ["våga", "durven"]

  - id: bisats
    title: "Grammatik: lange bijzinnen"
    exercises:
      - id: bisats-zinsbouw
        title: Bijwoorden in de bijzin
        instruction: Zet de woorden in de goede volgorde.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: f7er, type: order, start: "Han sa att", tokens: ["han", "kanske", "inte", "längre", "ville", "segla"], answers: ["Han sa att han kanske inte längre ville segla."] }
          - { id: ur6r, type: order, start: "Det är synd att", tokens: ["vi", "aldrig", "har", "varit", "på Vasamuseet"], answers: ["Det är synd att vi aldrig har varit på Vasamuseet."] }
          - { id: wnxk, type: order, start: "Eftersom", tokens: ["skeppet", "redan", "var", "instabilt,", "sjönk", "det", "snabbt"], answers: ["Eftersom skeppet redan var instabilt, sjönk det snabbt."] }
          - { id: msvx, type: order, start: "Jag tror att", tokens: ["de", "nog", "inte", "hade", "märkt", "något"], answers: ["Jag tror att de nog inte hade märkt något."] }
          - { id: 8vh8, type: order, start: "Hon sa att", tokens: ["hon", "tyvärr", "inte", "kunde", "komma"], answers: ["Hon sa att hon tyvärr inte kunde komma."] }
          - { id: mabx, type: order, start: "Vi vet att", tokens: ["kungen", "aldrig", "såg", "skeppet", "segla"], answers: ["Vi vet att kungen aldrig såg skeppet segla."] }
          - { id: a2tm, type: order, start: "Det är märkligt att", tokens: ["ingen", "hade", "varnat", "kungen"], answers: ["Det är märkligt att ingen hade varnat kungen."] }
          - { id: k6xj, type: order, start: "Jag undrar om", tokens: ["de", "verkligen", "förstod", "riskerna"], answers: ["Jag undrar om de verkligen förstod riskerna."] }

      - id: bisats-omvormen
        title: Hoofdzin wordt bijzin
        instruction: Maak van de hoofdzin een bijzin na het gegeven begin.
        topic: bisats-adverb
        items:
          - { id: trmp, type: transform, prompt: "Kungen var inte i Stockholm.", task: "Vi vet att …", answers: ["Vi vet att kungen inte var i Stockholm."], feedback: [{ contains: "var inte", tip: "In de bijzin: inte vóór het werkwoord." }] }
          - { id: xvad, type: transform, prompt: "Han kom inte heller.", task: "Hon sa att …", answers: ["Hon sa att han inte heller kom."], feedback: [{ contains: "kom inte", tip: "In de bijzin: inte heller vóór het werkwoord." }] }
          - { id: z8a2, type: transform, prompt: "Skeppet var kanske för smalt.", task: "Forskarna tror att …", answers: ["Forskarna tror att skeppet kanske var för smalt."], feedback: [{ contains: "var kanske", tip: "In de bijzin: kanske vóór het werkwoord." }] }
          - { id: rjbc, type: transform, prompt: "Man hade redan märkt problemet.", task: "Det är känt att …", answers: ["Det är känt att man redan [hade ]märkt problemet."], feedback: [{ contains: "hade redan", tip: "In de bijzin: redan vóór het werkwoord." }] }
          - { id: vmwp, type: transform, prompt: "Skeppet sjönk inte på grund av stormen.", task: "Man vet att …", answers: ["Man vet att skeppet inte sjönk på grund av stormen."], feedback: [{ contains: "sjönk inte", tip: "In de bijzin: inte vóór het werkwoord." }] }
          - { id: aqym, type: transform, prompt: "Kungen ville alltid ha det största skeppet.", task: "Det sägs att …", answers: ["Det sägs att kungen alltid ville ha det största skeppet."], feedback: [{ contains: "ville alltid", tip: "In de bijzin: alltid vóór het werkwoord." }] }
          - { id: 25df, type: transform, prompt: "Hon har aldrig besökt museet.", task: "Hon berättade att …", answers: ["Hon berättade att hon aldrig [{hade|har} ]besökt museet."], feedback: [{ contains: ["hade aldrig", "har aldrig"], tip: "In de bijzin: aldrig vóór het werkwoord." }] }
          - { id: h67m, type: transform, prompt: "Vi kan tyvärr inte komma.", task: "Vi skrev att …", answers: ["Vi skrev att vi tyvärr inte {kunde|kan} komma."], feedback: [{ contains: ["kunde tyvärr", "kan tyvärr"], tip: "In de bijzin: tyvärr inte vóór het werkwoord." }] }

      - id: hade-weg
        title: Mag hade weg?
        instruction: In welke zin mag **hade** wegvallen?
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 4f77, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["När skeppet hade sjunkit, samlades folk vid stranden.", "Skeppet hade sjunkit på några minuter.", "Folk hade samlats vid stranden.", "Kungen hade beställt skeppet."], answer: 0, tip: "Alleen in een bijzin (hier na när)." }
          - { id: jwtr, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Han berättade att han hade hittat vraket.", "Han hade hittat vraket.", "Då hade han hittat vraket.", "Hade han hittat vraket?"], answer: 0, tip: "Alleen in een bijzin (hier na att)." }
          - { id: eegs, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Eftersom de hade glömt nyckeln, kom de inte in.", "De hade glömt nyckeln.", "Hade de glömt nyckeln?", "Då hade de glömt nyckeln."], answer: 0, tip: "Alleen in een bijzin (hier na eftersom)." }
          - { id: hdub, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Jag vet att hon hade läst boken.", "Hon hade läst boken.", "Boken hade hon läst.", "Hade hon läst boken?"], answer: 0, tip: "Alleen in een bijzin (hier na att)." }
          - { id: ckw6, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Om jag hade vetat det, skulle jag ha kommit.", "Jag hade vetat det.", "Det hade jag vetat.", "Hade jag vetat det?"], answer: 0, tip: "Alleen in een bijzin (hier na om)." }
          - { id: n8pu, type: mc, prompt: "Kies de zin waarin *hade* mag wegvallen.", options: ["Skeppet som hade byggts i Stockholm sjönk.", "Skeppet hade byggts i Stockholm.", "I Stockholm hade skeppet byggts.", "Hade skeppet byggts i Stockholm?"], answer: 0, tip: "Alleen in een bijzin (hier een som-zin)." }
          - { id: wy3k, type: mc, prompt: "Kies de zin waarin *hade* **niet** mag wegvallen.", options: ["Han hade redan ätit.", "När han hade ätit, gick han.", "Hon sa att han hade ätit.", "Eftersom han hade ätit, var han mätt."], answer: 0, tip: "In een hoofdzin moet hade blijven staan." }
          - { id: kv6w, type: mc, prompt: "Kies de zin waarin *hade* **niet** mag wegvallen.", options: ["Vi hade aldrig sett något liknande.", "Vi sa att vi aldrig hade sett något liknande.", "Fast vi hade sett det förut, blev vi förvånade.", "Det var något som vi aldrig hade sett."], answer: 0, tip: "In een hoofdzin moet hade blijven staan." }

      - id: pluskvamperfekt
        title: Voltooid verleden tijd
        instruction: Vul de vorm met **hade** in.
        topic: bisats-adverb
        shuffle: true
        items:
          - { id: 6g4h, type: gap, text: "Vasa ___ (segla) bara 1 300 meter när det sjönk.", gaps: [{ answers: ["hade seglat"], feedback: [{ match: "seglade", tip: "Het zeilen was al gebeurd vóór het zinken: hade seglat." }] }] }
          - { id: hzj9, type: gap, text: "Man ___ (märka) redan före avfärden att skeppet var instabilt.", gaps: [{ answers: ["hade märkt"] }] }
          - { id: zwzg, type: gap, text: "Kungen ___ (beställa) skeppet några år tidigare.", gaps: [{ answers: ["hade beställt"], feedback: [{ match: "hade beställd", tip: "Na hade: het supinum, beställt." }] }] }
          - { id: 8ctz, type: gap, text: "När vraket ___ (hitta), började man planera bärgningen.", hint: "Lijdend: hade + supinum + s.", gaps: [{ answers: ["hade hittats", "hittats"] }] }
          - { id: 2urw, type: gap, text: "Bussen ___ redan ___ (gå) när vi kom fram.", gaps: [{ answers: ["hade"] }, { answers: ["gått"], feedback: [{ match: "gåt", tip: "Supinum van gå: gått." }] }] }
          - { id: pk2k, type: gap, text: "Hon ___ (bo) i Göteborg i tio år innan hon flyttade.", gaps: [{ answers: ["hade bott"], feedback: [{ match: "bodde", tip: "Het wonen ging vooraf aan het verhuizen: hade bott." }] }] }
          - { id: wmrr, type: gap, text: "Vi ___ aldrig ___ (se) något liknande.", gaps: [{ answers: ["hade"] }, { answers: ["sett"] }] }
          - { id: dmq5, type: gap, text: "Skeppet ___ (bygga) i Stockholm innan det sjösattes.", hint: "Lijdend: hade + supinum + s.", gaps: [{ answers: ["hade byggts"], feedback: [{ match: "byggdes", tip: "Het bouwen ging vooraf aan de tewaterlating: hade byggts." }] }] }

  - id: fundament
    title: "Grammatik: wat zet je vooraan?"
    exercises:
      - id: bekend-nieuw
        title: Bekend vooraan
        instruction: Welke zin sluit het best aan op de vorige zin?
        topic: fundament
        shuffle: true
        items:
          - { id: numc, type: mc, prompt: "*Kungen beställde ett nytt krigsskepp.* …", options: ["Skeppet skulle bli världens mäktigaste.", "Världens mäktigaste skulle skeppet bli.", "Bli världens mäktigaste skulle skeppet.", "Mäktigaste i världen blev skeppet skulle."], answer: 0, tip: "Begin met wat al bekend is (skeppet)." }
          - { id: 6mnj, type: mc, prompt: "*1956 hittade en amatörforskare vraket.* …", options: ["Fem år senare bärgades det.", "Det bärgades, fem år senare, som skett.", "Bärgades fem år senare det.", "Senare fem år bärgades det."], answer: 0 }
          - { id: hcpb, type: mc, prompt: "*På museet finns en modell av skeppet.* …", options: ["Modellen är byggd i skala 1:10.", "I skala 1:10 är byggd modellen.", "Byggd i skala 1:10 är modellen den.", "Är modellen byggd i skala 1:10."], answer: 0 }
          - { id: 6qzv, type: mc, prompt: "*Vasa sjönk i augusti 1628.* …", options: ["I olyckan dog ett trettiotal människor.", "Ett trettiotal människor i olyckan dog.", "I olyckan ett trettiotal människor dog.", "Dog i olyckan ett trettiotal människor."], answer: 0, tip: "Begin met wat al bekend is (de ramp) en zet het nieuwe achteraan." }
          - { id: 2qjn, type: mc, prompt: "*Skeppet bärgades 1961.* …", options: ["Sedan dess har det restaurerats.", "Restaurerats har det sedan dess.", "Sedan dess det har restaurerats.", "Det sedan dess har restaurerats."], answer: 0 }
          - { id: s77q, type: mc, prompt: "*Kungen hette Gustav II Adolf.* …", options: ["Han var i Polen när skeppet sjönk.", "I Polen han var när skeppet sjönk.", "När skeppet sjönk han var i Polen.", "Var han i Polen när skeppet sjönk."], answer: 0 }
          - { id: 6qt4, type: mc, prompt: "*Många turister besöker Vasamuseet.* …", options: ["Museet är ett av Stockholms populäraste.", "Ett av Stockholms populäraste museet är.", "Populäraste av Stockholms är museet ett.", "Är museet ett av Stockholms populäraste."], answer: 0 }
          - { id: zg76, type: mc, prompt: "*Forskarna har undersökt vraket noga.* …", options: ["Deras slutsats är att skeppet var för smalt.", "Att skeppet var för smalt deras slutsats är.", "Slutsatsen deras är att skeppet var för smalt.", "Är deras slutsats att skeppet var för smalt."], answer: 0 }

      - id: det-finns
        title: Begin met det
        instruction: Herschrijf de zin met **det** vooraan.
        topic: fundament
        items:
          - { id: 9yt3, type: transform, prompt: "En man står vid dörren.", answers: ["Det står en man vid dörren."] }
          - { id: 23te, type: transform, prompt: "Många turister finns på museet.", answers: ["Det finns många turister på museet."], feedback: [{ contains: "det finnas", tip: "Het werkwoord blijft in de presens: det finns." }] }
