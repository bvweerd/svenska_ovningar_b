      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat je zegt.
        topic: partikelverb-2
        shuffle: true
        items:
          - { id: nrg5, type: mc, prompt: "Je wilt je kaartje omboeken.", options: ["Kan jag boka om min biljett?", "Kan jag boka in min biljett?", "Kan jag boka av min biljett?", "Kan jag boka upp min biljett?"], answer: 0 }
          - { id: 6tzy, type: mc, prompt: "Je wilt weten waar je moet overstappen.", options: ["Var ska jag byta?", "Var ska jag stiga på?", "Var ska jag komma fram?", "Var ska jag åka om?"], answer: 0 }
          - { id: s9fh, type: mc, prompt: "Je wilt compensatie voor de vertraging.", options: ["Jag vill ansöka om ersättning för förseningen.", "Jag vill betala för förseningen.", "Jag vill boka en försening.", "Jag vill hinna med förseningen."], answer: 0 }

      - id: taak-trein-geschrapt
        title: "Taak: je trein is geschrapt"
        instruction: "Je staat op het centraal station van Stockholm. Je trein naar Göteborg van 14.10 is net geschrapt, en je moet vóór zeven uur 's avonds in Göteborg zijn voor een bruiloft. **Doel:** laat je kaartje omboeken naar een trein die op tijd aankomt, vraag naar een vergoeding en zorg dat je de trein haalt. Kies of schrijf bij elke stap wat jij zegt."
        topic: partikelverb-2
        items:
          - id: 57vw
            type: steps
            explain: "Gelukt: je zit in de trein van 15.20, die om 18.30 in Göteborg is, en je kunt via de website een vergoeding aanvragen."
            steps:
              - type: mc
                topic: partikelverb-2
                prompt: "**Personalen:** Hej, vad kan jag hjälpa till med? — *Vertel wat er is en vraag om je kaartje om te boeken.*"
                options:
                  - "Hej! Mitt tåg till Göteborg är inställt. Kan jag boka om biljetten?"
                  - "Hej! Mitt tåg till Göteborg är ställt in. Kan jag boka om biljetten?"
                  - "Hej! Mitt tåg till Göteborg är inställd. Kan jag boka om biljetten?"
                  - "Hej! Mitt tåg till Göteborg är inställt. Kan jag boka in biljetten?"
                answer: 0
                optionTips:
                  - null
                  - "Als deelwoord komt het partikel vooraan en plak je het eraan: *ställa in → inställt*."
                  - "*tåg* is een ett-woord, dus het deelwoord krijgt -t: *tåget är inställt*."
                  - "Omboeken is *boka om*. *Boka in* gebruik je voor iets nieuws inplannen."
              - type: translate
                topic: partikelverb-2
                prompt: "Personalen: Absolut. Det går ett tåg klockan 15.20 och ett klockan 16.05. — Vraag: Wanneer komt de trein van 15.20 aan in Göteborg?"
                answers:
                  - "{När|Hur dags|Vilken tid} kommer tåget {{klockan|kl.} 15.20|som {går|avgår} [klockan ]15.20} fram [till Göteborg]?"
                  - "{När|Hur dags|Vilken tid} är tåget {{klockan|kl.} 15.20|som {går|avgår} [klockan ]15.20} framme [i Göteborg]?"
                  - "{När|Hur dags|Vilken tid} kommer 15.20-tåget fram [till Göteborg]?"
                  - "{När|Hur dags|Vilken tid} är 15.20-tåget framme [i Göteborg]?"
                  - "{När|Hur dags|Vilken tid} anländer tåget {{klockan|kl.} 15.20|som {går|avgår} [klockan ]15.20} [till Göteborg]?"
                feedback:
                  - { contains: "kommer fram tåget", tip: "In een vraag komt het onderwerp tussen werkwoord en partikel: *När kommer **tåget** fram?*" }
              - type: gap
                topic: sambandsord
                prompt: "**Personalen:** Det är framme i Göteborg 18.30. Tåget klockan 16.05 kommer fram först 19.15. — *Je kiest de trein van 15.20.*"
                text: "Då tar jag tåget klockan 15.20, ___ jag måste vara i Göteborg före sju."
                gaps:
                  - answers: ["eftersom"]
                    options: ["eftersom", "därför", "dessutom", "ändå"]
                    feedback:
