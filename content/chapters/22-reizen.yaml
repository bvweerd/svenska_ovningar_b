              - { contains: "är ställt in", tip: "Als deelwoord komt het partikel vooraan: *inställt*." }
              - { contains: "så måste vi", tip: "Na het voegwoord *så* (= dus) geen inversie: *så vi måste*." }
          - id: eqw7
            type: translate
            prompt: "Waar moeten we uitstappen als we naar het hotel willen?"
