              - ["köra om", "inhalen"]
          - id: 43sv
            type: match
            pairs:
              - ["en försening", "een vertraging"]
              - ["ett spår", "een spoor (spoornummer)"]
              - ["en avgång", "een vertrek"]
              - ["en ankomst", "een aankomst"]
              - ["ett byte", "een overstap"]
              - ["ersättning", "vergoeding, compensatie"]

      - id: ord-alle-woorden
        title: "Woorden in een zin: de rest van de lijst"
