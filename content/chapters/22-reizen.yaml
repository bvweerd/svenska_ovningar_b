          - { id: dj5f, type: translate, prompt: "Mijn vrienden in Uppsala hebben me uitgenodigd voor hun midzomerfeest.", answers: ["Mina {vänner|kompisar} i Uppsala har {bjudit in mig|bjudit mig} till sin midsommarfest."], feedback: [{ contains: "deras midsommarfest", tip: "Het eigen feest van het onderwerp (*mina vänner*): *sin midsommarfest*." }] }

  - id: sambandsord
    title: "Grammatik: verbindingswoorden"
    exercises:
      - id: samband-sorteren
        title: Inversie of niet?
        instruction: Komt er na het woord vooraan in de zin **inversie** (werkwoord vóór onderwerp)?
        topic: sambandsord
        items:
          - id: xswn
            type: sort
            categories: ["inversie: Därför kom vi …", "geen inversie: … så vi kom"]
            items:
              - { text: "därför", cat: 0 }
              - { text: "och", cat: 1 }
              - { text: "dessutom", cat: 0 }
              - { text: "men", cat: 1 }
              - { text: "ändå", cat: 0 }
              - { text: "så (= dus)", cat: 1 }
              - { text: "sedan", cat: 0 }
              - { text: "eller", cat: 1 }

      - id: samband-kiezen
        title: Het goede verbindingswoord
        instruction: Kies het woord dat past.
        topic: sambandsord
        shuffle: true
        items:
          - { id: eyfk, type: gap, text: "Tåget var försenat. ___ missade vi bussen.", gaps: [{ answers: ["Därför"], options: ["Därför", "Dessutom", "Däremot"], shuffle: false }] }
          - { id: tq2e, type: gap, text: "Hotellet var dyrt. ___ var det smutsigt.", gaps: [{ answers: ["Dessutom"], options: ["Därför", "Dessutom", "Däremot"], shuffle: false }] }
          - { id: jfkt, type: gap, text: "Tåget var försenat, ___ vi missade bussen.", gaps: [{ answers: ["så"], options: ["så", "därför", "dessutom"], shuffle: false, feedback: [{ match: ["därför", "dessutom"], tip: "Na een komma met gewone woordvolgorde (vi missade): het voegwoord så." }] }] }
          - { id: 8byx, type: gap, text: "Bussen var full. Tåget ___ var nästan tomt.", gaps: [{ answers: ["däremot"], options: ["däremot", "därför", "dessutom"], shuffle: false, tip: "Een tegenstelling: däremot." }] }
          - { id: 4mcn, type: gap, text: "Det regnade hela veckan. ___ hade vi roligt.", gaps: [{ answers: ["Ändå"], options: ["Ändå", "Därför", "Dessutom"], shuffle: false, tip: "Toch: ändå." }] }
          - { id: c54n, type: gap, text: "___ åkte vi till Kiruna, och sedan vidare till Abisko.", gaps: [{ answers: ["Först"], options: ["Först", "Till slut", "Däremot"], shuffle: false }] }
          - { id: h56y, type: gap, text: "Jag gillar att resa med tåg. Min man ___ föredrar flyg.", gaps: [{ answers: ["däremot"], options: ["däremot", "därför", "dessutom"], shuffle: false, tip: "Een tegenstelling: däremot." }] }
          - { id: zjmy, type: gap, text: "Vi åt middag och gick på museum. ___ åkte vi hem.", gaps: [{ answers: ["Till slut"], options: ["Till slut", "Däremot", "Dessutom"], shuffle: false }] }

      - id: samband-zinsbouw
        title: Let op de woordvolgorde
        instruction: Zet de woorden in de goede volgorde.
        topic: sambandsord
        shuffle: true
        items:
          - { id: vwdq, type: order, start: "Därför", tokens: ["kom", "vi", "fram", "sent"], answers: ["Därför kom vi fram sent."] }
          - { id: peev, type: order, start: "Dessutom", tokens: ["hade", "vi", "missat", "bussen"], answers: ["Dessutom hade vi missat bussen."] }
          - { id: 7jtb, type: order, start: "Tåget var sent, så", tokens: ["vi", "missade", "bussen"], answers: ["Tåget var sent, så vi missade bussen."] }
          - { id: xdqr, type: order, start: "Till slut", tokens: ["kom", "vi", "fram", "till Abisko"], answers: ["Till slut kom vi fram till Abisko."] }
          - { id: 4u9b, type: order, start: "Vi kom sent eftersom", tokens: ["tåget", "inte", "gick", "i tid"], answers: ["Vi kom sent eftersom tåget inte gick i tid."] }
          - { id: e9cj, type: order, start: "Däremot", tokens: ["var", "hotellet", "billigt"], answers: ["Däremot var hotellet billigt."] }
          - { id: 4eyy, type: order, start: "Ändå", tokens: ["hade", "vi", "en fin resa"], answers: ["Ändå hade vi en fin resa."] }
          - { id: s5rk, type: order, start: "Först", tokens: ["åkte", "vi", "till Stockholm"], answers: ["Först åkte vi till Stockholm."] }

      - id: samband-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds. Let op de woordvolgorde na het verbindingswoord.
        topic: sambandsord
        shuffle: true
        items:
          - id: akur
            type: translate
            prompt: "Het hotel was duur. Bovendien was de kamer klein en vies."
            answers: ["Hotellet var dyrt. Dessutom var rummet {litet|smått} och smutsigt."]
            feedback:
              - { contains: "dessutom rummet", tip: "Na *dessutom* vooraan: inversie, *dessutom var rummet*." }
              - { contains: "rummet var liten", tip: "*rum* is een ett-woord: *litet*." }
          - id: r79y
            type: translate
            prompt: "Het vliegtuig was vertraagd, dus we hebben de laatste bus naar het hotel gemist."
            answers: ["{Flyget|Planet} {var|blev} försenat, så vi {missade|har missat} {den sista bussen|sista bussen} till hotellet."]
            feedback:
              - { contains: "så missade vi", tip: "Na het voegwoord *så* (= dus) geen inversie: *så vi missade*." }
              - { contains: "var försenad", tip: "*flyg* is een ett-woord: *flyget var försenat*." }
          - id: 7gua
            type: translate
            prompt: "Het regende de hele week. Toch hadden we een fantastische vakantie."
            answers:
              - "Det regnade hela veckan. {Ändå|Trots det} hade vi en {fantastisk|underbar} semester."
              - "Det regnade hela veckan. Vi hade ändå en {fantastisk|underbar} semester."
            feedback:
              - { contains: "ändå vi hade", tip: "Na *ändå* vooraan: inversie, *ändå hade vi*." }
          - id: rgc3
            type: translate
            prompt: "We kwamen vijf uur te laat aan. Daarom willen we een vergoeding aanvragen."
            answers: ["Vi kom[ fram] fem timmar för sent. Därför vill vi {ansöka om|söka|begära|kräva} ersättning."]
            feedback:
              - { contains: "därför vi", tip: "Na *därför* vooraan: inversie, *därför vill vi*." }
          - id: ccwd
            type: translate
            prompt: "Eerst namen we de trein naar Kiruna en daarna de bus naar Abisko."
            answers:
              - "Först tog vi tåget till Kiruna[,] och {sedan|sen|efter det|därefter} tog vi bussen till Abisko."
              - "Först tog vi tåget till Kiruna[,] och {sedan|sen|efter det|därefter} bussen till Abisko."
            feedback:
              - { contains: "först vi tog", tip: "Na *först* vooraan: inversie, *först tog vi*." }
              - { contains: "sedan vi tog", tip: "Na *sedan* vooraan: inversie, *sedan tog vi*." }
          - id: tvzt
            type: translate
            prompt: "Mijn vriendin reist graag met het vliegtuig. Ik neem daarentegen liever de trein."
            answers: ["Min {kompis|vän|väninna|flickvän} {reser gärna med flyg|reser gärna med flygplan|flyger gärna}. {Jag tar däremot hellre tåget|Däremot tar jag hellre tåget|Jag åker däremot hellre tåg|Däremot åker jag hellre tåg}."]
            feedback:
              - { contains: "däremot jag", tip: "Na *däremot* vooraan: inversie, *däremot tar jag*." }
          - id: add7
            type: translate
            prompt: "We waren moe, want we hadden de hele nacht in de trein gezeten."
            answers:
              - "Vi var trötta, {för|eftersom} vi hade suttit {på|i} tåget hela natten."
              - "Vi var trötta, {för|eftersom} vi hade suttit hela natten {på|i} tåget."
            feedback:
              - { contains: "för hade vi", tip: "Na *för* (= want) geen inversie: *för vi hade*." }
              - { contains: "hela natt ", tip: "Na *hela*: bepaald, *hela natten*." }
          - { id: mbs7, type: translate, prompt: "We wilden midzomer bij het meer vieren, maar het regende helaas de hele dag.", answers: ["Vi ville fira midsommar vid sjön, men {det regnade tyvärr|tyvärr regnade det} hela dagen."], feedback: [{ contains: "tyvärr det regnade", tip: "Na *tyvärr* vooraan: inversie, *tyvärr regnade det*." }] }
          - { id: akup, type: translate, prompt: "Kerst is de belangrijkste feestdag van het jaar, daarom zijn de treinen in december altijd vol.", answers: ["{Julen|Jul} är {årets viktigaste högtid|den viktigaste högtiden {under|på} året}, [och ]därför är tågen {alltid fulla i december|i december alltid fulla|alltid fullsatta i december|i december alltid fullsatta}.", "{Julen|Jul} är {årets viktigaste högtid|den viktigaste högtiden {under|på} året}, så {tågen är|är tågen} {alltid fulla i december|i december alltid fulla|alltid fullsatta i december|i december alltid fullsatta}."], feedback: [{ contains: "därför tågen", tip: "Na *därför* vooraan: inversie, *därför är tågen*." }, { contains: "viktigast högtid", tip: "Na *årets* staat de overtreffende trap op -e: *årets viktigaste högtid*." }] }

      - id: langere-zinnen
        title: "Vertaal: langere zinnen"
        instruction: Vertaal de hele zin. Let op de woordvolgorde in de bijzin en na een woord vooraan.
        items:
          - { id: hc7n, type: translate, topic: sambandsord, prompt: "De trein had vertraging door een seinstoring, dus we haalden de overstap in Stockholm niet.", answers: ["Tåget var försenat på grund av ett signalfel, så vi hann inte med bytet i Stockholm.", "Tåget var försenat på grund av ett signalfel, {så vi hann inte med|så vi missade|och därför hann vi inte med|därför hann vi inte med|och därför missade vi|därför missade vi} bytet i Stockholm."], feedback: [{ contains: "därför vi hann", tip: "Na därför: werkwoord eerst (därför hann vi)." }] }
          - { id: dbyt, type: translate, topic: partikelverb-2, prompt: "We stapten bij de verkeerde halte uit en moesten bijna twee kilometer teruglopen naar het hotel.", answers: ["Vi steg av vid fel hållplats och fick gå nästan två kilometer tillbaka till hotellet.", "Vi {steg|klev|gick} av vid fel hållplats och {fick|måste|var tvungna att} gå {nästan två kilometer tillbaka|tillbaka nästan två kilometer} till hotellet."], feedback: [{ contains: "steg ut vid", tip: "Bij bus en trein zeg je meestal stiga av." }] }
          - { id: 9pkm, type: translate, topic: sambandsord, prompt: "Het regende de hele week, maar we wandelden toch elke dag omdat het uitzicht fantastisch was.", answers: ["Det regnade hela veckan, men vi vandrade ändå varje dag eftersom utsikten var fantastisk.", "Det regnade hela veckan, men vi {vandrade|promenerade} {ändå varje dag|varje dag ändå} {eftersom|för att} utsikten var fantastisk."], feedback: [{ contains: "eftersom var utsikten", tip: "In een bijzin: onderwerp, dan werkwoord (eftersom utsikten var)." }] }
          - { id: cb7a, type: translate, topic: sambandsord, prompt: "Bovendien was het hotel volgeboekt, dus we moesten die nacht in een klein tentje bij het meer slapen.", answers: ["Dessutom var hotellet fullbokat, så vi fick sova i ett litet tält vid sjön den natten.", "Dessutom var hotellet fullbokat, så vi {fick|måste} sova i ett litet tält vid sjön den natten."], feedback: [{ contains: "Dessutom hotellet var", tip: "Na dessutom vooraan: werkwoord eerst (dessutom var hotellet)." }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
