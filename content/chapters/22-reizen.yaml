          - { id: 3j8y, type: gap, text: "Det finns en direkt ___ med tåg mellan Stockholm och Oslo.", gaps: [{ answers: ["förbindelse"], options: ["förbindelse", "sevärdhet", "tull", "ankomst"], feedback: [{ match: "ankomst", tip: "*ankomst* betekent „een aankomst”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: qq4p, type: gap, text: "Tåget var försenat, så vi missade ___ till bussen.", gaps: [{ answers: ["anslutningen"], options: ["anslutningen", "ankomsten", "gränsen", "tullen"], feedback: [{ match: "ankomsten", tip: "*ankomsten* betekent „een aankomst”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: p2fk, type: gap, text: "Vi köpte en ___ till Kreta, med flyg och hotell i samma paket.", gaps: [{ answers: ["charterresa"], options: ["charterresa", "reseförsäkring", "returbiljett", "sevärdhet"], feedback: [{ match: "reseförsäkring", tip: "*reseförsäkring* betekent „een reisverzekering”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: 3r4a, type: gap, text: "Innan man reser utomlands är det bra att ha en ___.", gaps: [{ answers: ["reseförsäkring"], options: ["reseförsäkring", "charterresa", "sittplats", "kupé"], feedback: [{ match: "charterresa", tip: "*charterresa* betekent „een pakketreis”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: ufqh, type: gap, text: "Vi hittade ett billigt ___ nära stranden och ___ där på vägen hem.", gaps: [{ answers: ["boende"], options: ["boende", "resmål", "tull", "gräns"], feedback: [{ match: "resmål", tip: "*resmål* betekent „een reisbestemming”. Lees de zin nog eens: wat past hier?" }] }, { answers: ["övernattade"], options: ["övernattade", "köade", "utforskade", "körde om"] }] }
          - { id: b7dt, type: gap, text: "Det är förbjudet att ___ på höger sida.", gaps: [{ answers: ["köra om"], options: ["köra om", "köa", "hämta upp", "utforska"], feedback: [{ match: "köa", tip: "*köa* betekent „in de rij staan”. Lees de zin nog eens: wat past hier?" }] }] }
          - { id: b8mj, type: gap, text: "Svenskar ___ i lugn och ro i affären.", gaps: [{ answers: ["köar"], options: ["köar", "kör om", "hämtar upp", "utforskar"], feedback: [{ match: "kör om", tip: "*kör om* betekent „inhalen (in het verkeer)”. Lees de zin nog eens: wat past hier?" }] }] }
