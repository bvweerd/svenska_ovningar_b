          - { id: zut5, type: order, topic: sambandsord, start: "Därför", tokens: ["tog", "vi", "bussen"], answers: ["Därför tog vi bussen."] }
          - { id: zgad, type: gap, topic: partikelverb-2, text: "Vi måste ___ vid nästa station, annars missar vi bussen.", gaps: [{ answers: ["stiga av"], options: ["stiga av", "stiga på", "hinna med"], shuffle: false }] }
          - { id: djva, type: gap, topic: sambandsord, text: "Tåget var försenat, ___ missade vi vårt flyg till Luleå.", gaps: [{ answers: ["därför"], options: ["därför", "för", "men"], shuffle: false }] }
          - { id: quzd, type: gap, topic: bestamd-utan-artikel, text: "Vi var ute och reste hela ___ (vecka).", gaps: [{ answers: ["veckan"] }] }
          - { id: 4c6b, type: transform, topic: passiv-s, task: "Maak er een lijdende zin van met -s.", prompt: "Man ställde in flyget på grund av stormen.", answers: ["Flyget {ställdes in|inställdes} på grund av stormen."] }
          - { id: vfap, type: gap, topic: rad-onskan, text: "Jag önskar att jag ___ mer tid för mina vänner. (ha – ik wou dat ik meer tijd had)", gaps: [{ answers: ["hade"], feedback: [{ match: ["har", "ha"], tip: "Een wens die niet uitkomt: önskar att + verleden tijd, hade." }] }] }

