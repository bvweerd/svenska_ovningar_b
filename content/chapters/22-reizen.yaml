          - { id: wts2, type: gap, text: "boka om → Biljetten är ___.", gaps: [{ answers: ["ombokad"], feedback: [{ match: "bokad om", tip: "Het partikel komt vooraan: ombokad." }] }] }
          - { id: 5afn, type: gap, text: "packa upp → Väskorna är ___.", gaps: [{ answers: ["uppackade"], feedback: [{ match: ["upppackade", "uppackad"], tip: "Meervoud: uppackade (met twee p's)." }] }] }
          - { id: 6bq9, type: gap, text: "stänga av → Mobilen är ___.", gaps: [{ answers: ["avstängd"], feedback: [{ match: "stängd av", tip: "Het partikel komt vooraan: avstängd." }] }] }
          - { id: 2hka, type: gap, text: "låsa upp → Dörren är ___.", gaps: [{ answers: ["upplåst"], feedback: [{ match: "låst upp", tip: "Het partikel komt vooraan: upplåst." }] }] }
          - { id: et7e, type: gap, text: "slå på → Datorn är ___.", gaps: [{ answers: ["påslagen"], feedback: [{ match: ["slagen på", "påslaget"], tip: "dator is een en-woord en het partikel komt vooraan: påslagen." }] }] }
          - { id: uzzz, type: gap, text: "skriva ut → Biljetterna är ___.", gaps: [{ answers: ["utskrivna"], feedback: [{ match: ["utskriven", "skrivna ut"], tip: "Meervoud, met het partikel vooraan: utskrivna." }] }] }
          - { id: hcn5, type: gap, text: "sätta upp → Tältet är ___.", gaps: [{ answers: ["uppsatt"], feedback: [{ match: ["satt upp", "uppsatta"], tip: "tält is een ett-woord en het partikel komt vooraan: uppsatt." }] }] }

