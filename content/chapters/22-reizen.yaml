            type: translate
            prompt: "We moeten opschieten, anders halen we de laatste trein naar Kiruna niet."
            answers: ["Vi {måste|får} skynda oss, annars hinner vi inte med {det sista tåget|sista tåget} till Kiruna."]
            feedback:
              - { contains: "annars vi", tip: "*annars* vooraan geeft inversie: *annars hinner vi*." }
              - { contains: "hinner vi med inte", tip: "*inte* staat vóór het partikel: *hinner vi inte med*." }
          - id: n9tu
            type: translate
            prompt: "Vergeet niet je slaapzak en je paspoort mee te nemen!"
            answers: ["Glöm inte [att ]ta med [dig ]{sovsäcken|din sovsäck} och {passet|ditt pass}!"]
            feedback:
              - { contains: "ta med sig", tip: "Tegen jou (du): *ta med dig*." }
              - { contains: "ta dig med", tip: "Bij *ta med* staat *dig* na het partikel: *ta med dig*." }
          - id: ssjj
            type: translate
            prompt: "Toen we eindelijk in Abisko aankwamen, was de bus al vertrokken."
            answers:
              - "När vi {äntligen|till slut} kom fram till Abisko, hade bussen redan {åkt iväg|åkt|gått}."
              - "Bussen hade redan {åkt iväg|åkt|gått} när vi {äntligen|till slut} kom fram till Abisko."
            feedback:
              - { contains: "abisko bussen hade", tip: "Na de bijzin vooraan komt eerst het werkwoord: *hade bussen*." }
          - id: emfg
            type: translate
            prompt: "Onze vlucht is geannuleerd, dus we moeten de kaartjes omboeken."
            answers: ["Vårt flyg {är inställt|har ställts in|ställdes in|blev inställt|har blivit inställt}, så vi måste boka om biljetterna."]
            feedback:
