          - { id: kx95, type: findError, sentence: "Dessutom hotellet var dyrt.", wrong: [1, 2], answers: ["Dessutom var hotellet dyrt."], tip: "Inversie na dessutom." }
          - { id: gf78, type: findError, topic: partikelverb-2, sentence: "Flyget är ställt in.", wrong: [2, 3], answers: ["Flyget är inställt."], tip: "Bij een deelwoord komt het partikel vooraan." }
          - { id: ahuu, type: findError, topic: partikelverb-2, sentence: "Ta med sig passet!", wrong: [2], answers: ["Ta med dig passet!"], tip: "Tegen wie praat je?" }
          - { id: butj, type: findError, sentence: "Tåget var sent, så missade vi bussen.", wrong: [4, 5], answers: ["Tåget var sent, så vi missade bussen."], tip: "Na het voegwoord så (= dus): geen inversie. In spreektaal hoor je ook så missade vi, maar schrijf så vi missade." }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-utrop
        title: "Luisteren: een omroepbericht"
        instruction: Luister naar het omroepbericht op het station. Is de bewering **rätt** of **fel**?
        topic: partikelverb-2
        listen: true
        textTitle: Utrop på stationen
        text: |
          Information om tåg nittiofyra till Kiruna, med avgång klockan arton och fyra. Tåget är försenat cirka fyrtio minuter på grund av ett signalfel. Ny beräknad avgångstid är arton och fyrtiofem.

          Observera att tåget avgår från spår tolv i stället för spår fjorton. Resenärer som ska byta till bussen i Boden ombeds kontakta personalen på tåget. Vi ber om ursäkt för förseningen.
        items:
          - { id: 5mz5, type: truefalse, statement: "Tåget går till Kiruna.", answer: true }
          - { id: 74ty, type: truefalse, statement: "Tåget är försenat cirka en timme.", answer: false, correction: { answers: ["{Tåget|Det} är försenat {cirka|ungefär} fyrtio minuter."] } }
          - { id: ukby, type: truefalse, statement: "Förseningen beror på ett signalfel.", answer: true }
          - { id: 5j44, type: truefalse, statement: "Tåget avgår från spår fjorton.", answer: false, correction: { answers: ["{Tåget|Det} avgår från spår tolv[ i stället]."] } }
          - { id: jkse, type: truefalse, statement: "Den som ska byta till bussen i Boden ska kontakta personalen.", answer: true }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en maak de zin die je hoort.
        topic: sambandsord
        shuffle: true
        items:
          - { id: fdg2, type: listen, say: "Därför kom vi fram fem timmar för sent." }
          - { id: 65ec, type: listen, say: "Flyget är inställt på grund av dimma." }
          - { id: 2yca, type: listen, say: "Glöm inte att ta med dig passet." }
          - { id: w28r, type: listen, say: "Dessutom hade vi missat bussen." }

  - id: praktiskt
    title: Praktiskt · een reis plannen en klagen
    exercises:
      - id: dialoog-biljett
        title: Kaartjes kopen
        instruction: Zet het gesprek in de goede volgorde.
        topic: partikelverb-2
        items:
          - id: phem
            type: dialogue
            lines:
              - "Mirjam: Hej! Jag skulle vilja boka två biljetter till Abisko i juli."
              - "Personalen: Vill ni åka nattåg eller flyga till Kiruna?"
              - "Mirjam: Nattåg, tack. Helst med sovvagn."
              - "Personalen: Det finns plats den tolfte juli, med avgång klockan arton och fyra."
              - "Mirjam: Perfekt. Behöver vi byta någonstans?"
              - "Personalen: Nej, tåget går direkt. Ni kommer fram nästa förmiddag."
