          - { id: sfnv, type: gap, text: "Tågets ___ till Kiruna är klockan 11.40, men det kan bli försenat.", gaps: [{ answers: ["ankomst"], options: ["ankomst", "anslutning", "gräns", "tull"], feedback: [{ match: "anslutning", tip: "*anslutning* betekent „een aansluiting”. Lees de zin nog eens: wat past hier?" }] }] }
