chapter: 22
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan op reis werkwoorden met een partikel gebruiken (stiga på, hinna med)", topics: [partikelverb-2] }
  - { text: "Ik kan zinnen en delen van een verhaal met elkaar verbinden", topics: [sambandsord] }

grammar:
  - id: partikelverb-2
    title: Partikelwerkwoorden op reis
    summary: "*stiga på/av, komma fram, hinna med, åka iväg, ta med sig*. Als deelwoord komt het partikel **vooraan**: *ställa in → **in**ställd*, *boka om → **om**bokad*: *Tåget är **inställt**.*"
    body: |
      Nog meer werkwoorden met een beklemtoond partikel (zie hoofdstuk 15):

      | Zweeds | betekenis |
      |---|---|
      | stiga **på** / stiga **av** | instappen / uitstappen |
      | gå **av** (bussen) | uitstappen |
      | komma **fram** | aankomen |
      | hinna **med** | halen (op tijd) |
      | åka **iväg** | vertrekken |
      | ta **med** sig | meenemen |
      | köra **om** | inhalen (auto) |
      | ställa **in** | afgelasten |
      | boka **om** | omboeken |

      Bij *ta med sig* en *ha med sig* staat *sig* na het partikel: *Ta **med dig** passet!* *Jag tog **med mig** kameran.* Bij de meeste andere wederkerende partikelwerkwoorden staat *sig* vóór het partikel: *sätta **sig ner***, *ge **sig iväg***.

      ### Deelwoord: partikel vooraan
      Maak je een deelwoord van een partikelwerkwoord, dan komt het partikel **ervoor** en plak je het eraan:

      | werkwoord | deelwoord | voorbeeld |
      |---|---|---|
      | ställa in | **in**ställd | *Flyget är **inställt**.* |
      | boka om | **om**bokad | *Biljetten är **ombokad**.* |
      | packa upp | **upp**ackad | *Väskorna är **uppackade**.* |
      | stänga av | **av**stängd | *Mobilen är **avstängd**.* |

      Ook in de lijdende vorm met -s kan het partikel achteraan blijven: *Flyget **ställdes in**.* (gewoner dan *inställdes*)

  - id: sambandsord
    title: Verbindingswoorden
    summary: "**och, men, så, för, eller** verbinden zinnen zonder inversie: *…, så vi missade bussen.* Bijwoorden als **därför, dessutom, däremot, ändå, sedan** veroorzaken **inversie** vooraan: ***Därför** missade vi bussen.*"
    body: |
      Met verbindingswoorden maak je van losse zinnen een lopende tekst.

      | functie | woorden |
      |---|---|
      | toevoegen | *och, dessutom, även, också* |
      | tegenstelling | *men, däremot, ändå, trots det, i stället* |
      | reden | *för, eftersom* |
      | gevolg | *så, därför, alltså* |
      | volgorde | *först, sedan, efter det, till slut* |

      ### Woordvolgorde
      **Nevenschikkende voegwoorden** (*och, men, så, för, eller*) staan tussen twee hoofdzinnen. Daarna gewone volgorde:

      - *Tåget var sent, **så vi missade** bussen.*

      In spreektaal hoor je ook *så missade vi* (dan werkt *så* als bijwoord, 'toen'). In geschreven tekst is *så vi missade* de norm.

      **Bijwoorden** (*därför, dessutom, däremot, ändå, sedan, alltså, till slut*) zijn een zinsdeel. Staan ze vooraan, dan volgt **inversie** (V2):

      - ***Därför missade vi** bussen.* (niet ~~*Därför vi missade*~~)
      - *Hotellet var dyrt. **Dessutom var det** smutsigt.*

      *eftersom* begint een bijzin: *Vi kom sent **eftersom tåget var** försenat.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-nattag
        title: "Lezen: met de nachttrein naar Lapland"
        instruction: Lees de blog en beantwoord de vragen.
        topic: sambandsord
        textTitle: En resa som inte gick som planerat
        text: |
          Förra sommaren bestämde jag och min kompis Joyce oss för att åka nattåg från Stockholm till Abisko för att vandra. Vi bokade biljetterna två månader i förväg och packade ner allt vi behövde: tält, sovsäckar och mat för en vecka.

          Tåget skulle gå klockan sex på kvällen. Först blev det en timmes försening, och sedan stannade tåget helt utanför Umeå på grund av ett signalfel. Därför kom vi fram till Abisko fem timmar för sent. Dessutom hade vi missat bussen till vandringsleden, så vi fick vänta till nästa dag.

          Vi hade tänkt sova i tält redan den första natten, men vi var så trötta att vi inte orkade sätta upp det. Därför frågade vi på turiststationen om de hade några lediga sängar. Till slut fick vi två platser i ett rum med fyra andra vandrare. Det var trångt, men det var i alla fall varmt och torrt.

          Ändå var det värt det. Fjällen var fantastiska, och vi såg både renar och midnattssol. Sedan vandrade vi i fem dagar och sov i tältet varje natt. Bara en dag regnade det, men då blev nästan allt blött, även sovsäckarna. Dessutom hade Joyce glömt att ta med sig myggmedel, så vi fick dela på mitt.

          När vi kom hem skrev jag ett klagomål till tågbolaget. Två veckor senare fick vi tillbaka en del av pengarna. Nästa sommar vill vi åka dit igen, men då ska vi ta god tid på oss.
        items:
          - { id: s65v, type: mc, prompt: "Varför åkte de till Abisko?", options: ["för att vandra", "för att hälsa på släkt", "för att jobba", "för att åka skidor"], answer: 0 }
          - { id: 4d7c, type: truefalse, statement: "De bokade biljetterna i sista minuten.", answer: false, correction: { answers: ["De bokade {biljetterna|dem} två månader i förväg."] } }
          - { id: 2qfe, type: mc, prompt: "Varför stannade tåget utanför Umeå?", options: ["på grund av ett signalfel", "på grund av snö", "på grund av en älg", "för att byta förare"], answer: 0 }
          - { id: 76hu, type: truefalse, statement: "De kom fram fem timmar för sent.", answer: true }
          - { id: pd3e, type: mc, prompt: "Vad hände med bussen till vandringsleden?", options: ["De hade missat den.", "Den var inställd.", "Den var full.", "Den var gratis."], answer: 0 }
          - { id: ahpn, type: truefalse, statement: "Skribenten tycker att resan inte var värd det.", answer: false, correction: { answers: ["{Hon|Skribenten|Han} tycker att resan var värd det.", "{Hon|Skribenten|Han} tycker att det var värt det.", "Det var värt det."] } }
          - id: h6bd
            type: multi
            prompt: "Welke verbindingswoorden in de tekst geven een gevolg?"
            options: ["därför", "så", "dessutom", "ändå", "först"]
            answers: [0, 1]
            tip: "dessutom voegt iets toe, ändå is een tegenstelling, först geeft een volgorde."
          - { id: 43v8, type: mc, prompt: "Varför satte de inte upp tältet den första natten?", options: ["De var för trötta.", "Det regnade för mycket.", "De hade glömt tältet.", "Det var förbjudet att tälta."], answer: 0 }
          - { id: bzs4, type: truefalse, statement: "På turiststationen fick de ett eget rum.", answer: false, correction: { answers: ["De fick [två ]platser i ett rum med fyra andra[ vandrare]."] } }
          - { id: b3t4, type: mc, prompt: "Vad hade Joyce glömt att ta med sig?", options: ["myggmedel", "sin sovsäck", "sitt pass", "tältet"], answer: 0 }

      - id: makkelijk-1
        title: "Makkelijk lezen: Bytet i Stockholm"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Bytet i Stockholm"
        text: |
          Daan skulle åka tåg från Göteborg till Kiruna. Han skulle byta tåg i Stockholm, men det första tåget var försenat. Därför hann han inte med det andra tåget. Han gick till informationen och fick en ny biljett. Dessutom fick han en matkupong. Han kom fram fyra timmar senare, men han var ändå nöjd med resan. Nästa gång vill han åka tåg igen.
        items:
          - { id: wn5v, type: truefalse, statement: "Daan hann med bytet i Stockholm.", answer: false }
          - { id: 58a3, type: truefalse, statement: "Daan fick en ny biljett.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Vilse i fjällen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Vilse i fjällen"
        text: |
          Joyce och hennes kompis gick vilse på en vandringsled i fjällen. De hade glömt kartan i stugan. Som tur var mötte de en annan vandrare, som visade dem vägen tillbaka. Sedan dess tar Joyce alltid med sig både karta och mobil. Vandraren berättade att många går vilse just där, eftersom leden delar sig. Joyce och kompisen kom tillbaka till stugan innan det blev mörkt. De var trötta men glada.
        items:
          - { id: d2yt, type: truefalse, statement: "De hade kartan med sig.", answer: false }
          - { id: xzvv, type: truefalse, statement: "En annan vandrare hjälpte dem.", answer: true }

      - id: makkelijk-3
        title: "Makkelijk lezen: Försenat flyg"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Försenat flyg"
        text: |
          Sanne och Bas skulle flyga till Kiruna i fredags. Flyget var försenat i tre timmar, eftersom det snöade mycket i norr. De satt på flygplatsen och väntade, och kaféet var dessutom stängt. Trots att de var hungriga och trötta var de på gott humör. När de till slut landade, var det mörkt och tjugo grader kallt. De checkade in på hotellet och somnade direkt.
        items:
          - { id: 2bph, type: truefalse, statement: "Flyget var försenat i en timme.", answer: false }
          - { id: xtwk, type: mc, prompt: "Varför var flyget försenat?", options: ["Det snöade mycket.", "Piloten var sjuk.", "Det var strejk."], answer: 0 }
          - { id: ngqe, type: truefalse, statement: "Det var mörkt när de landade.", answer: true }

      - id: makkelijk-4
        title: "Makkelijk lezen: Tågluffen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Tågluffen"
        text: |
          Efter studenten åker Moa och hennes kompis Ella på tågluff i Europa. De ska vara borta i en månad. De har köpt ett Interrailkort, och därför kan de åka så mycket de vill. Först åker de ner till Köpenhamn och vidare till Berlin. Där stannar de i fyra dagar. Sedan fortsätter de till Prag och Wien. De bor på billiga vandrarhem. Moa skriver dagbok varje kväll, så att hon kommer ihåg allt.
        items:
          - { id: t8t7, type: mc, prompt: "Hur länge ska de vara borta?", options: ["En vecka.", "En månad.", "Ett år."], answer: 1 }
          - { id: e2d6, type: truefalse, statement: "De stannar i Berlin i fyra dagar.", answer: true }
          - { id: dnwd, type: truefalse, statement: "De bor på dyra hotell.", answer: false }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
