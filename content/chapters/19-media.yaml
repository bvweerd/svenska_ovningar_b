  - id: indirekt-tal
    title: "Grammatik: indirecte rede"
    exercises:
      - id: indirekt-omvormen
        title: Wat zei hij?
        instruction: Schrijf de zin als indirecte rede. Laat de tijd een stap terugschuiven.
        topic: indirekt-tal-b1
        items:
          - { id: xcjm, type: transform, prompt: "Anna: ”Jag är trött.”", task: "Anna sa att …", answers: ["Anna sa att hon var trött."], feedback: [{ match: "Anna sa att hon är trött.", tip: "Schuif de tijd terug: är → var." }] }
          - { id: n9vk, type: transform, prompt: "Erik: ”Jag har köpt en ny bil.”", task: "Erik sa att …", answers: ["Erik sa att han hade köpt en ny bil."], feedback: [{ match: "Erik sa att han har köpt en ny bil.", tip: "har köpt → hade köpt." }] }
          - { id: g2vw, type: transform, prompt: "Läraren: ”Ni ska läsa kapitel tre.”", task: "Läraren sa att vi …", answers: ["Läraren sa att vi skulle läsa kapitel tre."], feedback: [{ contains: "att vi ska", tip: "ska → skulle." }] }
          - { id: pw9c, type: transform, prompt: "Mamma: ”Jag kan inte komma i morgon.”", task: "Mamma sa att …", answers: ["Mamma sa att hon inte kunde komma {dagen efter|nästa dag|dagen därpå|följande dag|i morgon|imorgon}."], feedback: [{ contains: "kunde inte", tip: "Het is een bijzin: inte vóór het werkwoord, inte kunde." }, { contains: "att hon inte kan", tip: "kan → kunde." }] }
          - { id: t5mb, type: transform, prompt: "Polisen: ”Ingen har skadats.”", task: "Polisen sa att …", answers: ["Polisen sa att ingen hade skadats.", "Polisen sa att ingen skadades."] }
          - { id: tjnr, type: transform, prompt: "Meteorologen: ”Det kommer att snöa i helgen.”", task: "Meteorologen sa att …", answers: ["Meteorologen sa att det skulle snöa i helgen."], feedback: [{ contains: "kommer att", tip: "kommer att → skulle." }] }
          - { id: frth, type: transform, prompt: "Nils: ”Jag tycker inte om fisk.”", task: "Nils sa att …", answers: ["Nils sa att han inte tyckte om fisk."], feedback: [{ contains: "tyckte inte om", tip: "In de bijzin staat inte vóór het werkwoord: att han inte tyckte om." }, { contains: "tycker", tip: "Schuif de tijd terug: tycker → tyckte." }] }
          - { id: xbxg, type: transform, prompt: "Ingrid: ”Vi har aldrig varit i Lappland.”", task: "Ingrid sa att …", answers: ["Ingrid sa att de aldrig hade varit i Lappland."], feedback: [{ contains: "att vi", tip: "Ingrid praat over haar gezin: vi wordt de." }, { contains: "hade aldrig", tip: "In de bijzin staat aldrig vóór het werkwoord: de aldrig hade varit." }] }
          - { id: m2ux, type: transform, prompt: "Karin: ”Jag har aldrig sett en älg så nära förut.”", task: "Karin berättade att …", answers: ["Karin berättade att hon aldrig hade sett en älg så nära förut."], feedback: [{ contains: "hade aldrig sett", tip: "In de bijzin staat aldrig vóór het werkwoord: att hon aldrig hade sett." }, { contains: "aldrig har sett", tip: "Schuif de tijd terug: har sett → hade sett." }, { contains: "att jag", tip: "Karin vertelt over zichzelf: jag wordt hon." }] }
          - { id: jrnw, type: transform, prompt: "Polisen: ”Vi kommer att hålla gatorna stängda i en timme till.”", task: "Polisen sa att …", answers: ["Polisen sa att de skulle hålla gatorna stängda i en timme till."], feedback: [{ contains: "kommer att", tip: "kommer att → skulle." }, { contains: "att vi", tip: "Vertel je na wat de politie zei, dan wordt vi de." }] }
          - { id: 9xgz, type: transform, prompt: "Chefredaktören: ”Vi har fått över tusen mejl om älgen.”", task: "Chefredaktören sa att …", answers: ["Chefredaktören sa att de hade fått över tusen {mejl|mail} om älgen."], feedback: [{ contains: "har fått", tip: "Schuif de tijd terug: har fått → hade fått." }, { contains: "att vi", tip: "Vertel je het na, dan wordt vi de." }] }
          - { id: bxpa, type: transform, prompt: "Omar: ”Jag kan inte köra vidare förrän älgen har gått.”", task: "Omar sa att …", answers: ["Omar sa att han inte kunde köra vidare förrän älgen hade gått."], feedback: [{ contains: "kunde inte", tip: "In de bijzin staat inte vóór het werkwoord: att han inte kunde." }, { contains: "inte kan", tip: "Schuif de tijd terug: kan → kunde." }, { contains: "älgen har gått", tip: "Schuif ook hier de tijd terug: har gått → hade gått." }] }
          - { id: um9k, type: transform, prompt: "Ministern: ”Jag tänker inte avgå, eftersom jag inte har gjort något fel.”", task: "Ministern sa att …", answers: ["Ministern sa att {hon inte tänkte avgå[,] eftersom hon|han inte tänkte avgå[,] eftersom han} inte hade gjort något fel."], feedback: [{ contains: "tänkte inte", tip: "In de bijzin staat inte vóór het werkwoord: att hon inte tänkte avgå." }, { contains: "hade inte gjort", tip: "Ook na eftersom is het een bijzin: eftersom hon inte hade gjort." }, { contains: ["inte har gjort", "inte tänker"], tip: "Schuif de tijd terug: tänker → tänkte, har gjort → hade gjort." }] }

      - id: indirekt-vragen
        title: Wat vroeg ze?
        instruction: Schrijf de vraag als indirecte vraag.
        topic: indirekt-fraga
        items:
          - { id: 99yx, type: transform, prompt: "”Kommer du på festen?” frågade Lisa.", task: "Lisa frågade …", answers: ["Lisa frågade om jag {kom|skulle komma} på festen."], feedback: [{ contains: "frågade kom", tip: "Een ja/nee-vraag krijgt om: frågade om jag kom." }, { contains: "om kom jag", tip: "Bijzinvolgorde: om jag kom." }] }
          - { id: 9m5u, type: transform, prompt: "”Var bor du?” frågade han.", task: "Han frågade …", answers: ["Han frågade var jag {bodde|bor}."], feedback: [{ contains: "var bodde jag", tip: "Bijzinvolgorde: eerst het onderwerp, var jag bodde." }, { contains: "var bor jag", tip: "Bijzinvolgorde: eerst het onderwerp, var jag bor (of var jag bodde)." }] }
          - { id: gfws, type: transform, prompt: "”Varför kom du inte?” frågade chefen.", task: "Chefen frågade …", answers: ["Chefen frågade varför jag inte {hade kommit|kom}."], feedback: [{ contains: "jag kom inte", tip: "In de bijzin staat inte vóór het werkwoord: varför jag inte kom." }, { contains: "jag hade inte", tip: "In de bijzin staat inte vóór het werkwoord: varför jag inte hade kommit." }] }
          - { id: ecab, type: transform, prompt: "”Vem ringde?” frågade hon.", task: "Hon frågade …", answers: ["Hon frågade vem som {hade ringt|ringde}."], feedback: [{ contains: "vem ringde", tip: "vem is het onderwerp: vem som ringde." }, { contains: "vem hade ringt", tip: "vem is het onderwerp: vem som hade ringt." }] }
          - { id: qkvt, type: transform, prompt: "”Hur mår du?” frågade läkaren.", task: "Läkaren frågade …", answers: ["Läkaren frågade hur jag {mådde|mår}."], feedback: [{ contains: "hur mådde jag", tip: "Bijzinvolgorde: eerst het onderwerp, hur jag mådde." }, { contains: "hur mår jag", tip: "Bijzinvolgorde: eerst het onderwerp, hur jag mår (of hur jag mådde)." }] }
          - { id: gx92, type: transform, prompt: "”Har du sett min nyckel?” frågade Bram.", task: "Bram frågade …", answers: ["Bram frågade om jag hade sett hans nyckel."], feedback: [{ contains: "min nyckel", tip: "Het is Brams sleutel: hans nyckel." }, { contains: "sin nyckel", tip: "In de bijzin is jag het onderwerp, dus geen sin: hans nyckel." }] }
          - { id: dunt, type: transform, prompt: "”När börjar filmen?” undrade Wilma.", task: "Wilma undrade …", answers: ["Wilma undrade när filmen {började|skulle börja}."], feedback: [{ contains: "när började filmen", tip: "Bijzinvolgorde: eerst het onderwerp, när filmen började." }] }
          - { id: 55we, type: transform, prompt: "”Vad heter din syster?” frågade Olle.", task: "Olle frågade …", answers: ["Olle frågade vad min syster {hette|heter}."], feedback: [{ contains: "vad hette", tip: "Bijzinvolgorde: eerst het onderwerp, vad min syster hette." }, { contains: "din syster", tip: "Olle vraagt naar jouw zus; vanuit jou gezien: min syster." }] }
          - { id: 9gz2, type: transform, prompt: "”Varför har ni inte spärrat av gatan?” frågade en journalist.", task: "Journalisten frågade polisen …", answers: ["Journalisten frågade polisen varför de inte hade spärrat av gatan."], feedback: [{ contains: "varför ni", tip: "Vertel je het na, dan wordt ni (de politie) de." }, { contains: "hade inte spärrat", tip: "In de bijzin staat inte vóór het werkwoord: varför de inte hade spärrat." }, { contains: "varför hade de", tip: "Bijzinvolgorde: eerst het onderwerp, varför de inte hade spärrat." }] }
          - { id: wwwy, type: transform, prompt: "”Vet du om älgen har skadat någon?” frågade Tom.", task: "Tom frågade om jag …", answers: ["Tom frågade om jag visste om älgen {hade|har} skadat någon."], feedback: [{ contains: "om har älgen", tip: "Bijzinvolgorde: eerst het onderwerp, om älgen hade skadat." }, { contains: "om jag vet", tip: "Schuif de tijd terug: vet → visste." }] }
          - { id: yfp2, type: transform, prompt: "”Vem var det som filmade älgen först?” undrade reportern.", task: "Reportern undrade …", answers: ["Reportern undrade {vem som|vem det var som} {hade filmat|filmade} älgen först."], feedback: [{ contains: ["vem hade filmat", "vem filmade"], tip: "vem is het onderwerp: vem som hade filmat." }, { contains: "vem var det", tip: "Bijzinvolgorde: vem det var som …" }] }

      - id: vem-som
        title: Vem som of vem?
        instruction: Kies wat past.
        topic: indirekt-fraga
        shuffle: true
        items:
          - { id: fjtu, type: gap, text: "Jag vet inte ___ har ringt.", gaps: [{ answers: ["vem som"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vem", tip: "vem is hier het onderwerp (wie heeft gebeld?): vem som." }] }] }
          - { id: m8nf, type: gap, text: "Berätta ___ hände!", gaps: [{ answers: ["vad som"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vad", tip: "vad is het onderwerp (wat gebeurde er?): vad som." }] }] }
          - { id: mnd2, type: gap, text: "Vet du ___ hon träffade i går?", gaps: [{ answers: ["vem"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vem som", tip: "hon is het onderwerp; vem is lijdend voorwerp: geen som." }] }] }
          - { id: 96yx, type: gap, text: "Jag undrar ___ du tänker göra i sommar.", gaps: [{ answers: ["vad"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vad som", tip: "du is het onderwerp: geen som." }] }] }
          - { id: nta3, type: gap, text: "Ingen vet ___ orsakade branden – kanske spisen?", gaps: [{ answers: ["vad som"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vad", tip: "vad is het onderwerp (wat veroorzaakte de brand?): vad som." }] }] }
          - { id: 5ywz, type: gap, text: "Kan du säga ___ jag ska ringa?", gaps: [{ answers: ["vem"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false }] }
          - { id: fj9g, type: gap, text: "Jag vet inte ___ du pratar om.", gaps: [{ answers: ["vem", "vad"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: ["vem som", "vad som"], tip: "du is het onderwerp: geen som." }] }] }
          - { id: gc96, type: gap, text: "Säg ___ du vill ha till middag!", gaps: [{ answers: ["vad"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vad som", tip: "du is het onderwerp: geen som." }] }] }
          - { id: kmc5, type: gap, text: "Ingen på tidningen vet ännu ___ skrev den anonyma insändaren i lördags.", gaps: [{ answers: ["vem som"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vem", tip: "vem is hier het onderwerp (wie schreef de brief?): vem som." }] }] }
          - { id: fe7w, type: gap, text: "Kan du berätta för mig ___ du gjorde när du kom till stationen?", gaps: [{ answers: ["vad"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vad som", tip: "du is het onderwerp: geen som." }] }] }
          - { id: ytvm, type: gap, text: "Mamma ringde och undrade ___ jag tänkte göra i sommar när skolan slutar.", gaps: [{ answers: ["vad"], options: ["vem som", "vem", "vad som", "vad"], shuffle: false, feedback: [{ match: "vad som", tip: "jag is het onderwerp: geen som." }] }] }

      - id: indirekt-zinsbouw
        title: Bijzinnen bouwen
