chapter: 19
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan navertellen wat iemand zei, met de goede tijd", topics: [indirekt-tal-b1] }
  - { text: "Ik kan een vraag indirect stellen of doorgeven", topics: [indirekt-fraga] }

grammar:
  - id: indirekt-tal-b1
    title: Indirecte rede met tijdsverschuiving
    summary: "Na *sa att* schuift de tijd een stap terug: *är → var*, *har köpt → hade köpt*, *ska → skulle*, *kan → kunde*. Bijzinvolgorde: *Hon sa att hon **inte var** trött.*"
    body: |
      Vertel je na wat iemand gezegd heeft (*sa att, berättade att, skrev att*), dan schuift de tijd een stap terug, net als in het Nederlands:

      | direct | indirect |
      |---|---|
      | *”Jag **är** trött.”* | *Hon sa att hon **var** trött.* |
      | *”Jag **har köpt** en bil.”* | *Han sa att han **hade köpt** en bil.* |
      | *”Jag **köpte** en bil.”* | *Han sa att han **hade köpt** (of: **köpte**) en bil.* |
      | *”Vi **ska** åka.”* | *De sa att de **skulle** åka.* |
      | *”Det **kommer att** regna.”* | *De sa att det **skulle** regna.* |
      | *”Jag **kan** inte.”* | *Hon sa att hon inte **kunde**.* |

      Is iets nog steeds waar, dan mag de presens blijven: *Hon sa att hon **bor** i Malmö.*

      ### Ook veranderen
      - **voornaamwoorden**: *jag → hon/han*, *vi → de*
      - **tijdswoorden**, als je het later vertelt: *i dag → den dagen*, *i går → dagen innan*, *i morgon → dagen efter*
      - **woordvolgorde**: het is een bijzin, dus *inte* vóór het werkwoord: *Han sa att han **inte kunde** komma.*

      In nieuwsberichten zie je ook **enligt** (volgens): ***Enligt** polisen skadades ingen.*

  - id: indirekt-fraga
    title: Indirecte vragen en vem som
    summary: "Ja/nee-vraag: **om**: *Hon frågade **om** jag ville komma.* Vraagwoord: *Jag undrar **varför** han **inte** kom.* Is het vraagwoord het onderwerp, dan **som**: *Jag vet inte **vem som** ringde.*"
    body: |
      Een vraag in een bijzin (na *fråga, undra, veta, berätta* …) heeft **bijzinvolgorde**: onderwerp – (inte) – werkwoord.

      | directe vraag | indirect |
      |---|---|
      | *Kommer du?* | *Hon frågade **om** jag kom.* |
      | *Var bor du?* | *Han frågade **var jag bodde**.* |
      | *Varför kom du inte?* | *Chefen undrade **varför jag inte** hade kommit.* |

      Een ja/nee-vraag krijgt **om** (of): *Vet du **om** butiken är öppen?*

      ### vem som, vad som, vilka som
      Is het vraagwoord zelf het **onderwerp** van de bijzin, dan komt er **som** achter:

      - *Vem ringde?* → *Jag vet inte **vem som** ringde.*
      - *Vad hände?* → *Berätta **vad som** hände!*
      - *Vilka kommer?* → *Vet du **vilka som** kommer?*

      Is het vraagwoord het **lijdend voorwerp**, dan komt er geen *som*:

      - *Vem ringde du?* → *Jag vet inte **vem du** ringde.*

      Test: staat er na het vraagwoord al een onderwerp (*du, hon, Erik* …)? Dan geen *som*.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-alg
        title: "Lezen: een eland in de stad"
        instruction: Lees het nieuwsbericht en beantwoord de vragen.
        topic: indirekt-tal-b1
        textTitle: Älg på villovägar i centrala Uppsala
        text: |
          En älg orsakade stor uppståndelse i centrala Uppsala i tisdags morse. Älgen sågs först vid järnvägsstationen strax efter klockan sex. Sedan gick den lugnt genom stadsparken och vidare ner mot Fyrisån.

          – Jag trodde inte mina ögon, säger Karin Lund, som var på väg till jobbet. Den stod bara där och åt av buskarna utanför min port.

          Polisen spärrade av flera gator, och trafiken stod still i nästan en timme. Ingen människa skadades.

          Många som såg älgen filmade den med sina mobiler, och snart spreds filmerna i sociala medier. En av dem som filmade var Omar Hassan, som kör buss i Uppsala.

          – Jag fick stanna bussen mitt på gatan. Passagerarna frågade vad som hade hänt, och när jag pekade på älgen började alla skratta, berättar han.

          – Älgen var troligen ung och hade gått vilse, säger polisens presstalesperson Anders Berg. Till slut lyckades vi leda den ut ur staden mot skogen.

          Enligt Berg är det inte ovanligt att älgar kommer in i städer på våren, när de unga djuren lämnar sina mödrar. Polisen vill ändå påminna om att en älg kan bli farlig om den känner sig stressad. Man ska hålla avstånd och inte försöka ta bilder på nära håll. Den som ser en älg i staden kan ringa polisen på 114 14. Är någon i fara ska man ringa 112.

          Senare samma dag sågs älgen i ett skogsområde norr om staden. Enligt polisen mådde den bra.
        items:
          - { id: dwrr, type: mc, prompt: "Var sågs älgen först?", options: ["vid järnvägsstationen", "i stadsparken", "vid Fyrisån", "i skogen"], answer: 0 }
          - { id: qcwm, type: truefalse, statement: "Älgen sågs på kvällen.", answer: false, correction: { answers: ["{Älgen|Den} sågs [på morgonen ]strax efter klockan sex[ på morgonen].", "{Älgen|Den} sågs på morgonen."] } }
          - { id: 68ht, type: mc, prompt: "Vad gjorde älgen utanför Karin Lunds port?", options: ["Den åt av buskarna.", "Den sov.", "Den sprang in i huset.", "Den skadade en bil."], answer: 0 }
          - { id: hbdf, type: truefalse, statement: "En person skadades.", answer: false, correction: { answers: ["Ingen [människa ]skadades."] } }
          - { id: rcwa, type: mc, prompt: "Varför kom älgen in i staden, enligt polisen?", options: ["Den var ung och hade gått vilse.", "Den letade efter mat.", "Den var sjuk.", "Någon hade jagat den."], answer: 0 }
          - { id: b7rs, type: mc, prompt: "När kommer älgar ofta in i städer?", options: ["på våren", "på vintern", "på natten", "på hösten"], answer: 0 }
          - { id: wf7p, type: mc, prompt: "Wat betekent *spärrade av flera gator*?", options: ["sloot meerdere straten af", "maakte meerdere straten schoon", "reed door meerdere straten", "zocht in meerdere straten"], answer: 0 }
          - { id: 43pp, type: mc, prompt: "Vad gjorde många som såg älgen?", options: ["De filmade den med sina mobiler.", "De ringde polisen.", "De gav den mat.", "De sprang hem."], answer: 0 }
          - { id: a4aa, type: truefalse, statement: "Passagerarna på bussen blev rädda.", answer: false, correction: { answers: ["{Passagerarna|De|Alla} började skratta.", "{Passagerarna|De} skrattade."] } }
          - { id: cufb, type: mc, prompt: "Vad bör man göra om man ser en älg i staden, enligt polisen?", options: ["hålla avstånd och ringa polisen på 114 14", "ta bilder på nära håll", "försöka leda den till skogen", "ringa tidningen"], answer: 0 }

      - id: makkelijk-1
        title: "Makkelijk lezen: Nyheten"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Nyheten"
        text: |
          I morse läste Bas en nyhet i tidningen. Där stod det att en buss hade kört av vägen nära Västerås. Enligt polisen skadades ingen allvarligt. Bussföraren berättade att det hade snöat mycket. Journalisten frågade om bussen hade haft vinterdäck, men det visste ingen. Polisen stängde av vägen i tre timmar. Många fick vänta länge i bilen. Nu ska kommunen undersöka om något måste göras med vägen.
        items:
          - { id: 4wsy, type: truefalse, statement: "Flera personer skadades allvarligt.", answer: false }
          - { id: 738w, type: truefalse, statement: "Föraren sa att det hade snöat mycket.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Den godaste soppan"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Den godaste soppan"
        text: |
          I fredags lagade eleverna i skolan soppa. Alla undrade vems soppa som var godast. Tre lärare smakade tolv olika soppor. Till slut sa de att Elin hade gjort den godaste soppan. Tidningen skrev en kort artikel om dagen. Elin berättade att hon hade lagat soppan med sin mormor många gånger. Hon fick en bok om mat som pris. Nästa år vill hon vara med igen.
        items:
          - { id: u6fz, type: truefalse, statement: "Lärarna smakade tolv soppor.", answer: true }
          - { id: jevf, type: truefalse, statement: "Elins soppa var den godaste.", answer: true }

