  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-nyheter
        title: "Luisteren: het nieuws"
        instruction: Luister naar het nieuwsbericht. Is de bewering **rätt** of **fel**?
        topic: indirekt-tal-b1
        listen: true
        textTitle: Nyheterna
        text: |
          Här är nyheterna. Kraftigt snöfall i norra Sverige har lett till stora problem i trafiken. Flera tåg mellan Umeå och Luleå är inställda, och på E4:an har flera lastbilar kört av vägen. Ingen har skadats allvarligt.

          Enligt meteorologerna kommer det att fortsätta snöa under natten, men i morgon förmiddag väntas vädret bli bättre. Trafikverket uppmanar alla att undvika onödiga resor.

          Och så sporten: Sverige vann mot Norge med tre–ett i ishockey i går kväll.
        items:
          - { id: b56t, type: truefalse, statement: "Det har snöat mycket i södra Sverige.", answer: false, correction: { answers: ["Det har snöat mycket i norra Sverige.", "Snöfallet är i norra Sverige."] } }
          - { id: jtu8, type: truefalse, statement: "Flera tåg mellan Umeå och Luleå är inställda.", answer: true }
          - { id: ecup, type: truefalse, statement: "Flera personer skadades allvarligt.", answer: false, correction: { answers: ["Ingen har skadats allvarligt.", "Ingen skadades allvarligt."] } }
          - { id: tnjs, type: truefalse, statement: "Vädret väntas bli bättre i morgon förmiddag.", answer: true }
          - { id: ssf5, type: truefalse, statement: "Norge vann matchen.", answer: false, correction: { answers: ["Sverige vann[ matchen].", "Sverige vann mot Norge[ med {tre–ett|3–1}]."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en maak de zin die je hoort.
        topic: indirekt-fraga
        shuffle: true
        items:
          - { id: u38t, type: listen, say: "Hon sa att hon inte kunde komma." }
          - { id: vymy, type: listen, say: "Jag vet inte vem som ringde." }
          - { id: 7a2x, type: listen, say: "Enligt polisen skadades ingen." }
          - { id: m9s9, type: listen, say: "Han frågade om jag ville följa med." }

  - id: praktiskt
    title: Praktiskt · nieuws navertellen
    exercises:
      - id: dialoog-nyhet
        title: Heb je het gehoord?
        instruction: Zet het gesprek in de goede volgorde.
        topic: indirekt-tal-b1
        items:
          - id: rcyw
            type: dialogue
            lines:
              - "Maja: Har du hört om älgen i Uppsala?"
              - "Tom: Nej, vad hände?"
              - "Maja: Det stod i tidningen att en älg gick rakt genom centrum i tisdags."
              - "Tom: På riktigt? Skadades någon?"
              - "Maja: Nej, enligt polisen skadades ingen. Men trafiken stod still i en timme."
              - "Tom: Vad hände med älgen sedan?"
              - "Maja: Polisen sa att de hade lett den tillbaka till skogen."

      - id: wat-zeg-je
        title: Wat zeg je?
        instruction: Kies wat past.
        topic: indirekt-tal-b1
        shuffle: true
        items:
          - { id: bsc8, type: mc, prompt: "Je begint over een nieuwtje.", options: ["Har du hört att …?", "Har du sagt att …?", "Har du frågat att …?", "Har du läst om att du …?"], answer: 0 }
          - { id: t3un, type: mc, prompt: "Je noemt je bron.", options: ["Det stod i tidningen att …", "Det sa i tidningen att …", "Det skrev i tidningen att …", "Tidningen stod att …"], answer: 0, tip: "In het Zweeds: det stod i tidningen (het stond in de krant)." }
          - { id: e2ts, type: mc, prompt: "Je twijfelt of het nieuws klopt.", options: ["Är det verkligen sant? Vad är källan?", "Det är sant eftersom jag läste det.", "Alla nyheter är falska.", "Jag vet inte vem som är sant."], answer: 0 }

      - id: wat-zeg-je-zelf
        title: Wat zeg je? (zelf)
        instruction: Zeg het nu zelf in het Zweeds. Er is vaak meer dan één goed antwoord.
        kind: situatie
        items:
          - { id: 8f9p, type: translate, topic: indirekt-tal-b1, prompt: "Je collega vraagt wat de chef zei. Zeg dat ze zei dat de vergadering wordt verschoven.", answers: ["{Hon|Chefen} {sa|sade} att mötet {skulle flyttas|skulle skjutas upp|flyttas|skjuts upp|har flyttats}."], feedback: [{ contains: "att mötet ska", tip: "Na sa schuift de tijd mee: ska → skulle." }] }
          - { id: fe85, type: translate, topic: indirekt-fraga, prompt: "Vraag beleefd of iemand weet waar het station is.", answers: ["[Ursäkta, ]vet {du|ni} var stationen {ligger|är}?"], feedback: [{ contains: "var ligger stationen", tip: "In een indirecte vraag: onderwerp, dan werkwoord (var stationen ligger)." }] }
          - { id: y53c, type: translate, topic: indirekt-fraga, prompt: "Zeg dat je niet weet wie er gewonnen heeft.", answers: ["Jag vet inte vem som {vann|har vunnit}."], feedback: [{ contains: "vem vann", tip: "Is vem het onderwerp in een indirecte vraag, dan komt er som bij: vem som vann." }] }
          - { id: uvtj, type: translate, topic: indirekt-tal-b1, prompt: "Vertel dat in de krant stond dat de weg is afgesloten.", answers: ["Det stod i tidningen att vägen {är|var} avstängd.", "Tidningen skrev att vägen {är|var} avstängd.", "I tidningen stod det att vägen {är|var} avstängd."] }

  - id: skriva
    title: Skriva · schrijven
    intro: "Schrijfdoel: een samenvatting."
    exercises:
      - id: skriva-sammanfattning
        title: Vat het nieuws samen
        instruction: "Bouw eerst je samenvatting op in vier stappen die de app nakijkt. Daarna schrijf je de hele samenvatting, als je wilt."
        topic: indirekt-tal-b1
        items:
          - { id: enrs, type: mc, prompt: "Welke zin is een goede eerste zin van je samenvatting?", options: ["I tisdags gick en ung älg rakt genom centrala Uppsala.", "Jag tycker att älgar är väldigt fina djur.", "Det här är en text som jag har läst om en älg."], answer: 0, tip: "Een samenvatting begint met wat er gebeurde, waar en wanneer, zonder je eigen mening." }
          - { id: yfgh, type: order, topic: indirekt-tal-b1, prompt: "De politie zei: „Älgen har troligen gått vilse.” Vertel het verder.", start: "Polisen sa att", tokens: ["älgen", "troligen", "hade", "gått", "vilse"], answers: ["Polisen sa att älgen troligen hade gått vilse."] }
          - { id: 58st, type: translate, prompt: "Volgens de politie is dat niet ongewoon.", answers: ["Enligt polisen är {det|detta} {inte ovanligt|inget ovanligt|inte något ovanligt}.", "{Det|Detta} är {inte ovanligt|inget ovanligt|inte något ovanligt}[,] enligt polisen."], feedback: [{ contains: "polisen det är", tip: "Enligt polisen staat vooraan, dus het werkwoord komt op plaats 2: Enligt polisen är det …" }] }
          - { id: zb7b, type: gap, topic: indirekt-fraga, prompt: "Kies het goede woord.", text: "Polisen vet inte ___ såg älgen först.", gaps: [{ answers: ["vem som"], options: ["vem som", "vem", "vilken"], tip: "Is het vraagwoord het onderwerp van de indirecte vraag, dan komt er som achter: vem som såg …" }] }
          - id: 78ks
            type: free
            prompt: "Vat het bericht *Älg på villovägar i centrala Uppsala* samen in 50–80 woorden, in je eigen woorden. Vertel wat er gebeurde, waar en wanneer, en wat de politie zei. Gebruik **enligt** en minstens één keer **sa att**."
            minWords: 45
            require:
              - { any: ["älg", "älgen"], label: "Je noemt de eland" }
              - { any: ["uppsala"], label: "Je noemt waar het gebeurde" }
              - { any: ["enligt"], label: "Je gebruikt enligt" }
              - { any: ["sa att", "berättade att"], label: "Je gebruikt sa att of berättade att" }
              - { any: ["polisen"], label: "Je vertelt wat de politie zei of deed" }
            model: "I tisdags morse gick en ung älg rakt genom centrala Uppsala. Den sågs först vid järnvägsstationen och gick sedan genom stadsparken. Polisen spärrade av flera gator, och trafiken stod still i nästan en timme. Ingen skadades. Polisens presstalesperson sa att älgen troligen hade gått vilse. Enligt polisen är det inte ovanligt att unga älgar kommer in i städer på våren."

