chapter: 24
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kan mijn mening geven en reageren op die van een ander", topics: [asikt] }
  - { text: "Ik kan tegenstelling en tijd uitdrukken met trots att, även om en medan", topics: [subjunktioner-b1] }

grammar:
  - id: asikt
    title: Je mening geven
    summary: "*Jag tycker/anser/menar att …*, *Jag håller med (dig) / Jag håller inte med*, *Å ena sidan … å andra sidan …*, *Visserligen … men …*, *Det beror på*."
    body: |
      | doel | Zweeds |
      |---|---|
      | mening geven | *Jag tycker att …* · *Jag anser att …* (formeler) · *Enligt min mening …* · *Jag är för/emot …* |
      | het eens zijn | *Jag håller med (dig).* · *Där har du rätt.* · *Precis!* |
      | het oneens zijn | *Jag håller inte med.* · *Det tycker inte jag.* · *Det stämmer inte riktigt.* |
      | nuanceren | *Å ena sidan … å andra sidan …* · *Visserligen …, men …* · *Det beror på.* |
      | toegeven | *Det stämmer att …, men …* · *Du har en poäng, men …* |
      | afsluiten | *Sammanfattningsvis …* · *Därför anser jag att …* |

      *hålla med* is een partikelwerkwoord: *Jag håller **med** dig.* – *Det håller jag inte **med** om.*

      Na *tycker att, anser att, menar att* volgt een bijzin: *Jag anser att vi **inte borde** göra det.*

  - id: subjunktioner-b1
    title: Trots att, även om, medan
    summary: "*trots att* = hoewel (feit), *även om* = ook al, zelfs als, *medan* = terwijl, *innan* = voordat, *sedan* = sinds of nadat. Bijzin vooraan → **inversie**: *Trots att det regnade **gick vi** ut.* Met infinitief: *för att / utan att + infinitief*."
    body: |
      | voegwoord | betekenis | voorbeeld |
      |---|---|---|
      | **trots att** | hoewel (iets wat zo is) | *Han gick till jobbet **trots att** han var sjuk.* |
      | **även om** | ook al, zelfs als | *Jag går på festen **även om** det blir sent.* |
      | **fastän** | hoewel (= trots att) | *Hon gick ut **fastän** det var kallt.* |
      | **medan** | terwijl (tijd of tegenstelling) | *Hon lagade mat **medan** han dukade. Hon pratar mycket, **medan** han är tyst.* |
      | **innan** | voordat | *Tvätta händerna **innan** du äter!* |
      | **sedan** | sinds; nadat | ***Sedan** jag flyttade hit har jag lärt mig mycket.* ***Sedan** vi hade ätit, gick vi ut.* |
      | **så att** | zodat | *Prata högre **så att** alla hör!* |

      Na **trots** zonder *att* komt een zelfstandig naamwoord: ***trots** regnet* (ondanks de regen).

      In de hoofdzin na *trots att* zeggen Zweden vaak nog extra *ändå*: *Trots att det regnade gick vi ut **ändå**.* Dat is correct, maar niet nodig.

      *Även om* hoor je ook bij iets wat echt zo is: *Även om det regnade gick vi ut.* Dat is goed Zweeds. Met *trots att* leg je meer nadruk op het feit; bij iets wat (nog) niet vaststaat, past alleen *även om*: *Jag går **även om** det blir sent.*

      ### Woordvolgorde
      Het zijn bijzinnen: *inte* vóór het werkwoord. Staat de bijzin **vooraan**, dan begint de hoofdzin met het **werkwoord** (V2):

      - ***Trots att** hon inte hade tid, **hjälpte hon** mig.*
      - ***Även om** det kostar pengar, **tror jag** att det är värt det.*

      ### Met een infinitief
      - **för att** + infinitief = om te: *Jag flyttade hit **för att** jobba.*
      - **utan att** + infinitief = zonder te: *Han gick **utan att** säga hej då.*

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-arbetsvecka
        title: "Lezen: een vierdaagse werkweek?"
        instruction: Lees de twee meningen en beantwoord de vragen.
        topic: asikt
        textTitle: Ska vi införa fyra dagars arbetsvecka?
        text: |
          I flera länder har företag testat att låta personalen jobba fyra dagar i veckan med samma lön. Nu diskuteras frågan även i Sverige. Vi frågade två personer vad de tycker.

          **Ja, säger Lina Ek, 34, sjuksköterska.** Jag tycker att vi borde testa det. Många är utbrända och sjukskrivna, och med en extra ledig dag skulle vi hinna vila. Själv jobbar jag natt varannan vecka, och när jag kommer hem är jag ofta så trött att jag inte orkar laga mat eller träffa vänner. Dessutom visar försök i andra länder att folk jobbar mer effektivt när de är utvilade. Även om det kostar pengar i början, tror jag att samhället tjänar på det i längden.

          **Nej, säger Per Holm, 58, företagare.** Visserligen låter det trevligt, men jag håller inte med. Trots att det kanske fungerar på kontor, är det omöjligt inom vården och i butiker, där någon alltid måste finnas på plats. I min egen butik har vi redan svårt att hitta personal, och om alla skulle jobba en dag mindre, skulle jag behöva anställa två personer till. Medan vissa får mer fritid, måste andra jobba mer. Jag anser att det är bättre att låta folk själva välja hur mycket de vill jobba. Själv har jag jobbat sex dagar i veckan sedan jag startade företaget, men det är mitt eget val.
        items:
          - { id: ngbb, type: mc, prompt: "Vad jobbar Lina med?", options: ["Hon är sjuksköterska.", "Hon är företagare.", "Hon är lärare.", "Hon är politiker."], answer: 0 }
          - { id: vv2a, type: truefalse, statement: "Lina tycker att man borde testa fyra dagars arbetsvecka.", answer: true }
          - { id: 4cux, type: mc, prompt: "Varför tror Lina att folk skulle jobba mer effektivt?", options: ["för att de skulle vara utvilade", "för att de skulle få högre lön", "för att de skulle jobba hemifrån", "för att chefen skulle bestämma mer"], answer: 0 }
          - { id: mhwh, type: truefalse, statement: "Per håller med Lina.", answer: false, correction: { answers: ["{Per|Han} håller inte med {Lina|henne}.", "{Per|Han} håller inte med."] } }
          - { id: 8znp, type: mc, prompt: "Var fungerar fyra dagars arbetsvecka inte, enligt Per?", options: ["inom vården och i butiker", "på kontor", "på universitet", "överallt"], answer: 0 }
          - { id: yyu8, type: mc, prompt: "Vad föreslår Per i stället?", options: ["att folk själva får välja hur mycket de jobbar", "att alla jobbar sex dagar", "att lönen höjs", "att butikerna stänger"], answer: 0 }
          - id: 78z8
            type: multi
            prompt: "Welke uitdrukkingen in de tekst nuanceren of geven iets toe?"
            options: ["Visserligen låter det trevligt, men …", "Även om det kostar pengar …", "Trots att det kanske fungerar på kontor …", "Jag tycker att vi borde testa det.", "Dessutom visar försök …"]
            answers: [0, 1, 2]
          - { id: cxca, type: mc, prompt: "Varför är Lina ofta trött när hon kommer hem?", options: ["Hon jobbar natt varannan vecka.", "Hon har lång väg till jobbet.", "Hon tränar varje kväll.", "Hon har tre små barn."], answer: 0 }
          - { id: akkw, type: truefalse, statement: "Per har svårt att hitta personal till sin butik.", answer: true }
          - { id: 85gq, type: truefalse, statement: "Per jobbar fyra dagar i veckan.", answer: false, correction: { answers: ["{Per|Han} {jobbar|har jobbat} sex dagar i veckan."] } }

      - id: makkelijk-1
        title: "Makkelijk lezen: Fyra dagar i veckan"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Fyra dagar i veckan"
        text: |
          Företaget där Kees jobbar testar en fyradagarsvecka. Kees tycker att det är en bra idé, eftersom han får mer tid med barnen. Hans kollega Anna håller inte med. Hon anser att det blir för stressigt, även om man har en extra ledig dag. Chefen ska bestämma efter sommaren. Många andra företag följer testet med intresse. Om det fungerar kan fler införa samma system.
        items:
          - { id: asea, type: truefalse, statement: "Anna tycker att fyradagarsveckan är en bra idé.", answer: false }
          - { id: bary, type: truefalse, statement: "Chefen ska bestämma efter sommaren.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Valet"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Valet"
        text: |
          I september är det val i Sverige. Trots att Kees har bott i Sverige i fem år får han inte rösta i riksdagsvalet, eftersom han inte är svensk medborgare. Men han får rösta i valet till kommunen. Medan hans fru redan har bestämt sig, läser Kees fortfarande om partierna. Han tycker att det är viktigt att rösta. Därför vill han söka medborgarskap längre fram.
        items:
          - { id: qt68, type: truefalse, statement: "Kees får rösta i valet till kommunen.", answer: true }
          - { id: auhw, type: truefalse, statement: "Kees har redan bestämt sig.", answer: false }

      - id: makkelijk-3
        title: "Makkelijk lezen: Biblioteket"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Biblioteket"
        text: |
          Kommunen vill stänga biblioteket i Erikas by för att spara pengar. Erika anser att det är fel. Hon menar att biblioteket är viktigt för både barn och äldre, även om det inte har så många besökare. Hennes granne håller inte med. Han tycker att man kan läsa böcker på nätet i stället. På ett möte i kommunen säger Erika vad hon tycker. Efter mötet bestämmer politikerna att biblioteket får vara kvar ett år till.
        items:
          - { id: yvts, type: truefalse, statement: "Erika vill att biblioteket stängs.", answer: false }
          - { id: kb92, type: mc, prompt: "Vad tycker grannen?", options: ["Att man kan läsa på nätet.", "Att biblioteket ska bli större.", "Att han inte vet."], answer: 0 }
          - { id: egzg, type: truefalse, statement: "Biblioteket får vara kvar ett år till.", answer: true }

      - id: makkelijk-4
        title: "Makkelijk lezen: I föreningen"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en beantwoord de vragen.
        topic: woordenschat
        kind: makkelijk
        textTitle: "I föreningen"
        text: |
          Varje lördag hjälper Hugo till i en förening för människor som nyss har kommit till Sverige. Han hjälper barnen med läxorna medan föräldrarna går på en svenskkurs. Han jobbar fyra timmar varje gång, trots att han inte får betalt. Hugo anser ändå att det är värt det. Han har lärt sig mycket om andra länder, och han har fått nya vänner. Enligt honom borde fler unga hjälpa till.
        items:
          - { id: fd7p, type: mc, prompt: "Vad gör Hugo i föreningen?", options: ["Han lagar mat.", "Han hjälper barnen med läxorna.", "Han kör bil."], answer: 1 }
          - { id: 3ukx, type: truefalse, statement: "Hugo får betalt.", answer: false }
          - { id: 8w7c, type: truefalse, statement: "Hugo tycker att fler unga borde hjälpa till.", answer: true }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: ord-samhalle
        title: Samenleving
        instruction: Koppel het woord aan de betekenis.
        topic: woordenschat
        items:
          - id: uem4
            type: match
            pairs:
              - ["ett samhälle", "een samenleving"]
              - ["införa", "invoeren"]
              - ["en fördel", "een voordeel"]
              - ["en nackdel", "een nadeel"]
              - ["utbränd", "opgebrand (burn-out)"]
              - ["i längden", "op den duur"]
          - id: nvqb
            type: match
            pairs:
              - ["hålla med", "het eens zijn"]
              - ["anse", "vinden, menen (formeel)"]
              - ["visserligen", "weliswaar"]
              - ["en åsikt", "een mening"]
              - ["en debatt", "een debat"]
              - ["tjäna på", "baat hebben bij"]

      - id: asikt-sorteren
        title: Eens of oneens?
        instruction: Is de spreker het eens, oneens, of zie je beide kanten?
        topic: asikt
        items:
          - id: 2pnm
            type: sort
            categories: ["eens", "oneens", "beide kanten"]
            items:
              - { text: "Jag håller helt med dig.", cat: 0 }
              - { text: "Där har du rätt.", cat: 0 }
              - { text: "Jag håller inte alls med.", cat: 1 }
              - { text: "Det tycker inte jag.", cat: 1 }
              - { text: "Å ena sidan är det dyrt, å andra sidan är det bra.", cat: 2 }
              - { text: "Det beror på.", cat: 2 }

      - id: asikt-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds.
        topic: asikt
        items:
          - { id: ajxr, type: translate, prompt: "Ik ben het met je eens.", answers: ["Jag håller med dig.", "Jag håller med."], feedback: [{ contains: "är enig", tip: "är enig med bestaat, maar is formeel en zeldzaam. Gewoner: Jag håller med (dig)." }] }
          - { id: q7hm, type: translate, prompt: "Daar ben ik het niet mee eens.", answers: ["Det håller jag inte med om.", "Jag håller inte med om det."], feedback: [{ contains: "håller inte med det", tip: "Het eens zijn met iets: hålla med om. Det håller jag inte med om." }] }
          - { id: 7j26, type: translate, prompt: "Volgens mij is dat te duur.", answers: ["Jag {tycker|anser|menar|tror}[ att] det är för dyrt.", "Enligt mig är det för dyrt.", "Det är för dyrt enligt mig.", "Enligt min mening är det för dyrt."], feedback: [{ contains: "för dyr ", tip: "det is een ett-vorm: för dyrt." }, { contains: "enligt mig det är", tip: "Na enligt mig: inversie, enligt mig är det." }] }
          - id: c6ng
            type: translate
            prompt: "Ik ben het niet met je eens, maar je hebt wel een punt."
            answers: ["Jag håller inte med [dig], men du har {ändå |faktiskt |}en poäng."]
            feedback:
              - { contains: "håller med inte", tip: "*inte* staat vóór het partikel: *jag håller inte med*." }
          - id: rwfw
            type: translate
            prompt: "Enerzijds is het duur, anderzijds zouden veel mensen er baat bij hebben."
            answers: ["Å ena sidan är det dyrt, [men ]å andra sidan skulle många [människor ]{tjäna på det|ha nytta av det}."]
            feedback:
              - { contains: "å ena sidan det", tip: "Na *å ena sidan* vooraan: inversie, *å ena sidan är det*." }
              - { contains: "å andra sidan många", tip: "Na *å andra sidan* vooraan: inversie, *å andra sidan skulle många*." }
              - { contains: "är det dyr ", tip: "Bij *det är* krijgt het bijvoeglijk naamwoord -t: *dyrt*." }
          - { id: w548, type: translate, prompt: "Ik vind dat de nationale feestdag in Zweden meer gevierd zou moeten worden.", answers: ["Jag {tycker|anser|menar} att nationaldagen {borde|bör} firas mer i Sverige.", "Jag {tycker|anser|menar} att nationaldagen i Sverige {borde|bör} firas mer.", "Jag {tycker|anser|menar} att {den svenska nationaldagen|Sveriges nationaldag} {borde|bör} firas mer.", "Jag {tycker|anser|menar} att {man|vi} {borde|bör} fira nationaldagen mer i Sverige.", "Jag {tycker|anser|menar} att {man|vi} i Sverige {borde|bör} fira nationaldagen mer."], feedback: [{ contains: ["nationaldagen borde fira", "nationaldagen bör fira", "sverige borde fira mer", "sverige bör fira mer"], tip: "De feestdag viert niet zelf: lijdend, *nationaldagen borde firas*." }, { contains: ["borde att", "bör att"], tip: "Na *borde* en *bör*: de infinitief zonder *att*." }] }

  - id: subjunktioner
    title: "Grammatik: trots att, även om, medan"
    exercises:
      - id: subj-kiezen
        title: Het goede voegwoord
        instruction: Kies wat past.
        topic: subjunktioner-b1
        shuffle: true
        items:
          - { id: 7sjd, type: gap, text: "___ det regnade, gick vi ut ändå.", gaps: [{"answers": ["Trots att"], "options": ["Trots att", "Eftersom", "Så att"], "shuffle": false, "feedback": [{"match": "Eftersom", "tip": "Eftersom = omdat. Hier is het een tegenstelling (ondanks dat): trots att."}]}] }
          - { id: e27x, type: gap, text: "Jag tänker gå på festen ___ det blir sent.", gaps: [{"answers": ["även om"], "options": ["även om", "medan", "sedan"], "shuffle": false, "tip": "Zelfs als (het nog moet gebeuren): även om.", "feedback": [{"match": "medan", "tip": "Medan = terwijl. Ook al: även om."}]}] }
          - { id: j6uc, type: gap, text: "Hon lagade mat ___ han dukade bordet. De gjorde det samtidigt.", gaps: [{"answers": ["medan"], "options": ["medan", "så att", "trots att"], "shuffle": false, "feedback": [{"match": "trots att", "tip": "Ze deden het tegelijk: medan (terwijl)."}]}] }
          - { id: 9vp3, type: gap, text: "Tvätta händerna ___ du äter!", gaps: [{ answers: ["innan"], options: ["innan", "medan", "sedan"], shuffle: false, feedback: [{ match: "sedan", tip: "sedan = sinds of daarna. Voordat = innan." }] }] }
          - { id: rz3e, type: gap, text: "___ jag flyttade hit, har jag lärt mig mycket.", gaps: [{ answers: ["Sedan"], options: ["Sedan", "Innan", "Medan"], shuffle: false }] }
          - { id: 54qj, type: gap, text: "Hon pratar mycket, ___ han är tyst.", gaps: [{"answers": ["medan"], "options": ["medan", "trots att", "innan"], "shuffle": false, "tip": "Een tegenstelling tussen twee mensen: medan.", "feedback": [{"match": "trots att", "tip": "Twee mensen tegenover elkaar (zij wel, hij niet): medan."}]}] }
          - { id: 2jja, type: gap, text: "Jag flyttade till Sverige ___ jobba.", gaps: [{"answers": ["för att"], "options": ["för att", "utan att", "så att"], "shuffle": false, "feedback": [{"match": "så att", "tip": "Om te + werkwoord: för att. Na så att (zodat) volgt een hele zin."}]}] }
          - { id: vcak, type: gap, text: "Han lämnade festen ___ säga hej då till någon.", gaps: [{"answers": ["utan att"], "options": ["för att", "utan att", "så att"], "shuffle": false, "feedback": [{"match": "för att", "tip": "Hij ging weg zonder gedag te zeggen: utan att."}]}] }

      - id: subj-combineren
        title: Twee zinnen worden één
        instruction: Maak één zin met het voegwoord tussen haakjes. Begin met het voegwoord.
        topic: subjunktioner-b1
        items:
          - { id: pz9s, type: transform, prompt: "Det regnade. Vi gick ut ändå. (trots att)", answers: ["Trots att det regnade[,] gick vi ut[ ändå]."], feedback: [{ contains: "regnade vi gick", tip: "Na de bijzin vooraan: eerst het werkwoord, gick vi." }] }
          - { id: w4gk, type: transform, prompt: "Han var sjuk. Han gick till jobbet ändå. (trots att)", answers: ["Trots att han var sjuk[,] gick han till jobbet[ ändå]."], feedback: [{ contains: "sjuk han gick", tip: "Inversie in de hoofdzin: gick han." }] }
          - { id: s8yq, type: transform, prompt: "Jag åt frukost. Sedan gick jag. (innan)", answers: ["Innan jag gick[,] åt jag frukost."], feedback: [{ contains: "gick jag åt", tip: "In de innan-zin: bijzinvolgorde, innan jag gick." }] }
          - { id: 9kjf, type: transform, prompt: "Hon hade inte tid. Hon hjälpte mig ändå. (trots att)", answers: ["Trots att hon inte hade tid[,] hjälpte hon mig[ ändå]."], feedback: [{ contains: "hade inte tid", tip: "In de bijzin staat inte vóór het werkwoord: hon inte hade." }] }
          - { id: x6b7, type: transform, prompt: "Jag var trött. Jag kunde inte sova. (fastän)", answers: ["Fastän jag var trött[,] kunde jag inte sova."], feedback: [{ contains: "trött jag kunde", tip: "Na de bijzin vooraan: eerst het werkwoord, kunde jag." }] }
          - { id: hvdx, type: transform, prompt: "Vi kom hem. Då började det regna. (när)", answers: ["När vi kom hem[,] började det regna."], feedback: [{ contains: "hem det började", tip: "Na de bijzin vooraan: eerst het werkwoord, började det." }] }
          - { id: wthp, type: transform, prompt: "Du är klar. Då kan vi gå. (när)", answers: ["När du är klar[,] kan vi gå."], feedback: [{ contains: "klar vi kan", tip: "Na de bijzin vooraan: eerst het werkwoord, kan vi." }] }
          - { id: ffa8, type: transform, prompt: "Han hade ätit. Sedan gick han ut. (efter att)", answers: ["Efter att han hade ätit[,] gick han ut.", "Efter att ha ätit[,] gick han ut."], feedback: [{ contains: "ätit han gick", tip: "Na de bijzin vooraan: eerst het werkwoord, gick han." }] }

      - id: subj-zinsbouw
        title: Zinnen bouwen
        instruction: Zet de woorden in de goede volgorde.
        topic: subjunktioner-b1
        shuffle: true
        items:
          - { id: q67s, type: order, start: "Även om det kostar pengar,", tokens: ["tror", "jag", "att", "det", "är", "värt det"], answers: ["Även om det kostar pengar, tror jag att det är värt det."] }
          - { id: fjjg, type: order, start: "Jag anser att", tokens: ["vi", "inte", "borde", "införa", "det"], answers: ["Jag anser att vi inte borde införa det."] }
          - { id: wg7p, type: order, start: "Medan vissa får mer fritid,", tokens: ["måste", "andra", "jobba", "mer"], answers: ["Medan vissa får mer fritid, måste andra jobba mer."] }
          - { id: vf46, type: order, start: "Eftersom priserna stiger,", tokens: ["måste", "många", "familjer", "spara"], answers: ["Eftersom priserna stiger, måste många familjer spara."] }
          - { id: cmay, type: order, start: "Jag tycker att", tokens: ["man", "inte", "ska", "förbjuda", "det"], answers: ["Jag tycker att man inte ska förbjuda det."] }
          - { id: 5t4d, type: order, start: "Om fler cyklade,", tokens: ["skulle", "luften", "bli", "bättre"], answers: ["Om fler cyklade, skulle luften bli bättre."] }
          - { id: tzme, type: order, start: "Trots att det är dyrt,", tokens: ["väljer", "många", "ekologiskt"], answers: ["Trots att det är dyrt, väljer många ekologiskt."] }
          - { id: s3wc, type: order, start: "Det är viktigt att", tokens: ["alla", "får", "säga", "sin åsikt"], answers: ["Det är viktigt att alla får säga sin åsikt."] }

      - id: subj-vertalen
        title: Vertaal
        instruction: Vertaal naar het Zweeds. Let op de woordvolgorde in de bijzin en in de hoofdzin.
        topic: subjunktioner-b1
        shuffle: true
        items:
          - id: 3jgh
            type: translate
            prompt: "Hoewel het regende, gingen we naar het debat in het stadhuis."
            answers:
              - "{Trots att|Fastän|Även om} det regnade[,] gick vi [ändå ]till debatten i stadshuset."
