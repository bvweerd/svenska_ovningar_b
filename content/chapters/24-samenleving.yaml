  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-enkat
        title: "Luisteren: een enquête"
        instruction: Luister naar het fragment uit een podcast. Is de bewering **rätt** of **fel**?
        topic: asikt
        listen: true
        textTitle: Vad tycker svenskarna?
        text: |
          Välkommen till veckans avsnitt. Vi har frågat tusen personer vad de tycker om fyra dagars arbetsvecka. Sex av tio svarade att de skulle vilja jobba fyra dagar i veckan, även om lönen blev något lägre.

          De yngre var mest positiva. Bland personer över sextio var däremot bara var tredje positiv. Många av dem menade att det skulle bli svårt för företagen.

          Trots att många är positiva, tror bara ett fåtal att det kommer att införas inom de närmaste tio åren.
        items:
          - { id: jaf5, type: truefalse, statement: "Man har frågat tusen personer.", answer: true }
          - { id: bged, type: truefalse, statement: "Fyra av tio vill jobba fyra dagar i veckan.", answer: false, correction: { answers: ["Sex av tio vill jobba fyra dagar i veckan.", "Sex av tio svarade att de skulle vilja jobba fyra dagar[ i veckan]."] } }
          - { id: t52v, type: truefalse, statement: "De äldre var mest positiva.", answer: false, correction: { answers: ["De yngre var mest positiva."] } }
          - { id: s5wt, type: truefalse, statement: "Många tror att det kommer att införas snart.", answer: false, correction: { answers: ["Bara ett fåtal tror att det kommer att införas[ inom de närmaste tio åren]."] } }

      - id: lyssna-dictee
