chapter: 28
# Kan-doen-uitspraken: de app vinkt ze zelf af als de vragen over deze onderwerpen
# grotendeels in doos 3 of hoger staan (src/progress.js, canDoStatus).
canDo:
  - { text: "Ik kies tussen formeel, neutraal en informeel taalgebruik", topics: [register] }
  - { text: "Ik begrijp veelgebruikte Zweedse uitdrukkingen", topics: [idiom] }

grammar:
  - id: register
    title: Formeel, neutraal en informeel
    summary: "Formeel: *erhålla, meddela, dock, vänligen*, lijdende vormen. Informeel: *tja, typ, sjukt kul, ses!* en spreektaalspelling (*dom, mej, nåt*). Schrijf **de** (onderwerp, = vi) en **dem** (voorwerp, = oss), ook al zeg je *dom*. Vóór een zelfstandig naamwoord altijd **de**: *de här skorna*."
    body: |
      | | formeel | neutraal | informeel |
      |---|---|---|---|
      | groet | *Bästa kund,* | *Hej!* | *Tja! Hallå!* |
      | krijgen | *erhålla* | *få* | *få* |
      | zeggen | *meddela* | *säga, berätta* | *säga* |
      | maar | *dock* | *men* | *men* |
      | dus | *således* | *alltså, så* | *så* |
      | heel | *mycket* | *väldigt* | *jätte-, sjukt, fett* |
      | afsluiting | *Med vänlig hälsning* | *Vänliga hälsningar* | *Hörs! Kram! Ses!* |

      Formele teksten gebruiken ook vaker **lijdende vormen** (*Ansökan ska skickas …*) en **nominalisaties** (hoofdstuk 25).

      ### Spreektaal op papier
      In sms'jes en chats schrijven Zweden vaak zoals ze praten. In een nette tekst gebruik je de standaardvorm:

      | spreektaal | standaard |
      |---|---|
      | dom | **de** (onderwerp) / **dem** (voorwerp) |
      | mej, dej, sej | mig, dig, sig |
      | nån, nåt, nåra | någon, något, några |
      | sen | sedan / senare |
      | va | vad / var |

      *Sen* is ook in gewone geschreven tekst heel gangbaar (*Vad gör du sen?*). Alleen in een echt formele tekst kies je *sedan* of *senare*.

      **de of dem?** Kun je het vervangen door *vi*, dan **de**. Door *oss*, dan **dem**. *De (vi) kommer i morgon. Jag såg dem (oss) i går.*

      Die test werkt alleen als *de/dem* los staat. Vóór een zelfstandig naamwoord is *de* een lidwoord of aanwijzend woord en schrijf je altijd **de**, ook als voorwerp: *Jag köpte **de** här skorna. Jag träffade **de** nya grannarna.*

  - id: idiom
    title: Zweedse uitdrukkingen
    summary: "*Det är ingen ko på isen* (geen haast), *glida in på en räkmacka* (zonder moeite succes hebben), *inte för allt smör i Småland* (voor geen goud), *ha is i magen* (kalm blijven), *kasta yxan i sjön* (de handdoek in de ring gooien)."
    body: |
      | Zweeds | letterlijk | betekenis |
      |---|---|---|
      | *Det är ingen ko på isen.* | er staat geen koe op het ijs | geen probleem, geen haast |
      | *glida in på en räkmacka* | binnenglijden op een garnalenbroodje | zonder moeite succes hebben |
      | *inte för allt smör i Småland* | niet voor alle boter in Småland | voor geen goud |
      | *ha is i magen* | ijs in de buik hebben | kalm blijven |
      | *kasta yxan i sjön* | de bijl in het meer gooien | de handdoek in de ring gooien |
      | *ana ugglor i mossen* | uilen in het moeras vermoeden | onraad ruiken |
      | *gå som katten kring het gröt* | als de kat om de hete pap lopen | om de hete brij heen draaien |
      | *ta det med en nypa salt* | met een snufje zout nemen | met een korreltje zout nemen |
      | *gå över ån efter vatten* | over de rivier gaan om water te halen | het jezelf onnodig moeilijk maken |
      | *få skägg i brevlådan* | een baard in de brievenbus krijgen | betrapt worden, in verlegenheid raken |

      Uitdrukkingen maken je Zweeds levendig, maar gebruik ze in een formele tekst spaarzaam.

sections:
  - id: lasa
    title: Läsa · lezen
    exercises:
      - id: lasa-svenska
        title: "Lezen: welk Zweeds spreek jij?"
        instruction: Lees de tekst en beantwoord de vragen.
        topic: register
        textTitle: Vilken svenska talar du?
        text: |
          Svenska låter inte likadant överallt. En person från Malmö och en person från Luleå kan ha svårt att förstå varandras dialekter, och i Finland har omkring fem procent av befolkningen svenska som modersmål. I Skåne uttalar många r-ljudet långt bak i munnen, ungefär som på danska, och i norra Sverige har språket en helt annan melodi. Finlandssvenskan har några egna ord, men de flesta svenskar förstår den utan problem.

          I storstädernas förorter har det dessutom vuxit fram ett eget sätt att prata, ibland kallat förortssvenska, med ord från bland annat arabiska och turkiska. Ord som *yalla* (skynda dig) och *len* (kompis) används i dag av många unga, oavsett var deras föräldrar kommer ifrån. Vissa vuxna ser förortssvenskan som dålig svenska, men språkforskare håller inte med. De menar att det är ett register som ungdomarna använder med sina vänner, och att samma ungdomar ofta byter till standardsvenska i skolan eller på en arbetsintervju.

          Sverige har också fem nationella minoritetsspråk: samiska, finska, meänkieli, romani chib och jiddisch. Meänkieli talas framför allt i Tornedalen i norra Sverige. Alla fem har en särskild ställning i lagen. I vissa kommuner har man dessutom rätt att använda samiska, finska eller meänkieli i kontakt med myndigheterna.

          Men alla svenskar byter också språk efter situationen. Samma person som skriver ”tja, ses sen?” till en kompis skriver ”Hej! Jag återkommer så snart som möjligt” till en kund. Att kunna växla mellan olika register är en viktig del av att behärska ett språk – kanske den svåraste.

          Ett brev från en myndighet ser helt annorlunda ut än ett sms. I brevet står det kanske ”Er ansökan har inkommit och kommer att behandlas inom fyra veckor”, medan en kompis bara skriver ”fick ditt mejl, kollar sen”. Båda meddelandena säger ungefär samma sak, men de hör hemma i olika situationer. Den som skriver som i ett sms till en myndighet riskerar att inte bli tagen på allvar.

          För den som lär sig svenska som vuxen är de idiomatiska uttrycken ofta en extra utmaning. Vad menar kollegan när hon säger ”det är ingen ko på isen”? Och varför ska man inte kasta yxan i sjön? Sådana uttryck ska man sällan ta bokstavligen, men de gör språket levande. Många av dem finns dessutom bara i svenskan och går inte att översätta ord för ord. Ett gott råd är att först lyssna på hur andra använder dem i vardagen innan man testar dem själv – och att spara dem till fikarasten snarare än till jobbansökan.
        items:
          - { id: fab2, type: truefalse, statement: "Svenska låter likadant i hela Sverige.", answer: false, correction: { answers: ["Svenska låter inte likadant överallt."] } }
          - { id: tab9, type: mc, prompt: "Hur många procent av befolkningen i Finland har svenska som modersmål?", options: ["omkring fem procent", "omkring femtio procent", "ingen", "alla"], answer: 0 }
          - { id: zvdy, type: mc, prompt: "Vad betyder *len* på förortssvenska?", options: ["kompis", "skynda dig", "hej", "pengar"], answer: 0 }
          - { id: rrkk, type: truefalse, statement: "Bara unga med föräldrar från andra länder använder förortssvenska ord.", answer: false, correction: { answers: ["Många unga använder dem[,] oavsett var deras föräldrar kommer ifrån."] } }
          - { id: uaye, type: mc, prompt: "Hur många nationella minoritetsspråk har Sverige?", options: ["fem", "tre", "två", "tio"], answer: 0 }
          - { id: wjx7, type: mc, prompt: "Vad är enligt texten kanske det svåraste med att behärska ett språk?", options: ["att växla mellan olika register", "att förstå dialekter", "att lära sig slang", "att stava rätt"], answer: 0 }
          - { id: y7pw, type: mc, prompt: "Hur ser språkforskarna på förortssvenskan enligt texten?", options: ["som ett register som ungdomarna använder med sina vänner", "som dålig svenska", "som ett nytt minoritetsspråk", "som en dialekt från Skåne"], answer: 0 }
          - { id: egjp, type: truefalse, statement: "Ungdomar som pratar förortssvenska kan bara prata på det sättet.", answer: false, correction: { answers: ["{De|Många|Samma ungdomar} byter ofta till standardsvenska[ i skolan eller på en arbetsintervju].", "{De|Många|Samma ungdomar} kan [också ]byta till standardsvenska[ i skolan eller på en arbetsintervju]."] } }
          - { id: hgdy, type: mc, prompt: "I vilket register är meningen ”Er ansökan har inkommit och kommer att behandlas inom fyra veckor” skriven?", options: ["formellt", "informellt", "på förortssvenska", "på dialekt"], answer: 0, tip: "inkommit en de lijdende vorm behandlas horen bij formele taal." }
          - { id: adzt, type: mc, prompt: "Vilket råd skulle textens författare troligen ge till någon som ska skriva en jobbansökan?", options: ["Skriv formellt och undvik idiomatiska uttryck.", "Använd så många uttryck som möjligt.", "Skriv som du pratar med dina vänner.", "Skriv på din egen dialekt."], answer: 0, tip: "Lees de laatste zin: waar bewaar je de uitdrukkingen voor?" }

      - id: makkelijk-1
        title: "Makkelijk lezen: Dialekter"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Dialekter"
        text: |
          Saskia bor i Skåne och har vant sig vid den skånska dialekten. När hon besökte en vän i Umeå förstod hon först inte allt. Vännen pratade snabbt och använde ord som Saskia aldrig hade hört. Efter några dagar gick det bättre. Nu tycker Saskia att det är roligt med olika dialekter. Hon har också märkt att samma ord kan låta helt olika i olika delar av landet. I norr pratar många långsammare än i söder. Hennes vän skrattade vänligt när Saskia försökte härma dialekten.
        items:
          - { id: 3cd6, type: truefalse, statement: "Saskia förstod allt direkt i Umeå.", answer: false }
          - { id: xsbg, type: truefalse, statement: "Saskia bor i Skåne.", answer: true }

      - id: makkelijk-2
        title: "Makkelijk lezen: Formellt eller vardagligt"
        instruction: Een korte tekst met woorden die je al kent. Lees hem vlot door en kies rätt of fel.
        topic: woordenschat
        kind: makkelijk
        textTitle: "Formellt eller vardagligt"
        text: |
          På jobbet skriver Niels formella mejl till kunderna, till exempel ”Vänligen återkom senast på fredag.” Till kollegorna skriver han i stället ”Hörs på fredag!” Han har lärt sig att välja rätt register beroende på vem han skriver till. I början blandade han ihop dem, men nu går det av sig självt. Hans chef har gett honom ett bra råd: om man är osäker, är det bättre att vara lite för formell än för vardaglig. Med tiden lär man känna kunderna, och då kan tonen bli lite lättare.
        items:
          - { id: k48y, type: truefalse, statement: "Niels skriver likadant till alla.", answer: false }
          - { id: h836, type: truefalse, statement: "Niels skriver formellt till kunderna.", answer: true }

  - id: ord
    title: Ord och fraser · woorden en uitdrukkingen
    exercises:
      - id: formeel-gewoon
        title: Formeel en gewoon
        instruction: Koppel het formele woord aan het gewone woord.
        topic: register
        items:
          - id: q6zb
            type: match
            pairs:
              - ["erhålla", "få"]
              - ["meddela", "säga, berätta"]
              - ["påbörja", "börja"]
              - ["bistå", "hjälpa"]
              - ["dock", "men"]
              - ["således", "alltså"]

      - id: idiomen-koppelen
        title: Uitdrukkingen
        instruction: Koppel de uitdrukking aan de betekenis.
        topic: idiom
        items:
          - id: s4rq
            type: match
            pairs:
              - ["Det är ingen ko på isen.", "Er is geen haast."]
              - ["glida in på en räkmacka", "zonder moeite succes hebben"]
              - ["inte för allt smör i Småland", "voor geen goud"]
              - ["ha is i magen", "kalm blijven"]
              - ["kasta yxan i sjön", "de handdoek in de ring gooien"]
              - ["ana ugglor i mossen", "onraad ruiken"]

  - id: register
    title: "Grammatik: register"
    exercises:
      - id: register-sorteren
        title: Formeel, neutraal of informeel?
        instruction: In welk register staat de zin?
        topic: register
        items:
          - id: dh3v
            type: sort
            categories: ["formeel", "neutraal", "informeel"]
            items:
              - { text: "Tja, läget?", cat: 2 }
              - { text: "Hej, hur mår du?", cat: 1 }
              - { text: "Vi ber er vänligen att kontakta kundtjänst.", cat: 0 }
              - { text: "Det var sjukt kul!", cat: 2 }
              - { text: "Ansökan ska ha inkommit senast den 1 maj.", cat: 0 }
              - { text: "Kan du ringa mig i morgon?", cat: 1 }
              - { text: "Härmed bekräftar vi er bokning.", cat: 0 }
              - { text: "Ses sen!", cat: 2 }

      - id: de-dem
        title: De of dem?
        instruction: "Kies **de** of **dem**. Tip: *vi* → de, *oss* → dem."
        topic: register
        shuffle: true
        items:
          - { id: n5ed, type: gap, text: "___ kommer i morgon.", gaps: [{ answers: ["De"], options: ["De", "Dem"], shuffle: false }] }
          - { id: f7hn, type: gap, text: "Jag såg ___ på stationen.", gaps: [{ answers: ["dem"], options: ["de", "dem"], shuffle: false, feedback: [{ match: "de", tip: "Jag såg oss → dem." }] }] }
          - { id: be58, type: gap, text: "Har du pratat med ___?", gaps: [{ answers: ["dem"], options: ["de", "dem"], shuffle: false, tip: "Na een voorzetsel: dem (med oss)." }] }
          - { id: 6jwa, type: gap, text: "Jag vet inte vad ___ vill.", gaps: [{ answers: ["de"], options: ["de", "dem"], shuffle: false, feedback: [{ match: "dem", tip: "vad vi vill → de." }] }] }
          - { id: 7a4c, type: gap, text: "___ här skorna är för små.", gaps: [{ answers: ["De"], options: ["De", "Dem"], shuffle: false, tip: "Aanwijzend vóór een zelfstandig naamwoord: de här." }] }
          - { id: 5jja, type: gap, text: "Jag ringde ___ i går.", gaps: [{ answers: ["dem"], options: ["de", "dem"], shuffle: false, feedback: [{ match: "de", tip: "Jag ringde oss → dem." }] }] }
          - { id: q27n, type: gap, text: "Vet du om ___ har ätit?", gaps: [{ answers: ["de"], options: ["de", "dem"], shuffle: false, feedback: [{ match: "dem", tip: "om vi har ätit → de." }] }] }
          - { id: gkmk, type: gap, text: "Vi bjöd ___ på middag.", gaps: [{ answers: ["dem"], options: ["de", "dem"], shuffle: false }] }

      - id: standaard
        title: Schrijf het netjes
        instruction: Schrijf het sms'je in standaard Zweeds.
        topic: register
        items:
          - { id: d3cw, type: transform, prompt: "Jag vet inte vad dom vill.", answers: ["Jag vet inte vad de vill."], feedback: [{ contains: "vad dem", tip: "vad vi vill → de." }] }
          - { id: ry7v, type: transform, prompt: "Kan du hjälpa mej med nåt?", answers: ["Kan du hjälpa mig med {något|någonting}?"] }
          - { id: bch5, type: transform, prompt: "Jag såg dom i går.", answers: ["Jag såg dem {i går|igår}."], feedback: [{ contains: "såg de", tip: "Jag såg oss → dem." }] }
          - { id: ubzd, type: transform, prompt: "Va gör du sen?", answers: ["Vad gör du {sedan|senare|sen}?"] }
          - { id: rcgj, type: transform, prompt: "Har nån sett mina nycklar?", answers: ["Har någon sett mina nycklar?"] }
          - { id: zthq, type: transform, prompt: "Dom sa att dom inte hade tid.", answers: ["De sa att de inte hade tid.", "De sade att de inte hade tid."], feedback: [{ contains: "dem", tip: "Onderwerp (vi sa, vi hade): de." }] }
          - { id: dsmp, type: transform, prompt: "Ja vet inte.", answers: ["Jag vet inte."] }
          - { id: bxa9, type: transform, prompt: "Säj till om du behöver nåt!", answers: ["Säg till om du behöver {något|någonting}!"] }

      - id: formeler
        title: Formeler
        instruction: Kies het formele woord.
        topic: register
        shuffle: true
        items:
          - { id: vtfd, type: gap, text: "Vi har ___ din ansökan.", gaps: [{ answers: ["erhållit"], options: ["erhållit", "fått tag på", "kollat"], shuffle: false }] }
          - { id: ukfj, type: gap, text: "Vi vill ___ att kontoret är stängt i morgon.", gaps: [{ answers: ["meddela"], options: ["meddela", "snacka om", "säga till dig"], shuffle: false }] }
          - { id: pce2, type: gap, text: "Tack för din ansökan. Vi har ___ redan anställt en person.", gaps: [{ answers: ["dock"], options: ["dock", "typ", "liksom"], shuffle: false }] }
          - { id: yvma, type: gap, text: "Mötet ___ på fredag klockan tio.", gaps: [{ answers: ["äger rum"], options: ["äger rum", "blir av typ", "händer liksom"], shuffle: false }] }
          - { id: b74h, type: gap, text: "Vi ___ dig att svara senast den 1 maj.", gaps: [{ answers: ["ber"], options: ["ber", "vill typ att", "säger åt"], shuffle: false }] }
          - { id: kquh, type: gap, text: "Har du ___ frågor är du välkommen att kontakta oss.", gaps: [{ answers: ["ytterligare"], options: ["ytterligare", "fler såna", "lite mer typ"], shuffle: false }] }
          - { id: ry78, type: gap, text: "Vi ___ för besväret.", gaps: [{ answers: ["ber om ursäkt"], options: ["ber om ursäkt", "är sorry", "säger förlåt typ"], shuffle: false }] }
          - { id: acwz, type: gap, text: "Ansökan ska skickas ___ den 15 maj.", gaps: [{ answers: ["senast"], options: ["senast", "typ innan", "sådär runt"], shuffle: false }] }
          - { id: djtd, type: gap, text: "Ansökan kom in efter sista dagen och kan ___ inte behandlas i år.", gaps: [{ answers: ["således"], options: ["således", "typ", "asså"], shuffle: false, tip: "Formeel 'dus': således. Typ en asså zijn spreektaal." }] }

      - id: standaard-lang
        title: Langere berichten netjes schrijven
        instruction: Schrijf het bericht in standaard schrijftaal (neutraal register), zonder spreektaalspelling.
        topic: register
        items:
          - { id: t3yu, type: transform, prompt: "Dom sa att dom skulle ringa mej sen, men jag har inte hört nåt än.", answers: ["De {sa|sade} att de skulle ringa mig {senare|sedan|sen}, men jag har inte hört {något|någonting} {än|ännu}."], feedback: [{ contains: "dem sa", tip: "Onderwerp (vi sa): de." }, { contains: "att dem", tip: "att vi skulle ringa → de." }] }
          - { id: w45s, type: transform, prompt: "Jag träffade dom på stationen och frågade om dom ville följa med oss hem.", answers: ["Jag träffade dem på stationen och frågade om de ville följa med oss hem."], feedback: [{ contains: "träffade de", tip: "Jag träffade oss → dem." }, { contains: "om dem ville", tip: "om vi ville → de." }] }
          - { id: 23n2, type: transform, prompt: "Va tycker dom om det nya förslaget? Jag har inte hunnit fråga dom än.", answers: ["Vad tycker de om det nya förslaget? Jag har inte hunnit fråga dem {än|ännu}."], feedback: [{ contains: "tycker dem", tip: "Vad tycker vi → de." }, { contains: "fråga de", tip: "fråga oss → dem." }] }
          - { id: 7grd, type: gap, text: "Föräldrarna sa att ___ inte hade fått något meddelande från skolan om den nya regeln.", gaps: [{ answers: ["de"], options: ["de", "dem"], shuffle: false, feedback: [{ match: "dem", tip: "att vi inte hade fått → de." }] }] }
          - { id: 9d7k, type: gap, text: "Jag har försökt ringa ___ flera gånger, men ingen svarar i telefonen på kontoret.", gaps: [{ answers: ["dem"], options: ["de", "dem"], shuffle: false, feedback: [{ match: "de", tip: "ringa oss → dem." }] }] }

      - id: register-vertalen
        title: Formeel of informeel schrijven
        instruction: Schrijf of vertaal de zin in het register dat de opdracht noemt.
        topic: register
        items:
          - { id: 7fv7, type: transform, task: "Maak de zin **formeel**: vervang *fått* door een vorm van *erhålla*, en maak er twee zinnen van met *dock* in plaats van *men*.", prompt: "Vi har fått er ansökan, men vi kan inte behandla den förrän i maj.", answers: ["Vi har erhållit er ansökan. Vi kan dock inte behandla den förrän i maj.", "Vi har erhållit er ansökan. Dock kan vi inte behandla den förrän i maj."], feedback: [{ contains: "kan inte dock", tip: "dock staat vóór inte: Vi kan dock inte …" }, { contains: "har fått", tip: "Formeel: erhålla (har erhållit)." }] }
          - { id: zvtp, type: translate, prompt: "Vertaal **formeel** (brief van de gemeente): Uw aanvraag moet uiterlijk 15 mei bij ons binnen zijn, anders kunnen wij die helaas niet behandelen.", answers: ["{Er|Din} ansökan {ska|måste} ha {inkommit|kommit in}[ till oss] senast [den ]15 maj, annars kan vi tyvärr inte behandla den.", "{Er|Din} ansökan {ska|måste} ha {inkommit|kommit in}[ till oss] senast [den ]15 maj, annars kan den tyvärr inte behandlas."], feedback: [{ contains: "vara inne", tip: "Goed Zweeds, maar neutraal of spreektaal. Formeel: ska ha inkommit." }, { contains: "kan vi inte tyvärr", tip: "tyvärr staat vóór inte: kan vi tyvärr inte." }] }
          - { id: snd3, type: translate, prompt: "Vertaal **formeel** (mail aan een klant): Wij bieden onze excuses aan voor de vertraging en komen zo snel mogelijk bij u terug.", answers: ["Vi ber [{er|dig} ]om ursäkt för {förseningen|dröjsmålet} och återkommer [till {dig|er} ]{så snart som möjligt|så snart vi kan|snarast|snarast möjligt}."], feedback: [{ contains: "säger förlåt", tip: "Te informeel. Formeel: Vi ber om ursäkt." }, { contains: "sorry", tip: "Te informeel. Formeel: Vi ber om ursäkt." }] }
          - { id: 5r43, type: translate, prompt: "Vertaal **formeel** (bericht van de school): Wij delen u mee dat de school morgen gesloten is vanwege de storm.", answers: ["Vi {vill meddela|meddelar} [{er|dig} ]att skolan {är stängd|kommer att vara stängd|håller stängt} {i morgon|imorgon} {på grund av|med anledning av} stormen.", "Härmed meddelar vi [{er|dig} ]att skolan {är stängd|kommer att vara stängd|håller stängt} {i morgon|imorgon} {på grund av|med anledning av} stormen.", "Vi vill informera [{er|dig} ]om att skolan {är stängd|kommer att vara stängd|håller stängt} {i morgon|imorgon} {på grund av|med anledning av} stormen."], feedback: [{ contains: "vi säger", tip: "Formeel: meddela in plaats van säga." }] }
          - { id: xvh3, type: translate, prompt: "Vertaal **informeel** (sms aan een vriendin), met *sjukt* en *typ*: Het feest gisteren was echt hartstikke leuk, we hebben zo'n beetje tot drie uur 's nachts gedanst.", answers: ["Festen {i går|igår} var sjukt {kul|rolig}, vi {dansade|har dansat} {typ till tre|till typ tre}[ på natten]."], feedback: [{ contains: "festet", tip: "fest is een en-woord: festen." }] }

