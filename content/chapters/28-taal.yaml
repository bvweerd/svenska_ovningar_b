  - id: idiom
    title: "Grammatik: uitdrukkingen"
    exercises:
      - id: idiom-kiezen
        title: Welke uitdrukking past?
        instruction: Kies de uitdrukking die past.
        topic: idiom
        shuffle: true
        items:
          - { id: 3p7z, type: mc, prompt: "*Förlåt, jag blir tio minuter sen!* – *___ Vi väntar.*", options: ["Det är ingen ko på isen.", "Kasta yxan i sjön!", "Inte för allt smör i Småland!", "Jag anar ugglor i mossen."], answer: 0 }
          - { id: 6ycw, type: mc, prompt: "*Han fick jobbet tack vare sin pappa. Han ___.*", options: ["gled in på en räkmacka", "kastade yxan i sjön", "hade is i magen", "gick som katten kring het gröt"], answer: 0 }
          - { id: fdmj, type: mc, prompt: "*Skulle du hoppa fallskärm? – ___!*", options: ["Aldrig, inte för allt smör i Småland", "Ja, det är ingen ko på isen", "Jag har is i magen", "Jag tar det med en nypa salt"], answer: 0 }
          - { id: fcp5, type: mc, prompt: "*Hon var lugn under hela intervjun. Hon ___.*", options: ["hade is i magen", "fick skägg i brevlådan", "gled in på en räkmacka", "anade ugglor i mossen"], answer: 0 }
          - { id: naeq, type: mc, prompt: "*Säg vad du menar, i stället för att ___!*", options: ["gå som katten kring het gröt", "ha is i magen", "kasta yxan i sjön", "glida in på en räkmacka"], answer: 0 }
          - { id: bhv6, type: mc, prompt: "*Det var svårt, men vi ___. Vi fortsatte.*", options: ["kastade inte yxan i sjön", "hade inte is i magen", "anade inte ugglor i mossen", "tog det inte med en nypa salt"], answer: 0, tip: "Ze gaven niet op: de bijl niet in het meer gooien." }
          - { id: 5k2j, type: mc, prompt: "*Jag tror inte på allt han säger. Jag ___.*", options: ["tar det med en nypa salt", "har is i magen", "går som katten kring het gröt", "kastar yxan i sjön"], answer: 0 }
          - { id: 3gfw, type: mc, prompt: "*Något är konstigt här. Jag ___.*", options: ["anar ugglor i mossen", "glider in på en räkmacka", "har is i magen", "kastar yxan i sjön"], answer: 0 }

      - id: idiom-vertalen
        title: Uitdrukkingen vertalen
        instruction: Vertaal naar het Zweeds (neutraal register). Gebruik de Zweedse uitdrukking, niet een letterlijke vertaling.
        topic: idiom
        items:
          - { id: jqgh, type: translate, prompt: "Doe rustig aan, er is geen haast: de vergadering begint pas om drie uur. (uitdrukking met *ko*)", answers: ["Ta det lugnt, det är ingen ko på isen, mötet börjar {inte förrän|först} {klockan tre|klockan 15|kl. 15|tre}."], feedback: [{ contains: "ingen koe", tip: "ko = koe, zonder e." }] }
          - { id: 9e7y, type: translate, prompt: "We mogen de handdoek niet in de ring gooien, ook al zijn de eerste resultaten slecht.", answers: ["Vi får inte kasta yxan i sjön, {även om|fast|fastän|trots att} de första resultaten är dåliga.", "{Även om|Fast|Fastän|Trots att} de första resultaten är dåliga[,] får vi inte kasta yxan i sjön."], feedback: [{ contains: "handduken", tip: "In deze oefening: de Zweedse uitdrukking kasta yxan i sjön (de bijl in het meer)." }, { contains: "dåliga vi får", tip: "Na een bijzin vooraan komt eerst het werkwoord: …, får vi inte …" }] }
          - { id: 2sc7, type: translate, prompt: "Voor geen goud zou ik spreektaal gebruiken in een formele sollicitatie (jobbansökan).", answers: ["Inte för allt smör i Småland skulle jag använda {talspråk|vardagsspråk|slang} i en formell jobbansökan.", "Jag skulle inte använda {talspråk|vardagsspråk|slang} i en formell jobbansökan för allt smör i Småland."], feedback: [{ contains: "småland jag skulle", tip: "Na het zinsdeel vooraan komt eerst het werkwoord: … skulle jag använda." }, { contains: "ett formell", tip: "jobbansökan is een en-woord: en formell jobbansökan." }] }
          - { id: jbjb, type: translate, prompt: "Hoewel de vragen moeilijk waren, bleef hij kalm tijdens het hele sollicitatiegesprek. (uitdrukking met *is*)", answers: ["{Trots att|Fast|Fastän|Även om} frågorna var svåra[,] hade han is i magen [under ]hela {anställningsintervjun|intervjun|arbetsintervjun|jobbintervjun}.", "Han hade is i magen [under ]hela {anställningsintervjun|intervjun|arbetsintervjun|jobbintervjun}[,] {trots att|fast|fastän|även om} frågorna var svåra."], feedback: [{ contains: "svåra han hade", tip: "Na een bijzin vooraan komt eerst het werkwoord: …, hade han is i magen." }] }

      - id: idiom-ordenen
        title: Uitdrukkingen in een zin
        instruction: Zet de woorden in de goede volgorde.
        topic: idiom
        items:
          - { id: tauq, type: order, start: "När chefen plötsligt slutade svara på mejlen", tokens: ["började", "hon", "ana", "ugglor", "i", "mossen"], answers: ["När chefen plötsligt slutade svara på mejlen började hon ana ugglor i mossen."], feedback: [{ contains: "mejlen hon började", tip: "Na een bijzin vooraan komt eerst het werkwoord: … började hon." }] }
          - { id: ntsn, type: order, start: "I stället för att", tokens: ["gå", "som", "katten", "kring", "het", "gröt", "borde", "du", "säga", "vad", "du", "menar"], answers: ["I stället för att gå som katten kring het gröt borde du säga vad du menar."], feedback: [{ contains: "gröt du borde", tip: "Na het zinsdeel vooraan komt eerst het werkwoord: … borde du säga." }] }
          - { id: t2w8, type: gap, prompt: "Maak de uitdrukking af.", text: "Han fick jobbet utan att ens gå på en intervju: han gled in på en ___.", gaps: [{ answers: ["räkmacka"], options: ["räkmacka", "smörgås", "kanelbulle"], shuffle: false }] }
          - { id: dayr, type: gap, prompt: "Maak de uitdrukking af.", text: "Man ska ta det han skriver på sociala medier med en nypa ___, eftersom han ofta överdriver.", gaps: [{ answers: ["salt"], options: ["salt", "socker", "peppar"], shuffle: false }] }

  - id: zoek-de-fout
    title: Zoek de fout
    exercises:
