          - { id: s862, type: findError, topic: idiom, sentence: "Det är ingen häst på isen.", wrong: [3], answers: ["Det är ingen ko på isen."], tip: "Welk dier staat er op het ijs?" }
          - { id: 9hwv, type: findError, topic: idiom, sentence: "Hon hade eld i magen under intervjun.", wrong: [2], answers: ["Hon hade is i magen under intervjun."], tip: "Kalm blijven: … i magen." }
          - { id: y55t, type: findError, sentence: "Härmed bekräftar vi er bokning och ser fett mycket fram emot ert besök i juni.", wrong: [7], answers: ["Härmed bekräftar vi er bokning och ser mycket fram emot ert besök i juni.", "Härmed bekräftar vi er bokning och ser fram emot ert besök i juni.", "Härmed bekräftar vi er bokning och ser verkligen fram emot ert besök i juni."], tip: "Dit is een formele bevestiging. Welk woord is spreektaal?" }
          - { id: etaf, type: findError, sentence: "Jag frågade de om de ville följa med på konserten i Göteborg på lördag.", wrong: [2], answers: ["Jag frågade dem om de ville följa med på konserten i Göteborg på lördag."], tip: "Jag frågade oss → ?" }
          - { id: d2hf, type: findError, sentence: "Dem som vill delta i kursen ska anmäla sig senast på fredag.", wrong: [0], answers: ["De som vill delta i kursen ska anmäla sig senast på fredag."], tip: "Onderwerp: kun je hier vi zeggen (vi som vill delta)?" }
          - { id: 8uvb, type: findError, topic: idiom, sentence: "Det är för tidigt att kasta handduken i sjön, vi har fortfarande två matcher kvar.", wrong: [6], answers: ["Det är för tidigt att kasta yxan i sjön, vi har fortfarande två matcher kvar."], tip: "Wat gooi je in het Zweeds in het meer?" }
          - { id: pa3s, type: findError, topic: idiom, sentence: "Han gick som hunden kring het gröt i stället för att svara på frågan.", wrong: [3], answers: ["Han gick som katten kring het gröt {i stället|istället} för att svara på frågan."], tip: "Welk dier loopt om de hete pap?" }

  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-de-dem
        title: "Luisteren: de, dem of dom?"
        instruction: Luister naar de taaltip. Is de bewering **rätt** of **fel**?
        topic: register
        listen: true
        textTitle: Språktipset
        text: |
          Veckans språktips handlar om de och dem. Många svenskar uttalar båda orden som ”dom”, och därför är det svårt att veta vilken form man ska skriva.

          Ett enkelt knep: byt ut ordet mot vi eller oss. Om du kan säga vi, ska du skriva de. Om du kan säga oss, ska du skriva dem. Alltså: de kommer i morgon, men jag träffade dem i går.

          Vissa har föreslagit att man ska skriva dom i alla lägen, men än så länge är det inte standard i formell text.
        items:
          - { id: 7y7p, type: truefalse, statement: "Många svenskar uttalar både de och dem som dom.", answer: true }
          - { id: 69zt, type: truefalse, statement: "Om man kan säga oss, ska man skriva de.", answer: false, correction: { answers: ["Om man kan säga oss[,] ska man skriva dem."] } }
          - { id: yv8g, type: truefalse, statement: "Dom är standard i formell text.", answer: false, correction: { answers: ["Dom är inte standard i formell text[ än så länge].", "Det är inte standard[ i formell text]."] } }

      - id: lyssna-dictee
        title: Dictee
        instruction: Luister en maak de zin die je hoort.
        topic: idiom
        shuffle: true
        items:
          - { id: gwy5, type: listen, say: "Det är ingen ko på isen." }
          - { id: d7mf, type: listen, say: "Jag träffade dem i går.", answers: ["Jag träffade dem {i går|igår}."] }
          - { id: 2n34, type: listen, say: "Hon hade is i magen under hela intervjun." }
          - { id: xb5t, type: listen, say: "Vi har erhållit din ansökan." }

  - id: praktiskt
