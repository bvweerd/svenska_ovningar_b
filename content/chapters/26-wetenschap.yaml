  - id: lyssna
    title: Lyssna · luisteren
    exercises:
      - id: lyssna-natur
        title: "Luisteren: wandelen in de natuur"
        instruction: Luister naar het wetenschapsbericht. Is de bewering **rätt** of **fel**?
        topic: nominalfras
        listen: true
        textTitle: Natur och stress
        text: |
          Ny forskning tyder på att promenader i naturen kan minska stress. I en mindre studie fick fyrtio deltagare antingen promenera i en park eller längs en trafikerad gata i trettio minuter.

          De som gick i parken hade efteråt i genomsnitt lägre puls och sa att de kände sig lugnare. Forskarna betonar dock att studien är liten, och att man inte kan säga hur länge effekten varar.

          – Det verkar som att även korta stunder i naturen kan göra skillnad, säger en av forskarna. Men vi behöver större studier för att kunna dra säkra slutsatser.
        items:
