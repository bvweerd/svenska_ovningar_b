          - { id: vk3e, type: translate, prompt: "De in het onderzoek ondervraagde leraren zeiden dat de leerlingen na de lunch vaak moe waren.", answers: ["De i {studien|undersökningen} {tillfrågade|intervjuade} lärarna {sa|uppgav|berättade} att eleverna ofta var trötta efter {lunchen|lunch}.", "De i {studien|undersökningen} {tillfrågade|intervjuade} lärarna {sa|uppgav|berättade} att eleverna efter {lunchen|lunch} ofta var trötta."], feedback: [{ contains: "eleverna var ofta", tip: "In een bijzin staat ofta vóór het werkwoord: att eleverna ofta var trötta." }, { contains: ["tillfrågad lärarna", "intervjuad lärarna"], tip: "Na de: de vorm op -e, de i studien tillfrågade lärarna." }] }
          - { id: p4kr, type: translate, prompt: "Volgens de in het rapport genoemde experts is er meer onderzoek nodig naar hoe stress de slaap beïnvloedt.", answers: ["Enligt de i rapporten nämnda experterna behövs [det ]mer forskning {om|kring} {hur stress påverkar sömnen|stressens påverkan på sömnen|effekten av stress på sömnen}.", "Enligt de i rapporten nämnda experterna {finns det ett behov av|krävs [det ]} mer forskning {om|kring} {hur stress påverkar sömnen|stressens påverkan på sömnen|effekten av stress på sömnen}."], feedback: [{ contains: ["nämnd experterna", "nämnde experterna"], tip: "Na de: de vorm op -a, de i rapporten nämnda experterna." }, { contains: ["experterna det behövs", "experterna mer forskning behövs"], tip: "Na Enligt … vooraan komt meteen het werkwoord: Enligt … experterna behövs det mer forskning." }] }
          - { id: x35a, type: translate, prompt: "Een vaak geciteerd voorbeeld uit de jaren negentig laat zien hoe moeilijk het is om een theorie te bewijzen.", answers: ["Ett ofta citerat exempel från {1990-talet|nittiotalet|90-talet} visar hur svårt det är att bevisa en teori."], feedback: [{ contains: ["ofta citerad exempel", "ofta citerade exempel"], tip: "exempel is een ett-woord, onbepaald: ett ofta citerat exempel." }, { contains: "hur svårt är det", tip: "Na hur volgt een bijzin: onderwerp vóór werkwoord, hur svårt det är." }] }

