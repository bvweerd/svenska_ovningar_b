          - { id: q8cq, type: translate, prompt: "Een snel groeiend aantal ouderen in Europa leidt tot hogere kosten voor de gezondheidszorg.", answers: ["Ett snabbt {växande|ökande} antal äldre i Europa leder till högre kostnader för {vården|sjukvården|hälso- och sjukvården}."], feedback: [{ contains: ["snabb växande", "snabb ökande"], tip: "Bij een deelwoord hoort een bijwoord: ett snabbt växande antal." }, { contains: ["snabbt växt", "snabbt växat"], tip: "Het aantal groeit nu: tegenwoordig deelwoord, växande." }, { contains: "en snabbt", tip: "antal is een ett-woord: ett snabbt växande antal." }] }
