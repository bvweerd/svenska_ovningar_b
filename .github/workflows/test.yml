name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Gedeelde code (src/, tests/, scripts/ …) moet gelijk zijn aan die van de zusterrepo:
      # zelfde branch als die bestaat, anders main.
      - name: Gedeelde code gelijk aan zusterrepo
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "${GITHUB_REPOSITORY}" in
            *_b) SIB="${GITHUB_REPOSITORY%_b}" ;;
            *) SIB="${GITHUB_REPOSITORY}_b" ;;
          esac
          git clone --depth 1 --branch "$BRANCH" "https://github.com/$SIB.git" "$RUNNER_TEMP/sibling" \
            || git clone --depth 1 "https://github.com/$SIB.git" "$RUNNER_TEMP/sibling"
          SIBLING_DIR="$RUNNER_TEMP/sibling" npm run check-sync
